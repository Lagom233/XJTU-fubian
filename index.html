⟦2928⟧ 初值确保无误。"]],[7,"卷积方程与微分方程初值问题","用拉普拉斯变换求解常系数线性微分方程初值问题、含单边卷积核 ⟦2939⟧ 的积分方程或两像函数乘积的反演。","2.3–2.6 第 1–28 页 拉氏卷积定理与初值问题 · 教材 积分变换 §2.3–§2.5",[["单边卷积定理","⟦2935⟧","⟦1341⟧ 在 ⟦1298⟧ 分段连续且均为指数阶时，公式在两者的共同绝对收敛半平面内成立。"],["导数变换与初值条件","⟦2936⟧","初值取 ⟦1961⟧ 右极限，要求原函数及低阶导数分段光滑且具有指数增长阶。"]],["<strong>设像函数并标出初值</strong>：记 ⟦2937⟧，抄出 ⟦2938⟧ 及右端激励和卷积核各自的单边变换。","<strong>两边取变换解 ⟦1152⟧</strong>：将导数项与单边卷积项统一变为关于 ⟦1152⟧ 的代数式，移项合并系数后解出有理函数 ⟦1152⟧。","<strong>裂项反演并代回验证</strong>：对 ⟦1152⟧ 做部分分式拆分或配方查表求得 ⟦1929⟧，最后代回 ⟦945⟧ 检验初值（如满足方程和初值即百分百正确）。"]],[7,"利用变换性质求反常积分","用拉普拉斯变换计算形如 ⟦2957⟧、⟦2891⟧ 或含指数衰减因子 ⟦2950⟧ 的反常实积分。","2.1–2.2 第 38–42 页 拉氏变换求反常积分 · 教材 积分变换 §2.2",[["拉氏变换值直接对应含衰减核的反常积分","⟦2945⟧","要求实常数 ⟦1535⟧ 严格位于 ⟦2946⟧ 的绝对收敛半平面内；无指数核（⟦211⟧）且条件收敛时通过 ⟦1104⟧ 取极限验证。"],["借助除以 ⟦682⟧ 性质求常见振荡积分","⟦2947⟧","要求 ⟦2948⟧ 在 ⟦2928⟧ 附近有界或绝对可积（如 ⟦2949⟧）。"]],["<strong>分离核函数与 ⟦2950⟧</strong>：把被积式写为 ⟦2951⟧ 的形式（无衰减项则保留参数 ⟦2952⟧ 充当人工衰减因子 ⟦2953⟧）。","<strong>求 ⟦2946⟧ 的像函数 ⟦2954⟧</strong>：若是 ⟦2948⟧ 结构，先求 ⟦960⟧ 的拉氏变换再由 ⟦1086⟧ 积到 ⟦2461⟧（如出现 ⟦2955⟧ 可用除 ⟦682⟧ 两次或频域与卷积/求导配合）。","<strong>代入 ⟦2956⟧ 或令 ⟦1104⟧ 并验收敛</strong>：合并所有对数项或反三角项后再代入上限与指定点 ⟦1535⟧（或取 ⟦1104⟧），并简述端点可积与收敛依据。"]],[0,"复数四则运算与有理化","题目要求计算复数商、分离实虚部，或附带 ⟦11⟧ 单位圆条件化简分式时，使用分母实数化与 ⟦2970⟧ 代换。","ch1.1 第 3–6 页 复数的四则运算与共轭性质 · 教材 §1.1",[["复数除法与分母实数化","⟦2963⟧","适用于非零分母 ⟦293⟧。将分子按多项式展开并代入 ⟦2964⟧，即可分离实部和虚部。"],["实虚部反解与模平方恒等式","⟦2965⟧","对任意复数 ⟦9⟧ 成立。当 ⟦1646⟧（特别是 ⟦1551⟧）时，可立即代换 ⟦2966⟧。"]],["<strong>分母实数化</strong>：做复数除法时分子分母同乘分母的共轭复数 ⟦2967⟧，利用 ⟦2968⟧ 消去分母中的 ⟦1750⟧。","<strong>巧用共轭代换</strong>：若已知 ⟦11⟧ 或需要提取表达式的实部，优先用 ⟦2969⟧ 与 ⟦2970⟧ 化简。","<strong>核对实虚部符号</strong>：分别写出结果 ⟦1460⟧ 中的实数 ⟦2971⟧ 与 ⟦2972⟧，确保虚部不带 ⟦1750⟧。"]],[0,"距离不等式与模的极值","给定 ⟦1646⟧ 或圆盘区域求有理分式模的最大值或最小值时，先因式分解再用下界三角不等式放缩分母。","ch1.1 第 7–10 页 复数的模与不等式 · 教材 §1.1",[["复数和差模的上下界估计","⟦2979⟧","放大分子用右端上界；放大分式（缩小非零分母）用左端下界。两个非零项同向或反向决定了哪一端可取等号。"]],["<strong>因式分解化简</strong>：将分母或目标式分解为一次或简单二次因式的乘积，把乘积的模拆为各因子模的乘积。","<strong>应用反三角不等式</strong>：对每个因子利用 ⟦2980⟧ 结合已知模长 ⟦1646⟧ 给出下界（若求上界则用 ⟦2981⟧）。","<strong>检验取等可达性</strong>：具体写出满足全部因子同时取等号的复数 ⟦9⟧，代入原式验证确实能取到该极值。"]],[0,"幅角主值与三种表示互化","求特定象限复数、三角表达式（含负号或 ⟦58⟧ 陷阱）或复指数 ⟦2996⟧ 的主辐角与三角/指数互化。","ch1.1 第 11–18 页 辐角主值与三种表示 · 教材 §1.1",[["复数的三种等价表示","⟦2985⟧","加减运算优先用代数形式 ⟦2986⟧；乘除、幂、开方运算优先转为三角或指数形式。"],["辐角主值 ⟦2987⟧ 的象限修正公式","⟦2988⟧","⟦1482⟧ 时，按 ⟦2989⟧ 或 ⟦2990⟧ 分别取 ⟦1408⟧ 或 ⟦2991⟧；⟦2992⟧ 时辐角无定义。"]],["<strong>核验标准形态</strong>：若为三角组合式（如 ⟦2993⟧），先用倍角公式提公因式并由诱导公式化成 ⟦2994⟧（保证 ⟦1440⟧）。","<strong>分象限定角</strong>：对于 ⟦2986⟧，先判断实虚部符号确定象限，再用象限修正公式求唯一主辐角 ⟦2643⟧。","<strong>折回主值区间</strong>：若通过运算得到一般辐角 ⟦2995⟧，通过加减 ⟦2647⟧ 将其唯一地调整到 ⟦47⟧ 内。"]],[0,"复数整数幂与全部 n 次根","计算 ⟦3017⟧ 高次幂、商的幂或求解 ⟦3018⟧ 与 ⟦3019⟧ 的全部根，先统一为指数形式。","ch1.1 第 19–28 页 复数的乘幂与方根 · 教材 §1.1",[["复数乘除的指数法则与棣莫弗公式","⟦3008⟧","⟦3009⟧，⟦3010⟧。先化为极坐标后再乘方，可快速化简商的高次幂。"],["非零复数的全部 ⟦372⟧ 次方根","⟦3011⟧","⟦3012⟧，⟦372⟧ 为正整数。⟦3013⟧ 取正实数的算术 ⟦372⟧ 次根，全部 ⟦372⟧ 个根的模相等。"]],["<strong>化为指数形式</strong>：分别求出底数（或分子、分母）的模 ⟦1266⟧ 与主辐角 ⟦856⟧，尽量利用特殊角（⟦3014⟧）。","<strong>求幂或开方</strong>：高次幂直接乘指数 ⟦372⟧ 并利用 ⟦3015⟧ 约简；求 ⟦372⟧ 次根则写出带 ⟦2647⟧ 的通式并令 ⟦3016⟧。","<strong>还原代数或主辐角</strong>：根据题目要求将各根写为 ⟦251⟧ 代数形式，并核对其主辐角是否已折入 ⟦47⟧。"]],[0,"轨迹互化、区域与单连通","判别点集是否为区域、单/多连通域，或进行复数轨迹方程与直角坐标方程的互化，常考选择题与填空题。","ch1.2 第 4–13 页 复平面曲线、区域与连通性 · 教材 §1.2",[["复变量与直角坐标的互化公式","⟦3024⟧","将 ⟦214⟧ 代入直线或二次曲线方程，可立刻得到关于 ⟦3025⟧ 的复数方程；反之用 ⟦2031⟧ 展开。"],["常见平面几何轨迹的复数方程","⟦3026⟧","圆盘 ⟦3027⟧ 和角域 ⟦3028⟧ 为单连通域；圆环 ⟦3029⟧ 与去心邻域 ⟦2429⟧ 为多连通域。"]],["<strong>几何化理解模</strong>：将 ⟦3030⟧ 看作点 ⟦9⟧ 到定点 ⟦369⟧ 的欧氏距离，迅速识别圆、垂直平分线、椭圆或双曲线分支。","<strong>验证区域两要素</strong>：先查不等式是否严格（⟦3031⟧ 会包含边界导致非开集），再检查挖去的点或线是否将集合割成不连通的几块。","<strong>检查连通与孔洞</strong>：确认是区域后，若区域内部存在未被包含的孤立点、线段或圆洞，即判为多连通域，否则为单连通域。"]],[0,"距离比圆与圆反演对称","遇阿波罗尼斯圆方程 ⟦1201⟧（⟦1200⟧）或要求证明两点关于圆周反演对称时使用。","ch1.1 第 9 页 & 第六章对称点准备 · 教材 §1.1",[["距离比圆的圆心与半径公式","⟦3036⟧","由 ⟦3037⟧ 展开并利用 ⟦2003⟧ 配方得到，要求 ⟦1198⟧。"],["关于圆周 ⟦3038⟧ 的对称点充要条件","⟦3039⟧","该复数关系同时蕴含了同射线方向（乘积为正实数）与反演距离关系 ⟦3040⟧。"]],["<strong>平方展开配方</strong>：将 ⟦1201⟧ 两边平方并展开为 ⟦3041⟧ 形式，除以 ⟦3042⟧ 后配成 ⟦3043⟧。","<strong>计算方向与模积</strong>：由圆心 ⟦1535⟧ 分别作差 ⟦3044⟧ 与 ⟦3045⟧，推导出比例关系 ⟦1205⟧ 说明同射线。","<strong>核对反演半径</strong>：验证 ⟦3046⟧ 恰好等于配方所得半径平方 ⟦3047⟧，完成反演对称证明。"]],[0,"复数条件证明几何形状","题设给出三点 ⟦3060⟧ 的代数对称关系，要求证明它们构成等边、直角或等腰三角形时，作差取商。","ch1.1 复数的几何表示与向量夹角 · 教材 §1.1",[["复数商的边长比与旋转角意义","⟦3052⟧","要求 ⟦3053⟧。特别地，若该商为 ⟦3054⟧（即方程 ⟦1213⟧ 的根），则三点构成等边三角形。"]],["<strong>平移简化坐标</strong>：选取顶点 ⟦2738⟧ 作平移 ⟦3055⟧，验证给定条件在平移下保持不变（或直接化为关于 ⟦481⟧ 的齐次式）。","<strong>作商降维求解</strong>：令 ⟦1212⟧（⟦1430⟧），将齐次关系转化为关于 ⟦3056⟧ 的实系数代数方程并解出 ⟦3056⟧。","<strong>还原边长与夹角</strong>：读出 ⟦3057⟧ 和 ⟦3058⟧（对应边长比）以及 ⟦3059⟧（对应内角），从而得出几何形状结论。"]],[0,"多路径极限与连续性","讨论 ⟦3078⟧ 是否存在，或验证分段函数在某点是否连续；遇含 ⟦2706⟧、⟦53⟧、⟦368⟧ 或 ⟦3079⟧ 的分式时常用。","ch1.2 第 14–33 页 复变函数的极限与连续性 · 教材 §1.2",[["复变函数极限与连续的实虚部充要条件","⟦3068⟧","⟦192⟧ 在 ⟦3069⟧ 连续，当且仅当二元实函数 ⟦204⟧ 在 ⟦3070⟧ 均连续。"],["常用路径估计不等式","⟦3071⟧","证明极限存在时的基本控制手段；若要否定极限存在，可选实轴、虚轴、直线 ⟦141⟧ 或抛物线 ⟦3072⟧。"]],["<strong>拆解实部虚部</strong>：将 ⟦129⟧ 写成 ⟦3073⟧，也可直接整体分析模长 ⟦3074⟧。","<strong>试探路径否定极限</strong>：分别令 ⟦9⟧ 沿实轴（⟦836⟧）、虚轴（⟦1482⟧，特别注意 ⟦2694⟧ 指数增长）、直线 ⟦141⟧ 或抛物线趋近 ⟦369⟧，若结果依赖于路径参数或发散，则极限不存在。","<strong>一致估值证存在</strong>：若极限存在，利用 ⟦3075⟧、⟦3076⟧ 等不等式给出与路径无关的收敛上界，最后与 ⟦3077⟧ 对比判定连续性。"]],[1,"由定义求导与单点可导反例","考察由定义计算复导数、证明 ⟦2706⟧ 或 ⟦3090⟧ 不可解析，或构造满足 C-R 却不可导的反例（如 ⟦3091⟧）。","ch2.1 第 4–21, 31–32 页 导数概念、可导与解析 · 教材 §2.1–§2.2",[["复导数的差商定义","⟦3083⟧","极限值必须与 ⟦2360⟧ 的方向和路径完全无关。在一点可导等价于在该点复可微，但不能反推该点解析。"],["解析性与孤立可导反例判据","⟦3084⟧","⟦3085⟧ 仅在 ⟦156⟧ 可导；⟦164⟧ 在 ⟦156⟧ 满足 C-R 方程但偏导不连续、实不可微，故仍不可导。"]],["<strong>先沿实虚轴试探</strong>：分别取 ⟦3086⟧ 和 ⟦3087⟧ 检验差商极限是否一致，不一致则立即否定可导性。","<strong>检验任意方向或斜线</strong>：若实虚方向一致（或考察 ⟦204⟧ 在原点处的 C-R 与可微性），再沿一般直线 ⟦3088⟧ 检查极限是否依赖 ⟦131⟧；若证可导则用模长估计 ⟦3089⟧。","<strong>由邻域判解析</strong>：找出全部可导点集后，看每个可导点周围能否找到全由可导点构成的开圆盘，从而区分“可导点”与“解析点”。"]],[1,"解 C–R 方程、确定解析域与参数","明确给定二元函数式，要求确定可导点集合、解析区域及导数表达式，或证明其为整函数（全平面解析）。","ch2.1 第 22–41 页 C-R 方程求解与应用 · 教材 §2.2",[["区域解析的充要条件与实用判别法","⟦3095⟧","满足上述条件则 ⟦443⟧ 在开区域 ⟦193⟧ 内处处解析；特别地，当 ⟦3096⟧ 时称为整函数。"],["四种等价复导数公式","⟦2674⟧","在一切可导点均成立。可灵活选用只需 ⟦474⟧ 或只需 ⟦449⟧ 的形式以简化后续计算。"]],["<strong>求四偏导并验连续</strong>：分离出 ⟦448⟧ 和 ⟦442⟧，求出 ⟦2676⟧，说明其为初等函数（或多项式）在定义域内连续。","<strong>解 C-R 方程组</strong>：同时联立 ⟦218⟧ 与 ⟦478⟧，取两条方程解集的交集即为可导点集；若为恒成立方程则对比 ⟦214⟧ 系数求待定参数。","<strong>判解析写导数</strong>：判断解集内部是否非空以确定解析区域，并在可导集上利用 ⟦2678⟧ 算出导数（必要时拼合为 ⟦9⟧ 的式子）。"]],[1,"指数、三角与双曲函数拆实虚","计算 ⟦3109⟧ 的模、实虚部（如 ⟦243⟧），或将 ⟦3110⟧、⟦3111⟧、⟦3112⟧ 等化为代数形式 ⟦251⟧。","ch2.2 第 4–10, 26–31 页 初等复函数的拆解与求值 · 教材 §2.3–§2.4",[["复指数的实虚部与模公式","⟦3099⟧","对任意复数 ⟦3100⟧ 恒成立。求双重指数如 ⟦243⟧ 时，先求出内层 ⟦3101⟧ 作为外层的实虚部。"],["复三角与双曲函数实虚拆解","⟦3102⟧","由 ⟦2694⟧、⟦3103⟧ 及和角公式推导，适用于任意实数 ⟦214⟧。"]],["<strong>拆出实部与虚部</strong>：先把内层自变量 ⟦3104⟧ 化为实部 ⟦3105⟧ 与虚部 ⟦2599⟧ 之和 ⟦3106⟧。","<strong>套用指数或和角公式</strong>：若是指数函数则直接得模 ⟦3107⟧ 与幅角 ⟦2599⟧；若是三角或双曲函数则用定义或实虚展开式代入。","<strong>化简常数</strong>：将最终结果整理成规范的实代数式 ⟦3108⟧ 或双曲/三角乘积形式。"]],[1,"复对数的多值、主值与解析支","计算 ⟦3129⟧（多值）或 ⟦3121⟧（主值），处理 ⟦3130⟧ 复合，或指出复对数解析支的割线与导数。","ch2.2 第 11–20 页 复对数函数、主值与解析分支 · 教材 §2.3",[["复对数全体值与主值公式","⟦3120⟧","⟦162⟧，⟦2643⟧。主值 ⟦3121⟧ 在挖去原点及负实轴的割线平面 ⟦3122⟧ 上连续且解析。"],["对数解析支的导数","⟦3123⟧","对任意选定的连续单值辐角分支 ⟦3124⟧，分支 ⟦3125⟧ 在对应割线之外的区域解析且导数均为 ⟦2975⟧。"]],["<strong>判明要求与符号</strong>：看清题目求多值 ⟦279⟧ 还是主值 ⟦275⟧，以及底数是否需要先化简（或为指数形式 ⟦3126⟧）。","<strong>算模与折回主辐角</strong>：求出底数的正实数模 ⟦53⟧ 并算出自然对数 ⟦3127⟧，依据象限算出落入 ⟦47⟧ 内的主辐角 ⟦54⟧。","<strong>补全周期或定割线</strong>：多值加 ⟦3128⟧（⟦1486⟧），主值不加；若讨论解析支，须明确写出割线位置并验证分支在割线外连续。"]],[1,"复幂的全体值与主值","计算 ⟦3143⟧（如 ⟦287⟧、⟦3144⟧、⟦3145⟧ 或 ⟦290⟧）的全部值或主值时，一律通过底数对数 ⟦3146⟧ 转化为指数运算。","ch2.2 第 21–25 页 一般复数乘幂与主值 · 教材 §2.3",[["一般复数乘幂与主值定义","⟦3137⟧","底数 ⟦1430⟧。求主值时直接取 ⟦85⟧ 即用 ⟦3138⟧；求全部值时须保留 ⟦1486⟧ 并检查周期是否导致值重复。"]],["<strong>求底数对数</strong>：算出底数 ⟦291⟧ 的模 ⟦3139⟧ 与主辐角 ⟦3140⟧，写出全部对数 ⟦292⟧（主值取 ⟦85⟧）。","<strong>乘指数分实虚</strong>：计算乘积 ⟦3141⟧，务必将其显式整理成实部 ⟦3105⟧ 与虚部 ⟦2599⟧ 之和 ⟦3106⟧。","<strong>套用指数公式</strong>：由 ⟦3114⟧ 得出结果；特别注意如 ⟦3142⟧ 实部与虚部交换后全为正实数。"]],[1,"复三角方程与反函数多值","解复三角方程 ⟦3157⟧、⟦3158⟧ 或求反三角函数 ⟦3168⟧、⟦3169⟧ 的全体复数解。","ch2.2 第 32–35 页 反三角函数与复三角方程 · 教材 §2.4",[["复三角函数的指数替换法","⟦3155⟧","令 ⟦3156⟧ 可将 ⟦3157⟧ 或 ⟦3158⟧ 化为关于 ⟦474⟧ 的一元二次方程 ⟦3159⟧ 或 ⟦3160⟧。"],["反三角函数的对数表示","⟦3161⟧","式中平方根 ⟦3162⟧ 取双值，对应二次方程的两根，取对数自然带有无穷多个 ⟦2647⟧ 分支。"]],["<strong>指数换元化二次</strong>：用 ⟦309⟧ 或 ⟦1611⟧ 定义，令 ⟦3163⟧，整理为关于 ⟦474⟧ 的二次方程。","<strong>求根并取复对数</strong>：用求根公式算出两个非零复数根 ⟦3164⟧，分别写出 ⟦3165⟧。","<strong>同除 ⟦1750⟧ 并化简合并</strong>：两边除以 ⟦1750⟧（即乘 ⟦1754⟧）得到 ⟦9⟧；若两根满足 ⟦3166⟧ 或 ⟦3167⟧，可把两支结果进一步整理合并检验。"]],[2,"原函数、路径无关与牛顿–莱布尼茨","被积函数在给定闭路内解析、或在连接两点的路径所在单连通域内解析时，利用柯西定理或原函数直接用牛顿–莱布尼茨求值。","ch3.2–ch3.3 柯西–古萨定理与原函数法 · 教材 §3.2",[["路径无关与牛顿–莱布尼茨公式","⟦3177⟧","要求在包含路径的区域内存在单值解析原函数 ⟦3178⟧。整函数、多项式以及在 ⟦346⟧ 内部无奇点的有理函数均自动满足。"],["柯西闭路消零判据","⟦3179⟧","做题前务必先找出被积函数的全部奇点，确认是否全部落在闭曲线 ⟦346⟧ 的外部。"]],["<strong>查奇点判解析域</strong>：列出被积函数的所有奇点或支点，确认闭路内部（或起终点间路径所在单连通域）是否处处解析。","<strong>求原函数或直接消零</strong>：闭路内部全解析则直接得 ⟦128⟧；开路径若解析则直接写出原函数 ⟦3178⟧（可使用分部积分和换元法）。","<strong>保持分支代入端点</strong>：按终点值减起点值计算 ⟦3180⟧；若含 ⟦3121⟧ 等多值原函数，需沿路径连续追踪辐角确保在同一分支上取值。"]],[2,"圆周参数化、共轭代换与 ML 估值","沿圆周或圆弧积分，遇到 ⟦2706⟧、⟦53⟧、⟦3191⟧ 整数次幂通式，或仅要求证明复积分模的上界 ⟦3192⟧。","ch3.1 第 12–17 页 圆周通式与 ML 估计 · 教材 §3.1",[["基本围线积分公式（含整数幂通式）","⟦3184⟧","正向绕 ⟦369⟧ 一周，结果与圆半径 ⟦1693⟧ 无关，是柯西公式与洛朗级数留数理论的共同基石。"],["复积分的 ML 模长估值不等式","⟦3185⟧","⟦3186⟧ 为被积函数模长在曲线 ⟦346⟧ 上的上界，⟦3187⟧ 为分段光滑曲线 ⟦346⟧ 的总弧长。"]],["<strong>识别路径约束与类型</strong>：写明曲线方程（圆周 ⟦371⟧、圆弧起止角度或线段）及方向、弧长 ⟦3187⟧。","<strong>圆周消共轭或直接参数化</strong>：若为圆周且含 ⟦3188⟧，可利用 ⟦3189⟧ 转化为有理积分或直接代 ⟦3190⟧。","<strong>求值或 ML 估值</strong>：需要精确值时计算定积分或套基本公式；若只需证不等式，先用反三角不等式求 ⟦2430⟧，再乘以弧长 ⟦3187⟧。"]],[2,"复合闭路、挖洞与方向","大闭路内部同时包围多个孤立奇点，或要求用已知小圆围线积分表示复杂外围线积分时，使用复合闭路定理。","ch3.2 第 9–14 页 复合闭路与闭路变形原理 · 教材 §3.2",[["复合闭路定理（多连通域柯西定理）","⟦3199⟧","⟦3200⟧ 是互不包含且全在 ⟦3201⟧ 内部的简单闭曲线，⟦1195⟧ 在 ⟦3201⟧ 与各 ⟦3202⟧ 围成的带洞域及各边界上解析，且均取逆时针。"]],["<strong>标出所有障碍点</strong>：找出被积函数的全部奇点，并标明哪些落在给定闭路 ⟦3201⟧ 内部、哪些落在外部。","<strong>挖小洞分拆围线</strong>：以圈内每个奇点为中心各作一个互不相交的小圆周 ⟦3203⟧，将大圈积分拆为所有小圈积分之和。","<strong>核对方向分别求解</strong>：对每个小圈单独使用柯西公式、部分分式或参数法求值，若原题闭路取顺时针则整体取相反数。"]],[2,"多奇点与柯西高阶公式","围线内同时含多个极点或同时含一阶与高阶分母因式（如 ⟦3211⟧），先分离奇点再套柯西高阶公式。","ch3.4 第 5–20 页 多奇点分离与高阶导数公式 · 教材 §3.3",[["柯西高阶导数计算公式","⟦3206⟧","⟦2779⟧ 为正向简单闭曲线，⟦291⟧ 在其内部，⟦132⟧ 在闭域上解析。注意求导阶数 ⟦634⟧ 等于分母指数减 ⟦101⟧。"]],["<strong>分类内外奇点</strong>：解出分母的全部零点，利用曲线方程逐个判定是否在 ⟦346⟧ 的内部（只保留内部奇点，外部直接移作分子解析部分）。","<strong>分离奇点构造解析分子</strong>：用复合闭路把圈内奇点拆到各自的小圆 ⟦3205⟧ 上，在小圆 ⟦3205⟧ 上把非 ⟦3207⟧ 的分母因子全搬入分子 ⟦3208⟧（或先作部分分式分解）。","<strong>匹配阶数相加收尾</strong>：对各小圈分别套用 ⟦3209⟧（⟦3210⟧），相加得出总积分。"]],[2,"柯西公式证明题与边界唯一性","题干涉及证明边界值决定内部解析函数、推导平均值定理，或将 ⟦761⟧ 实三角积分转为单位圆柯西积分证明。","ch3.4 第 12–16 页 柯西公式的理论推论与证明 · 教材 §3.3",[["解析函数的边界决定公式与平均值性质","⟦3215⟧","⟦1195⟧ 在简单闭曲线 ⟦346⟧ 内部解析并在闭域上连续（或者在含边界的更大区域解析），⟦291⟧ 为内部任意点。"]],["<strong>明确目标差函数或换元</strong>：若是唯一性证明则作差函数 ⟦1235⟧；若是单位圆实积分证明则令 ⟦1232⟧ 并把三角项改写为 ⟦3216⟧ 组合。","<strong>拆分适应柯西公式形式</strong>：将所求积分整理为 ⟦3217⟧ 之和或直接利用边界上 ⟦2374⟧。","<strong>回代柯西公式得出结论</strong>：由柯西定理、柯西公式及高阶公式依次算出各项与 ⟦3218⟧ 的关系（或推得 ⟦1237⟧）。"]],[2,"用复线积分求平面面积","计算 ⟦3226⟧、⟦3227⟧ 或 ⟦1238⟧ 等非解析函数绕平面区域边界的封闭积分。","ch3.1 复线积分与格林公式求平面面积 · 教材 §3.1 习题",[["复围线积分表示平面区域面积","⟦3222⟧","⟦2779⟧ 为分段光滑简单闭曲线且取逆时针正向，⟦1157⟧ 为其所围有界平面区域 ⟦193⟧ 的面积。"]],["<strong>展开实虚部分离微分</strong>：写出 ⟦2031⟧ 与 ⟦2383⟧，将复被积式乘开并整理为 ⟦3223⟧。","<strong>消去全微分闭路项</strong>：识别形如 ⟦3224⟧ 与 ⟦2385⟧ 的全微分项，其沿任意闭曲线积分为 ⟦128⟧。","<strong>格林公式换成面积</strong>：对其余交叉项应用格林公式 ⟦3225⟧，结合正向符号得出面积 ⟦1157⟧ 的倍数。"]],[2,"调和判定、配参数与恢复解析函数","检验调和性、根据 ⟦2733⟧ 定待定参数，或已知实部/虚部构造完整解析函数 ⟦129⟧（期末 100% 必考大题）。","ch3.5 第 3–11 页 调和判定、参数确定与解析重构 · 教材 §3.4",[["二维拉普拉斯方程（调和条件）","⟦3235⟧","在单连通区域 ⟦193⟧ 内有连续二阶偏导数且满足拉普拉斯方程的实函数称为调和函数，必存在全局共轭调和函数。"],["偏积分法与汤姆逊恢复公式","⟦3236⟧","已知实部 ⟦474⟧ 时使用上式；已知虚部 ⟦449⟧ 时改用 ⟦2731⟧ 或 ⟦2732⟧。"]],["<strong>求二阶偏导定参数或验调和</strong>：算出 ⟦3237⟧ 与 ⟦3238⟧；若含待定参数则令 ⟦484⟧ 比较多项式或函数系数求出参数，否则直接验证和为零。","<strong>积分恢复共轭部或导数</strong>：使用偏积分法沿一个变量积分并保留单变量未知函数，再用另一条 C-R 方程定出未知函数；若只求 ⟦129⟧ 且过实轴也可用汤姆逊法直接积分 ⟦191⟧。","<strong>化为 ⟦9⟧ 式并代初值</strong>：利用配方或代换写出只含 ⟦9⟧ 的解析函数 ⟦129⟧，最后代入给定点处的初值确定积分常数。"]],[3,"复数列与复数项级数敛散性","讨论复数列的极限，或判别复数项级数的收敛性、条件收敛与绝对收敛，一般通过拆实虚部与求模归结为高数级数判别。","ch4.1 第 4–24 页 复数列极限与复数项级数 · 教材 §4.1",[["复级数收敛充要条件与必要条件","⟦3245⟧","⟦3246⟧。只要实部或虚部级数中有一个发散，或通项模不趋于 ⟦128⟧，复级数即发散。"],["绝对收敛与条件收敛判据","⟦3247⟧","若正项级数 ⟦504⟧ 发散而 ⟦3248⟧ 均收敛，则称原级数为条件收敛。"]],["<strong>检验必要条件</strong>：先求通项模长 ⟦3249⟧；若极限不为零或不存在，直接断定发散。","<strong>拆实虚判敛散</strong>：将通项分解为 ⟦3250⟧，分别运用实数项级数的收敛判别法检查 ⟦3251⟧ 与 ⟦3252⟧ 是否同时收敛。","<strong>判别绝对收敛性</strong>：构造正项级数 ⟦3253⟧，利用比较、比值或根值法区分绝对收敛与条件收敛。"]],[3,"幂级数半径、边界和阿贝尔定理","利用系数求幂级数收敛半径 ⟦370⟧，根据已知两点的敛散性反推未知点是否收敛，或利用阿贝尔定理判断收敛圆周。","ch4.2 第 8–18 页 收敛半径与阿贝尔定理 · 教材 §4.2",[["幂级数收敛半径的比值与根值公式","⟦2735⟧","以 ⟦369⟧ 为中心，所得 ⟦370⟧ 满足：⟦3027⟧ 绝对收敛，⟦3257⟧ 发散，⟦371⟧ 须单独检验。"],["阿贝尔定理与收敛域区间估计","⟦3258⟧","推论：若点 ⟦9⟧ 满足 ⟦3259⟧，则级数在该点必绝对收敛；若 ⟦3260⟧ 则必发散。"]],["<strong>识别展开中心 ⟦369⟧</strong>：将幂级数整理成 ⟦3261⟧ 标准形态（若为变量代换如 ⟦3262⟧ 需先提出公因子），读出 ⟦369⟧ 与系数 ⟦3263⟧。","<strong>求取或夹逼半径 ⟦370⟧</strong>：系数已知时用比值或根值极限算出 ⟦370⟧；若系数未知只给特定点敛散，则计算各已知点到 ⟦369⟧ 的距离以界定 ⟦370⟧ 范围。","<strong>判定指定点与边界</strong>：比较待判点到 ⟦369⟧ 的距离与 ⟦370⟧ 大小；若恰在边界圆周，逐个代入再用实复级数判别法（如狄利克雷或交错判别）确定。"]],[3,"逐项积分或求导得到和函数","计算如 ⟦3268⟧、⟦3269⟧ 或 ⟦3270⟧ 等特定幂级数在收敛圆内的解析和函数。","ch4.2 第 21–23 页 幂级数逐项求导与积分 · 教材 §4.2",[["几何级数逐项求导与积分典型和函数","⟦3266⟧","逐项求导与积分仅保证在开收敛圆 ⟦3027⟧ 内部成立，端点处的和函数需另行由阿贝尔第二定理检验。"]],["<strong>匹配基准幂级数</strong>：观察通项系数中的多项式因子（⟦3267⟧）或分母（⟦3267⟧），确定它是几何级数或指数级数求导或积分几次的结果。","<strong>执行逐项微积分</strong>：先补足或提取 ⟦9⟧ 的公共幂次使其指数与求导/积分次数匹配，然后对闭式和函数求导（或从中心 ⟦369⟧ 逐项积分）。","<strong>核查边界常数与收敛域</strong>：代入中心 ⟦156⟧ 检验常数项是否相符，并明确注明和函数成立的开收敛圆 ⟦3027⟧。"]],[3,"泰勒展开与最近奇点法","给定解析函数与非零中心 ⟦369⟧，要求不展开直接求泰勒收敛半径，或将有理式展开为 ⟦3281⟧ 幂级数。","ch4.3 第 4–25 页 泰勒展开与最近奇点法 · 教材 §4.3",[["泰勒展开定理与最近奇点半径准则","⟦3274⟧","⟦1195⟧ 在 ⟦369⟧ 解析时展开唯一成立。计算 ⟦370⟧ 时必须先剔除可通过补充定义消除的可去奇点。"],["高频麦克劳林基准展开式（间接法母版）","⟦3275⟧","后两式对全平面 ⟦3276⟧ 收敛；此外 ⟦3277⟧、⟦3278⟧。"]],["<strong>若只问半径：找最近奇点</strong>：解出分母或非解析点的全部位置，剔除可去奇点后计算中心 ⟦369⟧ 到各实际奇点的距离 ⟦3279⟧，取最小值即为 ⟦370⟧。","<strong>若要展开：配中心裂项</strong>：若是多项分母的有理式，先做部分分式分解；把所有自变量统一改写为 ⟦711⟧，并从每个分母提取常数使化为 ⟦3280⟧。","<strong>套表合并定交集</strong>：对各因式分别用公比 ⟦2763⟧ 的几何级数或导数关系展开并合并同类幂，收敛半径取所有分式收敛域的交集。"]],[3,"双边幂级数与多圆环洛朗展开","求双边幂级数 ⟦3298⟧ 收敛环、将函数在多个不同圆环（含中心为极点）展开，或原圆环跨奇点需拆分。","ch4.4 第 8–34 页 双边幂级数与多圆环洛朗展开 · 教材 §4.4",[["双边级数收敛圆环结构","⟦3286⟧","当且仅当 ⟦3287⟧ 时存在非空收敛开圆环 ⟦3288⟧；若 ⟦3289⟧ 则双边级数处处不收敛。"],["指定圆环的等价几何级数模板","⟦3290⟧","⟦3291⟧。遇指数型如 ⟦2771⟧ 或 ⟦3292⟧ 时直接套用 ⟦3293⟧ 麦克劳林展开，在 ⟦3294⟧ 均成立。"]],["<strong>定中心划同心圆</strong>：以展开中心 ⟦369⟧ 为圆心计算其到所有奇点的距离 ⟦3295⟧，检查目标圆环是否跨过圆周 ⟦3296⟧（跨过则必须拆分）。","<strong>分式拆解与指数展开</strong>：作代换 ⟦3291⟧；对有理分式先裂项（若以极点为中心则留出 ⟦3297⟧），指数或三角复合式直接套对应麦克劳林级数。","<strong>分环选比并写出结论</strong>：在每个目标圆环上按“小在分子、大在分母”原则逐项展开，合并同次幂并写清最终有效的开圆环范围。"]],[4,"有限奇点、零点阶数与数列奇点","给定分式、指数或三角组合函数，分类所有有限孤立奇点与零点阶数，或判断整数无穷数列奇点 ⟦3312⟧ 的类型。","ch5.1 第 16–32 页 零极点阶数与周期分母奇点 · 教材 §5.1",[["局部分解与零极点统一判据","⟦3305⟧","⟦3306⟧ 时 ⟦291⟧ 为 ⟦634⟧ 阶零点；⟦3307⟧ 时 ⟦291⟧ 为 ⟦3308⟧ 阶极点；若无此有限指数（去心邻域有无穷多负幂项）则为本性奇点。"],["解析函数 ⟦634⟧ 阶零点等价条件","⟦3309⟧","记忆常用泰勒首项：⟦3310⟧（1阶）；⟦3311⟧（2阶）。"]],["<strong>列出全部候选点并判孤立</strong>：找出所有使函数无定义点并验证其相互孤立（或考察任意两点距离有下界）。","<strong>分解分子分母首非零幂</strong>：利用等价泰勒展开或高阶导数分别求出分子、分母在各个候选点处的零点阶数。","<strong>按情形归纳奇点类型</strong>：对满足分子为零的特例点单独相减归类，其余点直接得出极点阶数或指出本性奇点。"]],[4,"无穷远点的奇点分类","判断函数在无穷远点 ⟦669⟧ 的奇点类型，或在存在无穷多个有限奇点时判别 ⟦842⟧ 是否为孤立奇点。","ch5.1 第 27–32 页 无穷远点的奇点分类 · 教材 §5.1",[["倒数换元法判定 ⟦669⟧ 性态","⟦3316⟧","前提是存在 ⟦1693⟧ 使 ⟦1195⟧ 在 ⟦3317⟧ 解析。⟦853⟧ 对于 ⟦3318⟧ 是可去、⟦634⟧ 阶极点还是本性奇点，⟦842⟧ 对于 ⟦129⟧ 即为同类奇点。"]],["<strong>核验外域解析性</strong>：检查有限奇点是否有界（是否有奇点列趋向无穷）；若无界，则 ⟦842⟧ 为非孤立奇点。","<strong>作倒数换元</strong>：令 ⟦1654⟧ 写出 ⟦668⟧，把研究无穷远转为研究原点 ⟦853⟧。","<strong>归类 ⟦853⟧ 并译回 ⟦842⟧</strong>：求极限或展开 ⟦3318⟧，按 ⟦853⟧ 处极限有限、⟦3319⟧ 极点或无穷多负幂项，给出 ⟦669⟧ 的奇点类型。"]],[4,"展开读留数与高阶极点求导","计算高阶极点留数、本性奇点留数，或者围线外奇点极少而内部奇点众多时的复围线积分。","ch5.2 第 7–15 页 留数五大算法与围线积分 · 教材 §5.2",[["⟦634⟧ 阶极点通用求导留数公式","⟦3324⟧","⟦291⟧ 为 ⟦1195⟧ 的 ⟦634⟧ 阶极点（⟦2443⟧）。若分子分母在 ⟦291⟧ 同有零点，需先约去公因子或由阶数差定出真实 ⟦634⟧。"],["本性奇点展开与留数定理","⟦3325⟧","对本性奇点只能展开求 ⟦2788⟧ 系数。若外部奇点更少，可先算包含所有奇点的外和或用无穷远留数扣减。"]],["<strong>消公因子判阶数</strong>：检查圈内各奇点，先约掉或比较分子分母零点阶数得出实际极点阶数（消除可去奇点）或识别本性奇点。","<strong>选择最短留数路径</strong>：一阶极点用 ⟦2785⟧；二阶极点用 ⟦3326⟧ 求一阶导；三阶及以上或本性奇点做换元 ⟦2786⟧ 泰勒展开读 ⟦702⟧ 系数。","<strong>求和并核查边界方向</strong>：圈内留数之和乘 ⟦2077⟧（注意题中围线是否反向，并确认围线上无奇点）。"]],[4,"无穷远留数与全平面求和","计算 ⟦1256⟧ 等函数在 ⟦842⟧ 处的留数，或围线内部极点多且阶数高而外部无奇点（或只有简单奇点）的围线积分。","ch5.2 第 17–26 页 无穷远点留数与全平面留数和 · 教材 §5.2",[["无穷远点留数的定义与换元公式","⟦3331⟧","⟦701⟧ 为 ⟦129⟧ 在包含所有有限奇点的外环 ⟦3317⟧ 内洛朗展开的 ⟦584⟧ 系数。负号对应顺时针绕 ⟦842⟧ 定向。"],["全平面留数和定理与有理式速判","⟦3332⟧","当 ⟦3333⟧ 时，⟦3334⟧ 等于最高次项系数比值的相反数。"]],["<strong>观察内外奇点复杂度</strong>：比较闭路 ⟦346⟧ 内部奇点总数/阶数与 ⟦346⟧ 外部奇点数；外部更简单时选用全平面留数和定理。","<strong>计算 ⟦842⟧ 点留数</strong>：对有理式直接比较分子分母最高次幂（差 ⟦731⟧ 即得 ⟦128⟧，差 ⟦101⟧ 读首项系数比值加负号）；对非有理式在 ⟦2415⟧ 展开找 ⟦584⟧ 系数并取反，或套 ⟦3335⟧。","<strong>加总圈外留数并取反</strong>：将所有落在 ⟦346⟧ 外的有限奇点留数与 ⟦3336⟧ 相加，乘以 ⟦3337⟧ 即得原积分。"]],[4,"孤立奇点可去与极点判据证明","证明孤立奇点在去心邻域有界必为可去奇点（黎曼可去奇点定理），或证明 ⟦1268⟧ 必为极点。","ch5.1 孤立奇点判别定理的严格证明 · 教材 §5.1",[["洛朗负幂系数积分与估计","⟦3343⟧","⟦1195⟧ 在去心邻域 ⟦2429⟧ 解析且满足 ⟦2430⟧，其中 ⟦1261⟧。令 ⟦3344⟧ 即得全部 ⟦2438⟧。"],["倒数与零极点转换关系","⟦3345⟧","其中 ⟦2443⟧ 为 ⟦1270⟧ 在 ⟦291⟧ 处的零点阶数且 ⟦1273⟧，从而 ⟦3346⟧ 具有 ⟦634⟧ 阶极点。"]],["<strong>有界证可去</strong>：对 ⟦1263⟧ 写出 ⟦3347⟧ 沿圆 ⟦3348⟧ 的积分表示，代入 ⟦1264⟧ 与弧长 ⟦2435⟧ 得 ⟦1265⟧。","<strong>令半径趋零消主部</strong>：由系数与 ⟦1266⟧ 无关性令 ⟦3344⟧，推出所有负幂系数 ⟦2438⟧，故仅含非负幂项而为可去奇点。","<strong>趋无穷转倒数证极点</strong>：在充分小去心邻域内取 ⟦3349⟧ 使 ⟦1270⟧ 解析且趋于 ⟦128⟧，延拓后由非恒零解析函数孤立零点性质提取 ⟦3350⟧ 得证。"]],[4,"对数导数与零极点阶数","已知 ⟦1195⟧ 在 ⟦291⟧ 处有 ⟦634⟧ 阶零点或 ⟦372⟧ 阶极点，求对数导数 ⟦1271⟧（或组合 ⟦3358⟧）在 ⟦291⟧ 处的奇点类型与留数。","ch5.2 对数导数、零极点阶数与留数 · 教材 §5.2–§5.4",[["对数导数分解与留数定理","⟦3355⟧","⟦1224⟧ 在 ⟦291⟧ 邻域解析且 ⟦1273⟧。当 ⟦291⟧ 为 ⟦634⟧ 阶零点时留数为 ⟦634⟧；当 ⟦291⟧ 为 ⟦372⟧ 阶极点（⟦3356⟧）时留数为 ⟦1281⟧。"]],["<strong>提取局部首阶幂</strong>：按零点或极点阶数写出分解式 ⟦1272⟧，标明 ⟦1224⟧ 在 ⟦291⟧ 解析且 ⟦1273⟧。","<strong>计算导数并拆分比值</strong>：对乘积求导计算 ⟦1271⟧（以及可能涉及的 ⟦3357⟧），化简为极点主部与辅助商函数之和。","<strong>验证余项解析并读留数</strong>：由 ⟦1273⟧ 说明 ⟦2447⟧ 等余项在 ⟦291⟧ 解析（不贡献留数），从而直接由一阶项系数得出总留数。"]],[4,"周期三角积分的单位圆法","计算 ⟦3371⟧ 或偶函数在 ⟦2275⟧ 上的三角有理式定积分，使用单位圆代换。","ch5.3 第 2–8 页 第一类实积分（单位圆法） · 教材 §5.3",[["三角有理积分的单位圆代换公式","⟦3362⟧","整周期 ⟦761⟧ 对应正向单位圆 ⟦11⟧。半周期 ⟦2275⟧ 须先检验偶性并化为全周期的一半。"],["单位圆留数积分结论","⟦3363⟧","仅当分母在单位圆周 ⟦11⟧ 上无零点时成立；所有极点模长可用韦达定理 ⟦3364⟧ 快速判断内外。"]],["<strong>化为整周期区间</strong>：若原积分限为 ⟦2275⟧，利用偶函数性质改写为 ⟦3365⟧；含 ⟦3366⟧ 时也可用 ⟦3367⟧ 化简。","<strong>代换并通分有理化</strong>：把三角函数与 ⟦3368⟧ 全部用 ⟦9⟧ 表示，分子分母同乘 ⟦9⟧ 的幂次化为规范有理分式 ⟦3369⟧，核查是否含 ⟦156⟧ 极点。","<strong>判单位圆内极点算留数</strong>：解分母零点，用 ⟦3370⟧ 筛选圆内极点并求留数，乘 ⟦2077⟧（若有 ⟦2616⟧ 系数别忘乘回）。"]],[4,"有理函数全轴与半轴反常积分","计算 ⟦3381⟧ 或偶函数在 ⟦1819⟧ 上的有理反常积分（含一阶或重极点），选用上半圆围道。","ch5.3 第 9–14 页 第二类实积分（上半圆法） · 教材 §5.3",[["上半圆围道留数求有理反常积分","⟦3376⟧","条件：⟦3377⟧（⟦3378⟧）且 ⟦2794⟧。若原积分为 ⟦1819⟧ 且函数为偶函数，最终结果乘 ⟦2616⟧。"]],["<strong>检验条件与奇偶性</strong>：验证实轴上无奇点、分母次数至少比分子高 ⟦102⟧ 次，若为半轴积分说明偶性后加 ⟦785⟧ 改写为全轴积分。","<strong>筛选上半平面极点算留数</strong>：解出 ⟦3379⟧ 的所有根，只取 ⟦3380⟧ 的极点（包括重极点），按极点阶数求留数。","<strong>证明大圆弧消失并还原</strong>：利用 ML 估计指出半圆弧上 ⟦2798⟧ 故弧积分趋零，求和乘 ⟦2077⟧ 后还原半轴积分。"]],[4,"振荡反常积分与约当引理","计算 ⟦3398⟧ 或 ⟦812⟧ 型振荡反常积分时，必须替换成复指数 ⟦3394⟧ 并应用约当引理。","ch5.3 第 15–19 页 第三类实积分与约当引理 · 教材 §5.3",[["振荡反常积分与约当引理公式","⟦3386⟧","要求 ⟦1311⟧，⟦3387⟧ 在实轴无零点且 ⟦3388⟧（即无穷远充分衰减）；取实部得 ⟦3389⟧ 积分，取虚部得 ⟦812⟧ 积分。"],["复指数在上半平面的衰减机制","⟦3390⟧","由约当引理，只要当 ⟦3391⟧ 时上半圆弧上 ⟦3392⟧，则 ⟦3393⟧。"]],["<strong>判断奇偶与符号参数</strong>：确认实轴无奇点（如为偶函数在半轴 ⟦784⟧ 则乘 ⟦785⟧ 化全轴），并确保常数 ⟦1311⟧。","<strong>构造复指数辅助函数</strong>：将 ⟦3389⟧ 或 ⟦812⟧ 替换为 ⟦3394⟧，写出复函数 ⟦3395⟧。","<strong>求上半平面留数并取实虚部</strong>：计算 ⟦3380⟧ 处留数和乘 ⟦2077⟧，依据约当引理说明弧积分趋零，最后取实部（对 ⟦3396⟧）或虚部（对 ⟦3397⟧）并乘回半轴系数。"]],[5,"局部保角、伸缩率与旋转角","给定解析映射 ⟦848⟧ 与内点 ⟦369⟧，求该点处的伸缩率、旋转角，或指出使函数失去保角性的临界点。","共形映射 第 4–22 页 导数的几何意义与保角性 · 教材 §6.1",[["导数模与辐角的几何意义","⟦3405⟧","⟦1195⟧ 在 ⟦369⟧ 解析且 ⟦3406⟧ 时成立。正旋转角表示逆时针旋转，负值表示顺时针旋转。"]],["<strong>求导并检查非零性</strong>：计算解析函数的导数 ⟦191⟧，若找不保角点则令 ⟦3407⟧ 解方程；否则代入指定点 ⟦369⟧。","<strong>求模读出伸缩率</strong>：计算复数 ⟦3408⟧ 的模 ⟦3409⟧，即为该点处的线元伸缩率。","<strong>求辐角定旋转角</strong>：依据 ⟦3408⟧ 所在象限求其辐角主值 ⟦3410⟧，即为曲线切线的旋转角。"]],[5,"三点对应、保圆性与对称点","给定三个源点及其对应的三个像点求唯一分式线性映射，或利用保圆性与对称点求实轴、圆周的像。","共形映射 第 23–46 页 交比不变性与保圆保对称性 · 教材 §6.2",[["三点对应的交比不变公式","⟦3415⟧","三源点各自互异、三像点各自互异；其中若某个点为 ⟦842⟧，将其所在的所有因式（形如 ⟦3416⟧ 或 ⟦3417⟧）直接按极限替换为 ⟦101⟧。"],["对称点保持性质","⟦3418⟧","广义圆 ⟦346⟧ 关于另一点对的对称性在分式线性映射下严格保持不变；特别地，关于实轴的对称点为 ⟦9⟧ 与 ⟦2706⟧。"]],["<strong>标出三对对应点</strong>：从题设直接读出（或利用对称性、边界上选点补齐）互异的三组对应点 ⟦3419⟧，标记是否有 ⟦842⟧ 点。","<strong>列交比式化解</strong>：代入交比不变式并将含 ⟦842⟧ 的因式换成 ⟦101⟧，交叉相乘后整理成 ⟦2811⟧。","<strong>取内点校验方向</strong>：若映射涉及区域对应，取一内点代入验证区域落在边界哪一侧，并检验三点对应是否完全吻合。"]],[5,"圆盘自同构与内点归一化","构造从单位圆盘 ⟦565⟧ 映到自身 ⟦852⟧，或从任意半平面映到单位圆盘并指定内点与导数条件的共形映射。","共形映射 第 47–55 页 单位圆自同构与半平面模板 · 教材 §6.2",[["单位圆盘自同构一般形式","⟦3423⟧","该映射将单位圆盘 ⟦565⟧ 共形双射到自身，且 ⟦3424⟧；其导数在 ⟦291⟧ 处满足 ⟦3425⟧。"],["一般半平面或圆盘的归一化映射","⟦3426⟧","只要选对 ⟦291⟧ 与其对称点 ⟦3427⟧，即可保证边界直线到目标原点距离比恒为 ⟦101⟧（即映为单位圆周）。"]],["<strong>定源域与对称点</strong>：辨别源域是单位圆盘还是半平面，确定要把哪一个内点 ⟦291⟧ 送到原点，并写出其关于边界的对称点。","<strong>写模板算导数</strong>：套用对应含旋转角参数 ⟦2820⟧ 的标准公式，求导数 ⟦2821⟧ 并代入 ⟦1512⟧。","<strong>由导数条件定相位</strong>：根据题目对 ⟦3428⟧ 辐角或边界点像的要求解出 ⟦856⟧，再复核单射性与规范条件。"]],[5,"偏心圆环映到同心圆环","给定两个互不相交且不同心的圆周所围成的偏心圆环域，求将其共形映射成以原点为心的同心圆环的分式线性映射。","共形映射 第 56–58 页 偏心圆环映到同心圆环 · 教材 §6.2",[["公共对称点方程与同心化映射","⟦3433⟧","两圆 ⟦3434⟧ 与 ⟦3435⟧ 内含或外离；将圆心连线转到实轴后 ⟦3436⟧ 为实二次方程的两实根，取绝对值系数 ⟦131⟧ 使外圆半径映为 ⟦101⟧。"]],["<strong>连线转实轴</strong>：若两圆心连线不在实轴上，先作平移旋转将两圆心都移到实轴上（若已在实轴则直接跳过）。","<strong>联立求公共对称点 ⟦3436⟧</strong>：列出关于两圆的对称点方程组并两式相减消去二次项 ⟦3437⟧，解韦达方程得到实数 ⟦3436⟧。","<strong>定外圆半径归一化</strong>：写出 ⟦3438⟧（取环域外部的对称点作分母极点），代入外圆上一点令 ⟦839⟧ 确定 ⟦131⟧，再代入内圆一点求出内圆半径。"]],[5,"幂、指数与对数的复合区域映射","映射扇形/角形域、水平或竖直带形域、半圆域或两圆交集月牙域到上半平面或单位圆盘，采用“搭积木”复合保角映射。","共形映射 第 59–86 页 初等函数与复合保角映射 · 教材 §6.3",[["初等函数共形映射四件套","⟦3440⟧","分式映射 ⟦3441⟧ 把交于 ⟦1202⟧ 的两圆弧月牙域映为角域；再用 ⟦903⟧ 把上半平面映为单位圆。"]],["<strong>画草图标交点与边界</strong>：明确源域的边界线段、圆弧交点、对称轴或无限延伸方向，以及目标域要求。","<strong>拆解为标准化中转步骤</strong>：角域定角度放大倍数 ⟦3442⟧；带域先旋转成水平带再缩放用 ⟦3443⟧；月牙或半圆先把两交点映到 ⟦3444⟧ 变为角域。","<strong>逐步跟踪内点并复合</strong>：每一步都取一个内点跟踪其像验证区域在正确一侧且全程单射，最后把各步表达式复合成单一公式。"]],[6,"傅里叶级数、端点收敛与积分求值","求周期方波或分段函数的傅里叶级数，或借助跳点收敛定理与傅里叶积分表达式推导如狄利克雷积分等反常积分的值。","1.1–1.2 第 2–23 页 傅里叶级数与端点收敛求值 · 教材 积分变换 §1.1",[["狄利克雷端点收敛定理（级数与积分统一形式）","⟦3447⟧","对分段光滑函数的周期延拓傅里叶级数，或在全轴绝对可积且分段光滑的傅里叶反演积分，在任意点均收敛到左右极限半和。"],["实三角傅里叶级数系数（周期 ⟦3448⟧）","⟦3449⟧","奇函数仅含正弦项（⟦3450⟧），偶函数仅含余弦项（⟦3451⟧）；积分只需算半周期再乘 ⟦102⟧。"]],["<strong>分清周期级数与全轴积分</strong>：明确题目求的是离散周期级数展开还是非周期连续傅里叶积分。","<strong>求级数系数或连续频谱</strong>：利用奇偶性简化系数积分区间并算出表达式，特别简化 ⟦3452⟧ 导致的奇偶项消去。","<strong>代入指定点求左右极限</strong>：检查目标点 ⟦3453⟧ 的左极限 ⟦3454⟧ 与右极限 ⟦3455⟧，令级数和或反演积分等于其平均值解出数值。"]],[6,"奇偶性、分段波形与典型频谱","计算门函数、双边指数衰减、斜坡截断或三角波脉冲的标准傅里叶变换，结合奇偶性或分部积分化简。","1.1–1.2 第 24–39 页 典型非周期脉冲与指数频谱 · 教材 积分变换 §1.2",[["门函数与双边指数核心变换对","⟦3459⟧","单边衰减指数 ⟦3460⟧；双边指数可看作左右两单边之和。"],["奇偶对称函数的傅里叶化简形式","⟦3461⟧","频谱零点检验准则：⟦3462⟧；对连续分母含 ⟦1006⟧ 的结果取极限 ⟦2217⟧ 检验。"]],["<strong>划定非零区间判奇偶</strong>：画出波形支撑域并检查是否具有偶对称或奇对称性，遇到 ⟦3463⟧ 则按 ⟦945⟧ 分段。","<strong>积分化简为标准三角式</strong>：利用欧拉公式或分部积分算出定积分，通过 ⟦3464⟧ 或平方项整理表达式。","<strong>双保险核对频谱性质</strong>：检查 ⟦3465⟧ 是否等于时域总面积，并核对实偶函数对应实偶谱、实奇函数对应纯虚奇谱。"]],[6,"广义变换、冲激缩放及阶跃","遇尺度压缩冲激 ⟦3474⟧、冲激偶导数或计算单位阶跃函数 ⟦3478⟧ / 符号函数 ⟦2234⟧ 的广义傅里叶变换时使用。","1.1–1.2 第 40–50 页 冲激缩放与阶跃广义变换 · 教材 积分变换 §1.2",[["冲激的线性缩放与平移公式","⟦3469⟧","通过换元 ⟦3470⟧ 验证：积分面积缩放 ⟦3139⟧ 倍故须除以 ⟦3139⟧；当表达式含光滑因子 ⟦3471⟧ 时先筛选再换元等价。"],["符号函数与单位阶跃函数的广义频谱","⟦3472⟧","以广义函数（分布）与柯西主值意义理解；⟦989⟧ 与 ⟦3473⟧ 线性相加即得阶跃频谱。"]],["<strong>还原标准冲激位置</strong>：遇到 ⟦3474⟧ 先提因子 ⟦2866⟧ 化为 ⟦3475⟧，再用筛选性质在 ⟦3476⟧ 处代值计算乘子。","<strong>拆解常数与符号项</strong>：遇到阶跃函数或非对称常数信号，拆成常数直流项与 ⟦2234⟧ 组合。","<strong>合并广义变换项</strong>：代入 ⟦989⟧ 与 ⟦3477⟧（逆变换注意 ⟦1857⟧），核查零频冲激系数。"]],[6,"对偶、微分、调制与组合性质","题设给定基础变换对，要求综合运用对称性（对偶律）、时域/频域微分性质与调制性质推导出新函数的频谱。","1.3–1.5 第 6–20 页 对偶、微分与组合性质 · 教材 积分变换 §1.3",[["傅里叶对称性（互易律）","⟦3486⟧","由逆变换定义将 ⟦1006⟧ 与 ⟦682⟧ 互换变量即可导出；特别适用于计算像 ⟦3487⟧、⟦3488⟧ 这类频谱形态倒置的函数。"],["时域与频域微分性质","⟦3489⟧","前式需 ⟦3490⟧ 且分段光滑；一般 ⟦372⟧ 阶形式为 ⟦3491⟧ 与 ⟦3492⟧。"]],["<strong>匹配基本原型</strong>：观察目标函数结构，找出其来源的基本变换对（如双边指数或门函数）或求导前体。","<strong>明确性质叠加顺序</strong>：把“对称对偶、微分、缩放、平移、调制”拆成清晰的单步链条，每一步写出对应频谱变化。","<strong>复核符号与 ⟦49⟧ 因子</strong>：重新对原式取微分验证 ⟦1750⟧ 与正负号，并确认对称性带来的 ⟦49⟧ 因子是否已准确乘入或约掉。"]],[6,"全轴卷积及频域积分方程","计算指数函数全轴卷积（如 ⟦3507⟧），或求解形如 ⟦3508⟧ 的全轴卷积积分方程。","1.3–1.5 第 24–28 页 卷积定理与频域解积分方程 · 教材 积分变换 §1.4",[["傅里叶卷积定理（时域与频域互化）","⟦3503⟧","绝对可积条件下成立；对全轴卷积方程两边取正变换可得代数方程 ⟦3504⟧。"]],["<strong>确认全轴卷积结构</strong>：识别 ⟦3505⟧，区别于下限为 ⟦128⟧ 的拉普拉斯单边卷积。","<strong>变换到频域乘除求解</strong>：分别算出各已知核的傅里叶变换，写出乘积谱或解出未知函数频谱 ⟦3506⟧。","<strong>反演并代回核验</strong>：利用对偶性、参数求导或留数法将频谱反演回时域 ⟦960⟧，代回卷积积分验证满足原式。"]],[7,"拉氏收敛域与基本变换对","求三角平方、双曲平方等初等组合的拉普拉斯变换，或根据多项指数增长率确定确切的绝对收敛半平面。","2.1–2.2 第 10–16 页 基本变换对与收敛横坐标 · 教材 积分变换 §2.1",[["幂次与乘指数标准变换对","⟦3514⟧","对于一般实数次幂 ⟦3515⟧ 有 ⟦3516⟧（如 ⟦3517⟧）。"],["双曲函数变换对与绝对收敛半平面","⟦3518⟧","多个线性组合项的收敛域取交集，即由最右端极点/最大实部指数决定；有相消项时须先化简再判。"]],["<strong>降幂或展开为基本项</strong>：遇三角平方或乘积使用倍角/积化和差公式，遇双曲函数写为指数组合或直接拆项。","<strong>估计无穷远增长阶</strong>：检查是否存在同类增长项相互抵消，读出各项在大 ⟦682⟧ 时的主导指数增长率 ⟦3519⟧。","<strong>写变换结果与最右边界</strong>：逐项套用标准变换对合并通分，并以最大实部作为收敛边界 ⟦2905⟧。"]],[7,"阶跃、分段与非零时刻冲激","将分段斜坡/方波改写为单位阶跃函数求拉氏变换，或者反演含有延时因子 ⟦2904⟧ 的三角波与非零时刻冲激。","2.1–2.2 第 30–33 页 阶跃分段与第二位移性质 · 教材 积分变换 §2.2",[["延时波形与非零时刻冲激变换对","⟦3527⟧","若题给 ⟦3528⟧，等价写为 ⟦3529⟧；⟦1311⟧ 时延时冲激在原点无奇性。"],["延迟因子的逆变换公式","⟦3530⟧","即 ⟦3531⟧ 时该项取 ⟦128⟧，⟦3532⟧ 时取 ⟦3533⟧。注意分段三角波延迟 ⟦322⟧ 时 ⟦3534⟧ 可与前项抵消。"]],["<strong>标记分段跳变时刻</strong>：梳理每个新波形开启或关闭的时刻 ⟦3207⟧，用差分阶跃 ⟦3535⟧ 拼出整体表达。","<strong>配齐 ⟦3536⟧ 位移结构</strong>：正变换把分段乘子改写为 ⟦3536⟧ 的函数（或直接套 ⟦3537⟧）；逆变换先按各 ⟦3538⟧ 拆开分项。","<strong>逆变并保留阶跃开关</strong>：先对不含指数项的 ⟦3539⟧ 反演得 ⟦3540⟧，再分别将 ⟦682⟧ 改为 ⟦3541⟧ 并乘上 ⟦3542⟧ 还原。"]],[7,"周期函数的拉普拉斯变换","求周期方波、周期锯齿波或半波/全波整流正弦信号的拉普拉斯变换，套用单周期积分除以 ⟦3556⟧ 公式。","2.1–2.2 第 34–36 页 周期函数的拉氏变换 · 教材 积分变换 §2.2",[["因果周期函数的拉普拉斯变换公式","⟦3550⟧","⟦3551⟧ 在 ⟦3552⟧ 分段连续且对 ⟦1298⟧ 满足 ⟦3553⟧。对全波整流信号周期为半波周期，务必认真核对周期长度。"]],["<strong>确定完整正周期 ⟦3554⟧</strong>：画出两三个周期的波形，仔细辨别全周与半周非零区间，定出真实最小正周期 ⟦3554⟧。","<strong>只积第一周期 ⟦3552⟧</strong>：把 ⟦3552⟧ 内非零分段代入 ⟦3555⟧ 计算积分（三角核用分部积分或欧拉公式）。","<strong>除以 ⟦3556⟧ 并约简</strong>：代入公式后检查分子是否含 ⟦3557⟧ 因子并与分母 ⟦3558⟧ 约分。"]],[7,"初值终值定理及失效判断","题目利用初值定理求 ⟦3572⟧ 或利用终值定理判别 ⟦3573⟧ 是否存在，重点考察极点位置对终值定理失效的检验。","2.1–2.2 第 37–39 页 初值定理与终值定理 · 教材 积分变换 §2.2",[["拉氏初值定理与终值定理","⟦3567⟧","初值定理要求 ⟦960⟧ 在原点无冲激且有有限右极限；终值定理要求严格真有理式 ⟦1284⟧ 的全部极点均满足 ⟦3568⟧。"]],["<strong>先约分再查极点位置</strong>：写出 ⟦1284⟧ 并约去公因子（如 ⟦1086⟧），列出 ⟦1284⟧ 全部剩余极点并检验是否全在开左半平面 ⟦3569⟧。","<strong>判断定理适用性</strong>：若存在实部 ⟦3570⟧ 的极点（如虚轴上的共轭纯虚极点 ⟦3571⟧），直接判定终值定理失效（信号振荡或发散）。","<strong>满足条件后求极限或反演验证</strong>：确认全部条件成立后再令 ⟦2305⟧ 或 ⟦1104⟧ 求值，必要时反演核对时域极限。"]],[7,"乘除 t 与对数型逆变换","求解含乘 ⟦682⟧ 或除以 ⟦682⟧ 的拉氏正变换、计算形如 ⟦3586⟧ 或 ⟦3584⟧ 的超越像函数逆变换，或利用变换求 ⟦3587⟧。","2.1–2.6 乘除 t 性质与超越像函数反演 · 教材 积分变换 §2.2 & §2.4",[["乘 ⟦682⟧（频域求导）与除以 ⟦682⟧（频域积分）性质","⟦3578⟧","除以 ⟦682⟧ 性质按实变量 ⟦1086⟧ 表述时，须保证 ⟦2948⟧ 在 ⟦945⟧ 附近可积且满足积分换序条件（⟦3579⟧）。"],["超越像函数的求导反演法","⟦3580⟧","适用于 ⟦3581⟧、⟦3582⟧ 等求导后成为严格真有理式的函数，反演后须核对 ⟦1961⟧ 的极限。"]],["<strong>检验可积性与识别性质</strong>：遇 ⟦3583⟧ 正变换先验明 ⟦1961⟧ 原点可积；遇 ⟦275⟧ 或 ⟦3584⟧ 逆变换则对其像函数 ⟦1129⟧ 求导消去超越结构。","<strong>积分合并对数或反演有理式</strong>：求正变换时将分式从 ⟦1086⟧ 积到 ⟦2461⟧ 并合并对数再代上限 ⟦2461⟧；求逆变换时利用 ⟦3585⟧ 得出 ⟦1290⟧。","<strong>除回 ⟦682⟧ 并核对收敛域与端点</strong>：除以 ⟦682⟧ 还原 ⟦960⟧（若是实积分题则令 ⟦1104⟧ 或指定常数 ⟦1535⟧），确认收敛域与原点右极限。"]],[7,"单边卷积反演和微积分方程","使用单边卷积公式计算因果卷积或反演两像函数之积，以及求解同时出现导数与积分 ⟦3601⟧ 的微积分方程。","2.3–2.6 第 1–8, 25–28 页 单边卷积反演与微积分方程 · 教材 积分变换 §2.3 & §2.5",[["拉氏卷积定理与时域积分性质","⟦3596⟧","⟦3597⟧，对应于因果函数 ⟦1298⟧ 上的单边卷积。"]],["<strong>识别卷积核与积分项</strong>：将 ⟦3598⟧ 记为 ⟦3599⟧，将 ⟦3600⟧ 或三角核识别为标准单边卷积并写出各核像函数。","<strong>建立并化简代数方程</strong>：把原方程逐项变换并代入初值，通分消分母解出 ⟦1152⟧，必要时因式分解二次不可约分母并配方。","<strong>反演并在时域校验</strong>：求得因果解 ⟦1929⟧（⟦1298⟧），代入原积分/微分项复核左右两端相等。"]],[7,"常系数高阶、延迟或冲激初值题","求解三阶以上高阶常系数初值问题，或者右端含有分段非齐次激励、延时因子及冲激激励 ⟦1850⟧ 的二阶微分方程。","2.3–2.6 第 21–28 页 高阶及含冲激微分方程 · 教材 积分变换 §2.5",[["高阶导数的单边拉氏变换通式","⟦3608⟧","当激励含 ⟦1850⟧ 时，按分布（广义函数）含义使用该公式；⟦3609⟧ 表示从右侧趋于原点处的初值。"]],["<strong>列出全阶初值与激励像函数</strong>：完整写出 ⟦372⟧ 阶导数变换式并代入所有已知初值；求出右端指数、三角、阶跃或冲激激励的像函数。","<strong>求解并部分分式裂项 ⟦1152⟧</strong>：合并特征多项式 ⟦3610⟧ 后解出 ⟦1152⟧；先提出延迟因子 ⟦2904⟧，再对剩余有理分式裂项和配方。","<strong>反演并用初值严格复核</strong>：将各项查表反演（延时项乘 ⟦2902⟧），对所得 ⟦1929⟧ 求导代入全部初始条件检验无误。"]],[7,"两点边值题：用终点条件定初值","微分方程只给出了 ⟦3607⟧ 与另一时刻的终点值 ⟦3620⟧（两点边值问题），缺乏初始斜率 ⟦1172⟧ 时使用参数代换法。","2.3–2.6 缺失初值的两点边值问题 · 教材 积分变换 §2.5 延伸",[["未知初始斜率的参数化二阶变换","⟦3617⟧","先将未知的起点导数设成待定参数 ⟦131⟧；逆变换得含参函数 ⟦3618⟧ 后，再代入终点条件 ⟦3619⟧ 定出 ⟦131⟧。"]],["<strong>设未知初始量为参数</strong>：将题目缺失的起点条件（如 ⟦2942⟧）记为待定常数 ⟦131⟧。","<strong>带参完成变换与反演</strong>：对微分方程取拉氏变换解出含 ⟦131⟧ 的 ⟦1152⟧，做部分分式并反演得到含参数的时域通解 ⟦1929⟧。","<strong>代入终点条件消去参数</strong>：令 ⟦2873⟧ 代入求得 ⟦131⟧ 的数值，代回 ⟦1929⟧ 并同时检验 ⟦3607⟧ 与 ⟦3620⟧ 均满足题意。"]],[7,"变系数微分方程：把 t 变成对 s 求导","用拉普拉斯变换求解带时间 ⟦682⟧ 乘子的变系数常微分方程（如贝塞尔型或拉盖尔型 ⟦1319⟧）。","2.3–2.6 变系数微分方程的像域降阶法 · 教材 积分变换 §2.5 延伸",[["时域乘 ⟦682⟧ 导数对应的像域微分法则","⟦3623⟧","假设 ⟦231⟧ 及所需导数具有指数增长阶且满足积分号下求导换序条件。像域积分常数常由大 ⟦1086⟧ 渐近 ⟦3624⟧ 定出。"]],["<strong>先求导数变换再对 ⟦1086⟧ 求导</strong>：分别写出 ⟦3625⟧ 并代入初值，再对含 ⟦682⟧ 的项套用 ⟦3626⟧ 展开求导（勿漏乘积法则）。","<strong>在像域求解一阶微分方程</strong>：整理成关于 ⟦3627⟧ 与 ⟦1152⟧ 的一阶线性或可分离变量方程，积分求出带常数 ⟦346⟧ 的 ⟦1152⟧。","<strong>渐近定常数并反演验证</strong>：利用 ⟦3628⟧ 定出常数 ⟦346⟧，反演得 ⟦1929⟧ 后代回原方程及初值完全验算。"]],[1,"模函数的梯度恒等式","涉及解析函数模长 ⟦3640⟧ 的偏导数恒等式或梯度平方证明（如 ⟦1334⟧），并在零点处分析可微性。","ch2.1 解析函数性质与梯度计算 · 教材 §2.2 延伸",[["非零点处模函数的梯度恒等式","⟦3633⟧","⟦1332⟧ 在点 ⟦9⟧ 所在区域解析且 ⟦1333⟧。若 ⟦369⟧ 为简单零点（⟦3634⟧），则 ⟦2530⟧ 在 ⟦369⟧ 不可微。"]],["<strong>链式求模的偏导</strong>：记 ⟦3635⟧，分别计算 ⟦1336⟧ 与 ⟦2522⟧。","<strong>利用 C-R 消去交叉项</strong>：将 ⟦3636⟧ 代入 ⟦1337⟧，计算 ⟦3637⟧ 时 ⟦3638⟧ 恰好抵消。","<strong>约去 ⟦3639⟧ 并讨论零点</strong>：由 ⟦1338⟧ 得证，并给出 ⟦1339⟧ 说明简单零点处 ⟦2530⟧ 不可微的原因。"]],[4,"给定零点阶数求商的留数","未给出 ⟦3650⟧ 具体解析式，仅知二者在点 ⟦291⟧ 的零点阶数，要求用泰勒系数表示商 ⟦1342⟧ 在 ⟦291⟧ 的极点阶数与留数。","ch5.1–ch5.2 抽象零点阶数与留数符号推导 · 教材 §5.1–§5.2 延伸",[["抽象商函数在零点处的泰勒展开比","⟦3645⟧","⟦1343⟧，设 ⟦1346⟧。分子一阶零点除以分母三阶零点得到二阶极点，留数为 ⟦2539⟧ 系数 ⟦3646⟧。"]],["<strong>设局部坐标写首非零展开</strong>：令 ⟦1343⟧，分别按零点阶数写出 ⟦1195⟧ 与 ⟦1894⟧ 的前两三项泰勒展开并注明首项系数非零。","<strong>提最低幂定极点阶数</strong>：提取分子分母最低次幂约分得到 ⟦3647⟧，由此判定极点阶数为 ⟦3648⟧。","<strong>做几何倒数展开提 ⟦2539⟧ 项</strong>：将分母剩余解析因子写成 ⟦3649⟧ 并取逆展开，乘以分子后合并 ⟦2539⟧ 系数。"]],[5,"分支选择与 Joukowski 映射","考察儒可夫斯基（Joukowski）映射 ⟦3660⟧ 将单位圆外部或内部双射到割裂平面 ⟦3661⟧ 的分支与证明。","共形映射 第 82–85 页 儒可夫斯基映射 · 教材 §6.3 延伸",[["儒可夫斯基映射与二次逆公式","⟦3657⟧","两根满足韦达定理 ⟦755⟧；单位圆周 ⟦1232⟧ 映为实线段 ⟦1366⟧。"]],["<strong>求单位圆周的像</strong>：代入 ⟦1232⟧ 得到 ⟦1366⟧，说明原单位圆之外的点不会落入 ⟦1405⟧。","<strong>用二次方程分析逆像分布</strong>：对任一 ⟦3658⟧ 写出逆方程 ⟦1365⟧，由 ⟦755⟧ 及无单位圆根推出恰有一根满足 ⟦1363⟧。","<strong>检查解析与非零导数</strong>：由 ⟦3659⟧ 在 ⟦1363⟧ 处处非零，确认该双射也是共形映射。"]],[3,"洛朗系数、主部与展开存在性","只求洛朗展开中的某一个指定系数（如 ⟦701⟧ 或 ⟦3263⟧），或讨论洛朗级数在某圆环内是否存在展开。","ch4.4 第 10–15 页 洛朗系数公式与展开存在性 · 教材 §4.4",[["洛朗系数围线积分表达式","⟦3665⟧","⟦1195⟧ 在开圆环 ⟦3666⟧ 内解析，⟦2779⟧ 为圆环内任一围绕 ⟦369⟧ 的正向简单闭曲线。"],["泰勒与洛朗主要部的结构特征","⟦3667⟧","主要部分仅含负幂项，决定了函数在 ⟦369⟧ 附近的奇性；解析部分（⟦3668⟧）在圆盘 ⟦3669⟧ 内收敛。"]],["<strong>锁定目标解析环</strong>：求出函数的所有奇点并画出同心圆环，确认题目询问的是哪一个具体的圆环域。","<strong>选取对应展开方向</strong>：对分母因子按该圆环内的不等式选择正幂或负幂几何级数，只保留能够产生目标幂次 ⟦3670⟧ 的前几项。","<strong>提取并复核系数</strong>：将乘积展开中所有贡献 ⟦3670⟧ 的项系数相加，注意外环展开可能完全不含某些较低或较高的幂次。"]],[4,"实轴极点与柯西主值","计算振荡反常积分或有理实积分时，被积函数在实轴上存在一阶极点（如 ⟦3678⟧），需用小半圆绕行求柯西主值。","ch5.3 实轴极点与柯西主值积分 · 教材 §5.3 延伸",[["含实轴单极点的柯西主值留数公式","⟦3672⟧","适用于满足大圆弧积分趋零（如配合 ⟦3394⟧ 满足约当引理），且实轴上的奇点 ⟦293⟧ 均为一阶极点的情形。"],["绕实轴一阶极点的小弧引理","⟦3673⟧","⟦3674⟧ 为绕单极点 ⟦293⟧ 从角 ⟦3675⟧ 到 ⟦3676⟧ 的圆弧。上方避开时从 ⟦322⟧ 到 ⟦128⟧，角度差为 ⟦2658⟧。"]],["<strong>识别实轴单极点与主值</strong>：找出实轴上的奇点并确认是一阶极点，区分收敛的反常积分与柯西主值积分。","<strong>构造避让围道</strong>：在大上半圆封闭的同时，在实轴单极点 ⟦293⟧ 处用上半小圆弧 ⟦3674⟧ 从角度 ⟦322⟧ 顺时针绕行到 ⟦128⟧（将 ⟦293⟧ 留在围道外）。","<strong>合并留数与小弧极限</strong>：由封闭围道积分等于内部留数和乘 ⟦2077⟧，减去小弧极限 ⟦3677⟧（及大弧极限 ⟦128⟧），解出实轴主值。"]],[2,"柯西公式的估计、刘维尔与多项式判定","给定整函数满足多项式增长界 ⟦3691⟧ 或在全平面有界，证明其为至多 ⟦131⟧ 次多项式或常数（刘维尔定理）。","ch3.4 第 15–16 页 柯西不等式与刘维尔定理 · 教材 §3.3",[["柯西高阶导数估计不等式","⟦3684⟧","要求 ⟦1195⟧ 在圆盘 ⟦3685⟧ 上解析并在圆周连续。对整函数可令 ⟦3686⟧。"],["广义刘维尔定理推论","⟦3687⟧","⟦131⟧ 为非负整数；特别地，⟦85⟧（有界整函数）时 ⟦1195⟧ 必为常数。"]],["<strong>列 ⟦372⟧ 阶柯西估计</strong>：选取以原点为心、半径为 ⟦1693⟧ 的圆周，由增长不等式写出圆周上模的上界 ⟦1193⟧，代入柯西估计。","<strong>令半径趋无穷消高阶导</strong>：取导数阶数 ⟦3688⟧（如二次界取 ⟦1415⟧），分析分母 ⟦3689⟧ 阶数严格高于分子 ⟦3690⟧，令 ⟦3686⟧ 推出 ⟦2624⟧。","<strong>回代泰勒展开收束</strong>：指出整函数在全平面的泰勒展开收敛于自身，高阶系数全为零故必为至多 ⟦131⟧ 次多项式。"]],[1,"极坐标柯西–黎曼方程","用极坐标 ⟦3706⟧ 表示函数 ⟦3707⟧（如验证对数支或幂函数分支解析）时使用极坐标 C-R 方程。","ch2.1 极坐标形式的柯西–黎曼方程 · 教材 §2.2 习题",[["极坐标形式的 C-R 方程","⟦3695⟧","在 ⟦1440⟧ 的局部极坐标单值开域使用；若 ⟦3696⟧ 连续且满足此二式，则 ⟦1332⟧ 在该域解析。"],["极坐标下的复导数公式","⟦3697⟧","沿径向 ⟦3698⟧ 令 ⟦3699⟧ 直接导出，注意因子 ⟦3700⟧。"]],["<strong>确定去割线单值域</strong>：写明 ⟦3701⟧ 及所选取的开辐角范围（如 ⟦1419⟧），确认该域开且不含割线。","<strong>求极坐标偏导并检验</strong>：分别求出 ⟦3696⟧，验证其连续性并核对 ⟦3702⟧ 与 ⟦3703⟧。","<strong>计算复导数</strong>：使用公式 ⟦3704⟧ 求导（如对主对数得 ⟦3705⟧）。"]],[6,"傅里叶正弦与余弦变换","计算定义在半轴 ⟦784⟧ 上函数的傅里叶余弦变换 ⟦3715⟧ 或正弦变换 ⟦3716⟧（常用于半无界物理或衰减指数题）。","1.1–1.2 傅里叶正弦与余弦变换 · 教材 积分变换 §1.1 延伸",[["半轴余弦与正弦变换定义","⟦3711⟧","无前置系数的半轴正变换；对应逆变换为 ⟦3712⟧ 与 ⟦3713⟧。"]],["<strong>核对延拓与前置系数</strong>：确认题目规定的半轴变换无前置因子（或按题设系数保留），区分余弦（偶延拓）与正弦（奇延拓）核。","<strong>复指数合成一次积分</strong>：构造复积分 ⟦3714⟧ 算出解析结果并分母实数化。","<strong>拆分实虚部得两变换</strong>：实部即为 ⟦3715⟧，虚部即为 ⟦3716⟧（若使用 ⟦3717⟧ 则虚部取反号）。"]]],K=[["高频重点","非零复数 ⟦2031⟧ 既可表示为平面向量，也可由模 ⟦2656⟧ 与辐角 ⟦2657⟧ 唯一确定方向与长度。指数形式 ⟦1439⟧ 将复数乘法和乘幂转化为模的乘方与辐角的线性加法，是处理高次幂、开 ⟦372⟧ 次方及最值构造的核心工具。",["原点 ⟦156⟧ 的模为 ⟦128⟧，但辐角无意义；负实数（如 ⟦598⟧）的辐角主值是 ⟦322⟧ 而非 ⟦2658⟧，因为主值区间 ⟦47⟧ 左开右闭。","主辐角不满足直接相加：⟦2659⟧ 可能超出 ⟦47⟧，必须加减 ⟦2647⟧ 折回主值区间；仅全体辐角满足集合等式 ⟦2660⟧。","使用三角不等式求最大值或最小值时，除了给出不等式上界或下界，还必须验证能够同时使所有不等号取等号的复数确实存在于可行域内。"]],["基础与进阶","共轭运算 ⟦2669⟧ 几何上是关于实轴的反射，代数上与加法、乘法和除法完全交换，即实轴是共轭映射的不动点集。因此实系数多项式满足 ⟦2670⟧，这直接保证了高次实系数代数方程的非实复根必定以共轭对的形式成对出现。",["仅当多项式系数全为实数（⟦1456⟧）时才有 ⟦2670⟧；若系数含非实复数，虚根不再必然成对。","当 ⟦369⟧ 为实数时 ⟦2671⟧，二者是同一个根；只有当题目明确 ⟦369⟧ 为非实复数（⟦2667⟧）时，才能断定 ⟦369⟧ 与 ⟦2672⟧ 是两个相异的根。"]],["核心必考","复可导要求增量 ⟦2679⟧ 沿任意方向的差商极限一致，这迫使实虚部的四个一阶偏导数满足柯西–黎曼（C-R）方程 ⟦2680⟧。解析比可导要求更强：在一点解析必须在该点的某个开邻域内处处可导。若可导点仅构成孤立点或直线/圆周等低维曲线，则没有任何开邻域，函数在全平面处处不解析。",["“在 ⟦369⟧ 处可导”绝不等价于“在 ⟦369⟧ 处解析”，不存在“仅在某一个点解析”的函数。","C-R 方程只是复可导的必要条件，还须附加“⟦204⟧ 在该点可微”（一阶偏导数连续即可保证）才构成充要条件。"]],["高频重点","与实指数函数单调递增不同，复指数函数 ⟦2690⟧ 以 ⟦2077⟧ 为周期且模长 ⟦2691⟧ 在全平面永不为零。复正余弦函数通过欧拉公式自然延拓到整个复平面，其零点仍全部落在实轴上，但在虚轴方向按双曲函数指数级增长，因此不再有界。",["由 ⟦1480⟧ 不能推出 ⟦156⟧，正确全解为 ⟦1489⟧（⟦1486⟧），忘记周期 ⟦2689⟧ 是选择题和判断题最常见失分点。","在复数域上 ⟦2692⟧ 与 ⟦2693⟧ 不成立，例如 ⟦2694⟧ 可取任意大实数，方程 ⟦2695⟧ 在复平面上同样有解。"]],["高频重点","当被积函数不解析（例如含 ⟦2708⟧）或路径不是解析区域内的闭路时，柯西定理与牛顿–莱布尼茨公式均不适用，积分值通常依赖于具体路径。参数化法则将复路径 ⟦2709⟧ 与微分 ⟦2704⟧ 一并转化为高数一维实定积分，是计算一切分段光滑曲线积分最基础、最通用的方法。",["参数 ⟦682⟧ 的积分下限必须是起点对应的参数、上限必须是终点对应的参数；顺时针与逆时针圆弧方向相反，下限未必小于上限。","切勿把被积函数中的 ⟦2706⟧ 漏掉未取共轭，或者忘记将 ⟦2710⟧ 换算为 ⟦2711⟧（例如直线段 ⟦2712⟧ 时 ⟦1706⟧）。"]],["核心必考","如果函数在简单闭曲线 ⟦346⟧ 及其内部解析，柯西–古萨定理断定闭路积分为 ⟦128⟧；若圈内包含单个奇点形如 ⟦2721⟧，则奇点外的解析分子 ⟦132⟧ 在 ⟦291⟧ 处的值或 ⟦372⟧ 阶导数被围线积分完全确定。解析函数由此自然具有任意阶导数，解题核心在于“留内去外”：只把圈内对应奇点的幂留在分母，其余因子全部并入解析分子。",["务必检查分母奇点是否在围线 ⟦346⟧ 内部：落在 ⟦346⟧ 外部的因式在 ⟦346⟧ 及内部均解析且非零，必须整体挪到分子参与求导，不能算作圈内奇点。","分母次幂是 ⟦2722⟧，故高阶导数公式中的求导阶数 ⟦372⟧ 等于“分母幂次减 ⟦101⟧”，阶乘是 ⟦2723⟧；同时若围线为顺时针方向须在结果前补负号。"]],["核心必考","单连通区域内解析函数的实部 ⟦474⟧ 和虚部 ⟦449⟧ 必定满足拉普拉斯方程 ⟦2733⟧，彼此通过 C-R 方程相互锁定。因此只要已知其中一个（例如虚部 ⟦449⟧），先验证其调和性，再利用 C-R 方程沿一个坐标变量积分（保留另一个变量的待定函数）或直接使用汤姆逊导数法，即可在相差一个实常数的意义下唯一恢复解析函数 ⟦129⟧。",["注意共轭调和函数的顺序不可互换：若 ⟦1460⟧ 解析，则称 ⟦449⟧ 是 ⟦474⟧ 的共轭调和函数；反过来 ⟦713⟧ 才是 ⟦449⟧ 的共轭调和函数。","已知虚部 ⟦449⟧ 用汤姆逊法直接求 ⟦191⟧ 时公式为 ⟦2732⟧；若已知实部 ⟦474⟧ 则是 ⟦2734⟧，切莫弄错正负号。积分常数 ⟦346⟧ 须结合题给初值确定，且若求实部/虚部则对应常数应为实数。"]],["高频重点","复幂级数以展开中心 ⟦291⟧ 为圆心存在唯一的收敛半径 ⟦370⟧：在圆内 ⟦2741⟧ 处处绝对收敛，在圆外 ⟦2742⟧ 处处发散。根据阿贝尔定理，只要知道级数在某一点 ⟦2738⟧ 收敛（无论条件收敛还是绝对收敛），就能锁定 ⟦2743⟧；而在收敛圆周 ⟦1194⟧ 上，各种点可能呈现不同的敛散性，必须逐点代入实复级数检验。",["遇到非原点中心 ⟦2736⟧ 时，距离一定要计算 ⟦2740⟧ 而不是 ⟦53⟧！","在收敛圆周 ⟦1194⟧ 上某点条件收敛，由阿贝尔定理仍可直接锁定收敛半径恰为 ⟦2744⟧（因为如果半径更大，该点就在严格圆内而必绝对收敛，矛盾）。","遇缺项幂级数（如 ⟦2745⟧）切忌直接套 ⟦2746⟧，应当直接对通项整体用比值审敛法 ⟦2747⟧。"]],["核心必考","解析函数在圆盘内只能用非负幂泰勒级数表示，但在挖去了奇点的圆环域 ⟦2751⟧ 内，负幂项的加入使得展开成为可能，且在同一圆环内展开式唯一。展开有理分式的全部秘诀是“分项变中心、谁大提谁做分母”：通过平移 ⟦2749⟧ 后，保证每一项几何级数展开的公比严格满足 ⟦2763⟧。",["不同圆环域内的洛朗展开式完全不同！务必先根据圆环半径比确定每个分式在当前圆环中是 ⟦2757⟧（展成正幂）还是 ⟦2759⟧（展成负幂）。","注意展开中心 ⟦291⟧ 不是原点时的平移换元：若要在 ⟦591⟧ 展开，最后每一项都必须写成 ⟦606⟧ 的幂次而不能出现单独的 ⟦9⟧。","若题设指定的圆环内部跨过了函数的某个奇点（如极点落在圆环内），函数在该圆环并不解析，不能用一组洛朗级数表示，必须按奇点模长拆成内外两个子圆环分别展开。"]],["核心必考","奇点的本质由函数在去心邻域 ⟦2772⟧ 内洛朗展开的负幂项（主要部分）决定：无负幂项对应极限有限的“可去奇点”；仅含有限项至 ⟦2773⟧ 的对应趋于无穷的“⟦634⟧ 阶极点”；含无穷多负幂项的则是函数值剧烈振荡的“本性奇点”。判别商函数的极点阶数最快捷的方式是比较分子与分母的首个非零泰勒幂次之差。",["分类前务必先确认奇点是“孤立的”：若某点的任何去心邻域内都聚集着无穷多个奇点（如 ⟦2774⟧ 在 ⟦156⟧），则该点属于非孤立奇点，不能归入可去、极点或本性奇点。","分子、分母可能同时在 ⟦291⟧ 处取零（例如 ⟦2775⟧ 或 ⟦2776⟧），直接看分母指数会错判阶数，必须先求出分子零点阶数 ⟦634⟧ 再与分母阶数 ⟦372⟧ 相减；若两项相减（如 ⟦2777⟧）则须先通分。"]],["核心必考","函数在孤立奇点 ⟦291⟧ 处的留数 ⟦2787⟧ 就是去心邻域内洛朗展开式中 ⟦2788⟧ 项的系数 ⟦701⟧。因为 ⟦2789⟧ 在 ⟦2790⟧ 时绕 ⟦291⟧ 的闭路积分为零，仅 ⟦2788⟧ 贡献 ⟦2077⟧，故留数定理将整条围线积分彻底转化为内部所有孤立奇点留数之和乘以 ⟦2077⟧。",["圈外的奇点绝不能计入留数和，落在围线上的奇点也不适用普通留数定理；可去奇点的留数恒为 ⟦128⟧，无需额外计算。","对于本性奇点（如 ⟦2791⟧）或三阶以上极点，极限求导公式极易出错或失效，应当令 ⟦2786⟧ 展开为幂级数直接读出 ⟦702⟧ 项系数。","最后务必核对积分路径方向：标准留数定理默认正向（逆时针），顺时针闭路必须乘以 ⟦260⟧。"]],["核心必考","当实有理函数 ⟦2803⟧ 在实轴上没有奇点、且分母次数比分子至少高 ⟦102⟧ 次时，沿半径 ⟦370⟧ 的上半圆弧积分模长按 ⟦2804⟧ 衰减，在 ⟦1417⟧ 时自动消失。由此，整条实轴反常积分就等于由实轴与大上半圆弧闭合而成的上半平面围线积分，从而只需计算严格落在上半平面（⟦2805⟧）极点的留数之和。",["如果题目给的是半轴积分 ⟦2795⟧，使用上半圆围道前必须先验证被积函数为偶函数，并在结果中乘以 ⟦2616⟧。","下半平面（⟦2806⟧）的极点绝不能代入！此外答题时必须写明大圆弧 ⟦1623⟧ 上积分按 ML 估计趋于 ⟦128⟧ 的衰减依据。"]],["高频重点","分式线性映射 ⟦2811⟧（⟦2812⟧）在扩充复平面上一一对应且处处保角，并具备著名的“保广义圆性”：将圆周或直线映射为圆周或直线。判断像究竟是直线还是圆周的黄金判据是看原曲线是否经过极点 ⟦2813⟧：经过极点（有某点被映成 ⟦842⟧）则像必是直线，不经过极点则像必是有界圆周。",["利用反变换把 ⟦214⟧ 用 ⟦204⟧ 表示代入原曲线方程时，注意当原映射无定义点（或反变换原点 ⟦853⟧）不在定义域/像域中时，像圆上可能会“缺失一个点”（如 ⟦669⟧ 的像点）。","求区域（而非仅仅边界曲线）的像时，求出像曲线后务必在原区域内任选一个好算的测试内点 ⟦369⟧，算出 ⟦2814⟧ 才能断定区域落在像曲线的哪一侧。"]],["核心必考","构造上半平面或单位圆盘到圆盘的共形映射不需要每次从头列交比：根据对称点保持原理，只要把指定的原内点 ⟦291⟧ 送到像圆心 ⟦128⟧，那么 ⟦291⟧ 关于原边界的对称点必然被送到 ⟦128⟧ 关于单位圆的对称点 ⟦842⟧。由此直接锁定两个标准单参数模板，唯一待定的实旋转角 ⟦856⟧ 再通过求导代入 ⟦291⟧ 点并匹配给定的导数辐角 ⟦2825⟧ 即可迅速确定。",["上半平面到单位圆盘模板为 ⟦2826⟧，要求 ⟦2805⟧（注意分母是 ⟦2827⟧）；单位圆盘自同构模板为 ⟦846⟧，要求 ⟦1514⟧。","求导计算旋转角 ⟦856⟧ 时小心不要忘记共轭符号 ⟦2816⟧ 及分母负号；例如对 ⟦2828⟧ 在 ⟦1748⟧ 求导得 ⟦2829⟧，角度计算须细心验证。"]],["核心必考","傅里叶正变换将满足绝对可积条件的时域非周期信号分解为连续分布的角频率成分 ⟦2833⟧（频谱密度）；而傅里叶反演积分定理保证，在满足狄利克雷条件的情况下，反演积分在连续点还原原信号值，在第一类跳跃间断点处精确收敛到左右极限的算术平均值 ⟦2839⟧。",["严格牢记本课程教材与全站统一约定：正变换不带 ⟦2840⟧ 系数且指数为 ⟦2841⟧；逆变换带前置系数 ⟦2840⟧ 且指数为 ⟦2842⟧。","利用积分算出频谱分母中含 ⟦1006⟧ 或 ⟦2843⟧ 时，必须对使分母为零的孤立频率点（如 ⟦1845⟧ 或 ⟦2244⟧）回到原定义积分直接算出极限值或特殊值。"]],["高频重点","傅里叶变换的三大几何性质深刻刻画了时域与频域的对应：时域延迟 ⟦2856⟧ 不改变振幅谱大小，仅附加线性相位因子 ⟦2857⟧；而时间轴的压缩 ⟦2858⟧（⟦1517⟧）则把频谱向外拉宽成 ⟦2859⟧，呈现出“脉冲越窄、频带越宽”的时频不确定性互易规律。",["时移与频移的指数符号正好相反：⟦2860⟧ 对应 ⟦2861⟧（减对应负指数），而 ⟦2862⟧ 对应 ⟦2863⟧（正指数调制对应向右频移）。","遇到混合变换如 ⟦2864⟧ 时，务必先写成 ⟦2865⟧ 看清先后顺序：若先缩再移，延迟量是 ⟦102⟧ 而不是 ⟦774⟧，乘的相位因子是 ⟦1000⟧。","尺度变换 ⟦2858⟧ 前的幅度因子 ⟦2866⟧ 必须加绝对值（当 ⟦2867⟧ 时方向反转与积分上下限互换产生绝对值）。"]],["核心必考","直流常数、正余弦信号与阶跃函数在实轴上并不绝对可积，引入单位冲激函数 ⟦971⟧ 后，它们在频域中恰巧表现为集中在单个频率上的离散谱线。计算含冲激函数的积分时核心依据是“筛选性质”：冲激把乘在它上面的光滑函数在冲激触发时刻的值精准抽取出来；逆变换中出现一对关于 ⟦1845⟧ 对称的冲激谱线时，直接用欧拉公式还原为余弦或正弦波。",["在冲激积分 ⟦2879⟧ 中，如果积分是有限区间 ⟦2880⟧，必须先核对脉冲位置 ⟦291⟧ 是否严格落在区间内，不在区间内则积分为 ⟦128⟧。","切记由频域逆变换回时域时要保留前置因子 ⟦2840⟧！如 ⟦2881⟧。"]],["核心必考","全轴卷积 ⟦2889⟧ 在频域中退化为简单的乘积 ⟦2890⟧。帕塞瓦尔能量恒等式更建立起时域能量与频域能量的精确守恒关系（相差一个 ⟦1857⟧ 系数），这使得许多难以直接积出原函数的平方反常积分（如 ⟦2891⟧）瞬间化为简单的矩形面积计算。",["计算矩形脉冲卷积时必须以 ⟦1867⟧ 为积分变量，明确 ⟦2885⟧ 与 ⟦2886⟧ 各自的非零区间，按照外参数 ⟦682⟧ 的不同范围确定两个区间的实际重叠交集（当两者错开时交集为空，卷积为 ⟦128⟧）。","应用帕塞瓦尔等式时容易漏掉频域前的 ⟦2840⟧ 系数，或忘记将题目询问的半轴积分 ⟦784⟧ 乘 ⟦102⟧ 补成全轴积分后再对照等式。"]],["核心必考","单边拉普拉斯变换在傅里叶核基础上乘入指数衰减因子 ⟦2906⟧，使不绝对可积的指数增长信号也能在右半平面 ⟦2907⟧ 上收敛且处处解析。三大核心正变换性质分别对应不同的时域操作：乘 ⟦2908⟧ 对应 ⟦1086⟧ 域平移 ⟦2909⟧；乘以阶跃并延迟 ⟦291⟧ 对应乘延迟因子 ⟦2904⟧；从 ⟦128⟧ 到 ⟦682⟧ 积分对应像函数除以 ⟦1086⟧。",["使用第二位移性质 ⟦2910⟧ 时，括号内的时移必须与阶跃偏移 ⟦291⟧ 完全对齐！若原式是 ⟦2911⟧，必须先把 ⟦1057⟧ 改写成关于 ⟦2912⟧ 的表达式（或使用 ⟦2913⟧）。","指数平移 ⟦2914⟧ 不仅平移像函数，还会把收敛半平面由 ⟦2907⟧ 平移到 ⟦2915⟧。"]],["核心必考","求有理像函数 ⟦1129⟧ 的拉氏逆变换有两种互为印证的系统途径：一是部分分式与二次配方法——将分母二次不可约因子配成 ⟦2930⟧ 后把分子凑成 ⟦2931⟧ 与常数，直接查表化为阻尼振荡；二是海维赛德留数反演公式——对满足 ⟦2932⟧ 的有理式，直接在复平面内对 ⟦2925⟧ 的全部有限极点求留数相加。",["遇到分母为不可约二次式（如 ⟦1109⟧）时，不要贸然强行拆成复一次分式，直接配方后按分子凑出 ⟦2924⟧ 与 ⟦293⟧ 的比值查表最不易出错；特别别漏掉 ⟦2933⟧ 对应项须除以频率 ⟦293⟧。","用高阶极点求留数反演重极点时，注意导数是对复变量 ⟦1086⟧ 求导，因此把因子 ⟦2934⟧ 留在求导括号内部会产生因子 ⟦682⟧。"]],["核心必考","单边拉普拉斯变换的两大核心桥梁——导数变换性质与单边卷积定理——能同时把时域的“微商运算”与“变上限卷积积分”化为像空间里的纯代数乘法。解题遵循统一流水线：两边取变换并代入已知 ⟦2928⟧ 初值，解出未知函数像函数 ⟦1152⟧ 的代数表达，部分分式裂项或配方后反演回 ⟦1298⟧ 的时间函数。",["二阶导数变换 ⟦2940⟧ 中，切记 ⟦2941⟧ 乘的是 ⟦1086⟧，而 ⟦2942⟧ 是常数项；很多错误源于漏掉 ⟦2942⟧ 项或把初始条件正负号弄反。","区分单边卷积与普通积分：卷积限必须是 ⟦128⟧ 到 ⟦682⟧ 且被积式为 ⟦2943⟧，其拉氏变换直接等于 ⟦2944⟧（不像傅里叶逆变换那样带 ⟦49⟧ 系数）。"]],["高频重点","从拉普拉斯变换的积分定义 ⟦2958⟧ 出发，任何含 ⟦2950⟧ 的半轴反常积分本身就是像函数 ⟦1129⟧ 在 ⟦2956⟧ 处的取值；而不含衰减因子的条件收敛积分（如狄利克雷积分），也可看成收敛域边界上 ⟦1104⟧ 的阿贝尔极限值，借助除以 ⟦682⟧ 积分或卷积性质便可巧妙绕开直接求原函数的困难。",["当积分不含显式 ⟦2950⟧ 衰减因子（如 ⟦2959⟧）时，令 ⟦1104⟧ 取极限需要确保原反常积分收敛且极限换序合法（阿贝尔定理适用）。","利用频域积分 ⟦2960⟧ 后，记住结果是减号下限：⟦2961⟧，取极限前先把各项分式和函数化简合并，以防产生 ⟦2962⟧。"]],["基础与进阶","复数的加减对应平面向量合成，而除法通过分子分母同乘分母的共轭复数 ⟦2967⟧，将复分母转化为非负实数 ⟦2973⟧，从而顺利分离出实部与虚部。在化简含有 ⟦11⟧ 的表达式时，直接利用关系 ⟦2974⟧ 将共轭替换为 ⟦2975⟧，往往比设 ⟦2031⟧ 展开更加简捷。",["虚部 ⟦2976⟧ 本身是实数，书写结果时绝不能带上虚数单位 ⟦1750⟧。","切勿混淆 ⟦2977⟧ 与 ⟦2978⟧；在复数域中两个非实复数不能比较大小，只有模可以比较大小。"]],["高频重点","⟦2740⟧ 的几何意义是复平面上点 ⟦9⟧ 到定点 ⟦291⟧ 的距离。求分式 ⟦2982⟧ 的最大值等价于求分母 ⟦2983⟧ 的最小值。通过将高次多项式分解为一次或二次因式，利用反三角不等式对每个因式的模逐一下界估计，即可快速锁定最值并确定等号成立的几何位置。",["反三角不等式 ⟦19⟧ 的绝对值符号不可遗漏，否则在 ⟦2984⟧ 时会错用负值作为下界。","若同时对多个因子应用不等式下界，各因子的取等点必须相同（例如同落在正实轴或同一方向射线），否则合并下界并不一定能够同时达到。"]],["高频重点","由于反正切函数 ⟦2645⟧ 的值域仅为 ⟦2997⟧，直接套用它会把二、三象限的复数错误地折回一、四象限。主辐角 ⟦2643⟧ 必须依据实部和虚部的正负号做 ⟦2998⟧ 的象限修正；而三角表示必须严格满足 ⟦1440⟧ 且实部为 ⟦2999⟧、虚部为 ⟦3000⟧。",["遇假三角形式如 ⟦3001⟧ 或 ⟦3002⟧ 时，不能直接读出 ⟦2698⟧，必须用诱导公式或吸收负号为 ⟦3003⟧ 化为标准式。","形如 ⟦2996⟧ 的复数，其辐角集合为 ⟦3004⟧；当实数 ⟦293⟧ 不在 ⟦47⟧ 内（例如 ⟦3005⟧ 或 ⟦3006⟧）时，主值 ⟦3007⟧ 必须加减 ⟦49⟧ 折回主区间。"]],["高频重点","高次幂展开用二项式定理极易出错且繁琐，而指数形式下复数乘幂仅需把模求幂、辐角倍乘。开 ⟦372⟧ 次方则是逆过程，由于辐角相差 ⟦49⟧ 对应同一个复数，除以 ⟦372⟧ 后就会产生 ⟦372⟧ 个彼此相差 ⟦3020⟧ 弧度的不同角度，在复平面上构成正 ⟦372⟧ 边形顶点。",["计算 ⟦3021⟧ 时切忌忘记在原辐角后加 ⟦2653⟧，否则会漏掉其余 ⟦3022⟧ 个复数根；此外只取 ⟦2654⟧ 即可，再往后因周期性会重复。","乘除运算化简时注意主值符号：例如 ⟦3023⟧ 应先分别求出分子分母的模和辐角再相除，比先分母实数化更快捷不易错。"]],["高频重点","区域同时要求“非空开集”（不含任何边界点）和“连通性”（内部任意两点可用全在集内的折线相连）。单连通域在直观上指“内部没有孔洞（哪怕只挖掉一个孤立点）也没有把区域割断的裂缝”的区域，它是后续柯西积分定理成立的最核心拓扑前提。",["包含边界符号（⟦3031⟧）的集合或被射线、圆弧切分成两块的集合（如 ⟦777⟧ 且 ⟦105⟧）均不是区域。","去心邻域 ⟦2429⟧ 是开集且连通，因此它是区域，但因为中心挖去了一个点，绕 ⟦369⟧ 的闭路无法在区域内缩成一点，故它是多连通域而非单连通域。","距离之和 ⟦3032⟧ 只有当 ⟦3033⟧ 时才是椭圆；若 ⟦3034⟧ 则退化为线段，若 ⟦3035⟧ 则为空集。"]],["基础与进阶","到两定点距离之比为非 ⟦101⟧ 正常数 ⟦3048⟧ 的点轨迹是一个圆（阿波罗尼斯圆），当 ⟦3049⟧ 时退化为两点连线的垂直平分线。不仅如此，这两定点 ⟦1202⟧ 位于过圆心的同一条射线上，且到圆心距离的乘积恰等于半径的平方，即互为关于该圆的几何反演对称点。",["证明对称点必须同时验证两条：一是三点共线且 ⟦1202⟧ 在圆心 ⟦1535⟧ 的同侧（⟦1205⟧ 中系数 ⟦3050⟧）；二是距离乘积 ⟦3040⟧，缺一不可。","配方前需注明 ⟦1200⟧，保证分母 ⟦3051⟧；当 ⟦3049⟧ 时平方后二次项 ⟦3041⟧ 消去，得到的是直线方程。"]],["基础与进阶","在复平面中，向量 ⟦3061⟧ 由差复数 ⟦3062⟧ 表示，而两个非零差复数的商 ⟦3063⟧ 同时编码了三角形的边长比与有向顶角。通过平移一个顶点到原点再除以一条非零边，可将复杂的对称复代数等式降维成单复数的一元二次或高次方程。",["作除法前必须确认分母 ⟦3064⟧（题目一般要求三点互异）；此外只证明 ⟦3065⟧ 只能说明等腰，还须结合顶角为 ⟦3066⟧ 或同时验证第三边长才构成等边三角形。","证明几何关系时切忌未加说明就对任意旋转方向混用主辐角：有向夹角由 ⟦3067⟧ 的符号决定，逆时针为正、顺时针为负。"]],["高频重点","复变函数的极限 ⟦3080⟧ 要求点 ⟦9⟧ 从平面上一切方向与一切曲线（⟦3081⟧ 全方位）趋近 ⟦369⟧ 时都趋于同一复数 ⟦1157⟧，等价于实部和虚部二元实函数极限均存在。若沿两条不同路径极限不等或沿某路径无界，极限必不存在；要证明极限存在，则必须用不依赖于路径角度的模长不等式一致控制余项。",["沿所有直线 ⟦141⟧ 趋于原点得到相同极限，仍然不能推出复极限存在（存在沿抛物线 ⟦1704⟧ 极限不同的反例）；必须靠整体模长估计 ⟦3082⟧ 才能严格证明极限存在。","判断连续性时除了证明极限存在，还必须核验极限值等于函数在该点的定义值 ⟦3077⟧。"]],["高频重点","复变函数在一点可导必须使差商 ⟦3092⟧ 在复增量 ⟦2360⟧ 时沿所有方向收敛到同一复数。这一刚性约束使得 ⟦2706⟧ 处处连续却处处不可导，⟦3090⟧ 仅在原点孤立可导而处处不解析，而 ⟦164⟧ 则说明缺乏实可微性时单靠 C-R 方程并不足以保证复可导。",["验证孤立点可导（如 ⟦3090⟧ 在 ⟦156⟧ 或 ⟦3093⟧ 在实轴）后，切勿误称函数在该点或该曲线上解析；孤立点和一维曲线的内部为空集。","用定义计算一点的偏导数时只能沿坐标轴求极限（如 ⟦3094⟧），而求复导数必须考察斜线 ⟦141⟧ 等任意复路径。"]],["核心必考","当函数的实部 ⟦448⟧ 和虚部 ⟦442⟧ 具有连续一阶偏导数时，柯西–黎曼方程既是复可导的必要条件也是充分条件。若满足 C-R 方程的点构成非空开集（如全平面 ⟦3097⟧ 或半平面），则函数在该区域内解析，进而可使用四种等价公式中的任一种写出其导数，必要时结合恒等式识别为 ⟦9⟧ 的整函数。",["写出 ⟦2678⟧ 前必须先说明 ⟦2676⟧ 连续（满足可微条件），再把解出的 ⟦214⟧ 约束代入导数表达式。","若题目要求把解析函数或导数写成关于 ⟦9⟧ 的表达式，需利用 ⟦2978⟧ 或在实轴 ⟦836⟧ 处令 ⟦3098⟧ 还原，避免只留下 ⟦214⟧ 混合式。"]],["高频重点","复初等函数虽然沿用了实函数的符号，但在虚轴方向呈现出双曲特性：因为 ⟦3113⟧，复正弦和复余弦把实部的三角振荡与虚部的双曲增长耦合在了一起。计算任何复合指数或三角函数的模、实部、虚部时，先将自变量拆成 ⟦2986⟧ 并统一转化为 ⟦3114⟧，便可彻底化为实数运算。",["注意 ⟦221⟧ 中间是减号，而 ⟦3115⟧ 中间是加号。","求 ⟦3116⟧ 时先求指数 ⟦1367⟧ 的实部 ⟦3117⟧，因为 ⟦3118⟧，切勿错误地令 ⟦3119⟧。"]],["核心必考","复对数 ⟦3129⟧ 是指数函数 ⟦3131⟧ 的反函数。由于 ⟦3132⟧ 具有周期 ⟦2077⟧，每个非零复数都有无穷多个对数值，它们虚部相差 ⟦49⟧ 的整数倍。规定幅角取主值 ⟦2643⟧ 即得到单值的主对数 ⟦3121⟧，但它沿原点及负实轴发生 ⟦2077⟧ 跃变，因此必须沿一条从原点出发的射线（通常为负实轴）割开平面才能得到解析分支。",["严格区分大小写记号：大写的 ⟦3129⟧ 表示全体无穷多值，必须写 ⟦3128⟧（⟦1486⟧）；小写的 ⟦3121⟧ 专指主值（⟦85⟧），不能带 ⟦2689⟧。","复合函数陷阱：⟦3133⟧ 等于 ⟦3134⟧，而主值 ⟦3135⟧ 并不总等于 ⟦2986⟧！当 ⟦3136⟧ 时，必须先将 ⟦231⟧ 加减 ⟦49⟧ 折回 ⟦47⟧。"]],["高频重点","一般复乘幂 ⟦3143⟧ 统一定义为 ⟦3147⟧。随着指数 ⟦293⟧ 的性质不同，其值的个数呈现截然不同的特征：当 ⟦293⟧ 为整数时单值；当 ⟦3148⟧ 为既约有理数时恰有 ⟦3056⟧ 个不同值；而当 ⟦293⟧ 为无理数或非实复数（如 ⟦3144⟧）时，因为 ⟦3149⟧ 不再是 ⟦2077⟧ 的整数倍，乘幂拥有无穷多个互不相同的值。",["切忌受实数直觉误导写出 ⟦3150⟧：在复数域内 ⟦3151⟧，故 ⟦3152⟧ 共有无穷多个模为 ⟦101⟧ 的值，仅主值（⟦85⟧）为 ⟦101⟧。","算 ⟦3153⟧ 时若指数 ⟦293⟧ 也是复数（如 ⟦2081⟧），必须把 ⟦3154⟧ 整体展开并重新合并实部和虚部，再套用欧拉公式。"]],["基础与进阶","无需死记繁杂的反三角函数多值对数公式。所有复三角方程本质上都是关于 ⟦3156⟧ 的一元二次方程：因为 ⟦3170⟧、⟦3171⟧，求出非零根 ⟦474⟧ 后直接取全体复对数 ⟦3172⟧ 即可得到全部复数解，且过程清晰不易出错。",["解出二次方程的两个根 ⟦3164⟧ 后，取复对数 ⟦3173⟧ 时必须为每个分支保留独立的 ⟦3128⟧（⟦1486⟧），再验证两组解是否等价或可以合并。","注意 ⟦1593⟧ 方程乘 ⟦3174⟧ 化二次方程时符号极易弄反：⟦3175⟧，常数项是 ⟦260⟧ 而非 ⟦3176⟧。"]],["高频重点","若函数 ⟦129⟧ 在单连通域 ⟦193⟧ 内处处解析，那么沿 ⟦193⟧ 内任意闭曲线的积分均为零，从而两点间的积分只与起终点有关而与具体路径无关，且必存在解析原函数 ⟦3178⟧。在多连通域或带分支割线的区域，虽然闭路积分未必为零，但只要能先验明局部或区域内存在单值原函数，依然可以用高数的牛顿–莱布尼茨公式和分部积分法。",["切勿把逆命题弄反：⟦3181⟧ 并不能推出 ⟦129⟧ 在 ⟦346⟧ 内解析（反例：⟦3182⟧，但 ⟦1374⟧ 在 ⟦156⟧ 有二阶极点）。","当原函数涉及对数 ⟦3121⟧ 或分式幂等多值函数时，路径必须避开分支割线，且上下限代入必须保持在同一个连续单值分支上（通过路径追踪辐角变化量 ⟦3183⟧）。"]],["高频重点","在以 ⟦369⟧ 为圆心、⟦370⟧ 为半径的圆周上，点满足 ⟦3193⟧，因此圆周上的共轭与模长常常可以代换为解析变量 ⟦9⟧，进而使用围线公式。另外，基本积分 ⟦3194⟧ 在 ⟦619⟧ 时恒为 ⟦2077⟧ 而在 ⟦381⟧ 时恒为 ⟦128⟧，与半径 ⟦370⟧ 无关；而仅需证明界限时，ML 估值不等式无需算出原积分即可直接给出紧致上界。",["使用圆周代换 ⟦2966⟧ 时，该恒等式仅在圆周 ⟦1646⟧ 的曲线本身成立，不能推广到圆盘内部；替换成有理函数后再按圈内奇点计算。","应用 ML 估值时，常数 ⟦3195⟧ 必须是 ⟦3196⟧ 在整个积分路径 ⟦346⟧ 上的最大上界（常用反三角不等式缩小分母），⟦3187⟧ 为所给圆弧或曲线的实际弧长（如第一象限四分之一圆弧 ⟦3197⟧ 而非全圆 ⟦3198⟧）。"]],["核心必考","复合闭路定理是多连通域上的柯西定理：只要把大围线内部的奇点用互不相交的小闭路逐一“挖洞”隔离出来，在剩下的带孔环域内函数处处解析，由割缝拼接抵消即可推出“大圈正向积分等于所有内部小圈各自正向积分之和”。只要变形过程不穿过奇点，围线的具体形状与大小都完全无关紧要。",["应用公式 ⟦3204⟧ 时，外圈 ⟦346⟧ 和所有内小圈 ⟦3205⟧ 必须统一取逆时针正向；若题目给出外圈或某小圈为顺时针，必须在对应项前加上负号。","“挖洞”只能把孤立奇点挖掉；若有整条支割线或非孤立奇点贯穿区域，必须先确认区域边界上解析或连续才可应用闭路变形。"]],["核心必考","面对分母为多项式乘积的围线积分，直接求导几乎不可行。利用复合闭路挖洞定理或部分分式裂项，把每个圈内奇点拆到各自独立的小围线上处理，就能在每个小圈内确保“除了这一个极点之外，其余所有因子都解析”，从而干净利落地把多奇点问题还原为标准柯西高阶导数公式。",["构造解析分子 ⟦3208⟧ 时一定要剔除当前小圈的那个奇点因子 ⟦3212⟧，把其余所有分母（包括其他圈内奇点和所有圈外奇点）全部放进 ⟦3208⟧。","在求多阶导数 ⟦3213⟧ 时计算易出错，切忌漏掉系数 ⟦3214⟧；当函数在圈内无奇点时直接得 ⟦128⟧，不要画蛇添足地强行套公式。"]],["基础与进阶","柯西积分公式深刻揭示了解析函数的“全息刚性”：一个解析函数在闭曲线内部每一点的值，竟然完全由它在边界曲线上的取值唯一锁定。因此若两个解析函数在边界上相等，它们在内部必定恒等；同时把单位圆 ⟦1232⟧ 代入，还能将含 ⟦3219⟧ 的实三角积分转化为 ⟦3218⟧ 的代数证明。",["做三角积分证明题时，令 ⟦1232⟧ 后务必记得把 ⟦3220⟧ 与 ⟦3221⟧ 同时换完，特别别漏了分母中的 ⟦1750⟧ 和 ⟦9⟧。","证明边界唯一性时，不能直接分别对 ⟦1341⟧ 取值，而应当构造差函数 ⟦1235⟧，验证 ⟦1224⟧ 在 ⟦346⟧ 上为零且在 ⟦346⟧ 及内部解析后应用柯西公式。"]],["基础与进阶","由格林公式可知，绕正向简单闭曲线的实线积分 ⟦3228⟧ 均等于所围平面区域的面积 ⟦1157⟧。因此当复围线积分中出现 ⟦3229⟧ 等非解析项时，把被积表达式拆为实部和虚部两个实线积分，全微分项积分自动归零，余项恰用格林公式转为面积 ⟦1157⟧。",["使用格林公式前必须核对闭曲线的方向：边界正向（逆时针绕外边界）给出 ⟦3230⟧；若题设为顺时针方向须加负号。","注意区分各项符号：⟦3231⟧，而 ⟦3232⟧，因此 ⟦3233⟧，而 ⟦3234⟧。"]],["核心必考","所有解析函数的实部与虚部都必定是调和函数（满足拉普拉斯方程 ⟦3239⟧）；反之在单连通域上，任何一个调和函数也一定可以补出唯一（差实常数）的共轭调和函数使其组成解析函数。题目通常有两类：一是给定带参数的实函数使其调和（直接令 ⟦2110⟧ 比较系数即可）；二是给定已知实部 ⟦474⟧ 或虚部 ⟦449⟧ 恢复完整 ⟦129⟧（推荐偏积分法或汤姆逊导数法）。",["用偏积分法 ⟦3240⟧ 时，待定积分项不是常数 ⟦346⟧，而必须是关于另一个变量的一元函数 ⟦3241⟧；若再代回另一条 C-R 方程时没有把 ⟦231⟧ 全部消干净，说明前一步求导或积分必然有计算失误。","使用汤姆逊导数法 ⟦2734⟧ 或 ⟦2732⟧ 时，若所求原函数是给实部 ⟦474⟧ 且给出 ⟦3242⟧，注意实部常数已由 ⟦474⟧ 确定，待定常数只在虚部 ⟦3243⟧ 上体现（反之已知虚部时常数在实部 ⟦3244⟧）。"]],["基础与进阶","复数列的极限与复数项级数的收敛，完全等价于实部和虚部两个实数列（或实级数）同时收敛。在判别敛散性时，“通项模趋于零”只是级数收敛的必要条件而非充分条件；而若各项模组成的正项级数 ⟦3254⟧ 收敛，则原级数必绝对收敛（从而收敛）。",["绝对收敛可以推出收敛，但反之不成立：实部、虚部可能各自条件收敛（如交错调和级数），但模长级别 ⟦3255⟧ 使得 ⟦504⟧ 发散，此时应判为条件收敛。","切勿把复项直接做放缩后用正项级数判发散：必须利用不等式 ⟦3256⟧ 或直接对实部、虚部中发散的那一支判别。"]],["高频重点","对于任何幂级数 ⟦3261⟧，平面上的点总被以 ⟦369⟧ 为圆心、⟦370⟧ 为半径的收敛圆清晰地一分为二：圆内绝对收敛，圆外发散。阿贝尔定理进一步确立了收敛域的“圆盘完整性”——只要给定一个收敛点和一个发散点，就能把未知的收敛半径 ⟦370⟧ 夹在它们到中心距离的闭区间之内。",["应用阿贝尔定理时容易把收敛点距离与原点距离混淆：必须先找出级数表达式中的中心 ⟦369⟧，计算已知点到 ⟦369⟧ 的距离 ⟦3030⟧。","利用比值法求含三角或双曲系数的幂级数（如 ⟦3264⟧）时，先写成指数形式 ⟦3265⟧ 再取比值极限。"]],["基础与进阶","幂级数在其收敛圆 ⟦3027⟧ 内部表现得像多项式一样优良：和函数处处解析，且允许在收敛圆内部无限次逐项求导与逐项积分，更关键的是求导或积分后收敛半径 ⟦370⟧ 保持不变。借助这一性质，可将带多项式系数 ⟦372⟧ 或 ⟦1553⟧ 的幂级数反复与几何级数 ⟦3271⟧ 相互转化。",["逐项求导求得和函数后要核对求和起始下标（例如 ⟦3272⟧），避免多算或漏算常数项。","逐项积分由 ⟦128⟧ 积到 ⟦9⟧ 时要特别留心是否需要补起点值常数，并务必交代收敛域 ⟦3273⟧。"]],["核心必考","函数在点 ⟦369⟧ 解析当且仅当它能在 ⟦369⟧ 的某个圆邻域内展开为唯一的泰勒级数，且最大收敛圆恰好扩张到碰见第一个奇点为止——因此不必费力计算高阶导数，中心 ⟦369⟧ 到函数最近不可去奇点的距离直接给出了泰勒级数的收敛半径。做具体展开时应采用间接法：配出 ⟦3282⟧ 后转化为六大基本麦克劳林公式。",["求最近奇点距离前，务必先检验分子分母是否存在可约去的零点（即先排除可去奇点，如 ⟦3283⟧ 在 ⟦156⟧ 是可去奇点，其泰勒展开收敛半径为 ⟦2461⟧）。","在非原点 ⟦3284⟧ 处做泰勒展开时，每一项自变量必须是 ⟦3285⟧，不能展开完还留着孤立的 ⟦9⟧。"]],["核心必考","双边幂级数拆为正幂解析部分（收敛于圆内 ⟦3299⟧）和负幂主要部分（等价于关于 ⟦3300⟧ 的幂级数，收敛于圆外 ⟦3301⟧）；当 ⟦3287⟧ 时两者的交集就是开圆环。对于有理函数在多个同心圆环内的洛朗展开，本质是以展开中心为圆心、过各奇点画同心圆，把复平面划分成若干个不含奇点的环形区域，在每一环上独立选取 ⟦2763⟧ 展开。",["若题目给定的圆环（如 ⟦1243⟧）中间正好横跨了函数的极点（如 ⟦425⟧），则不能用同一个洛朗级数表示，必须拆分为 ⟦3302⟧ 与 ⟦3303⟧ 两段分别展开。","当展开中心本身就是一阶极点 ⟦369⟧ 时（如展开中心为 ⟦101⟧ 而分母含 ⟦407⟧），直接保留 ⟦3304⟧ 在外、仅展开解析余项，展开后注意 ⟦619⟧ 项会与负幂合并产生系数变化。"]],["核心必考","将分子、分母分别在候选奇点 ⟦291⟧ 处展开为泰勒首项 ⟦3313⟧ 与 ⟦3314⟧，奇点类型立即一目了然：分母幂次更高时呈现 ⟦2770⟧ 阶极点，分子幂次不低于分母时则是可去奇点。面对含 ⟦655⟧ 等周期分母的函数时，需先列出全部整数零点，再按分子在该点是否取零分情况讨论。",["判断零点阶数时不仅要检查函数值为零，还必须求导或用泰勒展开确定“首个非零导数的阶数”（如 ⟦624⟧ 在 ⟦156⟧ 是 ⟦102⟧ 阶零点，⟦2406⟧ 在所有整数点是 ⟦2225⟧ 阶零点）。","不要忽略分子可能正好在某些特殊整数点也为零，例如 ⟦3315⟧ 在 ⟦660⟧ 可去、在 ⟦663⟧ 为二阶极点、在其余整数为三阶极点。"]],["高频重点","当函数 ⟦129⟧ 在某个圆外区域 ⟦3317⟧ 内处处解析时，⟦669⟧ 才称为孤立奇点。做倒数代换 ⟦1654⟧，无穷远点立刻变成 ⟦853⟧，从而 ⟦129⟧ 在 ⟦842⟧ 处的奇点分类完全等价于 ⟦668⟧ 在 ⟦853⟧ 处的分类；但在有限平面上若有趋向无穷远的极点序列（如 ⟦3320⟧），则任何外域都包含奇点，⟦669⟧ 为非孤立奇点。",["判断 ⟦842⟧ 处奇点类型时，千万别用 ⟦3321⟧ 时的负幂项去数极点阶数！恰恰相反，对 ⟦669⟧ 而言，⟦3322⟧（正幂项）对应 ⟦3323⟧ 才是主要部分。","在动手分类前务必先检查是否存在趋于 ⟦842⟧ 的有限奇点列（如 ⟦3312⟧ 的整数根），一旦有无穷个奇点趋于 ⟦842⟧，应直接判定 ⟦842⟧ 为非孤立奇点。"]],["核心必考","求解留数没有必要一律死算高阶导数。一阶极点用分子除以分母导数最快捷；含 ⟦3327⟧ 等本性奇点或三阶以上分式极点时，做平移展开找 ⟦260⟧ 次项往往只需两三行；而当围线外奇点数量远少于围线内奇点时，扣掉外部奇点与无穷远点的贡献能大幅简化计算。",["用 ⟦634⟧ 阶极点求导公式 ⟦3328⟧ 时，极易漏掉前置阶乘因子 ⟦3329⟧ 或对分子分母消去公因子后弄错真实阶数 ⟦634⟧。","计算 ⟦3330⟧ 类本性奇点留数时，先令 ⟦1244⟧ 把所有变量化成 ⟦474⟧ 的幂再展开，切忌混用 ⟦407⟧ 与 ⟦707⟧ 导致正负号算反。"]],["高频重点","全平面留数和定理表明，扩充复平面上只有有限个孤立奇点的函数，其所有有限奇点留数加上无穷远点留数的总和恒为零。因此当正向闭路 ⟦346⟧ 内挤满高阶极点、而 ⟦346⟧ 外几乎没有有限奇点时，反过来只算 ⟦346⟧ 外部极点与 ⟦669⟧ 的留数并添负号，往往能在几步之内完成求解。",["无穷远点留数的定义带有负号：⟦3338⟧，即外环洛朗展开中 ⟦584⟧ 项系数的相反数！","即使 ⟦669⟧ 是可去奇点（例如 ⟦3339⟧），它在 ⟦842⟧ 处的留数仍未必为零（⟦3340⟧）；只有当有理函数分母次数至少比分子高 ⟦102⟧ 次（⟦2794⟧）时，⟦3341⟧ 才成立。","利用全平面留数和公式转向圈外时，记住公式为 ⟦3342⟧，负号不可遗漏。"]],["基础与进阶","黎曼定理与极点刻画是孤立奇点分类的理论基石：若 ⟦1195⟧ 在去心邻域 ⟦2429⟧ 内有界，利用洛朗负幂项积分公式与 ML 估计令圆半径 ⟦1267⟧，所有负幂系数 ⟦1265⟧ 被强迫归零，从而证明可去性；若 ⟦1268⟧，则倒数 ⟦1270⟧ 局部解析有界且趋于零，转为可去奇点后立刻读出原函数的有限极点阶数。",["用 ⟦3351⟧ 估计时，注意被积函数里 ⟦3352⟧ 的指数与周长 ⟦2435⟧ 相乘正好凑出 ⟦3353⟧（对 ⟦1263⟧ 才趋于 ⟦128⟧）；且必须说明 ⟦3347⟧ 与积分半径 ⟦1266⟧ 无关才能令 ⟦1267⟧。","证明 ⟦3354⟧ 为极点时，要说明为何 ⟦1270⟧ 在延拓为 ⟦128⟧ 后“不恒为零”（否则无法提取有限正整数零点阶数 ⟦634⟧）。"]],["基础与进阶","若函数在 ⟦291⟧ 处有 ⟦634⟧ 阶零点（⟦3306⟧）或 ⟦3359⟧ 阶极点（⟦3307⟧），则可统一写成 ⟦1272⟧（⟦1273⟧ 解析）。求对数导数 ⟦1271⟧ 时，乘积求导并相除恰好把指数 ⟦634⟧ 直接剥离成 ⟦2448⟧，余项 ⟦2447⟧ 在 ⟦291⟧ 解析，因此对数导数只呈现一阶极点且留数恰好等于阶数 ⟦634⟧（或 ⟦1281⟧）。",["利用分解 ⟦3360⟧ 后，必须明确验证 ⟦1273⟧ 且 ⟦1224⟧ 在 ⟦291⟧ 的邻域解析，才能断定 ⟦2447⟧ 在 ⟦291⟧ 处分母非零因而是解析项（留数为 ⟦128⟧）。","遇组合项如 ⟦3357⟧ 时，代入 ⟦1276⟧ 算出 ⟦1279⟧，需检查分母 ⟦3361⟧，证明该项在 ⟦128⟧ 处解析而非奇点。"]],["核心必考","设 ⟦1232⟧，当 ⟦856⟧ 从 ⟦128⟧ 变到 ⟦49⟧ 时，⟦9⟧ 恰好沿单位圆 ⟦11⟧ 逆时针绕行一周。借此将 ⟦2367⟧、⟦3372⟧ 和 ⟦3373⟧ 全部替换为 ⟦9⟧ 的有理函数，即把实三角定积分转化为单位圆周的留数计算。",["只挑选严格位于单位圆内部 ⟦3370⟧ 的奇点求留数，落在 ⟦3374⟧ 的根必须舍去；不要漏掉因 ⟦3373⟧ 而在原点 ⟦156⟧ 处可能引入或抵消的极点。","若积分区间为 ⟦2275⟧ 而非 ⟦761⟧，先检验被积函数关于 ⟦856⟧ 的偶性或周期性（如 ⟦3366⟧ 为偶函数），改写为 ⟦3375⟧ 再代换。"]],["核心必考","对实轴无零点且满足 ⟦2794⟧ 的有理函数，其沿上半平面大圆弧 ⟦1646⟧ 的积分在 ⟦1417⟧ 时以 ⟦2804⟧ 速度衰减为零。这使得原实积分直接由上半平面内的全部极点留数和确定；即使遇到二阶以上重极点（如 ⟦3382⟧），也只需结合高阶极点求导法则即可求得精确值。",["计算 ⟦3383⟧ 前必须指明被积函数为偶函数才能写成 ⟦786⟧；若被积函数不是偶函数则不能直接用此全轴折半技巧。","重极点 ⟦1748⟧ 在计算 ⟦3384⟧ 求导时务必注意链式求导与负指数减一的符号（例如 ⟦3385⟧）。"]],["核心必考","当有理分母比分子只高 ⟦101⟧ 次（如 ⟦3399⟧）时，普通 ML 估计已不足以说明弧积分趋零，而直接把 ⟦3389⟧ 换成 ⟦3400⟧ 更会因为沿虚轴指数爆炸而失效。约当引理指出：在 ⟦1311⟧ 时把三角因子嵌入 ⟦3394⟧ 并在上半平面封闭，指数衰减因子 ⟦3401⟧ 将强力压制大圆弧积分趋零，取留数结果实部或虚部即得正解。",["绝对禁止直接把被积函数中的 ⟦3389⟧ 替换成 ⟦3400⟧ 来算留数！因为 ⟦3402⟧，大弧积分根本不趋于零，必须统一用 ⟦3394⟧ 算完后再取 ⟦3403⟧ 或 ⟦813⟧。","当 ⟦1311⟧ 时取上半平面（⟦777⟧ 使 ⟦3404⟧）；若遇到 ⟦2867⟧ 则必须改选下半平面或先用三角奇偶性把 ⟦291⟧ 转为正数。"]],["高频重点","当解析函数在一点满足 ⟦3406⟧ 时，由复导数极限可知任意过 ⟦369⟧ 的光滑曲线经过映射后，切线长度一致放大 ⟦3409⟧ 倍（伸缩率不变性），切线方向一致逆时针旋转 ⟦3410⟧ 弧度（保角性）。反之在导数为零的点 ⟦3411⟧ 处，夹角将被成倍放大（如 ⟦824⟧ 在原点将夹角加倍），映射不再保角。",["解析函数在某区域“处处保角”（第一类保角）的充要条件是解析且处处 ⟦3412⟧；而在局部一点保角（即 ⟦3413⟧）并不自动保证函数在整个大区域上是一对一单射（例如 ⟦1511⟧ 处处导数非零但以 ⟦2077⟧ 为周期）。","计算旋转角 ⟦3410⟧ 时注意把 ⟦3408⟧ 写成标准极坐标 ⟦3414⟧ 并落在主辐角 ⟦47⟧ 内。"]],["高频重点","由于分式线性映射仅含三个本质复自由度，任意互异的三点 ⟦3420⟧ 到互异三点 ⟦3421⟧ 存在唯一的分式线性映射，由交比不变式直接给出。在交比公式中若出现无穷远点 ⟦842⟧，只需按极限约定将所有含 ⟦842⟧ 点的差因式直接替换为 ⟦101⟧，即可大幅化简代数运算。",["代三点交比公式时要核对分子、分母的顺序严格对称（⟦3422⟧），不要把两点顺序写反。","遇到无穷远点时是把“含该点的两个差因式”（通常是一个分子因式和一个分母因式）同时替换为 ⟦101⟧，不能只替一个或错误约分。"]],["核心必考","一切单位圆盘到自身的共形双射（自同构）都具有统一形式 ⟦846⟧（⟦1514⟧），其中内点 ⟦291⟧ 被映至原点，关于单位圆的对称点 ⟦3429⟧ 被映至无穷远。若源区域是左/右/上/下半平面，可先旋转平移至标准上半平面 ⟦901⟧，再直接套用上半平面模板完成内点与导数归一化。",["单位圆自同构分母为 ⟦3430⟧（不是 ⟦3431⟧），当 ⟦291⟧ 为纯虚数或一般复数时必须对 ⟦291⟧ 取共轭；此外需保证 ⟦1514⟧。","对于上半平面以外的半平面（如右半平面 ⟦1670⟧），应先乘 ⟦1750⟧ 或旋转成标准上半平面后再套公式，或者直接用关于该边界直线的对称点（如右半平面中 ⟦291⟧ 对称到 ⟦3432⟧）。"]],["基础与进阶","偏心圆环的两个边界圆周虽然不同心，但永远存在一对独特的公共几何反演对称点 ⟦3436⟧。借助分式线性映射的保对称点性质，只要把 ⟦1453⟧ 映到 ⟦128⟧、把 ⟦3056⟧ 映到 ⟦842⟧，那么关于 ⟦3436⟧ 互为对称点的新圆周就必须同时以 ⟦128⟧ 和 ⟦842⟧ 为反演对称点——而在平面上以原点和无穷远为对称点的圆周只能是以原点为圆心的同心圆！",["求解公共反演对称点时，如果两圆圆心连线不在实轴上，应先通过平移和旋转把圆心连线搬到实轴上再列实方程 ⟦3439⟧。","求出 ⟦3436⟧ 后务必检查其中一个落在内圆内部、另一个落在外圆外部（因此都不在偏心圆环内，映射在环内解析单叶无极点），最后代入外边界一点求出尺度常数 ⟦131⟧ 以归一化外圆半径为 ⟦101⟧。"]],["高频重点","单一的分式线性映射无法改变两条边界曲线的夹角，遇到角形域、带形域或半圆月牙域时，必须与幂函数 ⟦3442⟧、指数函数 ⟦1511⟧、对数函数等初等映射“搭积木”复合。核心战略是以“上半平面 ⟦901⟧”为通用中转站：角域用幂函数张平、带域用指数函数展开、月牙两交点用分式映射送到 ⟦128⟧ 和 ⟦842⟧ 变为角域后再用幂函数张平，最后再用 ⟦3445⟧ 收束为单位圆盘。",["对两条圆弧相交的月牙域或半圆域，分式映射必须把两个交点分别映到 ⟦128⟧ 和 ⟦842⟧（而不是只映其中一点），这样两圆弧才能同时变成过原点的两条射线而形成角形区域。","应用幂函数 ⟦3442⟧ 时须始终沿同一个连续辐角分支（如 ⟦3446⟧），并注意旋转系数使角域先对齐正实轴再作乘方。"]],["基础与进阶","周期函数可展为离散频率谐波之和（傅里叶级数），非周期绝对可积函数则展为连续傅里叶积分。无论是级数还是积分，只要在满足狄利克雷条件的分段光滑函数跳跃点（或连续端点）处代入具体数值 ⟦3453⟧，等式两端由极限平均值 ⟦3456⟧ 接轨，往往能直接推算出看似棘手的无穷级数和或振荡反常积分。",["代入端点值求级数和或积分值之前，必须先按照周期延拓（针对周期级数）或原非周期函数定义（针对傅里叶积分）画出 ⟦3453⟧ 左右两侧的实际极限值，切勿漏掉周期边界带来的跳跃。","若题目询问正弦或余弦半区间积分，要注意将全轴反演式 ⟦3457⟧ 利用被积函数偶性折算为 ⟦3458⟧。"]],["高频重点","门函数、单双边指数函数和三角脉冲是最常考的基本变换对。借助欧拉公式与函数奇偶性，实偶脉冲只需计算正半轴的余弦积分，而实奇脉冲则只产生纯虚的 ⟦3466⟧ 倍正弦积分；利用零频值 ⟦3467⟧ 等于时域曲线下面积，可以在考场迅速验证求出的频谱公式是否正确。",["斜坡脉冲（如 ⟦682⟧ 在 ⟦1731⟧）做分部积分时负号极易算错，求完后应立刻检查奇偶性（实奇函数的频谱必须为纯虚奇函数）和极限 ⟦3465⟧。","双边指数 ⟦3468⟧ 绝对不可直接连着绝对值积分，必须以 ⟦945⟧ 为界拆成 ⟦955⟧ 与 ⟦956⟧ 两段积分相加。"]],["高频重点","单位冲激在时间变量做线性代换 ⟦3479⟧ 时，其“总面积为 ⟦101⟧”的分布特性在换元雅可比作用下会产生伸缩因子 ⟦2866⟧。另一高频重点是单位阶跃函数 ⟦3480⟧ 的频谱：它的直流平均值 ⟦2616⟧ 贡献了零频冲激 ⟦3481⟧，而奇对称跃变部分则贡献主值项 ⟦3482⟧。",["冲激尺度的正确公式是 ⟦970⟧，常见错误是忘除 ⟦3139⟧ 或直接写成 ⟦3483⟧。","单位阶跃函数 ⟦3478⟧（即 ⟦3484⟧）的傅里叶变换是 ⟦3485⟧，绝不能漏掉零频冲激项 ⟦3481⟧！"]],["核心必考","在本课非对称角频率约定下，正逆变换几乎只在指数符号与 ⟦49⟧ 系数上有所不同，这直接催生了极为强悍的“对称性（互易律）”：⟦1009⟧。配合微分性质（时域求导乘 ⟦3493⟧，乘 ⟦682⟧ 对应频域求导 ⟦3494⟧），无需硬算含参广义积分，即可将 ⟦3495⟧、⟦3496⟧ 与 ⟦3497⟧ 等经典频谱一步推导出。",["牢记对称性右侧带有 ⟦49⟧ 且自变量取负号：⟦3498⟧！当 ⟦1195⟧ 为偶函数时负号可去掉，但 ⟦49⟧ 绝不能忘。","区分两条微分性质的系数符号：时域求导 ⟦3499⟧，而乘 ⟦682⟧ 的频域求导是 ⟦3500⟧（符号均与部分教材中用 ⟦1754⟧ 对应 ⟦3501⟧ 不同，由 ⟦3502⟧ 直接检验即可确保零失误）。"]],["高频重点","双边指数脉冲的直接卷积积分需要分情况拆绝对值，繁琐易错；但只要取一次傅里叶变换，卷积就化为了有理分式的乘积 ⟦3509⟧，再配合参数求导或部分分式即可轻松反演。同样地，含有全轴卷积的积分方程在变换到频域后会立刻降维为代数方程，先解出未知谱 ⟦2833⟧ 再作逆变换即得未知函数。",["在频域解卷积方程除以核函数 ⟦3510⟧ 时，必须先验证核函数在实轴上处处非零（否则可能引入奇点或非唯一广义解），且所得商函数需满足反演存在条件。","把参数求导法用于反演 ⟦3511⟧ 时要注意符号：对 ⟦3512⟧ 关于 ⟦1033⟧ 求偏导的同时，时域 ⟦3468⟧ 也要关于 ⟦1033⟧ 求导得到 ⟦3513⟧。"]],["核心必考","计算 ⟦3520⟧ 或 ⟦3521⟧ 等乘积型初等函数的拉氏变换，无需用分部积分，只需利用三角降幂或指数拆解即可立即化为基本变换对。确定总收敛域时，一般是取各加和项收敛半平面的交集（即最大增长指数）；但要注意若两个同指数增长项相互抵消，实际绝对收敛域可能会扩大。",["记忆 ⟦3396⟧ 与 ⟦3397⟧ 的像函数分子容易混淆：记住余弦分子是变量 ⟦1086⟧（因为当 ⟦1845⟧ 时 ⟦3522⟧），正弦分子是常数 ⟦1006⟧。","双曲正余弦 ⟦3523⟧ 的分母是减号 ⟦3524⟧，其增长指数为 ⟦3139⟧，故收敛半平面是 ⟦3525⟧（非仅 ⟦3526⟧）。"]],["核心必考","在工程信号处理中，任一在时间段 ⟦3543⟧ 上开启的信号 ⟦1057⟧ 都可以用“阶跃开关” ⟦3535⟧ 表达为整体公式。借助第二位移性质，时域的 ⟦291⟧ 秒延迟严格等价于频域乘以 ⟦2904⟧；反之做拉氏逆变换时，一旦见到分子上的 ⟦2923⟧，必须先把它提出来反演剩余有理式，再将所得原函数整体右移 ⟦1535⟧ 并乘上阶跃 ⟦2927⟧。",["使用第二位移正变换公式时常见错是直接写出 ⟦3544⟧！正确做法是改写 ⟦3545⟧，故变换为 ⟦3546⟧。","作反演遇到 ⟦3547⟧ 时，不仅要把 ⟦3540⟧ 中的所有 ⟦682⟧ 换成 ⟦3548⟧，还绝对不可忘记乘以开关因子 ⟦2927⟧（表示在 ⟦3549⟧ 时该分支仍为零）。"]],["高频重点","对于在 ⟦1298⟧ 上以 ⟦3559⟧ 为周期的因果信号，将其按 ⟦3560⟧ 分段积分并应用第二位移性质，各周期积分恰构成公比为 ⟦3561⟧ 的无穷等比级数。在 ⟦1401⟧ 时等比级数求和即化简为只含第一个周期 ⟦3552⟧ 内积分的封闭表达式 ⟦3562⟧。",["必须看清题目规定的完整周期 ⟦3554⟧ 是多少（例如半波整流正弦波只在 ⟦3563⟧ 非零、后半周期为零，其总周期仍是 ⟦2282⟧ 而非 ⟦3564⟧）！","分母的 ⟦3556⟧ 往往能与分子中的因式平方差约分（如方波产生 ⟦3565⟧，半波整流产生 ⟦3566⟧），务必化简到最简分式。"]],["高频重点","初值定理与终值定理能跳过繁琐的逆变换直接从 ⟦1284⟧ 的极限读取时域边界行为。然而终值定理存在严格的前提约束：必须保证时域极限 ⟦3574⟧ 确实存在。对于有理像函数而言，即要求 ⟦1284⟧ 的全部极点必须严格落在开左半平面（⟦3568⟧），否则即使 ⟦3575⟧ 算出来是个有限值（如 ⟦1282⟧ 对 ⟦1063⟧），结论也是完全错误的。",["考场常见陷阱：直接计算 ⟦3576⟧ 并断言 ⟦3577⟧！错误根源是 ⟦1284⟧ 在虚轴 ⟦2276⟧ 有极点，⟦1063⟧ 持续振荡无终值。","应用初值定理前必须确认 ⟦960⟧ 在原点无冲激项（即真分式 ⟦2932⟧），若有冲激项需先拆出常数项再对其余真分式部分使用初值定理。"]],["核心必考","在像空间中，时域“乘以 ⟦682⟧”对应求负导数 ⟦3588⟧，而时域“除以 ⟦682⟧”对应从 ⟦1086⟧ 到 ⟦2461⟧ 积分 ⟦2960⟧。这一对互逆性质完美破解了对数与反三角型像函数的逆变换难题：先对 ⟦275⟧ 或 ⟦3584⟧ 求导得到有理式，反演成 ⟦1290⟧ 后再除以 ⟦682⟧；同时将 ⟦1104⟧ 代入除 ⟦682⟧ 公式即可直接算出不含指数衰减的反常实积分。",["应用除以 ⟦682⟧ 性质前必须检验“原点可积性”：当 ⟦1961⟧ 时 ⟦2948⟧ 的极限必须有限或可积（如 ⟦3589⟧、⟦3590⟧）；不能对 ⟦3591⟧ 或 ⟦3592⟧ 使用该性质。","从 ⟦1086⟧ 积到 ⟦2461⟧ 计算对数积分时，不能把 ⟦3593⟧ 直接拆开代 ⟦2461⟧（会导致 ⟦2962⟧），必须先用对数性质合并成单一分式 ⟦3594⟧ 再取 ⟦3595⟧ 极限归零！"]],["核心必考","当遇到既含导数 ⟦3602⟧ 又含变上限积分 ⟦3598⟧ 或卷积分 ⟦3603⟧ 的方程时，传统微分方程办法需先求导消积分；而拉普拉斯变换直接将积分项视为 ⟦2491⟧（变换为 ⟦3599⟧）或 ⟦3604⟧（变换为 ⟦3605⟧），一步转化为有理分式代数方程，同时自动嵌入所有初始条件。",["用单边卷积反演如 ⟦3606⟧ 时，注意把积化为和差 ⟦1132⟧，在 ⟦1867⟧ 积分时把外部变量 ⟦682⟧ 当作常数。","求解微积分方程得到的 ⟦1929⟧ 后，除了检验 ⟦3607⟧ 初值，还应当代回原微积分方程验证左端导数项与积分项之和确实匹配右端（以此杜绝移项或裂项笔误）。"]],["核心必考","拉普拉斯变换特别擅长解决传统待定系数法难以处理的高阶初值问题、分段激励与冲激激励问题。在广义意义下，⟦3611⟧ 自然进入像函数分子；若题设初值在 ⟦945⟧ 给定而右端激励含 ⟦971⟧（在原点瞬间激发系统），则以右极限 ⟦3612⟧ 的角度或初始跃变来解读才自洽一致。",["对于高阶导数 ⟦3613⟧，分解 ⟦1152⟧ 后尤其是含二次不可约因式（如 ⟦3614⟧）时，拆分分子常系数最易算错，反演完务必用 ⟦3615⟧ 三项初值全部代入验算一遍！","右端出现 ⟦1850⟧（⟦1311⟧）时，因解在 ⟦2873⟧ 处一阶导数发生跳跃但函数值本身保持连续，故只在 ⟦3616⟧ 出现延迟解因子 ⟦2902⟧。"]],["基础与进阶","二阶微分方程通常需要 ⟦3607⟧ 和 ⟦1172⟧ 才能启动拉氏变换，但边值问题常常只给出起点 ⟦3607⟧ 与另一有限端点 ⟦3620⟧。解决策略极其自然：先把未知的初始导数 ⟦2942⟧ 暂时设为待定实常数 ⟦131⟧，像往常一样完成变换并反演出带有参数 ⟦131⟧ 的解 ⟦3618⟧，最后把终点条件 ⟦2873⟧ 代入解出 ⟦131⟧ 即可。",["终点条件 ⟦3621⟧ 只能在反演回时域 ⟦1929⟧ 之后才能代入，绝不能直接把 ⟦2873⟧ 写进像函数 ⟦1152⟧ 中！","参数 ⟦3622⟧ 虽然待定，但在求拉氏逆变换过程中作为线性乘子直接随函数一起反演出来，最终得到 ⟦131⟧ 的一次方程。"]],["基础与进阶","当微分方程系数中出现时间变量 ⟦682⟧（例如 ⟦1322⟧ 或 ⟦3629⟧）时，常规常系数代数化不再直接适用，但利用性质 ⟦3630⟧，时域里乘以 ⟦682⟧ 恰好变成像空间里对 ⟦1086⟧ 求导！如果原方程中只含 ⟦682⟧ 的一次幂，二阶变系数微分方程往往在像空间中奇迹般地降阶为可直接分离变量求解的一阶方程。",["变换 ⟦1322⟧ 时顺序至关重要：必须先算出 ⟦3631⟧，然后再整体对 ⟦1086⟧ 求导并加负号；注意里面的常数项 ⟦1172⟧ 求导后变为 ⟦128⟧，而 ⟦3632⟧ 求导后会留下一项 ⟦3607⟧！","在像空间解一阶微分方程得到的任意积分常数 ⟦346⟧，需结合初值渐近性质 ⟦3628⟧（有时还须利用原函数指数阶要求）确定，切勿遗漏。"]],["基础与进阶","当解析函数 ⟦1332⟧ 在一点非零时，其模长 ⟦3641⟧ 光滑可微，借助链式法则与 C-R 方程，交叉偏导项正好完全抵消，从而得到简练的恒等式 ⟦1334⟧。但在 ⟦3642⟧ 的零点处，平方根函数的奇异性会导致 ⟦2530⟧ 出现尖锥（例如 ⟦1339⟧ 时 ⟦3643⟧ 在原点不可微），因此不能直接对模求偏导。",["证明中对 ⟦3641⟧ 求偏导隐含前提是 ⟦1778⟧，即 ⟦1333⟧；若在零点处也直接套用公式会被扣分。","判断简单零点处 ⟦2530⟧ 是否可微时，注意反例 ⟦1339⟧ 虽全平面解析且 ⟦3644⟧，但 ⟦53⟧ 在 ⟦142⟧ 点连一阶偏导数都不存在。"]],["基础与进阶","当函数仅以抽象零点阶数给出时，设 ⟦1343⟧ 并写出分子和分母从最低非零幂开始的泰勒展开式。由最低幂之差直接确定极点阶数；随后把分母最高公因子提出并对剩余非零幂级数取倒数展开到所需低阶项，便可精确读出 ⟦2539⟧ 项的留数通式。",["注意分母泰勒系数 ⟦3651⟧ 对应 ⟦3652⟧，其中 ⟦3653⟧，展开倒数 ⟦3654⟧ 时切莫把负号和分母平方 ⟦3655⟧ 算丢。","如果阶数差是 ⟦102⟧ 阶极点，外提的是 ⟦2535⟧，因此括号内的乘积必须准确展开到 ⟦3656⟧ 一次项，才能保证乘以 ⟦2535⟧ 后得到正确的 ⟦2539⟧ 系数。"]],["基础与进阶","儒可夫斯基函数 ⟦3660⟧ 是航空动力学翼型绕流理论的基础变换。因为 ⟦3662⟧ 且仅在 ⟦663⟧ 导数为零，它把单位圆周 ⟦11⟧ 对折映成实轴闭线段 ⟦1405⟧，并同时把单位圆外 ⟦1363⟧ 与单位圆内 ⟦588⟧ 各自一对一双射地映到除去线段 ⟦1405⟧ 的整个复平面。",["证明双射时必须分析二次逆方程 ⟦1365⟧ 的两根乘积 ⟦755⟧：只有当 ⟦2556⟧ 时两根才同时落在单位圆周上（包括 ⟦3663⟧ 时的重根）；若 ⟦2560⟧，则两根必一个在圆外、一个在圆内。","判断保角性时需明确指出其导数 ⟦3664⟧ 在圆外区域 ⟦1363⟧ 上永不为零。"]],["基础与进阶","洛朗级数的第 ⟦372⟧ 项系数 ⟦3263⟧ 既可以通过局部已知的几何/麦克劳林展开直接抽取目标幂次得到，也可以由围绕中心在解析圆环内的围线积分 ⟦3671⟧ 确定。在求特定系数时只需展开到覆盖目标幂次的前几项即可，但绝不能将内环与外环的展开系数混淆。",["同一个函数在不同圆环的同一幂次系数往往完全不同：例如 ⟦1369⟧ 在 ⟦1370⟧ 中 ⟦584⟧ 系数为 ⟦1373⟧，而在外环 ⟦1371⟧ 中最低次已是 ⟦1374⟧，故 ⟦584⟧ 系数为 ⟦128⟧。","使用积分公式求系数时，积分闭曲线 ⟦346⟧ 必须绕展开中心正向一周且完整位于所讨论的解析圆环内部。"]],["基础与进阶","当一阶极点恰好落在实轴上时，普通反常积分发散，必须讨论对称删去极点邻域的柯西主值（⟦3679⟧）。常用技巧是在实轴极点 ⟦293⟧ 处从上半平面（或下半平面）挖去一个半径为 ⟦2568⟧ 的小半圆绕开奇点：随着 ⟦3680⟧，顺时针上方小半圆恰好贡献“负的半留数” ⟦3681⟧。",["上方绕开实轴极点时，实轴从左向右穿过该点，因此沿着小半圆弧是从角度 ⟦322⟧ 走到 ⟦128⟧，方向是<strong>顺时针</strong>（负方向）！贡献是 ⟦3682⟧，移项到等式右边才变成 ⟦3683⟧。","实轴极点必须是“一阶（简单）极点”，高阶极点在小半圆弧上积分会发散到无穷，不能直接套半留数公式。"]],["基础与进阶","高阶导数公式对半径为 ⟦370⟧ 的圆周进行 ML 估值，可以直接用圆周上的模长上界 ⟦1193⟧ 压制圆心处 ⟦372⟧ 阶导数的绝对值，即柯西估计 ⟦1192⟧。对于全平面解析的整函数，我们可以自由令圆半径 ⟦3686⟧：只要增长速度慢于 ⟦3690⟧，所有 ⟦3688⟧ 阶导数都必被压迫为零，从而迫使整函数的泰勒级数退化为有限次多项式（当 ⟦85⟧ 时即著名的刘维尔定理：有界整函数必为常数）。",["柯西估计不等式不要漏写因子 ⟦2723⟧，分母指数是 ⟦3689⟧ 而不是 ⟦3692⟧（因 ⟦3693⟧ 约去了一个 ⟦370⟧）。","仅证明 ⟦3694⟧ 阶导数为零还不够，必须点明“⟦1195⟧ 是整函数，故其原点麦克劳林/泰勒展开在全复平面收敛”，才能断言高次项全消后 ⟦129⟧ 就是多项式。"]],["基础与进阶","对复对数、非整数次幂等涉及模与辐角的函数，直角坐标 ⟦214⟧ 会引入繁杂的根号和反正切，而在极坐标 ⟦1439⟧ 下实部与虚部直接分离。通过极坐标链式法则（或沿径向与切向求导相等）可导出极坐标 C-R 方程，配合局部单值角区间及原点外连续性即可迅速证明解析性并算出导数。",["极坐标变换只在 ⟦1440⟧ 且去掉割线（例如非正实轴 ⟦1419⟧）的开区域内一一单值连续，验证解析性时必须明确指出所选开区域不含原点与割线。","切勿丢掉分母中的半径因子 ⟦1266⟧：记住量纲关系 ⟦3708⟧ 与 ⟦3709⟧ 同量纲，公式是 ⟦3710⟧。"]],["基础与进阶","当物理信号只定义在半轴 ⟦1298⟧ 时，将其做偶延拓可消去正弦分量得到纯粹的余弦变换 ⟦3715⟧，做奇延拓则消去余弦分量得到正弦变换 ⟦3716⟧。求解 ⟦1425⟧ 等指数型半轴变换最巧妙的办法是借欧拉公式合并复指数积分 ⟦3714⟧，算完一次后直接分出实部和虚部。",["不同教材对半轴正余弦变换前置系数 ⟦3718⟧ 或 ⟦3719⟧ 的约定可能不同，审题时务必核对题设；本课程采用正变换无前置系数、逆变换带 ⟦3719⟧ 的约定。","用复指数合成时要看清指数符号：⟦3720⟧；若用 ⟦3717⟧ 则是 ⟦3721⟧，虚部符号切勿弄反。"]]],B=[[[["指数形式","z = r e<sup>iθ</sup>，r = √(x²+y²)","z ≠ 0 时才有辐角。主辐角取 (−π, π]，先按 x、y 的符号判定象限。"],["幂与开方","zⁿ = rⁿ e<sup>inθ</sup>","n 为正整数。开 n 次方前将 θ 写成 θ+2kπ，再除以 n。"],["三角不等式","|a+b| ≤ |a|+|b|","两项均非零时，等号成立当且仅当它们同向。"]],["确定模与象限，写指数式。","幂运算乘辐角，开方时保留整周数。","求极值时给出上界，再构造取等号的点。"]],[[["多项式与共轭","p(z̄) = <span style='text-decoration:overline'>p(z)</span>","p 的系数为实数时成立。共轭运算与加法、乘法交换。"]],["从 p(z₀)=0 出发，写开多项式。","对等式两端取共轭，逐项处理系数。","用根的定义收束；如果根非实，说明两根相异。"]],[[["柯西–黎曼方程","u<sub>x</sub> = v<sub>y</sub>，u<sub>y</sub> = −v<sub>x</sub>","复可导的必要条件。若 u、v 在该点实可微，则两式同时成立也是充分条件；一阶偏导连续足以保证实可微。"],["导数","f′(z) = u<sub>x</sub> + i v<sub>x</sub>","先确认该点可导。要在一点解析，须在它的某个开邻域内处处可导。"]],["分出实、虚部并求四个偏导。","验证连续性，联立两条 C–R 方程，解出可导点。","寻找可导点集的内部，区分可导点和解析点。"]],[[["指数方程","e<sup>z</sup> = w ⇔ z = ln|w| + i(θ+2kπ)","w ≠ 0，θ 为 w 的一个辐角，k ∈ ℤ。"],["复正弦","sin z = (e<sup>iz</sup>−e<sup>−iz</sup>)/(2i)","指数定义对所有复数成立，指数函数处处非零。"]],["把三角函数转为指数，再移项。","依次比较模、辐角，辐角等式要加整周。","给出所有解的整数参数，并代回检验。"]],[[["路径参数化","∫<sub>C</sub> f(z) dz = ∫<sub>a</sub><sup>b</sup> f(z(t)) z′(t) dt","路径分段光滑，函数在路径上连续；t 从起点对应的值走到终点对应的值。"]],["依据路径与方向选择参数，圆弧常取 z=z₀+Reⁱᵗ。","将 z、z̄ 与 dz 一同换成参数表达式。","计算实参数积分，反转方向应使结果变号。"]],[[["柯西积分定理","∮<sub>C</sub> f(z) dz = 0","简单闭曲线 C 及整个内部都在 f 的解析域内，且 C 分段光滑。"],["高阶导数公式","∮<sub>C</sub> g(z)/(z−a)<sup>n+1</sup> dz = (2πi/n!) g<sup>(n)</sup>(a)","C 正向简单闭合且分段光滑，a 在圈内，g 在 C 上及内部解析，n≥0 为整数。"]],["画围线，把所有奇点分为圈内、圈外、线上。","抽出 (z−a) 的幂，验证其余因子解析，再读出导数阶数。","代值并检查 n!、2πi 和路径方向；路径过奇点时单独讨论。"]],[[["共轭调和函数","u<sub>x</sub> = v<sub>y</sub>，u<sub>y</sub> = −v<sub>x</sub>","已给 v 时先检验调和性。单连通区域上的调和函数存在单值共轭调和函数。"],["确定加法常数","Im(f₁−f₂)=0 ⇒ f₁−f₂=C，C∈ℝ","f₁、f₂ 在同一连通区域解析且虚部相同。"]],["观察 v 是否是某个熟悉函数的虚部。","也可关于 x 积分 uₓ=vᵧ，并把待定项写成 h(y)。","用另一条 C–R 方程消去 h′(y)，再由初值定常数。"]],[[["系数比值法","R = lim |c<sub>n</sub>/c<sub>n+1</sub>|","用于 ∑ cₙ(z−a)ⁿ，系数最终非零且所写极限存在。圆周必须逐点判断。"],["泰勒公式","cₙ = f<sup>(n)</sup>(a)/n!","f 在以 a 为中心的圆盘内解析时，泰勒级数在该圆盘内等于 f。"]],["识别中心 a 和系数 cₙ。","求 R，或用给定点的收敛方式确定它位于圆内、外或圆周。","将被问到的边界点逐个代回原级数。"]],[[["几何级数","1/(1−q) = 1+q+q²+⋯","仅在 |q|<1 时成立。指定内外半径决定取 z/a 还是 a/z。"],["洛朗展开","f(z) = ∑<sub>n∈ℤ</sub> cₙ(z−a)ⁿ","f 在以 a 为中心的给定开圆环内解析。展开系数与所选圆环有关。"]],["令 w=z−a，再作部分分式分解。","对每个分母选模小于 1 的公比，分别展开。","组合正、负幂，给出各项收敛域的交集。"]],[[["极点判据","lim<sub>z→a</sub>(z−a)<sup>m</sup>f(z) = A ≠ 0","a 为孤立奇点，m 为正整数，A 有限，则 a 为 m 阶极点。"],["洛朗主部","c<sub>−1</sub>/(z−a) + c<sub>−2</sub>/(z−a)² + ⋯","去心邻域内，零主部对应可去奇点；有限非零主部对应极点；无限多负幂项对应本性奇点。"]],["确认奇点孤立，并比较分子、分母消零的阶数。","指数或三角函数先展开到首个非零项。","用极限判阶，或由负幂项数目决定类型。"]],[[["留数定理","∮<sub>C</sub> f(z) dz = 2πi ∑<sub>圈内</sub> Res(f,a)","C 为正向分段光滑简单闭曲线。除内部有限个孤立奇点外，f 在 C 上和内部解析。"],["单极点留数","Res(g/h,a)=g(a)/h′(a)","g、h 在 a 附近解析，h(a)=0，h′(a)≠0，且 g(a)≠0。"],["由展开读留数","Res(f,a)=c<sub>−1</sub>","在 a 的去心邻域，以 z−a 为幂展开，读取 −1 次幂的系数。"]],["列出圈内候选奇点，并先消除可去奇点。","各点选择适合的留数算法，再把圈内留数相加。","乘 2πi；若路径是顺时针则调整符号。"]],[[["上半圆围道","∫<sub>−∞</sub><sup>∞</sup> f(x) dx = 2πi ∑<sub>Im a&gt;0</sub> Res(f,a)","实轴无极点，实积分存在，大圆弧积分趋于零。须说明衰减。"],["弧积分估计","|∫<sub>Γ</sub> f(z) dz| ≤ πR max<sub>Γ</sub>|f(z)|","Γ 是半径 R 的半圆弧。若沿弧 f=O(R⁻²)，右端趋于 0。"]],["判断半轴积分能否由偶性改写成全轴积分。","选围道，找上半平面所有极点并求留数。","估计大弧，令 R→∞，再还原半轴或全轴积分。"]],[[["反求坐标","1/w = (u−iv)/(u²+v²)","w=u+iv≠0；用反变换时要排除其无定义的点。"],["保圆性","w = (az+b)/(cz+d)","ad−bc≠0。扩充复平面上的圆与直线统称广义圆，分式线性映射将广义圆映成广义圆。"]],["由反变换写出 x、y 与 u、v 的关系。","代入曲线方程整理；若是区域再取一个内点判定哪一侧。","检验逆命题与缺失点，尤其留意原点和无穷远点。"]],[[["半平面映为圆盘","ζ = (z−a)/(z−ā)","Im a>0 时，上半平面双射到单位圆盘，a 映到原点。"],["旋转、伸缩、平移","w = w₀ + R e<sup>iθ</sup> ζ","R>0，圆心和平移量由目标区域确定。用导数或边界点条件确定旋转角。"]],["先用分式映射把指定内点送到单位圆盘的中心。","再按目标圆心、半径平移与伸缩。","根据导数方向定相位，并检查区域、点和导数三个条件。"]],[[["傅里叶正变换","F(ω) = ∫<sub>−∞</sub><sup>∞</sup> f(t)e<sup>−iωt</sup> dt","ω 为角频率。f 在实轴绝对可积是正变换存在的充分条件。"],["傅里叶反演与间断点","[f(t⁻)+f(t⁺)]/2 = (1/2π) lim<sub>R→∞</sub> ∫<sub>−R</sub><sup>R</sup> F(ω)e<sup>iωt</sup> dω","例如 f 绝对可积且在所考察点附近分 >由复三角函数的指数定义，有 ⟦1490⟧ 对任意 ⟦1491⟧，⟦1492⟧，所以可以乘以 ⟦1493⟧ 作等价变形。</p>","<p>由 ⟦1494⟧ 得 ⟦1495⟧。写 ⟦222⟧，比较模得到 ⟦1496⟧，即 ⟦836⟧。再由 ⟦1497⟧ 得 ⟦1498⟧，故 ⟦1499⟧。</p>","<p>由 ⟦1500⟧ 得 ⟦1501⟧。同样比较模可得 ⟦836⟧，再由 ⟦1502⟧ 得 ⟦1503⟧，故 ⟦1504⟧。两组结果代入对应的指数等式均成立。</p>"],"<p>⟦1494⟧ 的全部解为 ⟦1499⟧，⟦1500⟧ 的全部解为 ⟦1504⟧，其中 ⟦1486⟧。</p>"]],[4,"计算","四分之一圆弧上的积分","按 2021 年 8 月卷 · 一(3) 改编","沿单位圆第一象限的圆弧从 1 到 i，求 ∫<sub>C</sub> z̄ dz。",[["<p>该圆弧的起点为 ⟦101⟧，终点为 ⟦298⟧，故取与积分方向一致的参数式 ⟦1505⟧</p>","<p>沿圆弧有 ⟦1506⟧，并且 ⟦1507⟧。由复线积分的参数公式，⟦1508⟧</p>"],"<p>⟦1509⟧。</p>"]],[5,"计算","参数在单位圆内与圆外","本课教材 · 第三章习题 9（5） · 第 101 页","设 C 为正向单位圆，a∈ℂ 且 |a|≠1。计算 ∮<sub>C</sub> eᶻ/(z−a)³ dz，并按 a 的位置讨论。",[["<p>设 ⟦1510⟧。指数函数 ⟦1511⟧ 在全平面解析，被积函数唯一可能的奇点为 ⟦1512⟧。因为题设 ⟦1513⟧，只需判断 ⟦291⟧ 在圆内还是圆外。</p>","<p>当 ⟦1514⟧ 时，⟦291⟧ 在正向围线内，分子 ⟦1515⟧ 在闭圆盘的邻域内解析。分母的三次幂对应柯西积分公式中的二阶导数，因此 ⟦1516⟧</p>","<p>当 ⟦1517⟧ 时，分母在闭单位圆盘及其某个邻域内均不为零。被积函数在该邻域内解析，由柯西积分定理得 ⟦1518⟧。</p>"],"<p>⟦1519⟧</p>"]],[5,"证明","两条柯西公式如何接起来","2022 年 6 月 A 卷 · 三（重述）","设 C 正向简单闭合且分段光滑，f 在包含 C 及其内部的区域 D 解析。a∈D 且 a∉C。证明 ∮<sub>C</sub> f′(z)/(z−a) dz = ∮<sub>C</sub> f(z)/(z−a)² dz。",[["<p>由于 ⟦1195⟧ 在包含 ⟦346⟧ 及其内部的区域内解析，⟦1520⟧ 也在该区域内解析。又因 ⟦1521⟧，分别讨论 ⟦291⟧ 在 ⟦346⟧ 外与在 ⟦346⟧ 内的情况。</p>","<p>若 ⟦291⟧ 在 ⟦346⟧ 外，则 ⟦1522⟧ 在 ⟦346⟧ 及其内部不为零。两边的被积函数均在 ⟦346⟧ 及其内部的邻域内解析，由柯西积分定理，两边积分都等于 ⟦128⟧。</p>","<p>若 ⟦291⟧ 在 ⟦346⟧ 内，则对 ⟦1520⟧ 应用柯西积分公式，得 ⟦1523⟧ 再对 ⟦1195⟧ 应用一阶导数公式，得 ⟦1524⟧ 因而两边仍相等。</p>"],"<p>对题设中所有 ⟦1521⟧，均有 ⟦1525⟧。</p>"]],[6,"计算","从给定虚部找回 f(z)","本课教材 · 第三章习题 30（2） · 第 103 页","已知解析函数的虚部 v=y/(x²+y²)，且 f(2)=0，求 f(z)。",[["<p>在含 ⟦102⟧ 的连通解析区域内讨论。因 ⟦1526⟧，该区域不含 ⟦128⟧。对 ⟦1527⟧，⟦1528⟧ 所以 ⟦1529⟧ 的虚部恰为给定的 ⟦449⟧。</p>","<p>令 ⟦1530⟧。函数 ⟦1224⟧ 解析且 ⟦1531⟧。由柯西–黎曼方程，⟦1532⟧，⟦1533⟧。由区域连通可知 ⟦1534⟧ 为实常数 ⟦1535⟧，所以 ⟦1536⟧。</p>","<p>代入 ⟦1537⟧ 得 ⟦1538⟧，即 ⟦1539⟧。所得函数在 ⟦162⟧ 时解析，且虚部及给定点值均满足题设。</p>"],"<p>⟦1540⟧。</p>"]],[7,"填空","由一个点反求收敛半径","2022 年 6 月 A 卷 · 一(5)","∑cₙ(z−1)ⁿ 在 z=i 收敛，但非绝对收敛。求其收敛半径。",[["<p>设以 ⟦101⟧ 为中心的幂级数的收敛半径为 ⟦370⟧。按幂级数的收敛性质，⟦1541⟧ 时绝对收敛，⟦1542⟧ 时发散。</p>","<p>由题意，级数在 ⟦792⟧ 处收敛，所以 ⟦1543⟧。该点又不是绝对收敛点，所以 ⟦1544⟧。因此 ⟦298⟧ 必在收敛圆周上。</p>","<p>计算该点到圆心 ⟦101⟧ 的距离，得 ⟦1545⟧</p>"],"<p>⟦1546⟧。</p>"]],[7,"计算","同一圆周上的两种收敛行为","ch4.2 第 14–15 页 · 例 1(2)","求 ∑<sub>n=1</sub><sup>∞</sup>(z−1)ⁿ/n 的收敛半径，并讨论 z=0 和 z=2。",[["<p>级数以 ⟦103⟧ 为中心。令 ⟦1547⟧。对 ⟦12⟧，相邻两项的模之比满足 ⟦1548⟧ 因此 ⟦1549⟧ 时绝对收敛（⟦103⟧ 时各项为零），⟦1550⟧ 时发散，故 ⟦1551⟧。</p>","<p>在 ⟦156⟧ 处，原级数化为 ⟦1552⟧。由于 ⟦1553⟧ 单调递减且趋于零，按交错级数判别法收敛。其绝对值级数 ⟦1554⟧ 发散，所以在此点条件收敛。</p>","<p>在 ⟦660⟧ 处，原级数就是发散的调和级数 ⟦1554⟧。</p>"],"<p>收敛半径为 ⟦1551⟧。⟦156⟧ 处条件收敛，⟦660⟧ 处发散。</p>"]],[8,"计算","分别展开两个分式","ch4.4 第 30–33 页 · 例 3(2)","将 1/[(z−1)(z−2)] 在 1<|z|<2 内展开为以 0 为中心的洛朗级数。",[["<p>记 ⟦1555⟧。先作部分分式分解 ⟦1556⟧ 两个分式须分别改写，使几何级数的公比在题设圆环内均满足模小于 ⟦101⟧。</p>","<p>在 ⟦1557⟧ 时有 ⟦1558⟧，故 ⟦1559⟧</p>","<p>在 ⟦1363⟧ 时有 ⟦1560⟧，故 ⟦1561⟧</p>","<p>两个展开同时成立的范围为 ⟦589⟧。将第二个展开式从第一个展开式中减去，即得以 ⟦128⟧ 为中心的洛朗级数。</p>"],"<p>⟦1562⟧。</p>"]],[8,"计算","单位圆外的负幂展开","2022 年 6 月 A 卷 · 四(2)","在 |z|>1 内展开 1/[z²(z−1)]。",[["<p>因为 ⟦1363⟧，所以 ⟦162⟧ 且 ⟦1560⟧。将含 ⟦407⟧ 的因式提出 ⟦9⟧，得到 ⟦1563⟧</p>","<p>利用几何级数 ⟦1564⟧（⟦852⟧），取 ⟦1565⟧，得 ⟦1566⟧ 其前几项为 ⟦1567⟧。</p>"],"<p>所求洛朗级数为 ⟦1568⟧，收敛范围为 ⟦1363⟧。</p>"]],[8,"计算","比较单位圆内外的展开","补充教材 Complex Analysis · §7.3 习题 1","对 f(z)=1/(z³−z⁴)，分别求 0<|z|<1 与 |z|>1 上的洛朗展开。",[["<p>先分解分母，得到 ⟦1569⟧ 为使用几何级数，需在两个区域内分别选取模小于 ⟦101⟧ 的公比。</p>","<p>在 ⟦588⟧ 内，直接取公比 ⟦9⟧，得 ⟦1570⟧ 前几项为 ⟦1571⟧。</p>","<p>在 ⟦1363⟧ 内，写 ⟦1572⟧。此时 ⟦1560⟧，得 ⟦1573⟧ 前几项为 ⟦1574⟧。</p>"],"<p>⟦588⟧ 时为 ⟦1575⟧，⟦1363⟧ 时为 ⟦1576⟧。</p>"]],[9,"计算","相消后的极点阶数","ch5.1 第 24 页 · 例 4(1)","判定 z sin z/(eᶻ−z−1)² 在原点的奇点类型。",[["<p>在原点展开分子和分母中未平方的因式，得 ⟦1577⟧</p>","<p>令 ⟦1578⟧，⟦1579⟧，并以展开式分别补上其在原点的值。由上式，⟦1580⟧，⟦1581⟧。二者在原点附近解析，且 ⟦1582⟧ 在充分小的邻域内不为零。</p>","<p>在该去心邻域内，⟦1583⟧ 因为 ⟦1584⟧ 在原点可解析延拓且其值非零，按极点阶数判别准则，⟦156⟧ 是二阶极点。</p>"],"<p>⟦156⟧ 是二阶极点。</p>"]],[9,"选择","指数型孤立奇点","据 ch5.1 第 24 页 · 例 4(2) 改为选择题","f(z)=z e<sup>−1/z</sup>/(1+z²) 在原点属于哪一类奇点？",[["<p>由 ⟦1585⟧ 得另外两个可能奇点 ⟦1586⟧。在 ⟦588⟧ 内，⟦1587⟧ 和 ⟦1588⟧ 都解析，因此 ⟦156⟧ 是 ⟦1195⟧ 的孤立奇点。</p>","<p>指数函数在该去心邻域内的洛朗展开为 ⟦1589⟧ 所有 ⟦1263⟧ 的系数都不为零，所以 ⟦1588⟧ 在原点有无限个负幂项。</p>","<p>若 ⟦1195⟧ 在原点可去或为有限阶极点，则乘以 ⟦1590⟧ 仍至多有有限阶极点，再除以 ⟦9⟧ 最多增加一阶。由 ⟦1591⟧ 得右端也至多有有限阶极点，这与它的洛朗展开矛盾。</p>"],"<p>⟦156⟧ 是本性奇点，选 C。</p>"],["A 可去奇点","B 一阶极点","C 本性奇点","D 非孤立奇点"]],[10,"计算","同时处理可去奇点和单极点","2022 年 6 月 A 卷 · 四(3)","C 为逆时针圆 |z|=4，求 ∮<sub>C</sub> (eᶻ−1) cot z dz。",[["<p>记 ⟦1592⟧。⟦1593⟧ 的零点为 ⟦1594⟧，其中 ⟦1486⟧。因 ⟦1595⟧，在圆 ⟦1596⟧ 内只有 ⟦1597⟧ 三个候选点，围线上没有奇点。</p>","<p>在原点，⟦1598⟧，⟦1599⟧，⟦1600⟧。于是 ⟦1601⟧ 因而 ⟦128⟧ 是可去奇点，留数为 ⟦128⟧。</p>","<p>对 ⟦1602⟧ 或 ⟦1603⟧，⟦1604⟧ 而 ⟦1605⟧。分子 ⟦1606⟧ 非零，因此两个点均为单极点，并有 ⟦1607⟧</p>","<p>⟦346⟧ 的方向为逆时针，由留数定理，⟦1608⟧</p>"],"<p>⟦1609⟧。</p>"]],[10,"填空","直接读取负一次项","补充教材 Complex Analysis · §8.1 习题 1(f)","求 z⁻³ cos z 在原点的留数。",[["<p>设 ⟦1610⟧。⟦1611⟧ 在原点的泰勒展开收敛，且 ⟦1612⟧，所以 ⟦156⟧ 是 ⟦1195⟧ 的三阶极点。在去心邻域内，把 ⟦1611⟧ 的泰勒级数乘以 ⟦1613⟧ 即得 ⟦1195⟧ 的洛朗级数。</p>","<p>由于乘上 ⟦1613⟧ 后，只有原级数中的 ⟦339⟧ 项会成为 ⟦584⟧ 项，展开至二次项已足够。⟦1614⟧</p>","<p>孤立奇点处的留数等于洛朗展开中 ⟦584⟧ 的系数，故所求留数为 ⟦1615⟧。</p>"],"<p>⟦1616⟧。</p>"]],[11,"计算","四次分母的半轴积分","2021 年 8 月卷 · 六(2)","若 a>0，求 I=∫₀<sup>∞</sup> dx/(x⁴+a⁴)。",[["<p>记 ⟦1617⟧。因 ⟦1311⟧，实轴上无极点，且 ⟦1618⟧，故原反常积分收敛。由偶性有 ⟦1619⟧。</p>","<p>取 ⟦1620⟧，以线段 ⟦1621⟧ 和从 ⟦370⟧ 逆时针走到 ⟦1622⟧ 的上半圆弧 ⟦1623⟧ 组成正向闭合围道 ⟦1624⟧。上半平面内的根为 ⟦1625⟧、⟦1626⟧。分母在两点的导数 ⟦1627⟧ 均非零，故均为一阶极点。⟦1628⟧</p>","<p>由 ⟦1629⟧，留数定理给出 ⟦1630⟧</p>","<p>在 ⟦1623⟧ 上，⟦1631⟧。圆弧长为 ⟦1632⟧，所以 ⟦1633⟧ 令 ⟦1417⟧，得到全轴积分，再除以 ⟦102⟧ 得原半轴积分。</p>"],"<p>⟦1634⟧，其中 ⟦1311⟧。</p>"]],[11,"计算","两个二次因子的全轴积分","ch5.3 第 11 页 · 例 1","a,b>0 且 a≠b，求 ∫<sub>−∞</sub><sup>∞</sup> x²/[(x²+a²)(x²+b²)] dx。",[["<p>记 ⟦1635⟧。由 ⟦1636⟧，知实轴上无极点，且 ⟦1637⟧，故全轴积分收敛。取 ⟦1638⟧，以 ⟦1621⟧ 和上半圆弧 ⟦1623⟧ 组成正向围道。由于 ⟦1639⟧，围道内的 ⟦1640⟧ 与 ⟦1641⟧ 是两个不同的一阶极点。</p>","<p>用一阶极点留数公式，分别消去因子 ⟦1642⟧ 与 ⟦1643⟧。⟦1644⟧ 两者相加得 ⟦1645⟧。</p>","<p>当 ⟦1646⟧ 时，⟦1647⟧、⟦1648⟧，故 ⟦1649⟧</p>","<p>留数定理给出 ⟦1650⟧。令 ⟦1417⟧ 即得所求积分。</p>"],"<p>⟦1651⟧。</p>"]],[12,"计算","圆在反演下的像","本课教材 · 第一章习题 26（4） · 第 34 页","求圆 (x−1)²+y²=1（去掉原点）在 w=1/z 下的像。",[["<p>原圆方程可写为 ⟦1652⟧，也就是 ⟦1653⟧。在 ⟦162⟧ 时，⟦1565⟧ 有限且非零，可用反变换 ⟦1654⟧ 求像。</p>","<p>令 ⟦1655⟧，则 ⟦1656⟧ 代入原圆方程得 ⟦1657⟧。分母非零，故 ⟦1658⟧。</p>","<p>反过来，直线 ⟦1658⟧ 上任意点 ⟦1367⟧ 均非零。由 ⟦1654⟧ 可得非零有限点 ⟦9⟧，并且 ⟦1653⟧，所以每个这样的 ⟦1367⟧ 都有原像。</p>"],"<p>像为整条直线 ⟦1659⟧。</p>"]],[12,"填空","像 p>"]],[56,"计算","复指数法算正弦与余弦反常积分","本地复习提纲 · EX-513","利用留数计算广义积分：(1) ⟦797⟧； (2) ⟦798⟧。",["<ol>\n<li>被积函数为偶函数，⟦799⟧。<br />\n   构造辅助函数 <strong>⟦800⟧</strong>，在上半平面仅有 <strong>1 级极点 ⟦792⟧</strong>。求留数：\n   ⟦801⟧\n   故 ⟦802⟧。取实部并乘以 ⟦785⟧ 得：\n   ⟦803⟧</li>\n<li>被积函数 ⟦804⟧ 也是偶函数（奇函数 ⟦805⟧ 奇函数 ⟦806⟧ 偶函数。），故 ⟦807⟧。<br />\n   构造辅助函数 <strong>⟦808⟧</strong>，在上半平面仅有 <strong>1 级极点 ⟦809⟧</strong>。求留数：\n   ⟦810⟧\n   故 ⟦811⟧。<br />\n<strong>注意这里求的是 ⟦812⟧，取虚部 ⟦813⟧</strong>，再乘以 ⟦785⟧ 得：\n   ⟦814⟧</li>\n</ol>\n<p>第二问中 ⟦2178⟧。令 ⟦2179⟧，上半圆弧的积分模可估计为 ⟦2180⟧，由约当引理所用的估计趋于零。实轴上的半轴积分也可由狄利克雷判别法证明收敛。</p>","<p>⟦2181⟧，⟦2182⟧。</p>"]],[57,"计算","导数给出旋转角和伸缩率","本地复习提纲 · EX-601","求映射 ⟦816⟧ 在点 ⟦817⟧ 处的伸缩率与旋转角；并指出 ⟦816⟧ 在何处不具有保角性。",["<ol>\n<li>求导得 ⟦818⟧。在 ⟦819⟧ 处：\n   ⟦820⟧\n   故在 ⟦819⟧ 处的<strong>伸缩率为 ⟦821⟧</strong>，<strong>旋转角为 ⟦822⟧</strong>。  </li>\n<li>令 ⟦823⟧。故 ⟦824⟧ <strong>在原点 ⟦156⟧ 处不具有保角性</strong>（把原点处的夹角放大了 2 倍），在 ⟦162⟧ 处处处保角。</li>\n</ol>","<p>在 ⟦2081⟧ 处伸缩率为 ⟦2146⟧，主旋转角为 ⟦1816⟧。原点不保角。</p>"]],[58,"计算","有无穷远参与的三点对应","本地复习提纲 · EX-603","求把 ⟦826⟧ 依次映射为 ⟦827⟧ 的分式线性映射，并说明它把上半平面 ⟦96⟧ 映射成什么区域。",["<p>直接套三点对应公式（把含 ⟦828⟧ 和 ⟦829⟧ 的项换成 ⟦101⟧）：\n⟦830⟧\n取上半平面内测试点 ⟦831⟧，其像为 ⟦832⟧（虚部 ⟦833⟧），故把上半平面 ⟦777⟧ 仍映射为上半平面 ⟦834⟧。</p>\n<p>由 ⟦2183⟧ 直接判定映射方向。逆映射 ⟦2184⟧ 也有 ⟦2185⟧，故像是整个上半平面。</p>","<p>⟦2186⟧，上半平面的像仍是上半平面。</p>"]],[58,"计算","实轴与单位圆的像","本地复习提纲 · EX-604","在 ⟦2187⟧ 下，分别求有限实轴 ⟦836⟧ 及单位圆周 ⟦11⟧ 的有限像。说明这两条曲线在扩充复平面中的像补上哪些点。",[["<p>逆变换为 ⟦2188⟧。对有限实数 ⟦2089⟧，⟦2189⟧，故 ⟦839⟧。若 ⟦2190⟧，原式会要求 ⟦2191⟧，没有有限原像。</p>","<p>反之，若 ⟦839⟧ 且 ⟦2192⟧，则 ⟦2193⟧。对逆式取共轭可得 ⟦2194⟧，所以原像为有限实数。加入扩充实轴的 ⟦842⟧ 时，其像为 ⟦2190⟧，故像补成整条单位圆周。</p>","<p>对有限像的单位圆支，⟦11⟧ 等价于 ⟦2195⟧，即 ⟦845⟧。虚轴上每个有限 ⟦1367⟧ 都满足 ⟦2192⟧，可由逆式取到。单位圆上的 ⟦1752⟧ 对应扩充平面中的 ⟦842⟧。</p>"],"<p>（1）有限实轴映为单位圆去掉 ⟦2190⟧。（2）⟦11⟧ 去掉 ⟦1752⟧ 后映为整条虚轴。</p>"]],[59,"计算","指定半平面内点和导数","本地复习提纲 · EX-605","求把上半平面 ⟦96⟧ 映射为单位圆内部 ⟦847⟧ 的分式线性映射 ⟦848⟧，使满足 ⟦849⟧ 且 ⟦850⟧（或 ⟦851⟧）。",["<ol>\n<li>因为要把上半平面映为单位圆 ⟦852⟧ 且把内点 ⟦831⟧ 映为圆心 ⟦853⟧，直接默写<strong>模型一公式</strong>：\n   ⟦854⟧</li>\n<li>对 ⟦9⟧ 求导并代入 ⟦792⟧：\n   ⟦855⟧</li>\n<li>定旋转角 ⟦856⟧：</li>\n<li>若题目要求 <strong>⟦850⟧</strong>（即 ⟦857⟧）：则 ⟦858⟧，故 <strong>⟦859⟧</strong>。</li>\n<li>若题目要求 <strong>⟦851⟧</strong>：则 ⟦860⟧，故 <strong>⟦835⟧</strong>。</li>\n</ol>","<p>若 ⟦2196⟧，则 ⟦2197⟧。若 ⟦2198⟧，则 ⟦2187⟧。</p>"]],[59,"计算","从圆盘映回圆盘并定相位","本地复习提纲 · EX-606","求把单位圆内部 ⟦565⟧ 映射为单位圆内部 ⟦847⟧ 的分式线性映射 ⟦848⟧，使得 ⟦861⟧ 且 ⟦862⟧（即 ⟦863⟧）。",["<ol>\n<li>直接默写<strong>模型二公式</strong>（这里 ⟦864⟧）：\n   ⟦865⟧</li>\n<li>求导并代入 ⟦766⟧：\n   ⟦866⟧</li>\n<li>由 ⟦867⟧，故所求映射为：\n   ⟦868⟧</li>\n</ol>","<p>⟦2199⟧。</p>"]],[60,"计算","偏心圆环的公共反演对称点","本地复习提纲 · EX-607","求分式线性映射，把两圆周 ⟦870⟧ 与 ⟦871⟧ 围成的偏心圆环域 ⟦193⟧ 映射成中心在 ⟦853⟧、外半径为 ⟦101⟧ 的同心圆环域。",["<p>利用保对称性求两圆的公共对称点 ⟦872⟧：\n⟦873⟧\n两式相减得 ⟦874⟧，解得公共对称点为 <strong>⟦875⟧</strong>。<br />\n将 ⟦726⟧ 映为 ⟦853⟧，⟦876⟧ 映为 ⟦841⟧，则 ⟦877⟧。因外边界 ⟦871⟧（过点 ⟦878⟧）映为外圆 ⟦839⟧，代入 ⟦878⟧ 得 ⟦879⟧，故所求映射为 <strong>⟦880⟧</strong>（内圆半径为 ⟦881⟧，像区域为 ⟦882⟧）。</p>\n<p>外半径的条件确定 ⟦2200⟧，可以取 ⟦88⟧。其余辐角只使整个像圆环旋转。</p>","<p>可取 ⟦2201⟧，像域为 ⟦2202⟧。</p>"]],[61,"计算","双曲线域经平方后的像","本地复习提纲 · EX-602","求第一象限双曲线上方区域 ⟦884⟧ 在映射 ⟦816⟧ 下的像区域 ⟦885⟧。",["<p>设 ⟦886⟧，故虚部 ⟦887⟧。<br />\n区域 ⟦193⟧ 的边界 ⟦888⟧ 映射为直线 ⟦889⟧。<br />\n在 ⟦193⟧ 内任取内点 ⟦890⟧（⟦891⟧），其像 ⟦892⟧（⟦893⟧），由边界对应原理知像区域为上半平面 <strong>⟦894⟧</strong>。</p>\n<p>还可验证像域的每一点都取到：给定 ⟦2203⟧，取 ⟦1367⟧ 的第一象限平方根 ⟦9⟧。则 ⟦2204⟧，且 ⟦2205⟧，故 ⟦2206⟧。</p>","<p>像域为 ⟦2203⟧。</p>"]],[61,"计算","扇形先映半平面再映圆盘","本地复习提纲 · EX-608","求把角形区域 ⟦895⟧ 映射为单位圆内部 ⟦847⟧ 的双方单值保角映射（若要求把点 ⟦896⟧ 映为 ⟦853⟧ 呢？）。",["<p><strong>两步搭积木法（角形域 ⟦897⟧ 上半平面 ⟦898⟧ 单位圆）</strong>：<br />\n1. <strong>第1步（张角成半平面）</strong>：令 ⟦899⟧，把角域 ⟦900⟧ 放大 4 倍映射为上半平面 ⟦901⟧（⟦902⟧）。<br />\n2. <strong>第2步（上半平面映为单位圆）</strong>：用模型一公式 ⟦903⟧（此时对应 ⟦904⟧。），复合得：\n   ⟦905⟧</p>","<p>可取 ⟦2207⟧。它也满足 ⟦2208⟧。</p>"]],[61,"计算","水平带、竖直带的指数映射","本地复习提纲 · EX-609","求把水平带形区域 ⟦906⟧（或竖直带形区域 ⟦907⟧）映射为单位圆内部 ⟦847⟧ 的保角映射。",["<ol>\n<li>对水平带形 ⟦908⟧：</li>\n<li><strong>第1步</strong>：令 ⟦909⟧，把 ⟦908⟧ 映射为上半平面 ⟦901⟧。</li>\n<li><strong>第2步</strong>：再用 ⟦903⟧ 把上半平面映为单位圆，合并得 <strong>⟦910⟧</strong>。  </li>\n<li>若给的是<strong>竖直带形 ⟦907⟧</strong>：</li>\n<li>先乘以 ⟦911⟧（逆时针旋转 ⟦912⟧ 并伸缩 ⟦322⟧ 倍）：令 ⟦9 rong>。<br />\n1. 令 ⟦1100⟧，由除 ⟦682⟧ 积分性质：\n   ⟦1101⟧\n   令 ⟦1104⟧，可得 ⟦1102⟧。<br />\n2. 由【EX-803】(3) 知 ⟦1103⟧，令 ⟦1104⟧ 可得 ⟦1105⟧。</p>\n<p>第一问须验证可令 ⟦2297⟧。对所有 ⟦2298⟧，⟦2299⟧ 单调趋于零，分部积分给出尾部 ⟦2300⟧ 的模不超过 ⟦2301⟧。在有限区间取极限再令 ⟦1417⟧，故所得极限确为原积分。</p>","<p>⟦2302⟧，⟦2303⟧。</p>"]],[71,"计算","配方、裂项和对数逆变换","本地复习提纲 · EX-808","求下列函数的拉普拉斯逆变换：(1) ⟦1106⟧； (2) ⟦1107⟧； (3) ⟦1108⟧。",["<ol>\n<li><strong>配方凑分子法</strong>：分母配方 ⟦1109⟧（对应 ⟦1110⟧）。把分子 ⟦1111⟧ 整理成 ⟦1112⟧：\n   ⟦1113⟧\n   直接查表得：\n   ⟦1114⟧</li>\n<li><strong>部分分式 + 配方</strong>：设 ⟦1115⟧。<br />\n   遮住 ⟦1086⟧ 代 ⟦1116⟧ 得 ⟦1117⟧。通分对比系数 ⟦1118⟧，⟦1119⟧。故：\n   ⟦1120⟧\n   查表得：\n   ⟦1121⟧</li>\n<li><strong>性质反演法求 ⟦1122⟧</strong>：<br />\n   先对 ⟦1123⟧ 求导：\n   ⟦1124⟧\n   由 ⟦1125⟧，可得：\n   ⟦1126⟧</li>\n</ol>\n<p>第三问在 ⟦945⟧ 的右极限为 ⟦101⟧。其像函数在 ⟦1051⟧ 的解析支由实轴上 ⟦2304⟧（⟦2305⟧）确定。</p>","<p>⟦2306⟧ ⟦2307⟧。</p>"]],[72,"计算","两个正弦核卷积反演","本地复习提纲 · EX-807","设 ⟦1006⟧ 为实数，用卷积定理求 ⟦2308⟧ 的单边拉普拉斯逆变换。",["<p>将 ⟦1129⟧ 拆成两个已知象函数的乘积：\n⟦1130⟧\n因为 ⟦1131⟧，由卷积定理及积化和差公式 ⟦1132⟧：\n⟦1133⟧</p>\n<p>上式适用于 ⟦1849⟧。当 ⟦1845⟧，⟦2309⟧，由 ⟦2310⟧，逆变换为 ⟦2311⟧。</p>","<p>⟦2312⟧（⟦1849⟧）。⟦1845⟧ 时 ⟦2313⟧。</p>"]],[72,"计算","卷积积分方程与延迟冲激","本地复习提纲 · EX-812","用拉普拉斯变换求解：(1) 积分方程 ⟦1136⟧；<br />\n  (2) 含冲激激励的微分方程 ⟦1137⟧。",["<ol>\n<li>方程中的积分项 ⟦1138⟧ 恰为<strong>拉普拉斯卷积</strong>。<br />\n   设 ⟦1139⟧，两边取拉氏变换并应用卷积定理：\n   ⟦1140⟧\n   两边约去分母 ⟦1141⟧，解得：\n   ⟦1142⟧</li>\n<li>对含延时冲激 ⟦1143⟧ 的方程取拉氏变换（注意 ⟦1144⟧）：\n   ⟦1145⟧\n   因为 ⟦1146⟧，由<strong>第二位移性质</strong>（乘 ⟦1147⟧ 对应把 ⟦682⟧ 换成 ⟦1003⟧ 并乘上 ⟦1148⟧）得：\n   ⟦1149⟧</li>\n</ol>\n<p>第二问在 ⟦947⟧ 处解连续，⟦2314⟧。这给出二阶导数中的单位冲激。在其余各点，方程的右端为零。</p>","<p>（1）⟦2315⟧。（2）⟦2316⟧，其中 ⟦474⟧ 表示单位阶跃函数。</p>"]],[73,"计算","三阶初值方程的等价形式","本地复习提纲 · EX-810 · 原题的等价微分方程","用拉普拉斯变换求解三阶常系数线性微分方程初值问题：\n  ⟦1151⟧",[["<p>设 ⟦2317⟧。由三条初值，⟦2318⟧，所以 ⟦2319⟧，即 ⟦1388⟧。</p>","<p>按三次分母分解并配方，令 ⟦2320⟧，得 ⟦2321⟧</p>","<p>在共同收敛半平面 ⟦1294⟧ 逐项反演。所得函数的一阶导数在 ⟦128⟧ 处为 ⟦2322⟧。二阶导数在 ⟦128⟧ 处为 ⟦2323⟧，且 ⟦2324⟧。三项的指数参数都是 ⟦2325⟧ 的根，故 ⟦1394⟧。</p>"],"<p>⟦2326⟧。</p>"]],[73,"计算","含非齐次激励的二阶初值问题","本地复习提纲 · EX-811","用拉普拉斯变换求解微分方程初值问题：\n  ⟦1174⟧",["<ol>\n<li>设 ⟦1139⟧。右端 ⟦1175⟧。<br />\n   对左端取拉氏变换并代入 ⟦1176⟧：\n   ⟦1177⟧</li>\n<li>注意到 ⟦1178⟧，两边同除以 ⟦1179⟧：\n   ⟦1180⟧\n   <strong>神级裂项技巧</strong>：把 ⟦1181⟧ 看作一个整体 ⟦474⟧，则 ⟦1182⟧。无需设待定系数，1 秒裂项：\n   ⟦1183⟧</li>\n<li>取拉氏逆变换可得：\n   ⟦1184⟧</li>\n</ol>","<p>⟦2327⟧。</p>"]],[27,"证明","定距离比的圆与对称点","原卷核对 · 2007 年 0701 复变 A 卷 · 六 · PDF 第 2 页","设 ⟦1198⟧，⟦1199⟧ 且 ⟦1200⟧。证明 ⟦1201⟧ 表示一圆，且 ⟦1202⟧ 关于该圆反演对称。",[["<p>令 ⟦2328⟧，则 ⟦2329⟧ 且 ⟦2330⟧。等式两边非负，可以等价地平方。用 ⟦2331⟧ 展开得 ⟦2332⟧</p>","<p>除以 ⟦2333⟧，记 ⟦2334⟧。将一次项配入 ⟦2335⟧，得 ⟦2336⟧ 右端为正，因此轨迹为圆，半径 ⟦2337⟧。</p>","<p>由圆心公式，⟦2338⟧，而 ⟦2339⟧。因 ⟦2329⟧，两点都在从 ⟦1535⟧ 出发的同一条射线上，且 ⟦2340⟧ 这正满足圆反演对称的条件。</p>"],"<p>所求圆的圆心为 ⟦2341⟧，半径为 ⟦2342⟧，且 ⟦1202⟧ 关于此圆反演对称。</p>"]],[28,"证明","平方和条件推出等边三角形","原卷核对 · 2007 年 0701 复变 B 卷 · 六 · PDF 第 2 页","三点互异且 ⟦1207⟧。证明它们构成等边三角形。",[["<p>令 ⟦1209⟧、⟦1210⟧。移项并展开可验证 ⟦2343⟧</p>","<p>因三点互异，⟦1430⟧。除以 ⟦2344⟧ 并令 ⟦1212⟧，得 ⟦1213⟧，所以 ⟦2345⟧</p>","<p>三条边的长度依次为 ⟦2346⟧ 它们相等且均为正数。</p>"],"<p>⟦2347⟧，三点构成等边三角形。</p>"]],[29,"判断","含 cos(1/z) 的极限是否为零","原卷核对 · 仲英真题集 · 2021 年 8 月重修卷 · 二（4） · PDF 第 56 页","判断 ⟦1216⟧ 时 ⟦1217⟧ 是否成立。",[["<p>若复极限存在，则沿任意路径趋向 ⟦128⟧ 均应得到同一极限。沿实轴取 ⟦2348⟧，由 ⟦1218⟧ 知该路径下趋于 ⟦128⟧。</p>","<p>沿正虚轴取 ⟦1219⟧，其中 ⟦1220⟧。由 ⟦2349⟧ 及 ⟦2350⟧，原式变为 ⟦2351⟧。</p>","<p>用 ⟦2352⟧ 和 ⟦2353⟧（⟦1967⟧），有 ⟦2354⟧ 因此沿正虚轴的值趋于 ⟦2355⟧。</p>"],"<p>命题错误。沿实轴趋于 ⟦128⟧，沿正虚轴发散，故原复极限不存在。</p>"]],[30,"判断","沿一条曲线上处处可导能否推出解析","原卷核对 · 2015 年 11 月 14 日复变 A 卷 · 三（1）","若函数在一条曲线的每一点均复可导，能否推出它在该曲线的每一点解析？",[["<p>取 ⟦2356⟧，考察实轴。设 ⟦2357⟧，对任意复增量 ⟦2358⟧，有 ⟦2359⟧ 令 ⟦2360⟧，可知 ⟦2361⟧，且与趋近方向无关。</p>","<p>写成 ⟦2362⟧，其中 ⟦2363⟧、⟦2364⟧。复可导的必要条件是 ⟦478⟧。当 ⟦1226⟧ 时，⟦2365⟧，所以这些点均不可导。</p>","<p>实轴上任一点的任何开邻域都含有 ⟦1226⟧ 的点，所以该邻域内不可能处处可导。</p>"],"<p>不能推出解析。⟦2356⟧ 在实轴处处复可导，但在实轴各点均不解析。</p>"]],[40,"证明","从单位圆积分读出 f(0) 与 f′(0)","原卷核对 · 仲英真题集 · 2021 年复积 A 卷 · 四 · PDF 第 73 页","设 ⟦1195⟧ 在闭单位圆盘邻域解析，⟦1229⟧、⟦1230⟧。证明 ⟦1231⟧。",[["<p>令 ⟦1232⟧。当 ⟦856⟧ 从 ⟦128⟧ 增至 ⟦49⟧，⟦9⟧ 沿单位圆 ⟦346⟧ 逆时针绕一周。由 ⟦2366⟧ 和 ⟦2367⟧，得 ⟦2368⟧</p>","<p>⟦1195⟧ 在闭单位圆盘的邻域解析，且原点严格位于 ⟦346⟧ 内部。由柯西积分公式、柯西积分定理和柯西导数公式，分别有 ⟦2369⟧</p>","<p>代入三项积分，得 ⟦2370⟧ 再代入 ⟦1229⟧、⟦1230⟧。</p>"],"<p>⟦2371⟧。</p>"]],[40,"证明","边界上的值能否决定内部函数","原卷核对 · 仲英真题集 · 2019 年复积 A 卷 · 四 · PDF 第 69 页","设两个函数在简单闭曲线及其内部的邻域解析，且在曲线上处处相等。证明它们在内部相等。",[["<p>设简单闭曲线 ⟦346⟧ 的内部为 ⟦193⟧，令 ⟦1235⟧。由题设，⟦1224⟧ 在 ⟦193⟧ 内解析，在 ⟦2372⟧ 上连续，并且对每个 ⟦2373⟧ 均有 ⟦2374⟧。</p>","<p>若 ⟦1224⟧ 是常函数，由其边界值为零知 ⟦2375⟧。若 ⟦1224⟧ 不是常函数，由最大模原理，⟦2376⟧ 在紧集 ⟦2377⟧ 上的最大值只能在边界取得。因此对任意 ⟦2378⟧，有 ⟦2379⟧。</p>","<p>若 ⟦346⟧ 分段光滑，也可令它取正向并应用柯西积分公式。对任意 ⟦2378⟧，因 ⟦1224⟧ 在 ⟦346⟧ 上为零而 ⟦1522⟧ 在 ⟦346⟧ 上非零，得 ⟦2380⟧</p>"],"<p>对任意 ⟦2378⟧ 都有 ⟦2381⟧，所以两函数在 ⟦346⟧ 的内部相等。</p>"]],[41,"填空","正向围线上的虚部积分","原卷核对 · 仲英真题集 · 2021 年复积 A 卷 · 二（5） · PDF 第 71 页","设 ⟦346⟧ 是面积为 ⟦1157⟧ 的区域的正向光滑边界，求 ⟦1238⟧。",[["<p>令 ⟦2031⟧，则 ⟦2382⟧、⟦2383⟧。积分拆成 ⟦2384⟧</p>","<p>因 ⟦2385⟧ 是全微分，沿闭曲线一周起点和终点相同，所以 ⟦2386⟧。</p>","<p>设 ⟦193⟧ 为积分区域。⟦346⟧ 取题设的正向，取 ⟦2387⟧、⟦2388⟧，由格林公式得 ⟦2389⟧</p>"],"<p>⟦2390⟧。</p>"]],[47,"计算","题设圆环跨过奇点时先拆区间","原卷核对 · 仲英真题集 · 2021 年 8 月重修卷 · 五 · PDF 第 56 页","考察 ⟦1242⟧ 能否在 ⟦1243⟧ 用一组洛朗级数表示。如不能，分别写出各子圆环展开。",[["<p>令 ⟦1244⟧，则 ⟦2391⟧，所以 ⟦2392⟧。极点 ⟦2393⟧ 落在题设的 ⟦2394⟧ 中。洛朗级数在其收敛圆环内解析，因此必须在 ⟦1246⟧ 的两侧分别展开。</p>","<p>对 ⟦2395⟧，将几何级数逐项求导可得 ⟦2396⟧ 每次套用时均需满足 ⟦2395⟧。</p>","<p>当 ⟦1247⟧ 时，取 ⟦2397⟧，得 ⟦2398⟧</p>","<p>当 ⟦1250⟧ 时，取 ⟦2399⟧。将 ⟦2400⟧ 改写为 ⟦2401⟧，得 ⟦2402⟧</p>"],"<p>整个区域不能用同一组洛朗级数表示。令 ⟦1244⟧，⟦1247⟧ 时的展开为 ⟦2403⟧，⟦1250⟧ 时为 ⟦2404⟧。</p>"]],[49,"计算","无穷多个有限极点时判断无穷远","原卷核对 · 仲英真题集 · 2021 年 8 月重修卷 · 七 · PDF 第 57 页","求 ⟦1254⟧ 的各有限奇点类型，并判断无穷远点是否是孤立奇点。",[["<p>⟦655⟧ 的零点恰为整数。任取整数 ⟦131⟧，有 ⟦2405⟧，故 ⟦2406⟧ 在 ⟦131⟧ 为三阶零点。有限平面上其余各点解析。</p>","<p>若 ⟦131⟧ 为奇数，分子在 ⟦131⟧ 的值为 ⟦2407⟧，所以 ⟦131⟧ 是三阶极点。若 ⟦131⟧ 为非零偶数，则令 ⟦2408⟧，有 ⟦2409⟧ 因 ⟦2410⟧ 在 ⟦853⟧ 非零，分子恰有二阶零点，故 ⟦131⟧ 是一阶极点。</p>","<p>在原点，分子首个非零项为 ⟦2411⟧，分母首项为 ⟦2412⟧，故 ⟦2413⟧。原点可去，补定义 ⟦444⟧ 即可解析延拓。</p>","<p>对任意 ⟦1693⟧，总有整数极点满足 ⟦2414⟧。因此没有一个外域 ⟦2415⟧ 上 ⟦1195⟧ 处处解析。等价地，⟦2416⟧ 的极点在 ⟦853⟧ 聚集。</p>"],"<p>⟦156⟧ 为可去奇点，非零偶数为一阶极点，奇数为三阶极点，⟦842⟧ 为非孤立奇点。</p>"]],[51,"填空","只找外环中的 z⁻¹ 系数","原卷核对 · 武汉大学 2019–2020 第二学期 A 卷 · 一（4）","求 ⟦1256⟧ 在无穷远的留数。",[["<p>设 ⟦2417⟧。⟦1195⟧ 在充分大的 ⟦53⟧ 上解析。若 ⟦2418⟧ 是外域洛朗展开中 ⟦584⟧ 的系数，则 ⟦2419⟧。这个负号也可由 ⟦2420⟧ 得到。</p>","<p>将 function fitCanvas(el){
 const r=el.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);
 if(!r.width||!r.height)return null;
 el.width=Math.round(r.width*d);el.height=Math.round(r.height*d);
 const ctx=el.getContext('2d');if(!ctx)return null;
 ctx.scale(d,d);return [ctx,r.width,r.height];
}
function strokePts(ctx,pts,color,width=1){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function drawSurfaceOnly(){
 const el=document.querySelector('#surface');if(!el)return;
 const f=fitCanvas(el);if(!f)return;

 const proj=(r,t)=>[w*.49+s*r*Math.cos(t+angle),h*.43-s*(t-2*Math.PI)*.165+s*.31*r*Math.sin(t+angle)];
 strokePts(c,[[w*.08,h*.59],[w*.9,h*.49]],'#80a3b257');strokePts(c,[[w*.3,h*.77],[w*.69,h*.34]],'#80a3b257');strokePts(c,[[w*.49,h*.82],[w*.49,h*.06]],'#80a3b257');
 const segments=w<500?64:108, rings=w<500?8:14;
 for(let k=0;k<segments;k++){
  const t=k*4*Math.PI/segments,n=(k+1)*4*Math.PI/segments,hue=162+58*k/segments;
  const coords=[proj(.1,t),proj(1.25,t),proj(1.25,n),proj(.1,n)];
  c.beginPath();coords.forEach(([x,y],j)=>j?c.lineTo(x,y):c.moveTo(x,y));c.closePath();
  c.fillStyle='hsla('+hue+',48%,48%,.29)';c.fill();
  strokePts(c,[proj(.1,t),proj(1.25,t)],'hsla('+hue+',68%,77%,.7)',.75);
  for(let j=0;j<=rings;j++){const r=.1+j*1.15/rings;strokePts(c,[proj(r,t),proj(r,n)],'hsla('+hue+',75%,78%,.74)',j===rings?1.6:.75)}
 }
 c.font='italic 14px Georgia';c.fillStyle='#c4e2e0';c.fillText('θ',w*.49+5,h*.09);c.fillText('x',w*.9,h*.49);c.fillText('y',w*.28,h*.78);
}
