</style></head><body><header><div class="wrap"><button class="brand" data-cmd="home"><span aria-hidden="true">∿</span>复变研习室</button><nav class="nav" aria-label="主导航"><button data-cmd="home">学习总览</button><button data-cmd="formulas">公式索引</button><button data-cmd="practice">分类练习</button><button data-cmd="coverage">题型总表</button></nav><button class="right starTop" data-cmd="saved">☆ 复习清单<span class="star-count hide">0</span></button></div></header><main><noscript><h1>复变函数与积分变换</h1><p>本页面支持无脚本静默查阅模式；启用 JavaScript 可使用交互绘图、分类筛选、练习草稿与复习清单。</p><nav aria-label="题型目录"><a href="#type-0">模与辐角</a> · <a href="#type-1">共轭根证明</a> · <a href="#type-2">可导点与解析域</a> · <a href="#type-3">指数、对数与复方程</a> · <a href="#type-4">参数化积分</a> · <a href="#type-5">柯西积分公式与高阶导数</a> · <a href="#type-6">由虚部恢复解析函数</a> · <a href="#type-7">幂级数与收敛边界</a> · <a href="#type-8">指定圆环上的洛朗展开</a> · <a href="#type-9">孤立奇点与阶数</a> · <a href="#type-10">留数与围线积分</a> · <a href="#type-11">用留数求实积分</a> · <a href="#type-12">分式映射下曲线的像</a> · <a href="#type-13">构造归一化的共形映射</a> · <a href="#type-14">分段函数的频谱与傅里叶积分</a> · <a href="#type-15">逆变换、时移与尺度变换</a> · <a href="#type-16">冲激函数与离散谱线</a> · <a href="#type-17">傅里叶卷积与能量积分</a> · <a href="#type-18">单边正变换、平移与收敛域</a> · <a href="#type-19">有理式的拉普拉斯逆变换</a> · <a href="#type-20">卷积方程与微分方程初值问题</a> · <a href="#type-21">利用变换性质求反常积分</a></nav><h2>第一章 · 复数与复变函数</h2><div class="box" id="type-22"><b>复数四则运算与有理化</b><p>复数的加减对应平面向量合成，而除法通过分子分母同乘分母的共轭复数 ̄b，将复分母转化为非负实数 |b|^2，从而顺利分离出实部与虚部。在化简含有 |z|=1 的表达式时，直接利用关系 zz̄=|z|^2=1 将共轭替换为 1/z，往往比设 z=x+iy 展开更加简捷。</p></div><section class="box" id="type-1"><small>第一章 · 基础与进阶</small><h2>共轭根证明</h2><p>共轭运算 z=x+iy ↦ z̄=x-iy 几何上是关于实轴的反射，代数上与加法、乘法和除法完全交换，即实轴是共轭映射的不动点集。因此实系数多项式满足 p(z̄)=(p(z))̄，这直接保证了高次实系数代数方程的非实复根必定以共轭对的形式成对出现。</p><details><summary>多项式与共轭</summary><div>p(z̄) = <span style='text-decoration:overline'>p(z)</span></div><p>适用条件：p 的系数为实数时成立。共轭运算与加法、乘法交换。</p></details><details><summary>解题思路</summary><ol><li>展开根条件：设 p(z)=∑_{j=0}^n a_j z^j（a_j∈R），由已知 p(z_0)=0 写出求和等式。</li><li>整体取共轭：等式两端同时取共轭，逐项利用和积的共轭性质与实系数条件 (a_j)̄=a_j，化为 p(z̄_0)=0。</li><li>说明互异性：若题目要求证明共轭根为“另一个”根，需指出因 Imz_0≠ 0，故 Imz̄_0=-Imz_0≠Imz_0，两根相异。</li></ol></details><h3>非实根为什么成对出现</h3><p>设多项式 p 的系数全为实数。如果 z₀ 是 p 的一个非实根，证明 z̄₀ 也是 p 的根。</p><p class="source">本课教材 · 第一章习题 12（3） · 第 32 页</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∑</mo><mrow><mi>j</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>n</mi></mrow></msubsup><msub><mi>a</mi><mi>j</mi></msub><msup><mi>z</mi><mi>j</mi></msup></mrow></math>，其中 <math><mrow><msub><mi>a</mi><mi>j</mi></msub><mo>∈</mo><mi>ℝ</mi></mrow></math>。已知 <math><mrow><msub><mi>z</mi><mn>0</mn></msub></mrow></math> 是 <math><mrow><mi>p</mi></mrow></math> 的根，因此 <math display="block"><mrow><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>=</mo><munderover><mo>∑</mo><mrow><mi>j</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>n</mi></mrow></munderover><msub><mi>a</mi><mi>j</mi></msub><msubsup><mi>z</mi><mn>0</mn><mi>j</mi></msubsup><mo>=</mo><mn>0</mn><mo>.</mo></mrow></math></p></li><li><p>对等式两端取共轭。共轭运算可逐项作用于和与积，又因为 <math><mrow><msub><mi>a</mi><mi>j</mi></msub></mrow></math> 为实数，故 <math><mrow><mrow class="ov"><msub><mi>a</mi><mi>j</mi></msub></mrow><mo>=</mo><msub><mi>a</mi><mi>j</mi></msub></mrow></math>。于是 <math display="block"><mrow><mn>0</mn><mo>=</mo><mrow class="ov"><mi>p</mi><mo stretchy="false">(</mo><msub><mi>z</mi><mn>0</mn></msub><mo stretchy="false">)</mo></mrow><mo>=</mo><mrow class="ov"><msubsup><mo>∑</mo><mrow><mi>j</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>n</mi></mrow></msubsup><msub><mi>a</mi><mi>j</mi></msub><msubsup><mi>z</mi><mn>0</mn><mi>j</mi></msubsup></mrow><mo>=</mo><munderover><mo>∑</mo><mrow><mi>j</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>n</mi></mrow></munderover><mrow class="ov"><msub><mi>a</mi><mi>j</mi></msub></mrow><mspace width="0.167em" /><mo stretchy="false">(</mo><mrow class="ov"><msub><mi>z</mi><mn>0</mn></msub></mrow><msup><mo stretchy="false">)</mo><mi>j</mi></msup><mo>=</mo><munderover><mo>∑</mo><mrow><mi>j</mi><mo>=</mo><mn>0</mn></mrow><mrow><mi>n</mi></mrow></munderover><msub><mi>a</mi><mi>j</mi></msub><mo stretchy="false">(</mo><mrow class="ov"><msub><mi>z</mi><mn>0</mn></msub></mrow><msup><mo stretchy="false">)</mo><mi>j</mi></msup><mo>=</mo><mi>p</mi><mo stretchy="false">(</mo><mrow class="ov"><msub><mi>z</mi><mn>0</mn></msub></mrow><mo stretchy="false">)</mo><mo>.</mo></mrow></math></p></li><li><p>由 <math><mrow><mi>p</mi><mo stretchy="false">(</mo><mrow class="ov"><msub><mi>z</mi><mn>0</mn></msub></mrow><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math>，可知 <math><mrow><mrow class="ov"><msub><mi>z</mi><mn>0</mn></msub></mrow></mrow></math> 也是根。又因 <math><mrow><msub><mi>z</mi><mn>0</mn></msub></mrow></math> 的虚部非零，<math><mrow><msub><mi>z</mi><mn>0</mn></msub></mrow></math> 与 <math><mrow><mrow class="ov"><msub><mi>z</mi><mn>0</mn></msub></mrow></mrow></math> 的虚部互为相反数，所以二者是不同的根。</p></li></ol><strong>结论</strong><p>若 <math><mrow><msub><mi>z</mi><mn>0</mn></msub></mrow></math> 是实系数多项式 <math><mrow><mi>p</mi></mrow></math> 的非实根，则 <math><mrow><mrow class="ov"><msub><mi>z</mi><mn>0</mn></msub></mrow></mrow></math> 是另一个根。</p></details></section><div class="box" id="type-23"><b>距离不等式与模的极值</b><p>|z-a| 的几何意义是复平面上点 z 到定点 a 的距离。求分式 |1/P(z)| 的最大值等价于求分母 |P(z)| 的最小值。通过将高次多项式分解为一次或二次因式，利用反三角不等式对每个因式的模逐一下界估计，即可快速锁定最值并确定等号成立的几何位置。</p></div><div class="box" id="type-24"><b>幅角主值与三种表示互化</b><p>由于反正切函数 arctan(y/x) 的值域仅为 (-π/2,π/2)，直接套用它会把二、三象限的复数错误地折回一、四象限。主辐角 arg z∈(-π,π] 必须依据实部和虚部的正负号做 ±π 的象限修正；而三角表示必须严格满足 r&gt;0 且实部为 cosθ、虚部为 +isinθ。</p></div><section class="box" id="type-0"><small>第一章 · 高频重点</small><h2>模与辐角</h2><p>非零复数 z = x+iy 既可表示为平面向量，也可由模 r=|z| 与辐角 θ=Arg z 唯一确定方向与长度。指数形式 z=re^{iθ} 将复数乘法和乘幂转化为模的乘方与辐角的线性加法，是处理高次幂、开 n 次方及最值构造的核心工具。</p><details><summary>指数形式</summary><div>z = r e<sup>iθ</sup>，r = √(x²+y²)</div><p>适用条件：z ≠ 0 时才有辐角。主辐角取 (−π, π]，先按 x、y 的符号判定象限。</p></details><details><summary>幂与开方</summary><div>zⁿ = rⁿ e<sup>inθ</sup></div><p>适用条件：n 为正整数。开 n 次方前将 θ 写成 θ+2kπ，再除以 n。</p></details><details><summary>三角不等式</summary><div>|a+b| ≤ |a|+|b|</div><p>适用条件：两项均非零时，等号成立当且仅当它们同向。</p></details><details><summary>解题思路</summary><ol><li>定模判象限：由实部、虚部符号确定点 (x,y) 所在象限并算出主辐角 θ=arg z∈(-π,π]，写出标准指数式 z=re^{iθ}。</li><li>乘幂与开方分流：整数次幂直接乘辐角得 r^n e^{inθ}；求全部 n 次方根时务必在辐角上补齐 +2kπ 再除以 n，并取 k=0,1,…,n-1。</li><li>极值双向闭环：利用 |z^n+a|≤ |z|^n+|a| 给出上界后，需显式构造同向的边界点 z 代入验证等号确实能够取到。</li></ol></details><h3>单位圆盘中的最大值</h3><p>设 |z|≤1，n 为正整数，a 为固定复数。求 |zⁿ+a| 的最大值。</p><p class="source">本课教材 · 第一章习题 6 · 第 31 页</p><details><summary>查看完整解答</summary><ol><li><p>任取满足 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>≤</mo><mn>1</mn></mrow></math> 的复数 <math><mrow><mi>z</mi></mrow></math>。因为 <math><mrow><mi>n</mi></mrow></math> 为正整数，由复数的三角不等式得 <math display="block"><mrow><mo stretchy="false">|</mo><msup><mi>z</mi><mi>n</mi></msup><mo>+</mo><mi>a</mi><mo stretchy="false">|</mo><mo>≤</mo><mo stretchy="false">|</mo><msup><mi>z</mi><mi>n</mi></msup><mo stretchy="false">|</mo><mo>+</mo><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>=</mo><mo stretchy="false">|</mo><mi>z</mi><msup><mo stretchy="false">|</mo><mi>n</mi></msup><mo>+</mo><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>≤</mo><mn>1</mn><mo>+</mo><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>.</mo></mrow></math></p></li><li><p>若 <math><mrow><mi>a</mi><mo>≠</mo><mn>0</mn></mrow></math>，写 <math><mrow><mi>a</mi><mo>=</mo><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup></mrow></math>，取 <math><mrow><mi>z</mi><mo>=</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi><mo>/</mo><mi>n</mi></mrow></msup></mrow></math>。此时 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>=</mo><mn>1</mn></mrow></math> 且 <math><mrow><msup><mi>z</mi><mi>n</mi></msup><mo>=</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup></mrow></math>，所以 <math display="block"><mrow><mo stretchy="false">|</mo><msup><mi>z</mi><mi>n</mi></msup><mo>+</mo><mi>a</mi><mo stretchy="false">|</mo><mo>=</mo><mrow><mo stretchy="true" fence="true" form="prefix">|</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mo>=</mo><mn>1</mn><mo>+</mo><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>.</mo></mrow></math></p></li><li><p>若 <math><mrow><mi>a</mi><mo>=</mo><mn>0</mn></mrow></math>，则 <math><mrow><mo stretchy="false">|</mo><msup><mi>z</mi><mi>n</mi></msup><mo>+</mo><mi>a</mi><mo stretchy="false">|</mo><mo>=</mo><mo stretchy="false">|</mo><mi>z</mi><msup><mo stretchy="false">|</mo><mi>n</mi></msup></mrow></math>，任取 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>=</mo><mn>1</mn></mrow></math> 即得到 <math><mrow><mn>1</mn></mrow></math>，同样达到前面所得上界。</p></li></ol><strong>结论</strong><p>最大值为 <math><mrow><mn>1</mn><mo>+</mo><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo></mrow></math>。当 <math><mrow><mi>a</mi><mo>≠</mo><mn>0</mn></mrow></math> 时在满足 <math><mrow><msup><mi>z</mi><mi>n</mi></msup><mo>=</mo><mi>a</mi><mo>/</mo><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo></mrow></math> 的点取得，当 <math><mrow><mi>a</mi><mo>=</mo><mn>0</mn></mrow></math> 时在整个单位圆周上取得。</p></details><h3>写出全部四次根</h3><p>求 z⁴=−4 的全部解，并给出每个解的主辐角。</p><p class="source">按 2021 年 8 月卷一(1) 的指数式设问改编</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mi>z</mi><mo>=</mo><mi>r</mi><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup></mrow></math>，其中 <math><mrow><mi>r</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。由于 <math><mrow><msup><mi>z</mi><mn>4</mn></msup><mo>=</mo><msup><mi>r</mi><mn>4</mn></msup><msup><mi>e</mi><mrow><mn>4</mn><mi>i</mi><mi>θ</mi></mrow></msup></mrow></math>，比较 <math><mrow><msup><mi>z</mi><mn>4</mn></msup></mrow></math> 与 <math><mrow><mo>−</mo><mn>4</mn></mrow></math> 的模和辐角，得 <math display="block"><mrow><msup><mi>r</mi><mn>4</mn></msup><mo>=</mo><mn>4</mn><mo>,</mo><mspace width="2em" /><mn>4</mn><mi>θ</mi><mo>=</mo><mi>π</mi><mo>+</mo><mn>2</mn><mi>k</mi><mi>π</mi><mo>,</mo><mspace width="2em" /><mi>k</mi><mo>∈</mo><mi>ℤ</mi><mo>.</mo></mrow></math> 所以 <math><mrow><mi>r</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></mrow></math>，<math><mrow><mi>θ</mi><mo>=</mo><mi>π</mi><mo>/</mo><mn>4</mn><mo>+</mo><mi>k</mi><mi>π</mi><mo>/</mo><mn>2</mn></mrow></math>。</p></li><li><p>当 <math><mrow><mi>k</mi></mrow></math> 增加 <math><mrow><mn>4</mn></mrow></math> 时，<math><mrow><mi>θ</mi></mrow></math> 增加一整周，所得根不变。因此只取 <math><mrow><mi>k</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn></mrow></math>，得到四个不同的根 <math display="block"><mrow><msqrt><mn>2</mn></msqrt><msup><mi>e</mi><mrow><mi>i</mi><mi>π</mi><mo>/</mo><mn>4</mn></mrow></msup><mo>=</mo><mn>1</mn><mo>+</mo><mi>i</mi><mo>,</mo><mspace width="2em" /><msqrt><mn>2</mn></msqrt><msup><mi>e</mi><mrow><mn>3</mn><mi>i</mi><mi>π</mi><mo>/</mo><mn>4</mn></mrow></msup><mo>=</mo><mo>−</mo><mn>1</mn><mo>+</mo><mi>i</mi><mo>,</mo></mrow></math> <math display="block"><mrow><msqrt><mn>2</mn></msqrt><msup><mi>e</mi><mrow><mn>5</mn><mi>i</mi><mi>π</mi><mo>/</mo><mn>4</mn></mrow></msup><mo>=</mo><mo>−</mo><mn>1</mn><mo>−</mo><mi>i</mi><mo>,</mo><mspace width="2em" /><msqrt><mn>2</mn></msqrt><msup><mi>e</mi><mrow><mn>7</mn><mi>i</mi><mi>π</mi><mo>/</mo><mn>4</mn></mrow></msup><mo>=</mo><mn>1</mn><mo>−</mo><mi>i</mi><mo>.</mo></mrow></math></p></li><li><p>将最后两个角各减去 <math><mrow><mn>2</mn><mi>π</mi></mrow></math>，使它们落入主辐角区间 <math><mrow><mo stretchy="false">(</mo><mo>−</mo><mi>π</mi><mo>,</mo><mi>π</mi><mo stretchy="false">]</mo></mrow></math>。前两个角已经在该区间内。</p></li></ol><strong>结论</strong><p><math><mrow><mn>1</mn><mo>+</mo><mi>i</mi><mo>,</mo><mo>−</mo><mn>1</mn><mo>+</mo><mi>i</mi><mo>,</mo><mo>−</mo><mn>1</mn><mo>−</mo><mi>i</mi><mo>,</mo><mn>1</mn><mo>−</mo><mi>i</mi></mrow></math> 的主辐角依次为 <math><mrow><mi>π</mi><mo>/</mo><mn>4</mn><mo>,</mo><mtext> </mtext><mn>3</mn><mi>π</mi><mo>/</mo><mn>4</mn><mo>,</mo><mtext> </mtext><mo>−</mo><mn>3</mn><mi>π</mi><mo>/</mo><mn>4</mn><mo>,</mo><mtext> </mtext><mo>−</mo><mi>π</mi><mo>/</mo><mn>4</mn></mrow></math>。</p></details></section><div class="box" id="type-25"><b>复数整数幂与全部 n 次根</b><p>高次幂展开用二项式定理极易出错且繁琐，而指数形式下复数乘幂仅需把模求幂、辐角倍乘。开 n 次方则是逆过程，由于辐角相差 2π 对应同一个复数，除以 n 后就会产生 n 个彼此相差 2π/n 弧度的不同角度，在复平面上构成正 n 边形顶点。</p></div><div class="box" id="type-27"><b>距离比圆与圆反演对称</b><p>到两定点距离之比为非 1 正常数 λ 的点轨迹是一个圆（阿波罗尼斯圆），当 λ=1 时退化为两点连线的垂直平分线。不仅如此，这两定点 z_1,z_2 位于过圆心的同一条射线上，且到圆心距离的乘积恰等于半径的平方，即互为关于该圆的几何反演对称点。</p></div><div class="box" id="type-28"><b>复数条件证明几何形状</b><p>在复平面中，向量 {z_1 z_2} 由差复数 z_2-z_1 表示，而两个非零差复数的商 (z_3-z_1)/(z_2-z_1) 同时编码了三角形的边长比与有向顶角。通过平移一个顶点到原点再除以一条非零边，可将复杂的对称复代数等式降维成单复数的一元二次或高次方程。</p></div><div class="box" id="type-26"><b>轨迹互化、区域与单连通</b><p>区域同时要求“非空开集”（不含任何边界点）和“连通性”（内部任意两点可用全在集内的折线相连）。单连通域在直观上指“内部没有孔洞（哪怕只挖掉一个孤立点）也没有把区域割断的裂缝”的区域，它是后续柯西积分定理成立的最核心拓扑前提。</p></div><div class="box" id="type-29"><b>多路径极限与连续性</b><p>复变函数的极限 lim_{z→ z_0}f(z)=A 要求点 z 从平面上一切方向与一切曲线（360^° 全方位）趋近 z_0 时都趋于同一复数 A，等价于实部和虚部二元实函数极限均存在。若沿两条不同路径极限不等或沿某路径无界，极限必不存在；要证明极限存在，则必须用不依赖于路径角度的模长不等式一致控制余项。</p></div><h2>第二章 · 解析函数</h2><div class="box" id="type-30"><b>由定义求导与单点可导反例</b><p>复变函数在一点可导必须使差商 [f(z_0+h)-f(z_0)]/h 在复增量 h→ 0 时沿所有方向收敛到同一复数。这一刚性约束使得 z̄ 处处连续却处处不可导，|z|^2 仅在原点孤立可导而处处不解析，而 f(z)=√(|xy|) 则说明缺乏实可微性时单靠 C-R 方程并不足以保证复可导。</p></div><section class="box" id="type-2"><small>第二章 · 核心必考</small><h2>可导点与解析域</h2><p>复可导要求增量 Δ z→ 0 沿任意方向的差商极限一致，这迫使实虚部的四个一阶偏导数满足柯西–黎曼（C-R）方程 u_x=v_y, u_y=-v_x。解析比可导要求更强：在一点解析必须在该点的某个开邻域内处处可导。若可导点仅构成孤立点或直线/圆周等低维曲线，则没有任何开邻域，函数在全平面处处不解析。</p><details><summary>柯西–黎曼方程</summary><div>u<sub>x</sub> = v<sub>y</sub>，u<sub>y</sub> = −v<sub>x</sub></div><p>适用条件：复可导的必要条件。若 u、v 在该点实可微，则两式同时成立也是充分条件；一阶偏导连续足以保证实可微。</p></details><details><summary>导数</summary><div>f′(z) = u<sub>x</sub> + i v<sub>x</sub></div><p>适用条件：先确认该点可导。要在一点解析，须在它的某个开邻域内处处可导。</p></details><details><summary>解题思路</summary><ol><li>分拆实虚求偏导：写明 u(x,y),v(x,y) 并计算四个一阶偏导 u_x,u_y,v_x,v_y，注明其连续性（多项式、初等函数处处连续）。</li><li>联立 C-R 求解集：解方程组 u_x=v_y,\ u_y=-v_x，得到可导点集 E（若是恒等式则比较同类项系数求参数），并用 f&#x27;(z)=u_x+iv_x 求导。</li><li>判内点定解析域：检查可导点集 E 的内部；若 E 只是直线、曲线或孤立点，内部为空集，明确指出“处处不解析”。</li></ol></details><h3>可导点能否组成解析域</h3><p>设 z=x+iy，f(z)=x²−iy。求可导点、导数以及解析域。</p><p class="source">本课教材 · 第二章习题 2（1） · 第 66 页</p><details><summary>查看完整解答</summary><ol><li><p>把 <math><mrow><mi>f</mi></mrow></math> 写成 <math><mrow><mi>u</mi><mo>+</mo><mi>i</mi><mi>v</mi></mrow></math>，其中 <math><mrow><mi>u</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></math>，<math><mrow><mi>v</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>=</mo><mo>−</mo><mi>y</mi></mrow></math>。计算偏导数 <math display="block"><mrow><msub><mi>u</mi><mi>x</mi></msub><mo>=</mo><mn>2</mn><mi>x</mi><mo>,</mo><mspace width="2em" /><msub><mi>u</mi><mi>y</mi></msub><mo>=</mo><mn>0</mn><mo>,</mo><mspace width="2em" /><msub><mi>v</mi><mi>x</mi></msub><mo>=</mo><mn>0</mn><mo>,</mo><mspace width="2em" /><msub><mi>v</mi><mi>y</mi></msub><mo>=</mo><mo>−</mo><mn>1</mn><mo>.</mo></mrow></math> 这些偏导数在全平面连续，因此柯西–黎曼方程在本题中是复可导的充要条件。</p></li><li><p>代入 <math><mrow><msub><mi>u</mi><mi>x</mi></msub><mo>=</mo><msub><mi>v</mi><mi>y</mi></msub><mo>,</mo><mtext> </mtext><msub><mi>u</mi><mi>y</mi></msub><mo>=</mo><mo>−</mo><msub><mi>v</mi><mi>x</mi></msub></mrow></math>，得 <math><mrow><mn>2</mn><mi>x</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow></math> 和 <math><mrow><mn>0</mn><mo>=</mo><mn>0</mn></mrow></math>。所以复可导点恰为 <math><mrow><mi>x</mi><mo>=</mo><mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></math> 上的各点。在这些点，<math display="block"><mrow><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mi>u</mi><mi>x</mi></msub><mo>+</mo><mi>i</mi><msub><mi>v</mi><mi>x</mi></msub><mo>=</mo><mn>2</mn><mi>x</mi><mo>=</mo><mo>−</mo><mn>1</mn><mo>.</mo></mrow></math></p></li><li><p>一点处解析要求函数在该点的某个邻域内处处可导。直线 <math><mrow><mi>x</mi><mo>=</mo><mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></math> 上任一点的每个圆邻域都含有直线外的不可导点，所以没有解析点。</p></li></ol><strong>结论</strong><p><math><mrow><mi>f</mi></mrow></math> 恰在直线 <math><mrow><mo>Re</mo><mi>z</mi><mo>=</mo><mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></math> 上可导，导数均为 <math><mrow><mo>−</mo><mn>1</mn></mrow></math>，在复平面上处处不解析。</p></details><h3>求使函数解析的待定系数</h3><p>已知 u=my³+nx²y，v=x³+ℓxy²，求实数 m、n、ℓ，使 u+iv 在全平面解析。</p><p class="source">本课教材 · 第二章习题 8 · 第 67 页</p><details><summary>查看完整解答</summary><ol><li><p><math><mrow><mi>u</mi></mrow></math> 与 <math><mrow><mi>v</mi></mrow></math> 都是关于 <math><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></math> 的实多项式，一阶偏导数处处连续。因此 <math><mrow><mi>u</mi><mo>+</mo><mi>i</mi><mi>v</mi></mrow></math> 在全平面解析，当且仅当 <math><mrow><msub><mi>u</mi><mi>x</mi></msub><mo>=</mo><msub><mi>v</mi><mi>y</mi></msub></mrow></math>、<math><mrow><msub><mi>u</mi><mi>y</mi></msub><mo>=</mo><mo>−</mo><msub><mi>v</mi><mi>x</mi></msub></mrow></math> 对所有实数 <math><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></math> 成立。</p></li><li><p>计算偏导数 <math display="block"><mrow><msub><mi>u</mi><mi>x</mi></msub><mo>=</mo><mn>2</mn><mi>n</mi><mi>x</mi><mi>y</mi><mo>,</mo><mspace width="1em" /><msub><mi>u</mi><mi>y</mi></msub><mo>=</mo><mn>3</mn><mi>m</mi><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mi>n</mi><msup><mi>x</mi><mn>2</mn></msup><mo>,</mo><mspace width="1em" /><msub><mi>v</mi><mi>x</mi></msub><mo>=</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mi>ℓ</mi><msup><mi>y</mi><mn>2</mn></msup><mo>,</mo><mspace width="1em" /><msub><mi>v</mi><mi>y</mi></msub><mo>=</mo><mn>2</mn><mi>ℓ</mi><mi>x</mi><mi>y</mi><mo>.</mo></mrow></math> 把它们代入柯西–黎曼方程，整理为 <math display="block"><mrow><mn>2</mn><mo stretchy="false">(</mo><mi>n</mi><mo>−</mo><mi>ℓ</mi><mo stretchy="false">)</mo><mi>x</mi><mi>y</mi><mo>=</mo><mn>0</mn><mo>,</mo><mspace width="2em" /><mo stretchy="false">(</mo><mi>n</mi><mo>+</mo><mn>3</mn><mo stretchy="false">)</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mo stretchy="false">(</mo><mn>3</mn><mi>m</mi><mo>+</mo><mi>ℓ</mi><mo stretchy="false">)</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn><mo>.</mo></mrow></math></p></li><li><p>这两式为关于 <math><mrow><mi>x</mi><mo>,</mo><mi>y</mi></mrow></math> 的恒等式，比较系数得 <math><mrow><mi>n</mi><mo>=</mo><mi>ℓ</mi></mrow></math>、<math><mrow><mi>n</mi><mo>=</mo><mo>−</mo><mn>3</mn></mrow></math>、<math><mrow><mn>3</mn><mi>m</mi><mo>=</mo><mo>−</mo><mi>ℓ</mi></mrow></math>。解得 <math><mrow><mi>m</mi><mo>=</mo><mn>1</mn></mrow></math>，<math><mrow><mi>n</mi><mo>=</mo><mi>ℓ</mi><mo>=</mo><mo>−</mo><mn>3</mn></mrow></math>。</p></li><li><p>把确定的系数代回，可写成 <math display="block"><mrow><mi>u</mi><mo>+</mo><mi>i</mi><mi>v</mi><mo>=</mo><mo stretchy="false">(</mo><msup><mi>y</mi><mn>3</mn></msup><mo>−</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup><mi>y</mi><mo stretchy="false">)</mo><mo>+</mo><mi>i</mi><mo stretchy="false">(</mo><msup><mi>x</mi><mn>3</mn></msup><mo>−</mo><mn>3</mn><mi>x</mi><msup><mi>y</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mo>=</mo><mi>i</mi><mo stretchy="false">(</mo><mi>x</mi><mo>+</mo><mi>i</mi><mi>y</mi><msup><mo stretchy="false">)</mo><mn>3</mn></msup><mo>=</mo><mi>i</mi><msup><mi>z</mi><mn>3</mn></msup><mo>.</mo></mrow></math> 右端是复多项式，确实在全平面解析。</p></li></ol><strong>结论</strong><p><math><mrow><mi>m</mi><mo>=</mo><mn>1</mn><mo>,</mo><mspace width="1em" /><mi>n</mi><mo>=</mo><mi>ℓ</mi><mo>=</mo><mo>−</mo><mn>3</mn></mrow></math>。</p></details></section><div class="box" id="type-31"><b>解 C–R 方程、确定解析域与参数</b><p>当函数的实部 u(x,y) 和虚部 v(x,y) 具有连续一阶偏导数时，柯西–黎曼方程既是复可导的必要条件也是充分条件。若满足 C-R 方程的点构成非空开集（如全平面 C 或半平面），则函数在该区域内解析，进而可使用四种等价公式中的任一种写出其导数，必要时结合恒等式识别为 z 的整函数。</p></div><div class="box" id="type-82"><b>极坐标柯西–黎曼方程</b><p>对复对数、非整数次幂等涉及模与辐角的函数，直角坐标 x,y 会引入繁杂的根号和反正切，而在极坐标 z=re^{iθ} 下实部与虚部直接分离。通过极坐标链式法则（或沿径向与切向求导相等）可导出极坐标 C-R 方程，配合局部单值角区间及原点外连续性即可迅速证明解析性并算出导数。</p></div><div class="box" id="type-76"><b>模函数的梯度恒等式</b><p>当解析函数 f=u+iv 在一点非零时，其模长 ρ=√(u^2+v^2) 光滑可微，借助链式法则与 C-R 方程，交叉偏导项正好完全抵消，从而得到简练的恒等式 |∇|f||^2=|f&#x27;|^2。但在 f(z_0)=0 的零点处，平方根函数的奇异性会导致 |f| 出现尖锥（例如 f(z)=z 时 |z|=√(x^2+y^2) 在原点不可微），因此不能直接对模求偏导。</p></div><div class="box" id="type-32"><b>指数、三角与双曲函数拆实虚</b><p>复初等函数虽然沿用了实函数的符号，但在虚轴方向呈现出双曲特性：因为 e^{i(iy)}=e^{-y}，复正弦和复余弦把实部的三角振荡与虚部的双曲增长耦合在了一起。计算任何复合指数或三角函数的模、实部、虚部时，先将自变量拆成 x+iy 并统一转化为 e^{X+iY}=e^X(cos Y+isin Y)，便可彻底化为实数运算。</p></div><div class="box" id="type-33"><b>复对数的多值、主值与解析支</b><p>复对数 Lnz 是指数函数 e^w=z 的反函数。由于 e^w 具有周期 2π i，每个非零复数都有无穷多个对数值，它们虚部相差 2π 的整数倍。规定幅角取主值 arg z∈(-π,π] 即得到单值的主对数 ln z，但它沿原点及负实轴发生 2π i 跃变，因此必须沿一条从原点出发的射线（通常为负实轴）割开平面才能得到解析分支。</p></div><div class="box" id="type-34"><b>复幂的全体值与主值</b><p>一般复乘幂 a^b 统一定义为 exp(bLna)。随着指数 b 的性质不同，其值的个数呈现截然不同的特征：当 b 为整数时单值；当 b=p/q 为既约有理数时恰有 q 个不同值；而当 b 为无理数或非实复数（如 i^i）时，因为 2kπ i· b 不再是 2π i 的整数倍，乘幂拥有无穷多个互不相同的值。</p></div><section class="box" id="type-3"><small>第二章 · 高频重点</small><h2>指数、对数与复方程</h2><p>与实指数函数单调递增不同，复指数函数 e^z=e^x(cos y+isin y) 以 2π i 为周期且模长 e^x&gt;0 在全平面永不为零。复正余弦函数通过欧拉公式自然延拓到整个复平面，其零点仍全部落在实轴上，但在虚轴方向按双曲函数指数级增长，因此不再有界。</p><details><summary>指数方程</summary><div>e<sup>z</sup> = w ⇔ z = ln|w| + i(θ+2kπ)</div><p>适用条件：w ≠ 0，θ 为 w 的一个辐角，k ∈ ℤ。</p></details><details><summary>复正弦</summary><div>sin z = (e<sup>iz</sup>−e<sup>−iz</sup>)/(2i)</div><p>适用条件：指数定义对所有复数成立，指数函数处处非零。</p></details><details><summary>解题思路</summary><ol><li>三角转指数：遇 sin z, cos z 等方程，统一用欧拉公式化为 e^{iz} 和 e^{-iz} 的组合并乘 e^{iz} 消负指数。</li><li>比模比辐角：令 z=x+iy（或对 e^w=A 直接取复对数 Ln A），分别由模相等求实部、辐角差 2kπ 求虚部。</li><li>保留整周数：对所有解均保留整数参数 k∈Z，代回原指数式检验是否满足且无增根。</li></ol></details><h3>正弦和余弦的全部零点</h3><p>分别求 sin z=0 与 cos z=0 的全部复数解。</p><p class="source">本课教材 · 第二章习题 12（1）（2） · 第 67 页</p><details><summary>查看完整解答</summary><ol><li><p>由复三角函数的指数定义，有 <math display="block"><mrow><mi>sin</mi><mi>z</mi><mo>=</mo><mfrac><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>z</mi></mrow></msup><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>z</mi></mrow></msup></mrow><mrow><mn>2</mn><mi>i</mi></mrow></mfrac><mo>,</mo><mspace width="2em" /><mi>cos</mi><mi>z</mi><mo>=</mo><mfrac><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>z</mi></mrow></msup><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>z</mi></mrow></msup></mrow><mrow><mn>2</mn></mrow></mfrac><mo>.</mo></mrow></math> 对任意 <math><mrow><mi>z</mi><mo>∈</mo><mi>ℂ</mi></mrow></math>，<math><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>z</mi></mrow></msup><mo>≠</mo><mn>0</mn></mrow></math>，所以可以乘以 <math><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>z</mi></mrow></msup></mrow></math> 作等价变形。</p></li><li><p>由 <math><mrow><mi>sin</mi><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 得 <math><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>i</mi><mi>z</mi></mrow></msup><mo>=</mo><mn>1</mn></mrow></math>。写 <math><mrow><mi>z</mi><mo>=</mo><mi>x</mi><mo>+</mo><mi>i</mi><mi>y</mi></mrow></math>，比较模得到 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mn>2</mn><mi>y</mi></mrow></msup><mo>=</mo><mn>1</mn></mrow></math>，即 <math><mrow><mi>y</mi><mo>=</mo><mn>0</mn></mrow></math>。再由 <math><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>i</mi><mi>x</mi></mrow></msup><mo>=</mo><mn>1</mn></mrow></math> 得 <math><mrow><mn>2</mn><mi>x</mi><mo>=</mo><mn>2</mn><mi>k</mi><mi>π</mi></mrow></math>，故 <math><mrow><mi>z</mi><mo>=</mo><mi>k</mi><mi>π</mi></mrow></math>。</p></li><li><p>由 <math><mrow><mi>cos</mi><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 得 <math><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>i</mi><mi>z</mi></mrow></msup><mo>=</mo><mo>−</mo><mn>1</mn></mrow></math>。同样比较模可得 <math><mrow><mi>y</mi><mo>=</mo><mn>0</mn></mrow></math>，再由 <math><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>i</mi><mi>x</mi></mrow></msup><mo>=</mo><mo>−</mo><mn>1</mn></mrow></math> 得 <math><mrow><mn>2</mn><mi>x</mi><mo>=</mo><mo stretchy="false">(</mo><mn>2</mn><mi>k</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mi>π</mi></mrow></math>，故 <math><mrow><mi>z</mi><mo>=</mo><mi>π</mi><mo>/</mo><mn>2</mn><mo>+</mo><mi>k</mi><mi>π</mi></mrow></math>。两组结果代入对应的指数等式均成立。</p></li></ol><strong>结论</strong><p><math><mrow><mi>sin</mi><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 的全部解为 <math><mrow><mi>z</mi><mo>=</mo><mi>k</mi><mi>π</mi></mrow></math>，<math><mrow><mi>cos</mi><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 的全部解为 <math><mrow><mi>z</mi><mo>=</mo><mi>π</mi><mo>/</mo><mn>2</mn><mo>+</mo><mi>k</mi><mi>π</mi></mrow></math>，其中 <math><mrow><mi>k</mi><mo>∈</mo><mi>ℤ</mi></mrow></math>。</p></details><h3>指数方程是否只有一解</h3><p>判断「若 eᶻ=1，则 z=0」。</p><ol><li>正确</li><li>错误</li></ol><p class="source">按 2021 年 8 月卷 · 二(2) 改编</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mi>z</mi><mo>=</mo><mi>x</mi><mo>+</mo><mi>i</mi><mi>y</mi></mrow></math>，其中 <math><mrow><mi>x</mi><mo>,</mo><mi>y</mi><mo>∈</mo><mi>ℝ</mi></mrow></math>。由复指数的定义 <math display="block"><mrow><msup><mi>e</mi><mi>z</mi></msup><mo>=</mo><msup><mi>e</mi><mi>x</mi></msup><mo stretchy="false">(</mo><mi>cos</mi><mi>y</mi><mo>+</mo><mi>i</mi><mi>sin</mi><mi>y</mi><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 若 <math><mrow><msup><mi>e</mi><mi>z</mi></msup><mo>=</mo><mn>1</mn></mrow></math>，则取模得 <math><mrow><msup><mi>e</mi><mi>x</mi></msup><mo>=</mo><mn>1</mn></mrow></math>，所以 <math><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow></math>。</p></li><li><p>再比较实部与虚部，得到 <math><mrow><mi>cos</mi><mi>y</mi><mo>=</mo><mn>1</mn></mrow></math> 和 <math><mrow><mi>sin</mi><mi>y</mi><mo>=</mo><mn>0</mn></mrow></math>，即 <math><mrow><mi>y</mi><mo>=</mo><mn>2</mn><mi>k</mi><mi>π</mi></mrow></math>，其中 <math><mrow><mi>k</mi><mo>∈</mo><mi>ℤ</mi></mrow></math>。</p></li><li><p>反过来，对每个整数 <math><mrow><mi>k</mi></mrow></math>，都有 <math><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>k</mi><mi>π</mi><mi>i</mi></mrow></msup><mo>=</mo><mn>1</mn></mrow></math>。例如 <math><mrow><mi>z</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi></mrow></math> 满足原等式且 <math><mrow><mi>z</mi><mo>≠</mo><mn>0</mn></mrow></math>。</p></li></ol><strong>结论</strong><p>命题错误。方程的全部解为 <math><mrow><mi>z</mi><mo>=</mo><mn>2</mn><mi>k</mi><mi>π</mi><mi>i</mi></mrow></math>，<math><mrow><mi>k</mi><mo>∈</mo><mi>ℤ</mi></mrow></math>。</p></details></section><div class="box" id="type-35"><b>复三角方程与反函数多值</b><p>无需死记繁杂的反三角函数多值对数公式。所有复三角方程本质上都是关于 u=e^{iz} 的一元二次方程：因为 sin z=(u-u^{-1})/(2i)、cos z=(u+u^{-1})/2，求出非零根 u 后直接取全体复对数 iz=Ln u 即可得到全部复数解，且过程清晰不易出错。</p></div><h2>第三章 · 复变函数的积分</h2><section class="box" id="type-4"><small>第三章 · 高频重点</small><h2>参数化积分</h2><p>当被积函数不解析（例如含 x,y,z̄,Rez）或路径不是解析区域内的闭路时，柯西定理与牛顿–莱布尼茨公式均不适用，积分值通常依赖于具体路径。参数化法则将复路径 z=z(t) 与微分 dz=z&#x27;(t) dt 一并转化为高数一维实定积分，是计算一切分段光滑曲线积分最基础、最通用的方法。</p><details><summary>路径参数化</summary><div>∫<sub>C</sub> f(z) dz = ∫<sub>a</sub><sup>b</sup> f(z(t)) z′(t) dt</div><p>适用条件：路径分段光滑，函数在路径上连续；t 从起点对应的值走到终点对应的值。</p></details><details><summary>解题思路</summary><ol><li>判定是否需参数化：检查被积函数是否含非解析项（x,y,z̄,|z|）或路径为指定非闭曲线；若有折线则按光滑段拆成几段之和。</li><li>写出参数与微分：确定起止点对应的参数范围 [α,β]，同步写出 z(t), x(t), y(t), z̄(t) 与 dz=z&#x27;(t) dt。</li><li>拆实虚求实积分：代入化简为实变定积分 ∫_α^β (P+iQ) dt 分别积分并核对正负号。</li></ol></details><h3>直线与抛物线上的同一个积分</h3><p>由 0 到 1+i，分别沿直线 y=x 和抛物线 y=x² 计算 ∫<sub>C</sub> (x²+iy) dz。</p><p class="source">本课教材 · 第三章习题 2 · 第 99 页</p><details><summary>查看完整解答</summary><ol><li><p>令 <math><mrow><mi>t</mi><mo>=</mo><mi>x</mi></mrow></math>，两个路径都以 <math><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow></math> 为起点、<math><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow></math> 为终点。曲线积分按 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo><msup><mi>z</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi></mstyle></mrow></math> 计算。</p></li><li><p>沿直线 <math><mrow><mi>y</mi><mo>=</mo><mi>x</mi></mrow></math>，有 <math><mrow><mi>z</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>t</mi><mo>+</mo><mi>i</mi><mi>t</mi></mrow></math>，<math><mrow><mi>d</mi><mi>z</mi><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>i</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi></mrow></math>，故 <math display="block"><mrow><mrow><msub><mi>I</mi><mn>1</mn></msub><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo stretchy="false">(</mo><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mi>i</mi><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>i</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mspace linebreak="newline" /><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo stretchy="false">(</mo><msup><mi>t</mi><mn>2</mn></msup><mo>−</mo><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>+</mo><mi>i</mi><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo stretchy="false">(</mo><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mspace linebreak="newline" /><mo>=</mo><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo>+</mo><mi>i</mi><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo>=</mo><mfrac><mrow><mo>−</mo><mn>1</mn><mo>+</mo><mn>5</mn><mi>i</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>.</mo></mrow></mrow></math></p></li><li><p>沿抛物线 <math><mrow><mi>y</mi><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup></mrow></math>，有 <math><mrow><mi>z</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>t</mi><mo>+</mo><mi>i</mi><msup><mi>t</mi><mn>2</mn></msup></mrow></math>，<math><mrow><mi>d</mi><mi>z</mi><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>i</mi><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi></mrow></math>，故 <math display="block"><mrow><mrow><msub><mi>I</mi><mn>2</mn></msub><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo stretchy="false">(</mo><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mi>i</mi><msup><mi>t</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>i</mi><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mspace linebreak="newline" /><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo stretchy="false">(</mo><msup><mi>t</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><msup><mi>t</mi><mn>3</mn></msup><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>+</mo><mi>i</mi><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mo stretchy="false">(</mo><msup><mi>t</mi><mn>2</mn></msup><mo>+</mo><mn>2</mn><msup><mi>t</mi><mn>3</mn></msup><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mspace linebreak="newline" /><mo>=</mo><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo>+</mo><mi>i</mi><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>+</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo>=</mo><mfrac><mrow><mo>−</mo><mn>1</mn><mo>+</mo><mn>5</mn><mi>i</mi></mrow><mrow><mn>6</mn></mrow></mfrac><mo>.</mo></mrow></mrow></math></p></li></ol><strong>结论</strong><p>两条指定路径给出的积分相同，均为 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mo>−</mo><mn>1</mn><mo>+</mo><mn>5</mn><mi>i</mi></mrow><mrow><mn>6</mn></mrow></mfrac></mstyle></mrow></math>。</p></details><h3>四分之一圆弧上的积分</h3><p>沿单位圆第一象限的圆弧从 1 到 i，求 ∫<sub>C</sub> z̄ dz。</p><p class="source">按 2021 年 8 月卷 · 一(3) 改编</p><details><summary>查看完整解答</summary><ol><li><p>该圆弧的起点为 <math><mrow><mn>1</mn></mrow></math>，终点为 <math><mrow><mi>i</mi></mrow></math>，故取与积分方向一致的参数式 <math display="block"><mrow><mi>z</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>t</mi></mrow></msup><mo>,</mo><mspace width="2em" /><mn>0</mn><mo>≤</mo><mi>t</mi><mo>≤</mo><mi>π</mi><mo>/</mo><mn>2</mn><mo>.</mo></mrow></math></p></li><li><p>沿圆弧有 <math><mrow><mrow class="ov"><mi>z</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>t</mi></mrow></msup></mrow></math>，并且 <math><mrow><msup><mi>z</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>i</mi><msup><mi>e</mi><mrow><mi>i</mi><mi>t</mi></mrow></msup></mrow></math>。由复线积分的参数公式，<math display="block"><mrow><msub><mo>∫</mo><mi>C</mi></msub><mrow class="ov"><mi>z</mi></mrow><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mrow><mi>π</mi><mo>/</mo><mn>2</mn></mrow></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>i</mi><msup><mi>e</mi><mrow><mi>i</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mrow><mi>π</mi><mo>/</mo><mn>2</mn></mrow></msubsup><mi>i</mi><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mfrac><mrow><mi>π</mi><mi>i</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>.</mo></mrow></math></p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><msub><mo>∫</mo><mi>C</mi></msub><mrow class="ov"><mi>z</mi></mrow><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mfrac><mrow><mi>π</mi><mi>i</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mstyle></mrow></math>。</p></details></section><div class="box" id="type-37"><b>圆周参数化、共轭代换与 ML 估值</b><p>在以 z_0 为圆心、R 为半径的圆周上，点满足 (z-z_0)((z-z_0)̄)=R^2，因此圆周上的共轭与模长常常可以代换为解析变量 z，进而使用围线公式。另外，基本积分 ∮_{|z-z_0|=R}(z-z_0)^{-(n+1)}dz 在 n=0 时恒为 2π i 而在 n≠ 0 时恒为 0，与半径 R 无关；而仅需证明界限时，ML 估值不等式无需算出原积分即可直接给出紧致上界。</p></div><div class="box" id="type-41"><b>用复线积分求平面面积</b><p>由格林公式可知，绕正向简单闭曲线的实线积分 ∮_C x dy = -∮_C y dx 均等于所围平面区域的面积 A。因此当复围线积分中出现 z̄, Rez, Imz 等非解析项时，把被积表达式拆为实部和虚部两个实线积分，全微分项积分自动归零，余项恰用格林公式转为面积 A。</p></div><div class="box" id="type-36"><b>原函数、路径无关与牛顿–莱布尼茨</b><p>若函数 f(z) 在单连通域 D 内处处解析，那么沿 D 内任意闭曲线的积分均为零，从而两点间的积分只与起终点有关而与具体路径无关，且必存在解析原函数 F(z)。在多连通域或带分支割线的区域，虽然闭路积分未必为零，但只要能先验明局部或区域内存在单值原函数，依然可以用高数的牛顿–莱布尼茨公式和分部积分法。</p></div><div class="box" id="type-38"><b>复合闭路、挖洞与方向</b><p>复合闭路定理是多连通域上的柯西定理：只要把大围线内部的奇点用互不相交的小闭路逐一“挖洞”隔离出来，在剩下的带孔环域内函数处处解析，由割缝拼接抵消即可推出“大圈正向积分等于所有内部小圈各自正向积分之和”。只要变形过程不穿过奇点，围线的具体形状与大小都完全无关紧要。</p></div><section class="box" id="type-5"><small>第三章 · 核心必考</small><h2>柯西积分公式与高阶导数</h2><p>如果函数在简单闭曲线 C 及其内部解析，柯西–古萨定理断定闭路积分为 0；若圈内包含单个奇点形如 g(z)/(z-a)^{n+1}，则奇点外的解析分子 g(z) 在 a 处的值或 n 阶导数被围线积分完全确定。解析函数由此自然具有任意阶导数，解题核心在于“留内去外”：只把圈内对应奇点的幂留在分母，其余因子全部并入解析分子。</p><details><summary>柯西积分定理</summary><div>∮<sub>C</sub> f(z) dz = 0</div><p>适用条件：简单闭曲线 C 及整个内部都在 f 的解析域内，且 C 分段光滑。</p></details><details><summary>高阶导数公式</summary><div>∮<sub>C</sub> g(z)/(z−a)<sup>n+1</sup> dz = (2πi/n!) g<sup>(n)</sup>(a)</div><p>适用条件：C 正向简单闭合且分段光滑，a 在圈内，g 在 C 上及内部解析，n≥0 为整数。</p></details><details><summary>解题思路</summary><ol><li>求奇点判内外：令分母为零找出所有候选奇点，比较其与围线 C 的位置关系，区分圈内点与圈外点（若有奇点在 C 上则公式不直接适用）。</li><li>挖洞并留内去外：若圈内有多个奇点则用复合闭路拆为多个小圆之和；对每个小圆，只留该奇点因子 (z-a)^{n+1} 在分母，其余因子连同原分子构成解析函数 g(z)。</li><li>套公式核因子：读出导数阶数 n=(text{分母指数})-1，计算 g^{(n)}(a) 并乘 (2π i)/(n!)（逆时针为正，顺时针取反）。</li></ol></details><h3>参数在单位圆内与圆外</h3><p>设 C 为正向单位圆，a∈ℂ 且 |a|≠1。计算 ∮<sub>C</sub> eᶻ/(z−a)³ dz，并按 a 的位置讨论。</p><p class="source">本课教材 · 第三章习题 9（5） · 第 101 页</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mo>∮</mo><mi>C</mi></msub><msup><mi>e</mi><mi>z</mi></msup><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mrow><mo>−</mo><mn>3</mn></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>z</mi></mrow></math>。指数函数 <math><mrow><msup><mi>e</mi><mi>z</mi></msup></mrow></math> 在全平面解析，被积函数唯一可能的奇点为 <math><mrow><mi>z</mi><mo>=</mo><mi>a</mi></mrow></math>。因为题设 <math><mrow><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>≠</mo><mn>1</mn></mrow></math>，只需判断 <math><mrow><mi>a</mi></mrow></math> 在圆内还是圆外。</p></li><li><p>当 <math><mrow><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 时，<math><mrow><mi>a</mi></mrow></math> 在正向围线内，分子 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mi>z</mi></msup></mrow></math> 在闭圆盘的邻域内解析。分母的三次幂对应柯西积分公式中的二阶导数，因此 <math display="block"><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>i</mi></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mspace width="0.167em" /><msup><mi>g</mi><mi>″</mi></msup><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>i</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mspace width="0.167em" /><msup><mi>e</mi><mi>a</mi></msup><mo>=</mo><mi>π</mi><mi>i</mi><msup><mi>e</mi><mi>a</mi></msup><mo>.</mo></mrow></math></p></li><li><p>当 <math><mrow><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math> 时，分母在闭单位圆盘及其某个邻域内均不为零。被积函数在该邻域内解析，由柯西积分定理得 <math><mrow><mi>I</mi><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>I</mi><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>=</mo><mrow><mo stretchy="true" fence="true" form="prefix">{</mo><mtable><mtr><mtd columnalign="left"><mi>π</mi><mi>i</mi><msup><mi>e</mi><mi>a</mi></msup><mo>,</mo></mtd><mtd columnalign="left"><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn><mo>,</mo></mtd></mtr><mtr><mtd columnalign="left"><mn>0</mn><mo>,</mo></mtd><mtd columnalign="left"><mo stretchy="false">|</mo><mi>a</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn><mo>.</mo></mtd></mtr></mtable></mrow></mstyle></mrow></math></p></details><h3>两条柯西公式如何接起来</h3><p>设 C 正向简单闭合且分段光滑，f 在包含 C 及其内部的区域 D 解析。a∈D 且 a∉C。证明 ∮<sub>C</sub> f′(z)/(z−a) dz = ∮<sub>C</sub> f(z)/(z−a)² dz。</p><p class="source">2022 年 6 月 A 卷 · 三（重述）</p><details><summary>查看完整解答</summary><ol><li><p>由于 <math><mrow><mi>f</mi></mrow></math> 在包含 <math><mrow><mi>C</mi></mrow></math> 及其内部的区域内解析，<math><mrow><msup><mi>f</mi><mi>′</mi></msup></mrow></math> 也在该区域内解析。又因 <math><mrow><mi>a</mi><mo>∉</mo><mi>C</mi></mrow></math>，分别讨论 <math><mrow><mi>a</mi></mrow></math> 在 <math><mrow><mi>C</mi></mrow></math> 外与在 <math><mrow><mi>C</mi></mrow></math> 内的情况。</p></li><li><p>若 <math><mrow><mi>a</mi></mrow></math> 在 <math><mrow><mi>C</mi></mrow></math> 外，则 <math><mrow><mi>z</mi><mo>−</mo><mi>a</mi></mrow></math> 在 <math><mrow><mi>C</mi></mrow></math> 及其内部不为零。两边的被积函数均在 <math><mrow><mi>C</mi></mrow></math> 及其内部的邻域内解析，由柯西积分定理，两边积分都等于 <math><mrow><mn>0</mn></mrow></math>。</p></li><li><p>若 <math><mrow><mi>a</mi></mrow></math> 在 <math><mrow><mi>C</mi></mrow></math> 内，则对 <math><mrow><msup><mi>f</mi><mi>′</mi></msup></mrow></math> 应用柯西积分公式，得 <math display="block"><mrow><msub><mo>∮</mo><mi>C</mi></msub><mfrac><mrow><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo></mrow><mrow><mi>z</mi><mo>−</mo><mi>a</mi></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi><mspace width="0.167em" /><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 再对 <math><mrow><mi>f</mi></mrow></math> 应用一阶导数公式，得 <math display="block"><mrow><msub><mo>∮</mo><mi>C</mi></msub><mfrac><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mfrac><mrow><mn>2</mn><mi>π</mi><mi>i</mi></mrow><mrow><mn>1</mn><mo>!</mo></mrow></mfrac><mspace width="0.167em" /><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi><mspace width="0.167em" /><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 因而两边仍相等。</p></li></ol><strong>结论</strong><p>对题设中所有 <math><mrow><mi>a</mi><mo>∉</mo><mi>C</mi></mrow></math>，均有 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msub><mo>∮</mo><mi>C</mi></msub><mfrac><mrow><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo></mrow><mrow><mi>z</mi><mo>−</mo><mi>a</mi></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><msub><mo>∮</mo><mi>C</mi></msub><mfrac><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>z</mi></mstyle></mrow></math>。</p></details></section><div class="box" id="type-39"><b>多奇点与柯西高阶公式</b><p>面对分母为多项式乘积的围线积分，直接求导几乎不可行。利用复合闭路挖洞定理或部分分式裂项，把每个圈内奇点拆到各自独立的小围线上处理，就能在每个小圈内确保“除了这一个极点之外，其余所有因子都解析”，从而干净利落地把多奇点问题还原为标准柯西高阶导数公式。</p></div><div class="box" id="type-40"><b>柯西公式证明题与边界唯一性</b><p>柯西积分公式深刻揭示了解析函数的“全息刚性”：一个解析函数在闭曲线内部每一点的值，竟然完全由它在边界曲线上的取值唯一锁定。因此若两个解析函数在边界上相等，它们在内部必定恒等；同时把单位圆 z=e^{iθ} 代入，还能将含 f(e^{iθ}) 的实三角积分转化为 f(0), f&#x27;(0) 的代数证明。</p></div><div class="box" id="type-81"><b>柯西公式的估计、刘维尔与多项式判定</b><p>高阶导数公式对半径为 R 的圆周进行 ML 估值，可以直接用圆周上的模长上界 M_R 压制圆心处 n 阶导数的绝对值，即柯西估计 |f^{(n)}(a)|≤ n! M_R/R^n。对于全平面解析的整函数，我们可以自由令圆半径 R→+∞：只要增长速度慢于 R^k，所有 n&gt;k 阶导数都必被压迫为零，从而迫使整函数的泰勒级数退化为有限次多项式（当 k=0 时即著名的刘维尔定理：有界整函数必为常数）。</p></div><section class="box" id="type-6"><small>第三章 · 核心必考</small><h2>由虚部恢复解析函数</h2><p>单连通区域内解析函数的实部 u 和虚部 v 必定满足拉普拉斯方程 u_{xx}+u_{yy}=0，彼此通过 C-R 方程相互锁定。因此只要已知其中一个（例如虚部 v），先验证其调和性，再利用 C-R 方程沿一个坐标变量积分（保留另一个变量的待定函数）或直接使用汤姆逊导数法，即可在相差一个实常数的意义下唯一恢复解析函数 f(z)。</p><details><summary>共轭调和函数</summary><div>u<sub>x</sub> = v<sub>y</sub>，u<sub>y</sub> = −v<sub>x</sub></div><p>适用条件：已给 v 时先检验调和性。单连通区域上的调和函数存在单值共轭调和函数。</p></details><details><summary>确定加法常数</summary><div>Im(f₁−f₂)=0 ⇒ f₁−f₂=C，C∈ℝ</div><p>适用条件：f₁、f₂ 在同一连通区域解析且虚部相同。</p></details><details><summary>解题思路</summary><ol><li>验证调和性：计算 v_{xx} 与 v_{yy} 并确认 v_{xx}+v_{yy}=0（若题目已说明 u+iv 解析则自然满足，也可直接检验复核）。</li><li>积分恢复另一部：由 u_x=v_y 对 x 偏积分得 u(x,y)=∫ v_y dx + h(y)，再对 y 求偏导代入 u_y=-v_x 消去 y（或直接代 f&#x27;(z)=v_y(z,0)+iv_x(z,0) 积分）。</li><li>合成 f(z) 并定常数：利用 z=x+iy 拼出 f(z)=u+iv（或检验汤姆逊积分结果虚部确为 v），最后代入给定点初值定出常数。</li></ol></details><h3>从给定虚部找回 f(z)</h3><p>已知解析函数的虚部 v=y/(x²+y²)，且 f(2)=0，求 f(z)。</p><p class="source">本课教材 · 第三章习题 30（2） · 第 103 页</p><details><summary>查看完整解答</summary><ol><li><p>在含 <math><mrow><mn>2</mn></mrow></math> 的连通解析区域内讨论。因 <math><mrow><mi>v</mi><mo>=</mo><mi>y</mi><mo>/</mo><mo stretchy="false">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></math>，该区域不含 <math><mrow><mn>0</mn></mrow></math>。对 <math><mrow><mi>z</mi><mo>=</mo><mi>x</mi><mo>+</mo><mi>i</mi><mi>y</mi><mo>≠</mo><mn>0</mn></mrow></math>，<math display="block"><mrow><mo>−</mo><mfrac><mn>1</mn><mi>z</mi></mfrac><mo>=</mo><mo>−</mo><mfrac><mrow><mi>x</mi><mo>−</mo><mi>i</mi><mi>y</mi></mrow><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mo>−</mo><mfrac><mrow><mi>x</mi></mrow><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfrac><mo>+</mo><mi>i</mi><mfrac><mrow><mi>y</mi></mrow><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup></mrow></mfrac><mo>.</mo></mrow></math> 所以 <math><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></math> 的虚部恰为给定的 <math><mrow><mi>v</mi></mrow></math>。</p></li><li><p>令 <math><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>+</mo><mn>1</mn><mo>/</mo><mi>z</mi><mo>=</mo><mi>U</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo><mo>+</mo><mi>i</mi><mi>V</mi><mo stretchy="false">(</mo><mi>x</mi><mo>,</mo><mi>y</mi><mo stretchy="false">)</mo></mrow></math>。函数 <math><mrow><mi>h</mi></mrow></math> 解析且 <math><mrow><mi>V</mi><mo>≡</mo><mn>0</mn></mrow></math>。由柯西–黎曼方程，<math><mrow><msub><mi>U</mi><mi>x</mi></msub><mo>=</mo><msub><mi>V</mi><mi>y</mi></msub><mo>=</mo><mn>0</mn></mrow></math>，<math><mrow><msub><mi>U</mi><mi>y</mi></msub><mo>=</mo><mo>−</mo><msub><mi>V</mi><mi>x</mi></msub><mo>=</mo><mn>0</mn></mrow></math>。由区域连通可知 <math><mrow><mi>U</mi></mrow></math> 为实常数 <math><mrow><mi>c</mi></mrow></math>，所以 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi><mo>+</mo><mi>c</mi></mrow></math>。</p></li><li><p>代入 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mn>2</mn><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math> 得 <math><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mn>2</mn><mo>+</mo><mi>c</mi><mo>=</mo><mn>0</mn></mrow></math>，即 <math><mrow><mi>c</mi><mo>=</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></math>。所得函数在 <math><mrow><mi>z</mi><mo>≠</mo><mn>0</mn></mrow></math> 时解析，且虚部及给定点值均满足题设。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>−</mo><mfrac><mn>1</mn><mi>z</mi></mfrac></mstyle></mrow></math>。</p></details></section><div class="box" id="type-42"><b>调和判定、配参数与恢复解析函数</b><p>所有解析函数的实部与虚部都必定是调和函数（满足拉普拉斯方程 Δ u=u_{xx}+u_{yy}=0）；反之在单连通域上，任何一个调和函数也一定可以补出唯一（差实常数）的共轭调和函数使其组成解析函数。题目通常有两类：一是给定带参数的实函数使其调和（直接令 Δ u=0 比较系数即可）；二是给定已知实部 u 或虚部 v 恢复完整 f(z)（推荐偏积分法或汤姆逊导数法）。</p></div><h2>第四章 · 级数展开</h2><div class="box" id="type-43"><b>复数列与复数项级数敛散性</b><p>复数列的极限与复数项级数的收敛，完全等价于实部和虚部两个实数列（或实级数）同时收敛。在判别敛散性时，“通项模趋于零”只是级数收敛的必要条件而非充分条件；而若各项模组成的正项级数 ∑ |a_n+ib_n| 收敛，则原级数必绝对收敛（从而收敛）。</p></div><section class="box" id="type-7"><small>第四章 · 高频重点</small><h2>幂级数与收敛边界</h2><p>复幂级数以展开中心 a 为圆心存在唯一的收敛半径 R：在圆内 |z-a|&lt;R 处处绝对收敛，在圆外 |z-a|&gt;R 处处发散。根据阿贝尔定理，只要知道级数在某一点 z_1 收敛（无论条件收敛还是绝对收敛），就能锁定 R≥|z_1-a|；而在收敛圆周 |z-a|=R 上，各种点可能呈现不同的敛散性，必须逐点代入实复级数检验。</p><details><summary>系数比值法</summary><div>R = lim |c<sub>n</sub>/c<sub>n+1</sub>|</div><p>适用条件：用于 ∑ cₙ(z−a)ⁿ，系数最终非零且所写极限存在。圆周必须逐点判断。</p></details><details><summary>泰勒公式</summary><div>cₙ = f<sup>(n)</sup>(a)/n!</div><p>适用条件：f 在以 a 为中心的圆盘内解析时，泰勒级数在该圆盘内等于 f。</p></details><details><summary>解题思路</summary><ol><li>确定中心与半径：读出幂级数的中心 a，用比值法、根值法或给定收敛/发散点到 a 的距离与阿贝尔定理定出半径 R。</li><li>判定内外区域：计算待判点到 a 的距离 |z-a|，严格小于 R 必绝对收敛，严格大于 R 必发散。</li><li>逐点代回边界圆周：对于 |z-a|=R 上的边界点，代入原级数拆实虚部或用交错级数、狄利克雷判别法逐一检验。</li></ol></details><h3>用条件收敛锁定收敛半径</h3><p>已知 ∑cₙ 收敛而 ∑|cₙ| 发散。证明幂级数 ∑cₙzⁿ 的收敛半径为 1。</p><p class="source">本课教材 · 第四章习题 9 · 第 143 页</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><msub><mi>c</mi><mi>n</mi></msub><msup><mi>z</mi><mi>n</mi></msup></mstyle></mrow></math> 的收敛半径为 <math><mrow><mi>R</mi></mrow></math>。当 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 时，该幂级数成为 <math><mrow><mo>∑</mo><msub><mi>c</mi><mi>n</mi></msub></mrow></math>。由题设，<math><mrow><mo>∑</mo><msub><mi>c</mi><mi>n</mi></msub></mrow></math> 收敛而 <math><mrow><mo>∑</mo><mo stretchy="false">|</mo><msub><mi>c</mi><mi>n</mi></msub><mo stretchy="false">|</mo></mrow></math> 发散，因此 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 是一个条件收敛点。</p></li><li><p>若 <math><mrow><mi>R</mi><mo>&#x0003C;</mo><mn>1</mn></mrow></math>，则 <math><mrow><mo stretchy="false">|</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mi>R</mi></mrow></math>，点 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 在收敛圆外，幂级数在那里发散，与题设矛盾。</p></li><li><p>若 <math><mrow><mi>R</mi><mo>&#x0003E;</mo><mn>1</mn></mrow></math>，则 <math><mrow><mo stretchy="false">|</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mi>R</mi></mrow></math>，点 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 在收敛圆内，幂级数在那里绝对收敛，同样与题设矛盾。故 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 必在收敛圆周上，即 <math><mrow><mi>R</mi><mo>=</mo><mo stretchy="false">|</mo><mn>1</mn><mo stretchy="false">|</mo><mo>=</mo><mn>1</mn></mrow></math>。</p></li></ol><strong>结论</strong><p>幂级数 <math><mrow><mo>∑</mo><msub><mi>c</mi><mi>n</mi></msub><msup><mi>z</mi><mi>n</mi></msup></mrow></math> 的收敛半径为 <math><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow></math>。</p></details><h3>换中心作泰勒展开</h3><p>将 (z−1)/(z+1) 展成以 z=1 为中心的泰勒级数，指出收敛半径。</p><p class="source">本课教材 · 第四章习题 12（1） · 第 143 页</p><details><summary>查看完整解答</summary><ol><li><p>以 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 为中心，令 <math><mrow><mi>t</mi><mo>=</mo><mi>z</mi><mo>−</mo><mn>1</mn></mrow></math>，则 <math><mrow><mi>z</mi><mo>+</mo><mn>1</mn><mo>=</mo><mn>2</mn><mo>+</mo><mi>t</mi></mrow></math>。整理得 <math display="block"><mrow><mfrac><mrow><mi>z</mi><mo>−</mo><mn>1</mn></mrow><mrow><mi>z</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn><mo>+</mo><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><mo>·</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>1</mn><mo>−</mo><mo stretchy="false">(</mo><mo>−</mo><mi>t</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>当 <math><mrow><mo stretchy="false">|</mo><mi>t</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>2</mn></mrow></math> 时，公比 <math><mrow><mo>−</mo><mi>t</mi><mo>/</mo><mn>2</mn></mrow></math> 的模小于 <math><mrow><mn>1</mn></mrow></math>。将几何级数乘以 <math><mrow><mi>t</mi><mo>/</mo><mn>2</mn></mrow></math>，再令 <math><mrow><mi>n</mi><mo>=</mo><mi>k</mi><mo>+</mo><mn>1</mn></mrow></math>，得到 <math display="block"><mrow><mfrac><mrow><mi>t</mi></mrow><mrow><mn>2</mn></mrow></mfrac><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><msup><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mo>−</mo><mfrac><mi>t</mi><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mi>k</mi></msup><mo>=</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow><mrow><mo>∞</mo></mrow></munderover><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msup><msup><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mi>t</mi><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mi>n</mi></msup><mo>.</mo></mrow></math></p></li><li><p>由几何级数的收敛条件，展开式在 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>2</mn></mrow></math> 收敛。在 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>≥</mo><mn>2</mn></mrow></math> 时，右侧级数的一般项的模不趋于零，故发散。因此 <math><mrow><mi>R</mi><mo>=</mo><mn>2</mn></mrow></math>。这也等于展开中心 <math><mrow><mn>1</mn></mrow></math> 到最近奇点 <math><mrow><mo>−</mo><mn>1</mn></mrow></math> 的距离。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>z</mi><mo>−</mo><mn>1</mn></mrow><mrow><mi>z</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><mfrac><mrow><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mrow><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msup></mrow><mrow><msup><mn>2</mn><mi>n</mi></msup></mrow></mfrac><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup></mstyle></mrow></math>，收敛半径 <math><mrow><mi>R</mi><mo>=</mo><mn>2</mn></mrow></math>。</p></details><h3>由一个点反求收敛半径</h3><p>∑cₙ(z−1)ⁿ 在 z=i 收敛，但非绝对收敛。求其收敛半径。</p><p class="source">2022 年 6 月 A 卷 · 一(5)</p><details><summary>查看完整解答</summary><ol><li><p>设以 <math><mrow><mn>1</mn></mrow></math> 为中心的幂级数的收敛半径为 <math><mrow><mi>R</mi></mrow></math>。按幂级数的收敛性质，<math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mi>R</mi></mrow></math> 时绝对收敛，<math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mi>R</mi></mrow></math> 时发散。</p></li><li><p>由题意，级数在 <math><mrow><mi>z</mi><mo>=</mo><mi>i</mi></mrow></math> 处收敛，所以 <math><mrow><mo stretchy="false">|</mo><mi>i</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>≤</mo><mi>R</mi></mrow></math>。该点又不是绝对收敛点，所以 <math><mrow><mo stretchy="false">|</mo><mi>i</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>≥</mo><mi>R</mi></mrow></math>。因此 <math><mrow><mi>i</mi></mrow></math> 必在收敛圆周上。</p></li><li><p>计算该点到圆心 <math><mrow><mn>1</mn></mrow></math> 的距离，得 <math display="block"><mrow><mi>R</mi><mo>=</mo><mo stretchy="false">|</mo><mi>i</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>=</mo><msqrt><mrow><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><msup><mn>1</mn><mn>2</mn></msup></mrow></msqrt><mo>=</mo><msqrt><mn>2</mn></msqrt><mo>.</mo></mrow></math></p></li></ol><strong>结论</strong><p><math><mrow><mi>R</mi><mo>=</mo><msqrt><mn>2</mn></msqrt></mrow></math>。</p></details><h3>同一圆周上的两种收敛行为</h3><p>求 ∑<sub>n=1</sub><sup>∞</sup>(z−1)ⁿ/n 的收敛半径，并讨论 z=0 和 z=2。</p><p class="source">ch4.2 第 14–15 页 · 例 1(2)</p><details><summary>查看完整解答</summary><ol><li><p>级数以 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 为中心。令 <math><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup><mo>/</mo><mi>n</mi></mrow></math>。对 <math><mrow><mi>z</mi><mo>≠</mo><mn>1</mn></mrow></math>，相邻两项的模之比满足 <math display="block"><mrow><msub><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>∞</mo></mrow></msub><mrow><mo stretchy="true" fence="true" form="prefix">|</mo><mfrac><mrow><msub><mi>a</mi><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msub></mrow><mrow><msub><mi>a</mi><mi>n</mi></msub></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mo>=</mo><msub><mo>lim</mo><mrow><mi>n</mi><mo>→</mo><mo>∞</mo></mrow></msub><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mfrac><mrow><mi>n</mi></mrow><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>.</mo></mrow></math> 因此 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 时绝对收敛（<math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 时各项为零），<math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math> 时发散，故 <math><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow></math>。</p></li><li><p>在 <math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 处，原级数化为 <math><mrow><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup><mo>/</mo><mi>n</mi></mrow></math>。由于 <math><mrow><mn>1</mn><mo>/</mo><mi>n</mi></mrow></math> 单调递减且趋于零，按交错级数判别法收敛。其绝对值级数 <math><mrow><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><mn>1</mn><mo>/</mo><mi>n</mi></mrow></math> 发散，所以在此点条件收敛。</p></li><li><p>在 <math><mrow><mi>z</mi><mo>=</mo><mn>2</mn></mrow></math> 处，原级数就是发散的调和级数 <math><mrow><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>1</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><mn>1</mn><mo>/</mo><mi>n</mi></mrow></math>。</p></li></ol><strong>结论</strong><p>收敛半径为 <math><mrow><mi>R</mi><mo>=</mo><mn>1</mn></mrow></math>。<math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 处条件收敛，<math><mrow><mi>z</mi><mo>=</mo><mn>2</mn></mrow></math> 处发散。</p></details></section><div class="box" id="type-44"><b>幂级数半径、边界和阿贝尔定理</b><p>对于任何幂级数 ∑ c_n(z-z_0)^n，平面上的点总被以 z_0 为圆心、R 为半径的收敛圆清晰地一分为二：圆内绝对收敛，圆外发散。阿贝尔定理进一步确立了收敛域的“圆盘完整性”——只要给定一个收敛点和一个发散点，就能把未知的收敛半径 R 夹在它们到中心距离的闭区间之内。</p></div><div class="box" id="type-45"><b>逐项积分或求导得到和函数</b><p>幂级数在其收敛圆 |z-z_0|&lt;R 内部表现得像多项式一样优良：和函数处处解析，且允许在收敛圆内部无限次逐项求导与逐项积分，更关键的是求导或积分后收敛半径 R 保持不变。借助这一性质，可将带多项式系数 n 或 1/n 的幂级数反复与几何级数 ∑ z^n = 1/(1-z) 相互转化。</p></div><div class="box" id="type-46"><b>泰勒展开与最近奇点法</b><p>函数在点 z_0 解析当且仅当它能在 z_0 的某个圆邻域内展开为唯一的泰勒级数，且最大收敛圆恰好扩张到碰见第一个奇点为止——因此不必费力计算高阶导数，中心 z_0 到函数最近不可去奇点的距离直接给出了泰勒级数的收敛半径。做具体展开时应采用间接法：配出 z-z_0 后转化为六大基本麦克劳林公式。</p></div><section class="box" id="type-8"><small>第四章 · 核心必考</small><h2>指定圆环上的洛朗展开</h2><p>解析函数在圆盘内只能用非负幂泰勒级数表示，但在挖去了奇点的圆环域 R_1&lt;|z-a|&lt;R_2 内，负幂项的加入使得展开成为可能，且在同一圆环内展开式唯一。展开有理分式的全部秘诀是“分项变中心、谁大提谁做分母”：通过平移 w=z-a 后，保证每一项几何级数展开的公比严格满足 |q|&lt;1。</p><details><summary>几何级数</summary><div>1/(1−q) = 1+q+q²+⋯</div><p>适用条件：仅在 |q|<1 时成立。指定内外半径决定取 z/a 还是 a/z。</p></details><details><summary>洛朗展开</summary><div>f(z) = ∑<sub>n∈ℤ</sub> cₙ(z−a)ⁿ</div><p>适用条件：f 在以 a 为中心的给定开圆环内解析。展开系数与所选圆环有关。</p></details><details><summary>解题思路</summary><ol><li>设偏移量并裂项：令 w=z-a，将圆环条件改写为 R_1&lt;|w|&lt;R_2；利用部分分式将有理函数拆成形如 A/(w-b) 的最简分式之和。</li><li>分环确定公比：在当前圆环内逐个比较 |w| 与 |b|：若 |w|&lt;|b| 则提出 -b 展为正幂级数；若 |w|&gt;|b| 则提出 w 展为负幂级数；若 b=0 则保留为 A w^{-1} 不动。</li><li>合并幂次写收敛域：把所有展式合并整理，写出 (z-a) 的正负幂级数表达式，并在括号内标明各项收敛域的交集。</li></ol></details><h3>在两个不同中心的圆环内展开</h3><p>将 f(z)=1/[(z−1)(z−2)] 分别在 0&lt;|z−1|&lt;1 和 1&lt;|z−2|&lt;∞ 内展开为洛朗级数。</p><p class="source">本课教材 · 第四章习题 16（3） · 第 144 页</p><details><summary>查看完整解答</summary><ol><li><p>先做部分分式分解。<math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>z</mi><mo>−</mo><mn>2</mn></mrow></mfrac><mo>−</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mi>z</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mo>.</mo></mrow></math> 两个圆环的中心不同，须分别选取展开变量。</p></li><li><p>在 <math><mrow><mn>0</mn><mo>&#x0003C;</mo><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 内令 <math><mrow><mi>t</mi><mo>=</mo><mi>z</mi><mo>−</mo><mn>1</mn></mrow></math>。此时 <math><mrow><mi>z</mi><mo>−</mo><mn>2</mn><mo>=</mo><mi>t</mi><mo>−</mo><mn>1</mn></mrow></math>，并且 <math><mrow><mo stretchy="false">|</mo><mi>t</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>，所以 <math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mo>−</mo><mfrac><mn>1</mn><mi>t</mi></mfrac><mo>=</mo><mo>−</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><msup><mi>t</mi><mi>n</mi></msup><mo>−</mo><mfrac><mn>1</mn><mi>t</mi></mfrac><mo>.</mo></mrow></math> 因为圆环不含 <math><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow></math>，负幂项 <math><mrow><msup><mi>t</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math> 在整个圆环上有定义。</p></li><li><p>在 <math><mrow><mn>1</mn><mo>&#x0003C;</mo><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>2</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mo>∞</mo></mrow></math> 内令 <math><mrow><mi>s</mi><mo>=</mo><mi>z</mi><mo>−</mo><mn>2</mn></mrow></math>。此时 <math><mrow><mi>z</mi><mo>−</mo><mn>1</mn><mo>=</mo><mi>s</mi><mo>+</mo><mn>1</mn></mrow></math>，并且 <math><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>/</mo><mi>s</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>。用 <math><mrow><msup><mi>s</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math> 按几何级数展开得 <math display="block"><mrow><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><mo>−</mo><mfrac><mn>1</mn><mrow><mi>s</mi><mo>+</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><mo>−</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>k</mi></msup><msup><mi>s</mi><mrow><mo>−</mo><mi>k</mi></mrow></msup><mspace linebreak="newline" /><mo>=</mo><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mrow><mo>∞</mo></mrow></munderover><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msup><msup><mi>s</mi><mrow><mo>−</mo><mi>k</mi><mo>−</mo><mn>1</mn></mrow></msup><mo>=</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup><msup><mi>s</mi><mrow><mo>−</mo><mi>n</mi><mo>−</mo><mn>2</mn></mrow></msup><mo>.</mo></mrow></mrow></math> <math><mrow><msup><mi>s</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math> 项相消，故首项是 <math><mrow><msup><mi>s</mi><mrow><mo>−</mo><mn>2</mn></mrow></msup></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mn>0</mn><mo>&#x0003C;</mo><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 时，<math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mrow><mi>z</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mo>−</mo><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup></mstyle></mrow></math>。<math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mn>2</mn><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math> 时，<math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><mfrac><mrow><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>2</mn><msup><mo stretchy="false">)</mo><mrow><mi>n</mi><mo>+</mo><mn>2</mn></mrow></msup></mrow></mfrac></mstyle></mrow></math>。</p></details><h3>分别展开两个分式</h3><p>将 1/[(z−1)(z−2)] 在 1<|z|<2 内展开为以 0 为中心的洛朗级数。</p><p class="source">ch4.4 第 30–33 页 · 例 3(2)</p><details><summary>查看完整解答</summary><ol><li><p>记 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>/</mo><mo stretchy="false">[</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><mo stretchy="false">]</mo></mrow></math>。先作部分分式分解 <math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mi>z</mi><mo>−</mo><mn>2</mn></mrow></mfrac><mo>−</mo><mfrac><mn>1</mn><mrow><mi>z</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mo>.</mo></mrow></math> 两个分式须分别改写，使几何级数的公比在题设圆环内均满足模小于 <math><mrow><mn>1</mn></mrow></math>。</p></li><li><p>在 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>2</mn></mrow></math> 时有 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>/</mo><mn>2</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>，故 <math display="block"><mrow><mfrac><mn>1</mn><mrow><mi>z</mi><mo>−</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mspace width="0.167em" /><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mi>z</mi><mo>/</mo><mn>2</mn></mrow></mfrac><mo>=</mo><mo>−</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><mfrac><mrow><msup><mi>z</mi><mi>n</mi></msup></mrow><mrow><msup><mn>2</mn><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msup></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>在 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math> 时有 <math><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>/</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>，故 <math display="block"><mrow><mfrac><mn>1</mn><mrow><mi>z</mi><mo>−</mo><mn>1</mn></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mi>z</mi></mfrac><mspace width="0.167em" /><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></mfrac><mo>=</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><msup><mi>z</mi><mrow><mo>−</mo><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msup><mo>.</mo></mrow></math></p></li><li><p>两个展开同时成立的范围为 <math><mrow><mn>1</mn><mo>&#x0003C;</mo><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>2</mn></mrow></math>。将第二个展开式从第一个展开式中减去，即得以 <math><mrow><mn>0</mn></mrow></math> 为中心的洛朗级数。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mo>−</mo><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><mfrac><mrow><msup><mi>z</mi><mi>n</mi></msup></mrow><mrow><msup><mn>2</mn><mrow><mi>n</mi><mo>+</mo><mn>1</mn></mrow></msup></mrow></mfrac><mo>−</mo><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><msup><mi>z</mi><mrow><mo>−</mo><mi>n</mi><mo>−</mo><mn>1</mn></mrow></msup><mo>,</mo><mspace width="2em" /><mn>1</mn><mo>&#x0003C;</mo><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>2</mn></mstyle></mrow></math>。</p></details><h3>单位圆外的负幂展开</h3><p>在 |z|>1 内展开 1/[z²(z−1)]。</p><p class="source">2022 年 6 月 A 卷 · 四(2)</p><details><summary>查看完整解答</summary><ol><li><p>因为 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math>，所以 <math><mrow><mi>z</mi><mo>≠</mo><mn>0</mn></mrow></math> 且 <math><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>/</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>。将含 <math><mrow><mi>z</mi><mo>−</mo><mn>1</mn></mrow></math> 的因式提出 <math><mrow><mi>z</mi></mrow></math>，得到 <math display="block"><mrow><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mn>2</mn></msup><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mn>3</mn></msup></mrow></mfrac><mspace width="0.167em" /><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>利用几何级数 <math><mrow><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mi>w</mi></mrow></mfrac><mo>=</mo><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><msup><mi>w</mi><mi>n</mi></msup></mrow></math>（<math><mrow><mo stretchy="false">|</mo><mi>w</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>），取 <math><mrow><mi>w</mi><mo>=</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></math>，得 <math display="block"><mrow><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mn>2</mn></msup><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mn>3</mn></msup></mrow></mfrac><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><msup><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mn>1</mn><mi>z</mi></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mi>n</mi></msup><mo>=</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mrow><mi>n</mi><mo>+</mo><mn>3</mn></mrow></msup></mrow></mfrac><mo>.</mo></mrow></math> 其前几项为 <math><mrow><msup><mi>z</mi><mrow><mo>−</mo><mn>3</mn></mrow></msup><mo>+</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>4</mn></mrow></msup><mo>+</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>5</mn></mrow></msup><mo>+</mo><mo>⋯</mo></mrow></math>。</p></li></ol><strong>结论</strong><p>所求洛朗级数为 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><msup><mi>z</mi><mrow><mo>−</mo><mi>n</mi><mo>−</mo><mn>3</mn></mrow></msup></mstyle></mrow></math>，收敛范围为 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math>。</p></details><h3>比较单位圆内外的展开</h3><p>对 f(z)=1/(z³−z⁴)，分别求 0<|z|<1 与 |z|>1 上的洛朗展开。</p><p class="source">补充教材 Complex Analysis · §7.3 习题 1</p><details><summary>查看完整解答</summary><ol><li><p>先分解分母，得到 <math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mn>3</mn></msup><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>z</mi><mo stretchy="false">)</mo></mrow></mfrac><mo>.</mo></mrow></math> 为使用几何级数，需在两个区域内分别选取模小于 <math><mrow><mn>1</mn></mrow></math> 的公比。</p></li><li><p>在 <math><mrow><mn>0</mn><mo>&#x0003C;</mo><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 内，直接取公比 <math><mrow><mi>z</mi></mrow></math>，得 <math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mn>3</mn></msup></mrow></mfrac><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><msup><mi>z</mi><mi>n</mi></msup><mo>=</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><msup><mi>z</mi><mrow><mi>n</mi><mo>−</mo><mn>3</mn></mrow></msup><mo>.</mo></mrow></math> 前几项为 <math><mrow><msup><mi>z</mi><mrow><mo>−</mo><mn>3</mn></mrow></msup><mo>+</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>2</mn></mrow></msup><mo>+</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup><mo>+</mo><mn>1</mn><mo>+</mo><mi>z</mi><mo>+</mo><mo>⋯</mo></mrow></math>。</p></li><li><p>在 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math> 内，写 <math><mrow><mn>1</mn><mo>−</mo><mi>z</mi><mo>=</mo><mo>−</mo><mi>z</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi><mo stretchy="false">)</mo></mrow></math>。此时 <math><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>/</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>，得 <math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mn>4</mn></msup></mrow></mfrac><mspace width="0.167em" /><mfrac><mn>1</mn><mrow><mn>1</mn><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></mfrac><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mrow><msup><mi>z</mi><mn>4</mn></msup></mrow></mfrac><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><msup><mi>z</mi><mrow><mo>−</mo><mi>n</mi></mrow></msup><mo>=</mo><mo>−</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><msup><mi>z</mi><mrow><mo>−</mo><mi>n</mi><mo>−</mo><mn>4</mn></mrow></msup><mo>.</mo></mrow></math> 前几项为 <math><mrow><mo>−</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>4</mn></mrow></msup><mo>−</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>5</mn></mrow></msup><mo>−</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>6</mn></mrow></msup><mo>−</mo><mo>⋯</mo></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mn>0</mn><mo>&#x0003C;</mo><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 时为 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><msup><mi>z</mi><mrow><mi>n</mi><mo>−</mo><mn>3</mn></mrow></msup></mstyle></mrow></math>，<math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn></mrow></math> 时为 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mo>−</mo><msubsup><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></msubsup><msup><mi>z</mi><mrow><mo>−</mo><mi>n</mi><mo>−</mo><mn>4</mn></mrow></msup></mstyle></mrow></math>。</p></details></section><div class="box" id="type-47"><b>双边幂级数与多圆环洛朗展开</b><p>双边幂级数拆为正幂解析部分（收敛于圆内 |z-z_0|&lt;R_1）和负幂主要部分（等价于关于 1/(z-z_0) 的幂级数，收敛于圆外 |z-z_0|&gt;R_2）；当 R_2&lt;R_1 时两者的交集就是开圆环。对于有理函数在多个同心圆环内的洛朗展开，本质是以展开中心为圆心、过各奇点画同心圆，把复平面划分成若干个不含奇点的环形区域，在每一环上独立选取 |q|&lt;1 展开。</p></div><div class="box" id="type-79"><b>洛朗系数、主部与展开存在性</b><p>洛朗级数的第 n 项系数 c_n 既可以通过局部已知的几何/麦克劳林展开直接抽取目标幂次得到，也可以由围绕中心在解析圆环内的围线积分 (1)/(2π i)∮ f(ζ)(ζ-z_0)^{-n-1} dζ 确定。在求特定系数时只需展开到覆盖目标幂次的前几项即可，但绝不能将内环与外环的展开系数混淆。</p></div><h2>第五章 · 留数及其应用</h2><section class="box" id="type-9"><small>第五章 · 核心必考</small><h2>孤立奇点与阶数</h2><p>奇点的本质由函数在去心邻域 0&lt;|z-a|&lt;δ 内洛朗展开的负幂项（主要部分）决定：无负幂项对应极限有限的“可去奇点”；仅含有限项至 (z-a)^{-m} 的对应趋于无穷的“m 阶极点”；含无穷多负幂项的则是函数值剧烈振荡的“本性奇点”。判别商函数的极点阶数最快捷的方式是比较分子与分母的首个非零泰勒幂次之差。</p><details><summary>极点判据</summary><div>lim<sub>z→a</sub>(z−a)<sup>m</sup>f(z) = A ≠ 0</div><p>适用条件：a 为孤立奇点，m 为正整数，A 有限，则 a 为 m 阶极点。</p></details><details><summary>洛朗主部</summary><div>c<sub>−1</sub>/(z−a) + c<sub>−2</sub>/(z−a)² + ⋯</div><p>适用条件：去心邻域内，零主部对应可去奇点；有限非零主部对应极点；无限多负幂项对应本性奇点。</p></details><details><summary>解题思路</summary><ol><li>验孤立排除非孤立点：解出分母零点、对数或根式支点及复合奇点，确认目标点周围是否存在完全解析的去心邻域。</li><li>求分子分母首阶幂：对可解析的分子分母分别用泰勒首项或求导法确定零点阶数（遇加减式先通分），指数或三角复合负幂直接展开。</li><li>差值或主部定类型：由分母阶数减去分子阶数确定极点阶数或可去性；若主部有无穷多项或极限沿不同方向行为迥异，判定为本性奇点。</li></ol></details><h3>由分母的因子判断各极点阶数</h3><p>求 f(z)=1/[z(z²+1)²] 在有限复平面内的全部极点及阶数。</p><p class="source">本课教材 · 第五章习题 1（1） · 第 183 页</p><details><summary>查看完整解答</summary><ol><li><p>分解分母得 <math><mrow><mi>z</mi><mo stretchy="false">(</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>=</mo><mi>z</mi><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></math>。因此有限复平面中的待判点仅为 <math><mrow><mn>0</mn><mo>,</mo><mi>i</mi><mo>,</mo><mo>−</mo><mi>i</mi></mrow></math>。若 <math><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>a</mi><msup><mo stretchy="false">)</mo><mi>m</mi></msup><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo></mrow></math> 可解析延拓到 <math><mrow><mi>a</mi></mrow></math> 且在 <math><mrow><mi>a</mi></mrow></math> 处非零，则 <math><mrow><mi>a</mi></mrow></math> 为 <math><mrow><mi>m</mi></mrow></math> 阶极点。</p></li><li><p>在 <math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 处，<math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>z</mi><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mo stretchy="false">(</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle></mrow></math> 解析，且在 <math><mrow><mn>0</mn></mrow></math> 处等于 <math><mrow><mn>1</mn></mrow></math>，所以 <math><mrow><mn>0</mn></mrow></math> 为一阶极点。</p></li><li><p>在 <math><mrow><mi>z</mi><mo>=</mo><mi>i</mi></mrow></math> 处，<math><mrow><mstyle displaystyle="true" scriptlevel="0"><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mi>z</mi><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle></mrow></math> 解析，且在 <math><mrow><mi>i</mi></mrow></math> 处等于 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn></mrow><mrow><mi>i</mi><mo stretchy="false">(</mo><mn>2</mn><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>i</mi><mn>4</mn></mfrac></mstyle></mrow></math>，所以 <math><mrow><mi>i</mi></mrow></math> 为二阶极点。</p></li><li><p>在 <math><mrow><mi>z</mi><mo>=</mo><mo>−</mo><mi>i</mi></mrow></math> 处，<math><mrow><mstyle displaystyle="true" scriptlevel="0"><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mi>z</mi><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle></mrow></math> 解析，且在 <math><mrow><mo>−</mo><mi>i</mi></mrow></math> 处等于 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn></mrow><mrow><mo stretchy="false">(</mo><mo>−</mo><mi>i</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mo>−</mo><mn>2</mn><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle><mo>=</mo><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>i</mi><mn>4</mn></mfrac></mstyle></mrow></math>，所以 <math><mrow><mo>−</mo><mi>i</mi></mrow></math> 为二阶极点。</p></li></ol><strong>结论</strong><p>全部有限极点为 <math><mrow><mn>0</mn><mo>,</mo><mi>i</mi><mo>,</mo><mo>−</mo><mi>i</mi></mrow></math>，阶数依次为 <math><mrow><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>2</mn></mrow></math>。</p></details><h3>相消后的极点阶数</h3><p>判定 z sin z/(eᶻ−z−1)² 在原点的奇点类型。</p><p class="source">ch5.1 第 24 页 · 例 4(1)</p><details><summary>查看完整解答</summary><ol><li><p>在原点展开分子和分母中未平方的因式，得 <math display="block"><mrow><mi>z</mi><mi>sin</mi><mi>z</mi><mo>=</mo><msup><mi>z</mi><mn>2</mn></msup><mo>−</mo><mfrac><mrow><msup><mi>z</mi><mn>4</mn></msup></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><msup><mi>z</mi><mn>6</mn></msup><mo stretchy="false">)</mo><mo>,</mo><mspace width="2em" /><msup><mi>e</mi><mi>z</mi></msup><mo>−</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo>=</mo><mfrac><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mfrac><mrow><msup><mi>z</mi><mn>3</mn></msup></mrow><mrow><mn>6</mn></mrow></mfrac><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><msup><mi>z</mi><mn>4</mn></msup><mo stretchy="false">)</mo><mo>.</mo></mrow></math></p></li><li><p>令 <math><mrow><mi>A</mi><mo stretchy="fa
