e_Fourier_Transform_%28CTFT%29">补充教材 Baraniuk 等 · §8.2 练习 2</a></p><details><summary>查看完整解答</summary><ol><li><p><math><mrow><mi>H</mi></mrow></math> 有界且在 <math><mrow><mo stretchy="false">[</mo><mo>−</mo><mi>M</mi><mo>,</mo><mi>M</mi><mo stretchy="false">]</mo></mrow></math> 外为零，因此逆变换积分绝对收敛。按本章的傅里叶变换约定，<math display="block"><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mi>H</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>ω</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msubsup><mo>∫</mo><mrow><mo>−</mo><mi>M</mi></mrow><mi>M</mi></msubsup><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>ω</mi><mo>.</mo></mrow></math></p></li><li><p>当 <math><mrow><mi>t</mi><mo>≠</mo><mn>0</mn></mrow></math> 时，直接取原函数并用欧拉公式。<math display="block"><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mfrac><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup></mrow><mrow><mi>i</mi><mi>t</mi></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mrow><mo>−</mo><mi>M</mi></mrow><mi>M</mi></msubsup><mo>=</mo><mfrac><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>M</mi><mi>t</mi></mrow></msup><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>M</mi><mi>t</mi></mrow></msup></mrow><mrow><mn>2</mn><mi>π</mi><mi>i</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mi>M</mi><mi>t</mi><mo stretchy="false">)</mo></mrow><mrow><mi>π</mi><mi>t</mi></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>当 <math><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow></math> 时，原积分的指数因子恒为 <math><mrow><mn>1</mn></mrow></math>，故 <math><mrow><mi>h</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msubsup><mo>∫</mo><mrow><mo>−</mo><mi>M</mi></mrow><mi>M</mi></msubsup><mn>1</mn><mspace width="0.167em" /><mi>d</mi><mi>ω</mi><mo>=</mo><mi>M</mi><mo>/</mo><mi>π</mi></mrow></math>。这也等于 <math><mrow><msub><mo>lim</mo><mrow><mi>t</mi><mo>→</mo><mn>0</mn></mrow></msub><mi>sin</mi><mo stretchy="false">(</mo><mi>M</mi><mi>t</mi><mo stretchy="false">)</mo><mo>/</mo><mo stretchy="false">(</mo><mi>π</mi><mi>t</mi><mo stretchy="false">)</mo></mrow></math>。</p></li></ol><strong>结论</strong><p><math display="block"><mrow><mi>h</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mrow><mo stretchy="true" fence="true" form="prefix">{</mo><mtable><mtr><mtd columnalign="left"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mi>M</mi><mi>t</mi><mo stretchy="false">)</mo></mrow><mrow><mi>π</mi><mi>t</mi></mrow></mfrac></mstyle><mo>,</mo></mtd><mtd columnalign="left"><mi>t</mi><mo>≠</mo><mn>0</mn><mo>,</mo></mtd></mtr><mtr><mtd columnalign="left"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mi>M</mi><mi>π</mi></mfrac></mstyle><mo>,</mo></mtd><mtd columnalign="left"><mi>t</mi><mo>=</mo><mn>0</mn><mo>.</mo></mtd></mtr></mtable></mrow></mrow></math></p></details><h3>脉冲变窄并向右平移</h3><p>p(t) 在 |t|&lt;1 时为 1，其余为 0。求 p(2(t−3)) 的傅里叶变换，并给出零频值。</p><p>专题自编 · 尺度与时移</p><details><summary>查看完整解答</summary><ol><li><p>记 <math><mrow><mi mathvariant="script">F</mi><mo stretchy="false">[</mo><mi>p</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><mi>P</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo></mrow></math>。由矩形脉冲的支撑区间，<math display="block"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mn>1</mn></mrow><mrow><mn>1</mn></mrow></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mrow><mo stretchy="true" fence="true" form="prefix">{</mo><mtable><mtr><mtd columnalign="left"><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>2</mn><mi>sin</mi><mi>ω</mi></mrow><mrow><mi>ω</mi></mrow></mfrac></mstyle><mo>,</mo></mtd><mtd columnalign="left"><mi>ω</mi><mo>≠</mo><mn>0</mn><mo>,</mo></mtd></mtr><mtr><mtd columnalign="left"><mn>2</mn><mo>,</mo></mtd><mtd columnalign="left"><mi>ω</mi><mo>=</mo><mn>0</mn><mo>.</mo></mtd></mtr></mtable></mrow></mrow></math></p></li><li><p>令 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>p</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math>。在傅里叶积分中令 <math><mrow><mi>u</mi><mo>=</mo><mn>2</mn><mi>t</mi></mrow></math>，则 <math display="block"><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mi>p</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>P</mi><mo stretchy="false">(</mo><mi>ω</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 其中 <math><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac></mrow></math> 来自 <math><mrow><mi>d</mi><mi>t</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mspace width="0.167em" /><mi>d</mi><mi>u</mi></mrow></math>。</p></li><li><p>所求信号为 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="false">)</mo></mrow></math>。令 <math><mrow><mi>v</mi><mo>=</mo><mi>t</mi><mo>−</mo><mn>3</mn></mrow></math>，则 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>3</mn><mi>i</mi><mi>ω</mi></mrow></msup><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>v</mi></mrow></msup></mrow></math>，故 <math display="block"><mrow><mi mathvariant="script">F</mi><mo stretchy="false">[</mo><mi>p</mi><mo stretchy="false">(</mo><mn>2</mn><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="false">)</mo><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>3</mn><mi>i</mi><mi>ω</mi></mrow></msup><mi>G</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>3</mn><mi>i</mi><mi>ω</mi></mrow></msup><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mi>ω</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><mrow><mi>ω</mi><mo>/</mo><mn>2</mn></mrow></mfrac><mspace width="1em" /><mo stretchy="false">(</mo><mi>ω</mi><mo>≠</mo><mn>0</mn><mo stretchy="false">)</mo><mo>.</mo></mrow></math></p></li><li><p>在 <math><mrow><mi>ω</mi><mo>=</mo><mn>0</mn></mrow></math> 处，频谱值为信号的面积。由 <math><mrow><mo stretchy="false">|</mo><mn>2</mn><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="false">)</mo><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 知其支撑区间为 <math><mrow><mo stretchy="false">(</mo><mn>5</mn><mo>/</mo><mn>2</mn><mo>,</mo><mn>7</mn><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></math>，高度为 <math><mrow><mn>1</mn></mrow></math>，故零频值为 <math><mrow><mn>1</mn></mrow></math>，也与上式的极限一致。</p></li></ol><strong>结论</strong><p><math><mrow><mi mathvariant="script">F</mi><mo stretchy="false">[</mo><mi>p</mi><mo stretchy="false">(</mo><mn>2</mn><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>3</mn><mo stretchy="false">)</mo><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>3</mn><mi>i</mi><mi>ω</mi></mrow></msup><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>2</mn><mi>sin</mi><mo stretchy="false">(</mo><mi>ω</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><mrow><mi>ω</mi></mrow></mfrac></mstyle></mrow></math>（<math><mrow><mi>ω</mi><mo>≠</mo><mn>0</mn></mrow></math>），零频值为 <math><mrow><mn>1</mn></mrow></math>。</p></details></section><div class="box" id="type-65"><b>对偶、微分、调制与组合性质</b><p>在本课非对称角频率约定下，正逆变换几乎只在指数符号与 2π 系数上有所不同，这直接催生了极为强悍的“对称性（互易律）”：F[F(t)] = 2π f(-ω)。配合微分性质（时域求导乘 iω，乘 t 对应频域求导 i F&#x27;(ω)），无需硬算含参广义积分，即可将 (1)/(1+t^2)、(sin t)/(t) 与 (t)/((1+t^2)^2) 等经典频谱一步推导出。</p></div><section class="box" id="type-17"><small>第七章 · 核心必考</small><h2>傅里叶卷积与能量积分</h2><p>全轴卷积 (f*g)(t)=∫_{-∞}^{∞}f(τ)g(t-τ) dτ 在频域中退化为简单的乘积 F(ω)G(ω)。帕塞瓦尔能量恒等式更建立起时域能量与频域能量的精确守恒关系（相差一个 1/(2π) 系数），这使得许多难以直接积出原函数的平方反常积分（如 ∫_0^∞ (sin^2 t)/(t^2) dt）瞬间化为简单的矩形面积计算。</p><details><summary>全轴卷积</summary><div>(f∗g)(t)=∫<sub>−∞</sub><sup>∞</sup> f(τ)g(t−τ)dτ　 ↔　 F(ω)G(ω)</div><p>适用条件：f、g 绝对可积时可用。矩形脉冲卷积时，只需对两个支撑区间的交集积分。</p></details><details><summary>帕塞瓦尔等式</summary><div>∫<sub>−∞</sub><sup>∞</sup> |f(t)|²dt = (1/2π)∫<sub>−∞</sub><sup>∞</sup> |F(ω)|²dω</div><p>适用条件：f 平方可积，频谱按同一角频率约定取。实偶被积函数在半轴的积分等于全轴一半。</p></details><details><summary>解题思路</summary><ol><li>分流判定时域或频域法：若题中问脉冲卷积波形，列出 f(τ) 与 g(t-τ) 的非零区间交集并按 t 分段积分；若频域更容易，则转为频谱相乘后再反演。</li><li>能量积分逆配原信号：若题目要求求 ∫ |F(ω)|^2 dω 形平方积分，逆向认出对应的原时域信号 f(t)（通常是简单的门函数或衰减指数）。</li><li>核对 2π 与半轴折算：套入帕塞瓦尔等式计算较容易一侧的平方积分，并检查半轴 [0,∞) 偶对称折半因子。</li></ol></details><h3>两个矩形脉冲的自卷积</h3><p>单位高度脉冲 p 在 [−1,1] 内为 1，区间外为 0。求 p∗p。</p><p><a href="https://math.libretexts.org/Bookshelves/Differential_Equations/Introduction_to_Partial_Differential_Equations_%28Herman%29/09%3A_Transform_Techniques_in_Physics/9.06%3A_The_Convolution_Operation">补充教材 Herman · §9.6 例 3、4</a></p><details><summary>查看完整解答</summary><ol><li><p><math><mrow><mi>p</mi></mrow></math> 有界且有紧支撑，因此卷积积分存在。<math display="block"><mrow><mo stretchy="false">(</mo><mi>p</mi><mo>*</mo><mi>p</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mi>p</mi><mo stretchy="false">(</mo><mi>τ</mi><mo stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>τ</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>τ</mi><mo>.</mo></mrow></math> 被积函数等于 <math><mrow><mn>1</mn></mrow></math> 当且仅当 <math><mrow><mi>τ</mi><mo>∈</mo><mo stretchy="false">[</mo><mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow></math> 且 <math><mrow><mi>t</mi><mo>−</mo><mi>τ</mi><mo>∈</mo><mo stretchy="false">[</mo><mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow></math>，即 <math><mrow><mi>τ</mi></mrow></math> 同时属于 <math><mrow><mo stretchy="false">[</mo><mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow></math> 和 <math><mrow><mo stretchy="false">[</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo>,</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo stretchy="false">]</mo></mrow></math>。因此卷积值等于这两个区间的交长。</p></li><li><p>当 <math><mrow><mi>t</mi><mo>&#x0003C;</mo><mo>−</mo><mn>2</mn></mrow></math> 或 <math><mrow><mi>t</mi><mo>&#x0003E;</mo><mn>2</mn></mrow></math> 时，两区间无交集，卷积值为零。在 <math><mrow><mi>t</mi><mo>=</mo><mi>±</mi><mn>2</mn></mrow></math> 时只有一个公共点，积分仍为零。</p></li><li><p>当 <math><mrow><mo>−</mo><mn>2</mn><mo>≤</mo><mi>t</mi><mo>≤</mo><mn>0</mn></mrow></math> 时，交集为 <math><mrow><mo stretchy="false">[</mo><mo>−</mo><mn>1</mn><mo>,</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo stretchy="false">]</mo></mrow></math>，积分为 <math><mrow><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><mi>t</mi><mo>+</mo><mn>2</mn></mrow></math>。当 <math><mrow><mn>0</mn><mo>≤</mo><mi>t</mi><mo>≤</mo><mn>2</mn></mrow></math> 时，交集为 <math><mrow><mo stretchy="false">[</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow></math>，积分为 <math><mrow><mn>1</mn><mo>−</mo><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><mo>−</mo><mi>t</mi></mrow></math>。</p></li><li><p>两段非零表达式以 <math><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow></math> 为对称点，且在 <math><mrow><mi>t</mi><mo>=</mo><mn>0</mn></mrow></math> 都等于 <math><mrow><mn>2</mn></mrow></math>，与 <math><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>τ</mi><mo stretchy="false">)</mo><mi>p</mi><mo stretchy="false">(</mo><mo>−</mo><mi>τ</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow></math> 在 <math><mrow><mo stretchy="false">[</mo><mo>−</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo stretchy="false">]</mo></mrow></math> 上积分的结果一致。</p></li></ol><strong>结论</strong><p><math display="block"><mrow><mo stretchy="false">(</mo><mi>p</mi><mo>*</mo><mi>p</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mrow><mo stretchy="true" fence="true" form="prefix">{</mo><mtable><mtr><mtd columnalign="left"><mn>2</mn><mo>−</mo><mo stretchy="false">|</mo><mi>t</mi><mo stretchy="false">|</mo><mo>,</mo></mtd><mtd columnalign="left"><mo stretchy="false">|</mo><mi>t</mi><mo stretchy="false">|</mo><mo>≤</mo><mn>2</mn><mo>,</mo></mtd></mtr><mtr><mtd columnalign="left"><mn>0</mn><mo>,</mo></mtd><mtd columnalign="left"><mo stretchy="false">|</mo><mi>t</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>2</mn><mo>.</mo></mtd></mtr></mtable></mrow></mrow></math></p></details><h3>由脉冲能量求 sinc 平方积分</h3><p>利用矩形脉冲求 ∫₀<sup>∞</sup>(sin x/x)²dx。</p><p>专题自编 · 帕塞瓦尔等式</p><details><summary>查看完整解答</summary><ol><li><p>令 <math><mrow><mi>p</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow></math>（<math><mrow><mo stretchy="false">|</mo><mi>t</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>），其余处为 <math><mrow><mn>0</mn></mrow></math>。它属于 <math><mrow><msup><mi>L</mi><mn>1</mn></msup><mo>∩</mo><msup><mi>L</mi><mn>2</mn></msup></mrow></math>，可应用傅里叶变换的帕塞瓦尔等式。时域能量为 <math><mrow><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mo stretchy="false">|</mo><mi>p</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mn>1</mn></mrow><mrow><mn>1</mn></mrow></msubsup><mn>1</mn><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mn>2</mn></mrow></math>。</p></li><li><p>由傅里叶变换定义，<math><mrow><mi>ω</mi><mo>≠</mo><mn>0</mn></mrow></math> 时 <math display="block"><mrow><mi>P</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mn>1</mn></mrow><mn>1</mn></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mfrac><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi></mrow></msup><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi></mrow></msup></mrow><mrow><mi>i</mi><mi>ω</mi></mrow></mfrac><mo>=</mo><mn>2</mn><mfrac><mrow><mi>sin</mi><mi>ω</mi></mrow><mrow><mi>ω</mi></mrow></mfrac><mo>.</mo></mrow></math> 在 <math><mrow><mi>ω</mi><mo>=</mo><mn>0</mn></mrow></math> 处，其连续延拓值为 <math><mrow><mi>P</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn></mrow></math>。</p></li><li><p>按 <math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><mo>∫</mo><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi></mrow></math> 的约定，帕塞瓦尔等式含因子 <math><mrow><mn>1</mn><mo>/</mo><mo stretchy="false">(</mo><mn>2</mn><mi>π</mi><mo stretchy="false">)</mo></mrow></math>。设所求积分为 <math><mrow><mi>I</mi></mrow></math>，利用 <math><mrow><msup><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mi>sin</mi><mi>ω</mi><mo>/</mo><mi>ω</mi><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mn>2</mn></msup></mrow></math> 的偶性，有 <math display="block"><mrow><mn>2</mn><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mo stretchy="false">|</mo><mi>P</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mspace width="0.167em" /><mi>d</mi><mi>ω</mi><mo>=</mo><mfrac><mn>4</mn><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><mo>·</mo><mn>2</mn><mi>I</mi><mo>=</mo><mfrac><mn>4</mn><mi>π</mi></mfrac><mi>I</mi><mo>.</mo></mrow></math></p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∫</mo><mn>0</mn><mrow><mo>∞</mo></mrow></msubsup><msup><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mrow><mi>sin</mi><mi>x</mi></mrow><mrow><mi>x</mi></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mn>2</mn></msup><mspace width="0.167em" /><mi>d</mi><mi>x</mi><mo>=</mo><mfrac><mi>π</mi><mn>2</mn></mfrac></mstyle></mrow></math>。</p></details></section><div class="box" id="type-66"><b>全轴卷积及频域积分方程</b><p>双边指数脉冲的直接卷积积分需要分情况拆绝对值，繁琐易错；但只要取一次傅里叶变换，卷积就化为了有理分式的乘积 [F(ω)]^2，再配合参数求导或部分分式即可轻松反演。同样地，含有全轴卷积的积分方程在变换到频域后会立刻降维为代数方程，先解出未知谱 F(ω) 再作逆变换即得未知函数。</p></div><div class="box" id="type-83"><b>傅里叶正弦与余弦变换</b><p>当物理信号只定义在半轴 t≥ 0 时，将其做偶延拓可消去正弦分量得到纯粹的余弦变换 F_c(ω)，做奇延拓则消去余弦分量得到正弦变换 F_s(ω)。求解 e^{-at} 等指数型半轴变换最巧妙的办法是借欧拉公式合并复指数积分 ∫_0^∞ f(t)e^{iω t} dt，算完一次后直接分出实部和虚部。</p></div><h2>第八章 · 拉普拉斯变换</h2><section class="box" id="type-18"><small>第八章 · 核心必考</small><h2>单边正变换、平移与收敛域</h2><p>单边拉普拉斯变换在傅里叶核基础上乘入指数衰减因子 e^{-σ t}，使不绝对可积的指数增长信号也能在右半平面 Res&gt;σ_0 上收敛且处处解析。三大核心正变换性质分别对应不同的时域操作：乘 e^{at} 对应 s 域平移 F(s-a)；乘以阶跃并延迟 a 对应乘延迟因子 e^{-as}；从 0 到 t 积分对应像函数除以 s。</p><details><summary>单边拉普拉斯变换</summary><div>F(s)=∫₀<sup>∞</sup> f(t)e<sup>−st</sup>dt，s=σ+iω</div><p>适用条件：设 f 在每个有限区间分段连续，且充分大的 t 满足 |f(t)|≤Me<sup>at</sup>。则 Re s&gt;a 是保证绝对收敛的半平面。</p></details><details><summary>指数与三角函数</summary><div>1 ↔ 1/s　 ·　 e<sup>at</sup> ↔ 1/(s−a)　 ·　 cos bt ↔ s/(s²+b²)　 ·　 sin bt ↔ b/(s²+b²)</div><p>适用条件：对实参数 a、b，指数项取 Re s&gt;a，常数及振荡项取 Re s&gt;0。</p></details><details><summary>指数平移与时间积分</summary><div>ℒ[e<sup>at</sup>f(t)]=F(s−a)　 ·　 ℒ[∫₀ᵗ f(τ)dτ]=F(s)/s</div><p>适用条件：指数平移使收敛半平面同时平移。时间积分公式可在 Re s&gt;max(0,σ₀) 使用，σ₀ 为原变换的收敛横坐标。</p></details><details><summary>延迟与单位阶跃</summary><div>ℒ[H(t−a)f(t−a)] = e<sup>−as</sup>F(s)</div><p>适用条件：a≥0，积分下限从 a 开始。若写成 H(t−a)g(t)，先把 g(t) 写成关于 t−a 的函数。</p></details><details><summary>解题思路</summary><ol><li>拆解操作类型与顺序：分辨题目中含有的基本初等函数、指数乘子、时间积分 ∫_0^t 与阶跃延迟 H(t-a) 的嵌套顺序。</li><li>从内向外逐层应用性质：先查内层基本变换对，再依次应用积分除以 s、复频移 s→ s-a 及延迟因子 e^{-as}。</li><li>确定收敛半平面并复核：合并各操作的收敛横坐标要求取交集，写出最终解析收敛半平面 Res&gt;σ_c。</li></ol></details><h3>衰减余弦先积分再变换</h3><p>f(t)=∫₀ᵗ e<sup>−3τ</sup>cos(2τ)dτ。在 Re s&gt;0 内，F(s) 等于哪一项？</p><ol><li>A. (s+3)/{s[(s+3)²+4]}</li><li>B. s(s+3)/[(s+3)²+4]</li><li>C. (s−3)/{s[(s−3)²+4]}</li><li>D. 2/{s[(s+3)²+4]}</li></ol><p>2022 年 6 月 A 卷 · 二（5） · 真题集 PDF 第 60 页（选项重拟）</p><details><summary>查看完整解答</summary><ol><li><p>令 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>3</mn><mi>t</mi></mrow></msup><mi>cos</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math>。由基本像函数 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>cos</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>s</mi></mrow><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac></mrow></math> 及指数平移公式，得 <math display="block"><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>g</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>s</mi><mo>+</mo><mn>3</mn></mrow><mrow><mo stretchy="false">(</mo><mi>s</mi><mo>+</mo><mn>3</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac><mo>,</mo><mspace width="2em" /><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mo>−</mo><mn>3</mn><mo>.</mo></mrow></math></p></li><li><p>题中 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mi>t</mi></msubsup><mi>g</mi><mo stretchy="false">(</mo><mi>τ</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>τ</mi></mrow></math>，是常函数 <math><mrow><mn>1</mn></mrow></math> 与 <math><mrow><mi>g</mi></mrow></math> 的单边卷积。当 <math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math> 时，<math><mrow><mn>1</mn></mrow></math> 和 <math><mrow><mi>g</mi></mrow></math> 的像函数均绝对收敛，可应用卷积定理。由于 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mn>1</mn><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>/</mo><mi>s</mi></mrow></math>，故 <math display="block"><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mn>1</mn><mo>*</mo><mi>g</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>s</mi><mo>+</mo><mn>3</mn></mrow><mrow><mi>s</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mi>s</mi><mo>+</mo><mn>3</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>进一步检验收敛域。从 <math><mrow><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mn>3</mn><mi>t</mi></mrow></msup><mi>cos</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mi>G</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>3</mn><mo>/</mo><mn>13</mn></mrow></math> 知 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></math> 趋于非零常数 <math><mrow><mn>3</mn><mo>/</mo><mn>13</mn></mrow></math>。因此 <math><mrow><mo stretchy="false">|</mo><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mi>t</mi></mrow></msup><mo stretchy="false">|</mo></mrow></math> 在无穷远可积当且仅当 <math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。</p></li></ol><strong>结论</strong><p>选 A。<math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>s</mi><mo>+</mo><mn>3</mn></mrow><mrow><mi>s</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mi>s</mi><mo>+</mo><mn>3</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></mfrac></mstyle></mrow></math>，绝对收敛域为 <math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。</p></details><h3>从分段斜坡写出延迟项</h3><p>t≥0。设 0≤t&lt;1 时 f(t)=t，t≥1 时 f(t)=1。求单边拉普拉斯变换。</p><p><a href="https://math.libretexts.org/Bookshelves/Differential_Equations/Elementary_Differential_Equations_with_Boundary_Value_Problems_%28Trench%29/08%3A_Laplace_Transforms/8.04%3A_The_Unit_Step_Function/8.4E%3A_The_Unit_Step_Function_%28Exercises%29">补充教材 Trench · §8.4E 习题 2</a></p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mi>H</mi></mrow></math> 为单位阶跃函数。<math><mrow><mn>0</mn><mo>≤</mo><mi>t</mi><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 时原函数等于 <math><mrow><mi>t</mi></mrow></math>，<math><mrow><mi>t</mi><mo>≥</mo><mn>1</mn></mrow></math> 时应从 <math><mrow><mi>t</mi></mrow></math> 中减去 <math><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></math>，因而在整个半轴上有 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>t</mi><mo>−</mo><mi>H</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></math>。在 <math><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow></math> 时乘阶跃的项为零。</p></li><li><p>当 <math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math> 时，由分部积分，<math display="block"><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>t</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><mi>t</mi><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mo>−</mo><mfrac><mrow><mi>t</mi><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mi>t</mi></mrow></msup></mrow><mi>s</mi></mfrac><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mn>0</mn><mo>∞</mo></msubsup><mo>+</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>对延迟项作代换 <math><mrow><mi>u</mi><mo>=</mo><mi>t</mi><mo>−</mo><mn>1</mn></mrow></math>，有 <math display="block"><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>H</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mn>1</mn><mo>∞</mo></msubsup><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi></mrow></msup><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><mi>u</mi><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mi>u</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>u</mi><mo>=</mo><mfrac><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi></mrow></msup></mrow><mrow><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac><mo>.</mo></mrow></math> 两项相减即得所求像函数。又因 <math><mrow><mi>t</mi><mo>≥</mo><mn>1</mn></mrow></math> 时 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow></math>，所以 <math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math> 正是绝对收敛域。</p></li></ol><strong>结论</strong><p><math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi></mrow></msup></mrow><mrow><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac></mstyle></mrow></math>，<math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。</p></details></section><div class="box" id="type-67"><b>拉氏收敛域与基本变换对</b><p>计算 sin^2(ω t) 或 cosh^2(at) 等乘积型初等函数的拉氏变换，无需用分部积分，只需利用三角降幂或指数拆解即可立即化为基本变换对。确定总收敛域时，一般是取各加和项收敛半平面的交集（即最大增长指数）；但要注意若两个同指数增长项相互抵消，实际绝对收敛域可能会扩大。</p></div><div class="box" id="type-68"><b>阶跃、分段与非零时刻冲激</b><p>在工程信号处理中，任一在时间段 [a,b) 上开启的信号 g(t) 都可以用“阶跃开关” H(t-a)-H(t-b) 表达为整体公式。借助第二位移性质，时域的 a 秒延迟严格等价于频域乘以 e^{-as}；反之做拉氏逆变换时，一旦见到分子上的 e^{-cs}，必须先把它提出来反演剩余有理式，再将所得原函数整体右移 c 并乘上阶跃 H(t-c)。</p></div><div class="box" id="type-69"><b>周期函数的拉普拉斯变换</b><p>对于在 t≥ 0 上以 T&gt;0 为周期的因果信号，将其按 [0,T),[T,2T),… 分段积分并应用第二位移性质，各周期积分恰构成公比为 e^{-sT} 的无穷等比级数。在 Res&gt;0 时等比级数求和即化简为只含第一个周期 [0,T] 内积分的封闭表达式 (1)/(1-e^{-sT)}∫_0^T f(t)e^{-st} dt。</p></div><div class="box" id="type-70"><b>初值终值定理及失效判断</b><p>初值定理与终值定理能跳过繁琐的逆变换直接从 sF(s) 的极限读取时域边界行为。然而终值定理存在严格的前提约束：必须保证时域极限 lim_{t→+∞}f(t) 确实存在。对于有理像函数而言，即要求 sF(s) 的全部极点必须严格落在开左半平面（Res_k&lt;0），否则即使 lim_{s→ 0^+}sF(s) 算出来是个有限值（如 F(s)=1/(s^2+1) 对 sin t），结论也是完全错误的。</p></div><section class="box" id="type-21"><small>第八章 · 高频重点</small><h2>利用变换性质求反常积分</h2><p>从拉普拉斯变换的积分定义 F(s)=∫_0^∞ e^{-st}h(t) dt 出发，任何含 e^{-ct} 的半轴反常积分本身就是像函数 F(s) 在 s=c 处的取值；而不含衰减因子的条件收敛积分（如狄利克雷积分），也可看成收敛域边界上 s→ 0^+ 的阿贝尔极限值，借助除以 t 积分或卷积性质便可巧妙绕开直接求原函数的困难。</p><details><summary>乘 t 与除以 t</summary><div>ℒ[tf(t)]=−F′(s)　 ·　 ℒ[f(t)/t](s)=∫ₛ<sup>∞</sup>F(u)du（实 s）</div><p>适用条件：乘 t 需能在积分号下求导。除以 t 时需检查原点可积与换序条件，例如实 s 下 ∫₀∞ e<sup>−st</sup>|f(t)|/t dt 有限。</p></details><details><summary>把核识别为变换取值</summary><div>∫₀<sup>∞</sup>e<sup>−ct</sup>h(t)dt = ℒ[h](c)</div><p>适用条件：c 为实数且在 h 的收敛域内。可先保留 c 做参数，最后代入指定数值。</p></details><details><summary>解题思路</summary><ol><li>分离核函数与 e^{-ct}：把被积式写为 e^{-ct}h(t) 的形式（无衰减项则保留参数 s&gt;0 充当人工衰减因子 e^{-st}）。</li><li>求 h(t) 的像函数 H(s)：若是 f(t)/t 结构，先求 f(t) 的拉氏变换再由 s 积到 +∞（如出现 1/t^2 可用除 t 两次或频域与卷积/求导配合）。</li><li>代入 s=c 或令 s→ 0^+ 并验收敛：合并所有对数项或反三角项后再代入上限与指定点 c（或取 s→ 0^+），并简述端点可积与收敛依据。</li></ol></details><h3>用拉氏变换求含 sin²t/t 的积分</h3><p>用拉普拉斯变换计算 ∫₀<sup>∞</sup> e<sup>−t</sup> sin²(t)/t dt。</p><p>2022 年 6 月 A 卷 · 六（2） · 真题集 PDF 第 61 页</p><details><summary>查看完整解答</summary><ol><li><p>记所求积分为 <math><mrow><mi>I</mi></mrow></math>。<math><mrow><mi>t</mi><mo>→</mo><msup><mn>0</mn><mo>+</mo></msup></mrow></math> 时 <math><mrow><msup><mi>sin</mi><mn>2</mn></msup><mi>t</mi><mo>/</mo><mi>t</mi><mo>=</mo><mi>O</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></math>，而 <math><mrow><mi>t</mi><mo>→</mo><mo>∞</mo></mrow></math> 时 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi></mrow></msup><msup><mi>sin</mi><mn>2</mn></msup><mi>t</mi><mo>/</mo><mi>t</mi></mrow></math> 由 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi></mrow></msup><mo>/</mo><mi>t</mi></mrow></math> 控制，故 <math><mrow><mi>I</mi></mrow></math> 收敛。</p></li><li><p>令 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>sin</mi><mn>2</mn></msup><mi>t</mi><mo>=</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>cos</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">)</mo><mo>/</mo><mn>2</mn></mrow></math>。对实数 <math><mrow><mi>u</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，利用基本像函数，<math display="block"><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>u</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>g</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>u</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mn>1</mn><mi>u</mi></mfrac><mo>−</mo><mfrac><mrow><mi>u</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo>=</mo><mfrac><mn>2</mn><mrow><mi>u</mi><mo stretchy="false">(</mo><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>对 <math><mrow><mi>t</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，有 <math><mrow><mfrac><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi></mrow></msup></mrow><mi>t</mi></mfrac><mo>=</mo><msubsup><mo>∫</mo><mn>1</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>u</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>u</mi></mrow></math>。由于双重积分中的 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>u</mi><mi>t</mi></mrow></msup><msup><mi>sin</mi><mn>2</mn></msup><mi>t</mi></mrow></math> 非负，可交换积分次序，从而 <math display="block"><mrow><mi>I</mi><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>sin</mi><mn>2</mn></msup><mi>t</mi><msubsup><mo>∫</mo><mn>1</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>u</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>u</mi><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msubsup><mo>∫</mo><mn>1</mn><mo>∞</mo></msubsup><mi>G</mi><mo stretchy="false">(</mo><mi>u</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>u</mi><mo>.</mo></mrow></math> 这正是拉普拉斯变换的除以 <math><mrow><mi>t</mi></mrow></math> 性质在 <math><mrow><mi>s</mi><mo>=</mo><mn>1</mn></mrow></math> 的应用。</p></li><li><p>将分式拆成 <math><mrow><mfrac><mn>2</mn><mrow><mi>u</mi><mo stretchy="false">(</mo><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>u</mi></mrow></mfrac><mo>−</mo><mfrac><mrow><mi>u</mi></mrow><mrow><mn>2</mn><mo stretchy="false">(</mo><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></mfrac></mrow></math>，得 <math display="block"><mrow><mi>I</mi><mo>=</mo><msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mi>ln</mi><mfrac><mrow><msup><mi>u</mi><mn>2</mn></msup></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mn>1</mn><mo>∞</mo></msubsup><mo>=</mo><mn>0</mn><mo>−</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mi>ln</mi><mfrac><mn>1</mn><mn>5</mn></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mi>ln</mi><mn>5</mn><mo>.</mo></mrow></math></p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi></mrow></msup><mfrac><mrow><msup><mi>sin</mi><mn>2</mn></msup><mi>t</mi></mrow><mrow><mi>t</mi></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mfrac><mrow><mi>ln</mi><mn>5</mn></mrow><mrow><mn>4</mn></mrow></mfrac></mstyle></mrow></math>。</p></details><h3>带参数的正弦除以时间</h3><p>a&gt;0，b&gt;0。求 ∫₀<sup>∞</sup> e<sup>−at</sup>sin(bt)/t dt。</p><p>专题自编 · 反常积分变式</p><details><summary>查看完整解答</summary><ol><li><p>记所求积分为 <math><mrow><mi>I</mi></mrow></math>。由 <math><mrow><mo stretchy="false">|</mo><mi>sin</mi><mo stretchy="false">(</mo><mi>b</mi><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">|</mo><mo>≤</mo><mi>b</mi><mi>t</mi></mrow></math> 及 <math><mrow><mi>a</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，有 <math><mrow><mo stretchy="false">|</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi><mi>t</mi></mrow></msup><mi>sin</mi><mo stretchy="false">(</mo><mi>b</mi><mi>t</mi><mo stretchy="false">)</mo><mo>/</mo><mi>t</mi><mo stretchy="false">|</mo><mo>≤</mo><mi>b</mi><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi><mi>t</mi></mrow></msup></mrow></math>，故 <math><mrow><mi>I</mi></mrow></math> 绝对收敛。</p></li><li><p>对 <math><mrow><mi>t</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，写成 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi><mi>t</mi></mrow></msup><mo>/</mo><mi>t</mi><mo>=</mo><msubsup><mo>∫</mo><mi>a</mi><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>u</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>u</mi></mrow></math>。交换积分次序所需的绝对可积性由下式保证。<math display="block"><mrow><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msubsup><mo>∫</mo><mi>a</mi><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>u</mi><mi>t</mi></mrow></msup><mo stretchy="false">|</mo><mi>sin</mi><mo stretchy="false">(</mo><mi>b</mi><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">|</mo><mspace width="0.167em" /><mi>d</mi><mi>u</mi><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><mfrac><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi><mi>t</mi></mrow></msup><mo stretchy="false">|</mo><mi>sin</mi><mo stretchy="false">(</mo><mi>b</mi><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">|</mo></mrow><mrow><mi>t</mi></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>≤</mo><mfrac><mi>b</mi><mi>a</mi></mfrac><mo>.</mo></mrow></math></p></li><li><p>利用 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>sin</mi><mo stretchy="false">(</mo><mi>b</mi><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>u</mi><mo stretchy="false">)</mo><mo>=</mo><mi>b</mi><mo>/</mo><mo stretchy="false">(</mo><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></math>，有 <math display="block"><mrow><mi>I</mi><mo>=</mo><msubsup><mo>∫</mo><mi>a</mi><mo>∞</mo></msubsup><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>u</mi><mi>t</mi></mrow></msup><mi>sin</mi><mo stretchy="false">(</mo><mi>b</mi><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mspace width="0.167em" /><mi>d</mi><mi>u</mi><mo>=</mo><msubsup><mo>∫</mo><mi>a</mi><mo>∞</mo></msubsup><mfrac><mi>b</mi><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>u</mi><mo>=</mo><msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mi>arctan</mi><mfrac><mi>u</mi><mi>b</mi></mfrac><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mi>a</mi><mo>∞</mo></msubsup><mo>.</mo></mrow></math></p></li><li><p>由 <math><mrow><mi>a</mi><mo>,</mo><mi>b</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，<math><mrow><mi>arctan</mi><mo stretchy="false">(</mo><mi>a</mi><mo>/</mo><mi>b</mi><mo stretchy="false">)</mo></mrow></math> 与 <math><mrow><mi>arctan</mi><mo stretchy="false">(</mo><mi>b</mi><mo>/</mo><mi>a</mi><mo stretchy="false">)</mo></mrow></math> 都在 <math><mrow><mo stretchy="false">(</mo><mn>0</mn><mo>,</mo><mi>π</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></math>，且互余。故上式等于 <math><mrow><mi>π</mi><mo>/</mo><mn>2</mn><mo>−</mo><mi>arctan</mi><mo stretchy="false">(</mo><mi>a</mi><mo>/</mo><mi>b</mi><mo stretchy="false">)</mo><mo>=</mo><mi>arctan</mi><mo stretchy="false">(</mo><mi>b</mi><mo>/</mo><mi>a</mi><mo stretchy="false">)</mo></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi><mi>t</mi></mrow></msup><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mi>b</mi><mi>t</mi><mo stretchy="false">)</mo></mrow><mi>t</mi></mfrac><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mi>arctan</mi><mfrac><mi>b</mi><mi>a</mi></mfrac></mstyle></mrow></math>，其中 <math><mrow><mi>a</mi><mo>,</mo><mi>b</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。</p></details></section><section class="box" id="type-19"><small>第八章 · 核心必考</small><h2>有理式的拉普拉斯逆变换</h2><p>求有理像函数 F(s) 的拉氏逆变换有两种互为印证的系统途径：一是部分分式与二次配方法——将分母二次不可约因子配成 (s-a)^2+b^2 后把分子凑成 s-a 与常数，直接查表化为阻尼振荡；二是海维赛德留数反演公式——对满足 lim_{s→∞}F(s)=0 的有理式，直接在复平面内对 e^{st}F(s) 的全部有限极点求留数相加。</p><details><summary>配方识别三角函数</summary><div>(s−a)/[(s−a)²+b²] ↔ e<sup>at</sup>cos(bt)　 ·　 b/[(s−a)²+b²] ↔ e<sup>at</sup>sin(bt)</div><p>适用条件：此处左边是像函数，b&gt;0，Re s&gt;a。先把分子整理成 s−a 与常数两部分。</p></details><details><summary>重极点与延迟</summary><div>ℒ⁻¹[1/(s−a)ⁿ]=t<sup>n−1</sup>e<sup>at</sup>/(n−1)!</div><p>适用条件：t≥0，n 为正整数，Re s&gt;Re a。存在 e<sup>−cs</sup> 因子时，先反演其余部分，再整体延迟 c≥0。</p></details><details><summary>用留数反演有理像函数</summary><div>f(t)=∑ Res(e<sup>st</sup>F(s),sₖ)，t&gt;0</div><p>适用条件：对单边变换的严格真有理函数，取全部有限极点，收敛线在最右极点的右侧。重极点要用相应的高阶留数公式。</p></details><details><summary>解题思路</summary><ol><li>先剥离延迟与真分式化：若有 e^{-cs} 延迟因子先单独提出；若为假分式先多项式除法分离出多项式部分，其余部分因式分解或配方。</li><li>配分母查表或算留数：单实根用遮盖法裂项，不可约二次式直接配方配齐 (s-a) 与 b，重极点套幂乘指数公式（或统一对 e^{st}F(s) 求各极点留数之和）。</li><li>复原延迟与正变换核验：按需补上延迟 t→ t-c 与阶跃因子 H(t-c)，对结果再心算一次正变换或检查 t=0^+ 初值确保无误。</li></ol></details><h3>移动极点后的阻尼或增长振荡</h3><p>求 F(s)=(2s−4)/(s²−4s+13) 的单边拉普拉斯逆变换。</p><p><a href="https://math.libretexts.org/Bookshelves/Differential_Equations/Elementary_Differential_Equations_with_Boundary_Value_Problems_%28Trench%29/08%3A_Laplace_Transforms/8.02%3A_The_Inverse_Laplace_Transform/8.2E%3A_The_Inverse_Laplace_Transform_%28Exercises%29">补充教材 Trench · §8.2E 习题 1（2）</a></p><details><summary>查看完整解答</summary><ol><li><p>先将分母配方，再把分子写成同一平移量。<math display="block"><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>−</mo><mn>4</mn><mi>s</mi><mo>+</mo><mn>13</mn><mo>=</mo><mo stretchy="false">(</mo><mi>s</mi><mo>−</mo><mn>2</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><msup><mn>3</mn><mn>2</mn></msup><mo>,</mo><mspace width="2em" /><mn>2</mn><mi>s</mi><mo>−</mo><mn>4</mn><mo>=</mo><mn>2</mn><mo stretchy="false">(</mo><mi>s</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 所以 <math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></math>，其中 <math><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>s</mi></mrow><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><msup><mn>3</mn><mn>2</mn></msup></mrow></mfrac></mrow></math>。</p></li><li><p>由标准变换对 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>cos</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow></math>（<math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>）。当 <math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>2</mn></mrow></math> 时，<math display="block"><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>t</mi></mrow></msup><mi>cos</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>s</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><mi>t</mi></mrow></msup><mi>cos</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><mo>.</mo></mrow></math></p></li><li><p>故对 <math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></math> 取单边拉普拉斯逆变换，只需给 <math><mrow><mi>cos</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math> 乘上 <math><mrow><mn>2</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>t</mi></mrow></msup></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><msup><mi>e</mi><mrow><mn>2</mn><mi>t</mi></mrow></msup><mi>cos</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math>，<math><mrow><mi>t</mi><mo>≥</mo><mn>0</mn></mrow></math>。其拉普拉斯像在 <math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>2</mn></mrow></math> 绝对收敛。</p></details><h3>重极点遇到时间延迟</h3><p>求 e<sup>−2s</sup>/(s+1)² 的单边拉普拉斯逆变换。</p><p>专题自编 · 延迟逆变换</p><details><summary>查看完整解答</summary><ol><li><p>先求 <math><mrow><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mo stretchy="false">(</mo><mi>s</mi><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mrow></math> 的原函数。由 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>t</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>/</mo><msup><mi>s</mi><mn>2</mn></msup></mrow></math> 与指数平移公式，<math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>t</mi><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi></mrow></msup><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow></math>（<math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mo>−</mo><mn>1</mn></mrow></math>），所以 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>t</mi><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi></mrow></msup></mrow></math>。</p></li><li><p>所求像函数为 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mn>2</mn><mi>s</mi></mrow></msup><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow></math>。应用第二平移公式时，原函数须从 <math><mrow><mi>t</mi><mo>=</mo><mn>2</mn></mrow></math> 起才取非零形式。设 <math><mrow><mi>u</mi><mo>=</mo><mi>t</mi><mo>−</mo><mn>2</mn></mrow></math>，可验算 <math display="block"><mrow><msubsup><mo>∫</mo><mn>2</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mi>t</mi></mrow></msup><mi>g</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>2</mn><mi>s</mi></mrow></msup><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>s</mi><mi>u</mi></mrow></msup><mi>g</mi><mo stretchy="false">(</mo><mi>u</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>u</mi><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>2</mn><mi>s</mi></mrow></msup><mi>G</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>.</mo></mrow></math></p></li><li><p>因此，<math><mrow><mn>0</mn><mo>≤</mo><mi>t</mi><mo>&#x0003C;</mo><mn>2</mn></mrow></math> 时原函数为零，<math><mrow><mi>t</mi><mo>≥</mo><mn>2</mn></mrow></math> 时为 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><mo>=</mo><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></msup></mrow></math>。在 <math><mrow><mi>t</mi><mo>=</mo><mn>2</mn></mrow></math> 时其值为零，阶跃函数在该点的约定不影响结果。</p></li></ol><strong>结论</strong><p><math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>H</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></msup></mrow></math>，<math><mrow><mi>t</mi><mo>≥</mo><mn>0</mn></mrow></math>，其中 <math><mrow><mi>H</mi></mrow></math> 为单位阶跃函数。</p></details><h3>用留数反演含二阶极点的像函数</h3><p>设 F(s)=1/[s(s+1)²]，Re s&gt;0。用留数求 t&gt;0 时的原函数。</p><p>专题自编 · 留数反演</p><details><summary>查看完整解答</summary><ol><li><p>取反演直线 <math><mrow><mo>Re</mo><mi>s</mi><mo>=</mo><mi>σ</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，令 <math><mrow><mi>Φ</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mi>s</mi><mi>t</mi></mrow></msup><mo>/</mo><mo stretchy="false">[</mo><mi>s</mi><mo stretchy="false">(</mo><mi>s</mi><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo stretchy="false">]</mo></mrow></math>。由拉普拉斯反演公式，<math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>2</mn><mi>π</mi><mi>i</mi></mrow></mfrac><msubsup><mo>∫</mo><mrow><mi>σ</mi><mo>−</mo><mi>i</mi><mo>∞</mo></mrow><mrow><mi>σ</mi><mo>+</mo><mi>i</mi><mo>∞</mo></mrow></msubsup><mi>Φ</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>s</mi></mrow></math>。对 <math><mrow><mi>t</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，把向上走的竖直线段与左侧半圆接成正向闭路。</p></li><li><p>在以 <math><mrow><mi>σ</mi></mrow></math> 为圆心、半径为 <math><mrow><mi>R</mi></mrow></math> 的左半圆上，<math><mrow><mo stretchy="false">|</mo><msup><mi>e</mi><mrow><mi>s</mi><mi>t</mi></mrow></msup><mo stretchy="false">|</mo><mo>≤</mo><msup><mi>e</mi><mrow><mi>σ</mi><mi>t</mi></mrow></msup></mrow></math>，而 <math><mrow><mo stretchy="false">|</mo><mi>s</mi><mo stretchy="false">|</mo><mo>≥</mo><mi>R</mi><mo>−</mo><mi>σ</mi></mrow></math>、<math><mrow><mo stretchy="false">|</mo><mi>s</mi><mo>+</mo><mn>1</mn><mo stretchy="false">|</mo><mo>≥</mo><mi>R</mi><mo>−</mo><mi>σ</mi><mo>−</mo><mn>1</mn></mrow></math>。于是弧积分的模不超过 <math><mrow><mi>π</mi><mi>R</mi><msup><mi>e</mi><mrow><mi>σ</mi><mi>t</mi></mrow></msup><mo>/</mo><mo stretchy="false">[</mo><mo stretchy="false">(</mo><mi>R</mi><mo>−</mo><mi>σ</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mi>R</mi><mo>−</mo><mi>σ</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo stretchy="false">]</mo></mrow></math>，令 <math><mrow><mi>R</mi><mo>→</mo><mo>∞</mo></mrow></math> 时趋于零。故 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></math> 为闭路内 <math><mrow><mi>s</mi><mo>=</mo><mn>0</mn></mrow></math> 与 <math><mrow><mi>s</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow></math> 的留数之和。</p></li><li><p><math><mrow><mi>s</mi><mo>=</mo><mn>0</mn></mrow></math> 为一阶极点，留数为 <math display="block"><mrow><msub><mo>Res</mo><mrow><mi>s</mi><mo>=</mo><mn>0</mn></mrow></msub><mi>Φ</mi><mo>=</mo><msub><mo>lim</mo><mrow><mi>s</mi><mo>→</mo><mn>0</mn></mrow></msub><mfrac><mrow><msup><mi>e</mi><mrow><mi>s</mi><mi>t</mi></mrow></msup></mrow><mrow><mo stretchy="false">(</mo><mi>s</mi><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>1</mn><mo>.</mo></mrow></math></p></li><li><p><math><mrow><mi>s</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow></math> 为二阶极点，留数为 <math display="block"><mrow><msub><mo>Res</mo><mrow><mi>s</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow></msub><mi>Φ</mi><mo>=</mo><msub><mrow><mo stretchy="true" fence="true" form="prefix" /><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>s</mi></mrow></mfrac><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mrow><msup><mi>e</mi><mrow><mi>s</mi><mi>t</mi></mrow></msup></mrow><mi>s</mi></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mrow><mi>s</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mo stretchy="true" fence="true" form="prefix" /><msup><mi>e</mi><mrow><mi>s</mi><mi>t</mi></mrow></msup><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mi>t</mi><mi>s</mi></mfrac><mo>−</mo><mfrac><mn>1</mn><mrow><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mrow><mi>s</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow></msub><mo>=</mo><mo>−</mo><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi></mrow></msup><mo>.</mo></mrow></math> 相加即得原函数。</p></li></ol><strong>结论</strong><p><math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>−</mo><mo stretchy="false">(</mo><mi>t</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi></mrow></msup></mrow></math>，<math><mrow><mi>t</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。</p></details></section><div class="box" id="type-71"><b>乘除 t 与对数型逆变换</b><p>在像空间中，时域“乘以 t”对应求负导数 -F&#x27;(s)，而时域“除以 t”对应从 s 到 +∞ 积分 ∫_s^∞ F(u) du。这一对互逆性质完美破解了对数与反三角型像函数的逆变换难题：先对 ln 或 arctan 求导得到有理式，反演成 tf(t) 后再除以 t；同时将 s→ 0^+ 代入除 t 公式即可直接算出不含指数衰减的反常实积分。</p></div><section class="box" id="type-20"><small>第八章 · 核心必考</small><h2>卷积方程与微分方程初值问题</h2><p>单边拉普拉斯变换的两大核心桥梁——导数变换性质与单边卷积定理——能同时把时域的“微商运算”与“变上限卷积积分”化为像空间里的纯代数乘法。解题遵循统一流水线：两边取变换并代入已知 t=0^+ 初值，解出未知函数像函数 Y(s) 的代数表达，部分分式裂项或配方后反演回 t≥ 0 的时间函数。</p><details><summary>单边卷积定理</summary><div>ℒ[∫₀ᵗ f(t−τ)g(τ)dτ]=F(s)G(s)</div><p>适用条件：t≥0，f、g 分段连续且为指数阶。在两者共同的绝对收敛半平面应用。</p></details><details><summary>导数变换中的初值</summary><div>ℒ[y′]=sY−y(0⁺)　 ·　 ℒ[y″]=s²Y−sy(0⁺)−y′(0⁺)</div><p>适用条件：在 t≥0 求解，初值取右极限。函数及所需低阶导数满足分部积分条件和指数阶条件。</p></details><details><summary>解题思路</summary><ol><li>设像函数并标出初值：记 Y(s)=L[y(t)]，抄出 y(0^+), y&#x27;(0^+) 及右端激励和卷积核各自的单边变换。</li><li>两边取变换解 Y(s)：将导数项与单边卷积项统一变为关于 Y(s) 的代数式，移项合并系数后解出有理函数 Y(s)。</li><li>裂项反演并代回验证：对 Y(s) 做部分分式拆分或配方查表求得 y(t)，最后代回 t=0 检验初值（如满足方程和初值即百分百正确）。</li></ol></details><h3>卷积核为余弦的积分方程</h3><p>用拉普拉斯变换求 ∫₀ᵗcos(t−τ)y(τ)dτ=t cos t 的解 y(t)，t≥0。</p><p>2022 年 6 月 A 卷 · 六（1） · 真题集 PDF 第 61 页</p><details><summary>查看完整解答</summary><ol><li><p>记 <math><mrow><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>y</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow></math>。左端是 <math><mrow><mi>cos</mi><mi>t</mi></mrow></math> 与 <math><mrow><mi>y</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></math> 的单边卷积。对可作拉普拉斯变换的连续解，在两者像函数的公共绝对收敛半平面内，卷积定理给出 <math display="block"><mrow><mi mathvariant="script">L</mi><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><msubsup><mo>∫</mo><mn>0</mn><mi>t</mi></msubsup><mi>cos</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>τ</mi><mo stretchy="false">)</mo><mi>y</mi><mo stretchy="false">(</mo><mi>τ</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>τ</mi><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>s</mi></mrow><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfrac><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>.</mo></mrow></math></p></li><li><p>由乘 <math><mrow><mi>t</mi></mrow></math> 的变换公式，<math display="block"><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>t</mi><mi>cos</mi><mi>t</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mo>−</mo><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>s</mi></mrow></mfrac><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mfrac><mrow><mi>s</mi></mrow><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo>=</mo><mo>−</mo><mfrac><mrow><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mo>−</mo><mn>2</mn><msup><mi>s</mi><mn>2</mn></msup></mrow><mrow><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>−</mo><mn>1</mn></mrow><mrow><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo>.</mo></mrow></math> 因而解代数方程得 <math display="block"><mrow><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>−</mo><mn>1</mn></mrow><mrow><mi>s</mi><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>s</mi></mrow><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfrac><mo>−</mo><mfrac><mn>1</mn><mi>s</mi></mfrac><mo>.</mo></mrow></math></p></li><li><p>由 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>cos</mi><mi>t</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mi>s</mi><mo>/</mo><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></math> 与 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mn>1</mn><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>/</mo><mi>s</mi></mrow></math>，得 <math><mrow><mi>y</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><mi>cos</mi><mi>t</mi><mo>−</mo><mn>1</mn></mrow></math>。拉普拉斯变换的唯一性保证该式为上述连续函数类中的解。</p></li><li><p>代回检验。积化和差给出 <math><mrow><mn>2</mn><mi>cos</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>τ</mi><mo stretchy="false">)</mo><mi>cos</mi><mi>τ</mi><mo>=</mo><mi>cos</mi><mi>t</mi><mo>+</mo><mi>cos</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>2</mn><mi>τ</mi><mo stretchy="false">)</mo></mrow></math>，所以 <math display="block"><mrow><msubsup><mo>∫</mo><mn>0</mn><mi>t</mi></msubsup><mi>cos</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>τ</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mn>2</mn><mi>cos</mi><mi>τ</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>τ</mi><mo>=</mo><mi>t</mi><mi>cos</mi><mi>t</mi><mo>+</mo><mi>sin</mi><mi>t</mi><mo>−</mo><mi>sin</mi><mi>t</mi><mo>=</mo><mi>t</mi><mi>cos</mi><mi>t</mi><mo>.</mo></mrow></math></p></li></ol><strong>结论</strong><p><math><mrow><mi>y</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><mi>cos</mi><mi>t</mi><mo>−</mo><mn>1</mn></mrow></math>，<math><mrow><mi>t</mi><mo>≥</mo><mn>0</mn></mrow></math>。</p></details><h3>二阶初值方程中保留初速度</h3><p>用拉普拉斯变换解 y″+y=sin(2t)，y(0)=0，y′(0)=1。</p><p><a href="https://math.libretexts.org/Bookshelves/Differential_Equations/Elementary_Differential_Equations_with_Boundary_Value_Problems_%28Trench%29/08%3A_Laplace_Transforms/8.03%3A_Solution_of_Initial_Value_Problems/8.3E%3A_Solution_of_Initial_Value_Problems_%28Exercises%29">补充教材 Trench · §8.3E 习题 7</a></p><details><summary>查看完整解答</summary><ol><li><p>记 <math><mrow><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>y</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo></mrow></math>。利用导数公式以及初值 <math><mrow><mi>y</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math>、<math><mrow><msup><mi>y</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow></math>，有 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><msup><mi>y</mi><mi>″</mi></msup><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>s</mi><mn>2</mn></msup><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>−</mo><mi>s</mi><mi>y</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>−</mo><msup><mi>y</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><msup><mi>s</mi><mn>2</mn></msup><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>−</mo><mn>1</mn></mrow></math>。</p></li><li><p>将方程两边取拉普拉斯变换。<math display="block"><mrow><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>−</mo><mn>1</mn><mo>=</mo><mfrac><mrow><mn>2</mn></mrow><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac><mo>,</mo><mspace width="2em" /><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>6</mn></mrow><mrow><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>作部分分式分解，设 <math><mrow><mi>Y</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mi>A</mi><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></mrow></mfrac><mo>+</mo><mfrac><mi>B</mi><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac></mrow></math>。比较分子中 <math><mrow><msup><mi>s</mi><mn>2</mn></msup></mrow></math> 的系数与常数项，得 <math><mrow><mi>A</mi><mo>+</mo><mi>B</mi><mo>=</mo><mn>1</mn></mrow></math>、<math><mrow><mn>4</mn><mi>A</mi><mo>+</mo><mi>B</mi><mo>=</mo><mn>6</mn></mrow></math>，解得 <math><mrow><mi>A</mi><mo>=</mo><mn>5</mn><mo>/</mo><mn>3</mn></mrow></math>、<math><mrow><mi>B</mi><mo>=</mo><mo>−</mo><mn>2</mn><mo>/</mo><mn>3</mn></mrow></math>。</p></li><li><p>由 <math><mrow><mi mathvariant="script">L</mi><mo stretchy="false">[</mo><mi>sin</mi><mo stretchy="false">(</mo><mi>a</mi><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mi>a</mi><mo>/</mo><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></math>，分别取逆变换，得 <math><mrow><mi>y</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>5</mn><mn>3</mn></mfrac><mi>sin</mi><mi>t</mi><mo>−</mo><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math>。代入有 <math><mrow><mi>y</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math>、<math><mrow><msup><mi>y</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>5</mn><mo>/</mo><mn>3</mn><mo>−</mo><mn>2</mn><mo>/</mo><mn>3</mn><mo>=</mo><mn>1</mn></mrow></math>，而 <math><mrow><msup><mi>y</mi><mi>″</mi></msup><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>+</mo><mi>y</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mi>y</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>5</mn><mn>3</mn></mfrac></mstyle><mi>sin</mi><mi>t</mi><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>3</mn></mfrac></mstyle><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math>，<math><mrow><mi>t</mi><mo>≥</mo><mn>0</mn></mrow></math>。</p></details><h3>把两个像函数的乘积写成卷积</h3><p>用卷积表示 ℒ⁻¹{1/[s²(s²+4)]}，再算出其显式结果。</p><p><a href="https://math.libretexts.org/Bookshelves/Differential_Equations/Elementary_Differential_Equations_with_Boundary_Value_Problems_%28Trench%29/08%3A_Laplace_Transforms/8.06%3A_Convolution/8.6E%3A_Convolution_%28Exercises%29">补充教材 Trench · §8.6E 习题 1（1）</a></p><details><summary>查看完整解答</summary><ol><li><p>分拆 <math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>s</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac><mo>·</mo><mfrac><mn>1</mn><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn></mrow></mfrac></mrow></math>。在 <math><mrow><mo>Re</mo><mi>s</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math> 时，两因子分别为 <math><mrow><mi>t</mi></mrow></math> 和 <math><mrow><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math> 的拉普拉斯像。乘积定理表明所求原函数是二者的单边卷积，故 <math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mo>∫</mo><mn>0</mn><mi>t</mi></msubsup><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>τ</mi><mo stretchy="false">)</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>τ</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>τ</mi><mo>,</mo><mspace width="2em" /><mi>t</mi><mo>≥</mo><mn>0</mn><mo>.</mo></mrow></math></p></li><li><p>在此积分中将 <math><mrow><mi>t</mi></mrow></math> 作为常数，取 <math><mrow><mi>u</mi><mo>=</mo><mi>t</mi><mo>−</mo><mi>τ</mi></mrow></math>、<math><mrow><mi>d</mi><mi>v</mi><mo>=</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>τ</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>τ</mi></mrow></math>，则 <math><mrow><mi>d</mi><mi>u</mi><mo>=</mo><mo>−</mo><mi>d</mi><mi>τ</mi></mrow></math>、<math><mrow><mi>v</mi><mo>=</mo><mo>−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mi>cos</mi><mo stretchy="false">(</mo><mn>2</mn><mi>τ</mi><mo stretchy="false">)</mo></mrow></math>。因此 <math display="block"><mrow><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mo>−</mo><mfrac><mrow><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>τ</mi><mo stretchy="false">)</mo><mi>cos</mi><mo stretchy="false">(</mo><mn>2</mn><mi>τ</mi><mo stretchy="false">)</mo></mrow><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mn>0</mn><mi>t</mi></msubsup><mo>−</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><msubsup><mo>∫</mo><mn>0</mn><mi>t</mi></msubsup><mi>cos</mi><mo stretchy="false">(</mo><mn>2</mn><mi>τ</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>τ</mi><mspace linebreak="newline" /><mo>=</mo><mfrac><mi>t</mi><mn>4</mn></mfrac><mo>−</mo><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow><mn>8</mn></mfrac><mo>.</mo></mrow></mrow></math></p></li><li><p>检验其拉普拉斯像为 <math><mrow><mfrac><mn>1</mn><mrow><mn>4</mn><msup><mi>s</mi><mn>2</mn></msup></mrow></mfrac><mo>−</mo><mfrac><mn>1</mn><mrow><mn>4</mn><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>s</mi><mn>2</mn></msup><mo stretchy="false">(</mo><msup><mi>s</mi><mn>2</mn></msup><mo>+</mo><mn>4</mn><mo stretchy="false">)</mo></mrow></mfrac></mrow></math>，与题设一致。</p></li></ol><strong>结论</strong><p><math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac><msubsup><mo>∫</mo><mn>0</mn><mi>t</mi></msubsup><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>τ</mi><mo stretchy="false">)</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>τ</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>τ</mi><mo>=</mo><mfrac><mi>t</mi><mn>4</mn></mfrac><mo>−</mo><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow><mn>8</mn></mfrac></mstyle></mrow></math>，<math><mrow><mi>t</mi><mo>≥</mo><mn>0</mn></mrow></math>。</p></details></section><div class="box" id="type-72"><b>单边卷积反演和微积分方程</b><p>当遇到既含导数 y&#x27;(t) 又含变上限积分 ∫_0^t y(τ) dτ 或卷积分 ∫_0^t k(t-τ)y(τ) dτ 的方程时，传统微分方程办法需先求导消积分；而拉普拉斯变换直接将积分项视为 1*y（变换为 Y(s)/s）或 k*y（变换为 K(s)Y(s)），一步转化为有理分式代数方程，同时自动嵌入所有初始条件。</p></div><div class="box" id="type-73"><b>常系数高阶、延迟或冲激初值题</b><p>拉普拉斯变换特别擅长解决传统待定系数法难以处理的高阶初值问题、分段激励与冲激激励问题。在广义意义下，L[δ(t-a)]=e^{-as} 自然进入像函数分子；若题设初值在 t=0 给定而右端激励含 δ(t)（在原点瞬间激发系统），则以右极限 0^+ 的角度或初始跃变来解读才自洽一致。</p></div><div class="box" id="type-74"><b>两点边值题：用终点条件定初值</b><p>二阶微分方程通常需要 y(0) 和 y&#x27;(0) 才能启动拉氏变换，但边值问题常常只给出起点 y(0) 与另一有限端点 y(a)。解决策略极其自然：先把未知的初始导数 y&#x27;(0^+) 暂时设为待定实常数 k，像往常一样完成变换并反演出带有参数 k 的解 y(t;k)，最后把终点条件 t=a 代入解出 k 即可。</p></div><div class="box" id="type-75"><b>变系数微分方程：把 t 变成对 s 求导</b><p>当微分方程系数中出现时间变量 t（例如 ty&#x27;&#x27; 或 ty&#x27;）时，常规常系数代数化不再直接适用，但利用性质 L[t f(t)] = -F&#x27;(s)，时域里乘以 t 恰好变成像空间里对 s 求导！如果原方程中只含 t 的一次幂，二阶变系数微分方程往往在像空间中奇迹般地降阶为可直接分离变量求解的一阶方程。</p></div></noscript></main><footer><span>复变研习室 · 工程数学复习平台</span><button class="plain" data-cmd="sources">课程资料与题目出处</button></footer><script>const C=[["复数与复变函数","z","辐角、模与共轭运算","#407293"],["解析函数","ƒ","可导点、解析域与初等函数","#7c60a2"],["复变函数的积分","∮","路径选择、积分公式与调和函数","#267a66"],["级数展开","Σ","收敛边界与指定圆环展开","#a67439"],["留数及其应用","ℛ","奇点分类、围线积分与实积分","#a65365"],["共形映射","w","边界对应与映射构造","#3c789d"],["傅里叶变换","ℱ","频谱、反演、冲激与全轴卷积","#377f70"],["拉普拉斯变换","ℒ","收敛域、逆变换、卷积与初值问题","#44677e"]],T=[[0,"模与辐角","题干涉及模、辐角主值、指数式互化、⟦593⟧ 或单位圆上的模极值时，优先化为极坐标与指数形式。","ch1.1 第 11–28 页 · 教材 §1.1–§1.2",[["复数的指数形式与模角关系","⟦2642⟧","适用于 ⟦162⟧。主辐角 ⟦2643⟧ 须结合点 ⟦140⟧ 所在象限确定，⟦2644⟧ 时不能直接写成 ⟦2645⟧。"],["棣莫弗公式与 ⟦372⟧ 次方根","⟦2646⟧","⟦372⟧ 为正整数且 ⟦162⟧。开 ⟦372⟧ 次方前须保留整周数 ⟦2647⟧，全部 ⟦372⟧ 个根均匀分布在半径为 ⟦2648⟧ 的圆周上构成正 ⟦372⟧ 边形。"],["复数的三角不等式","⟦2649⟧","对任意复数 ⟦481⟧ 成立。当 ⟦481⟧ 均非零时，⟦2650⟧ 当且仅当 ⟦291⟧ 与 ⟦293⟧ 同向（辐角主值差为 ⟦2647⟧）。"]],["<strong>定模判象限</strong>：由实部、虚部符号确定点 ⟦140⟧ 所在象限并算出主辐角 ⟦2651⟧，写出标准指数式 ⟦1439⟧。","<strong>乘幂与开方分流</strong>：整数次幂直接乘辐角得 ⟦2652⟧；求全部 ⟦372⟧ 次方根时务必在辐角上补齐 ⟦2653⟧ 再除以 ⟦372⟧，并取 ⟦2654⟧。","<strong>极值双向闭环</strong>：利用 ⟦2655⟧ 给出上界后，需显式构造同向的边界点 ⟦9⟧ 代入验证等号确实能够取到。"]],[0,"共轭根证明","出现实系数多项式、复数共轭证明或虚根性质推论时，利用共轭对四则运算的分配律展开或整体取共轭。","ch1.1 第 5–6 页 共轭复数 · 教材 §1.1",[["实系数多项式的共轭保持性","⟦2661⟧","成立条件为多项式系数 ⟦1455⟧ 全部为实数。推导依据为共轭满足 ⟦2662⟧ 与 ⟦2663⟧。"]],["<strong>展开根条件</strong>：设 ⟦2664⟧（⟦1452⟧），由已知 ⟦2665⟧ 写出求和等式。","<strong>整体取共轭</strong>：等式两端同时取共轭，逐项利用和积的共轭性质与实系数条件 ⟦1456⟧，化为 ⟦2666⟧。","<strong>说明互异性</strong>：若题目要求证明共轭根为“另一个”根，需指出因 ⟦2667⟧，故 ⟦2668⟧，两根相异。"]],[1,"可导点与解析域","给定 ⟦443⟧，要求找出全部可导点、判断是否存在解析点，或根据解析条件确定未知实参数。","ch2.1 第 22–41 页 柯西–黎曼方程与解析域 · 教材 §2.2",[["柯西–黎曼（C-R）方程","⟦2673⟧","复可导的必要条件；若 ⟦204⟧ 在点 ⟦140⟧ 实可微（例如一阶偏导连续），则两式同成立也是复可导的充要条件。"],["解析函数的导数表达式","⟦2674⟧","先确认点 ⟦9⟧ 处复可导后再代入求导数；要判定函数在点 ⟦369⟧ 解析，须存在以 ⟦369⟧ 为圆心的开圆盘使内每一点都可导。"]],["<strong>分拆实虚求偏导</strong>：写明 ⟦2675⟧ 并计算四个一阶偏导 ⟦2676⟧，注明其连续性（多项式、初等函数处处连续）。","<strong>联立 C-R 求解集</strong>：解方程组 ⟦1464⟧，得到可导点集 ⟦2677⟧（若是恒等式则比较同类项系数求参数），并用 ⟦2678⟧ 求导。","<strong>判内点定解析域</strong>：检查可导点集 ⟦2677⟧ 的内部；若 ⟦2677⟧ 只是直线、曲线或孤立点，内部为空集，明确指出“处处不解析”。"]],[1,"指数、对数与复方程","处理 ⟦2688⟧、⟦1494⟧、⟦1500⟧ 等复方程求解及命题辨析时，注意周期性 ⟦2689⟧ 与整周数不可遗漏。","ch2.2 第 4–18, 26–31 页 指数与复三角方程 · 教材 §2.3–§2.4",[["复指数方程通解","⟦2681⟧","要求 ⟦1667⟧（因 ⟦2682⟧ 永不为零）；比较模求实部 ⟦454⟧，比较辐角求虚部 ⟦231⟧ 并保留 ⟦2647⟧。"],["复正余弦的指数定义与零点","⟦2683⟧","对任意复数 ⟦9⟧ 定义成立，⟦1486⟧。利用 ⟦1492⟧ 可同乘 ⟦1493⟧ 化为关于 ⟦1493⟧ 的代数方程。"]],["<strong>三角转指数</strong>：遇 ⟦2684⟧ 等方程，统一用欧拉公式化为 ⟦1493⟧ 和 ⟦2685⟧ 的组合并乘 ⟦1493⟧ 消负指数。","<strong>比模比辐角</strong>：令 ⟦2031⟧（或对 ⟦2686⟧ 直接取复对数 ⟦2687⟧），分别由模相等求实部、辐角差 ⟦2647⟧ 求虚部。","<strong>保留整周数</strong>：对所有解均保留整数参数 ⟦1486⟧，代回原指数式检验是否满足且无增根。"]],[2,"参数化积分","被积函数含有 ⟦2706⟧、⟦53⟧、⟦368⟧、⟦2707⟧ 或明确给出非闭合线段、抛物线、圆弧路径时，使用参数化法。","ch3.1 第 3–17 页 复积分与参数计算 · 教材 §3.1",[["分段光滑路径参数积分公式","⟦2696⟧","路径 ⟦2697⟧ 分段光滑且参数 ⟦682⟧ 从起点 ⟦2698⟧ 单调变至终点 ⟦1033⟧，⟦1195⟧ 在 ⟦346⟧ 上连续。"],["直线段与圆弧标准参数方程","⟦2699⟧","直线段连接 ⟦2700⟧；圆弧以 ⟦369⟧ 为心、⟦370⟧ 为半径，逆时针 ⟦856⟧ 增大，顺时针 ⟦856⟧ 减小。"]],["<strong>判定是否需参数化</strong>：检查被积函数是否含非解析项（⟦2701⟧）或路径为指定非闭曲线；若有折线则按光滑段拆成几段之和。","<strong>写出参数与微分</strong>：确定起止点对应的参数范围 ⟦2702⟧，同步写出 ⟦2703⟧ 与 ⟦2704⟧。","<strong>拆实虚求实积分</strong>：代入化简为实变定积分 ⟦2705⟧ 分别积分并核对正负号。"]],[2,"柯西积分公式与高阶导数","沿简单闭曲线积分，分母可因式分解出 ⟦2717⟧，直接分流使用柯西定理、柯西积分公式或高阶导数公式。","ch3.2 第 6 页 & ch3.4 第 3–22 页 柯西定理与高阶导数 · 教材 §3.2–§3.3",[["柯西–古萨基本定理","⟦2713⟧","⟦346⟧ 为单连通解析域 ⟦193⟧ 内的任一分段光滑闭曲线（或 ⟦1195⟧ 在 ⟦346⟧ 内部解析且在闭域 ⟦2714⟧ 连续）。"],["柯西积分公式与高阶导数公式","⟦2715⟧","⟦346⟧ 取逆时针正向，⟦291⟧ 在 ⟦346⟧ 内部，⟦132⟧ 在 ⟦346⟧ 内部解析并在 ⟦346⟧ 上连续。⟦619⟧ 时即为柯西积分公式 ⟦2716⟧。"]],["<strong>求奇点判内外</strong>：令分母为零找出所有候选奇点，比较其与围线 ⟦346⟧ 的位置关系，区分圈内点与圈外点（若有奇点在 ⟦346⟧ 上则公式不直接适用）。","<strong>挖洞并留内去外</strong>：若圈内有多个奇点则用复合闭路拆为多个小圆之和；对每个小圆，只留该奇点因子 ⟦2717⟧ 在分母，其余因子连同原分子构成解析函数 ⟦132⟧。","<strong>套公式核因子</strong>：读出导数阶数 ⟦2718⟧，计算 ⟦2719⟧ 并乘 ⟦2720⟧（逆时针为正，顺时针取反）。"]],[2,"由虚部恢复解析函数","已知解析函数的虚部 ⟦442⟧（或实部 ⟦474⟧）及单点函数值，求共轭调和函数及解析函数 ⟦129⟧（偏积分法或汤姆逊法）。","ch3.5 第 6–11 页 调和函数与共轭调和函数 · 教材 §3.4",[["共轭调和关系与唯一性","⟦2724⟧","已给 ⟦449⟧ 时先检验调和性 ⟦2725⟧。在单连通域内调和函数必有共轭调和函数，仅差实常数。"],["由虚部直接求解析函数的汤姆逊公式","⟦2726⟧","适用于定义域含实轴段的单连通解析函数。也可对 ⟦218⟧ 关于 ⟦454⟧ 偏积分并引入待定函数 ⟦2727⟧。"]],["<strong>验证调和性</strong>：计算 ⟦2728⟧ 与 ⟦2729⟧ 并确认 ⟦2730⟧（若题目已说明 ⟦1460⟧ 解析则自然满足，也可直接检验复核）。","<strong>积分恢复另一部</strong>：由 ⟦218⟧ 对 ⟦454⟧ 偏积分得 ⟦2731⟧，再对 ⟦231⟧ 求偏导代入 ⟦478⟧ 消去 ⟦231⟧（或直接代 ⟦2732⟧ 积分）。","<strong>合成 ⟦129⟧ 并定常数</strong>：利用 ⟦2031⟧ 拼出 ⟦443⟧（或检验汤姆逊积分结果虚部确为 ⟦449⟧），最后代入给定点初值定出常数。"]],[3,"幂级数与收敛边界","求幂级数 ⟦2736⟧ 的收敛半径 ⟦370⟧、结合阿贝尔定理反推收敛范围，或逐点检验收敛圆边界 ⟦1194⟧ 处的敛散性。","ch4.2 第 4–20 页 幂级数收敛圆、比值法与阿贝尔定理 · 教材 §4.2",[["柯西–阿达马与比值法收敛半径","⟦2735⟧","用于标准幂级数 ⟦2736⟧（极限存在且系数最终非零）。若缺项幂级数须对整项做比值。"],["泰勒展开系数与阿贝尔推论","⟦2737⟧","若在边界点 ⟦2738⟧ 处级数条件收敛而非绝对收敛，则收敛半径必精确等于 ⟦2739⟧。"]],["<strong>确定中心与半径</strong>：读出幂级数的中心 ⟦291⟧，用比值法、根值法或给定收敛/发散点到 ⟦291⟧ 的距离与阿贝尔定理定出半径 ⟦370⟧。","<strong>判定内外区域</strong>：计算待判点到 ⟦291⟧ 的距离 ⟦2740⟧，严格小于 ⟦370⟧ 必绝对收敛，严格大于 ⟦370⟧ 必发散。","<strong>逐点代回边界圆周</strong>：对于 ⟦1194⟧ 上的边界点，代入原级数拆实虚部或用交错级数、狄利克雷判别法逐一检验。"]],[3,"指定圆环上的洛朗展开","给定函数 ⟦129⟧ 和具体圆环 ⟦2751⟧，要求展开为 ⟦1522⟧ 的洛朗级数（期末 94% 考频解答大题）。","ch4.4 第 4–34 页 洛朗级数与指定圆环展开 · 教材 §4.4",[["洛朗展开式与几何级数两种方向","⟦2748⟧","核心原则：谁大提谁做分母，使公比模严格小于 ⟦101⟧。其中 ⟦2749⟧ 为相对展开中心的变量。"],["洛朗级数唯一性与系数积分公式","⟦2750⟧","⟦1195⟧ 在开圆环 ⟦2751⟧ 内处处解析，⟦346⟧ 为圆环内正向绕 ⟦291⟧ 的简单闭曲线。⟦2752⟧ 时 ⟦701⟧ 即为留数。"]],["<strong>设偏移量并裂项</strong>：令 ⟦2749⟧，将圆环条件改写为 ⟦2753⟧；利用部分分式将有理函数拆成形如 ⟦2754⟧ 的最简分式之和。","<strong>分环确定公比</strong>：在当前圆环内逐个比较 ⟦2755⟧ 与 ⟦2756⟧：若 ⟦2757⟧ 则提出 ⟦2758⟧ 展为正幂级数；若 ⟦2759⟧ 则提出 ⟦1367⟧ 展为负幂级数；若 ⟦2760⟧ 则保留为 ⟦2761⟧ 不动。","<strong>合并幂次写收敛域</strong>：把所有展式合并整理，写出 ⟦2762⟧ 的正负幂级数表达式，并在括号内标明各项收敛域的交集。"]],[4,"孤立奇点与阶数","给定复变函数（含三角、指数或分式），判定某一点或全部有限奇点的孤立性、奇点类型（可去、⟦634⟧ 阶极点、本性奇点）与零点阶数。","ch5.1 第 3–26 页 孤立奇点分类与零极点阶数 · 教材 §5.1",[["极点阶数的极限判别准则","⟦2764⟧","⟦291⟧ 为孤立奇点，⟦634⟧ 为正整数。特别地，若 ⟦2765⟧ 存在且有限，则为可去奇点；若极限既不有限也不为 ⟦842⟧，则为本性奇点。"],["洛朗主要部分与商函数零极点抵消律","⟦2766⟧","⟦2767⟧：若 ⟦2768⟧ 则为可去奇点；若 ⟦2769⟧ 则为 ⟦2770⟧ 阶极点；含无穷多负幂项如 ⟦2771⟧ 为本性奇点。"]],["<strong>验孤立排除非孤立点</strong>：解出分母零点、对数或根式支点及复合奇点，确认目标点周围是否存在完全解析的去心邻域。","<strong>求分子分母首阶幂</strong>：对可解析的分子分母分别用泰勒首项或求导法确定零点阶数（遇加减式先通分），指数或三角复合负幂直接展开。","<strong>差值或主部定类型</strong>：由分母阶数减去分子阶数确定极点阶数或可去性；若主部有无穷多项或极限沿不同方向行为迥异，判定为本性奇点。"]],[4,"留数与围线积分","沿封闭围线积分内部含极点或本性奇点，先剔除外部与可去奇点，再针对各内部奇点选择单极点公式、高阶求导或洛朗展开求留数。","ch5.2 第 2–16 页 留数定义、留数定理与求法 · 教材 §5.2",[["留数基本定理","⟦2778⟧","⟦2779⟧ 为正向分段光滑简单闭曲线；除内部有限个孤立奇点外，⟦1195⟧ 在 ⟦346⟧ 上及内部解析。"],["一阶极点的留数计算法则","⟦2780⟧","右式要求 ⟦2781⟧ 在 ⟦291⟧ 附近解析且 ⟦2782⟧；可直接对分母求导代值，免去因式分解。"],["由洛朗展开读取留数","⟦2783⟧","对本性奇点和高阶极点均有效；展开时应使用 ⟦2762⟧ 而非 ⟦2784⟧ 作为底数，以免混淆负一次项系数符号。"]],["<strong>筛选圈内孤立奇点</strong>：找出全部奇点并检验与围线的位置关系，排除圈外奇点与可去奇点，识别其余圈内奇点的类型与阶数。","<strong>分点匹配留数算法</strong>：一阶极点用分母求导 ⟦2785⟧ 或乘 ⟦2762⟧ 取极限；高阶极点看情况用求导公式或展开；本性奇点做代换 ⟦2786⟧ 展开读 ⟦702⟧ 系数。","<strong>求和并核对路径方向</strong>：将所有圈内留数相加后乘 ⟦2077⟧，若给定围线为顺时针方向则取相反数。"]],[4,"用留数求实积分","求无界区间 ⟦2802⟧ 或 ⟦784⟧ 上的有理函数反常积分，通过上半圆围道将实轴积分化为上半平面留数和。","ch5.3 第 9–14 页 留数计算有理反常积分 · 教材 §5.3",[["有理函数全轴反常积分留数公式","⟦2792⟧","⟦2793⟧ 在实轴上无极点，且 ⟦2794⟧。若计算 ⟦2795⟧ 且 ⟦1195⟧ 为偶函数，先化为全轴积分的一半。"],["大圆弧积分衰减的 ML 估计","⟦2796⟧","⟦1623⟧ 为上半圆弧 ⟦2797⟧。当 ⟦2798⟧ 时，⟦2799⟧。"]],["<strong>核验条件与对称转化</strong>：确认实轴无极点且分母比分子至少高二次；若是 ⟦784⟧ 上的偶函数积分，先改写为 ⟦786⟧。","<strong>选定上半平面极点</strong>：解出分母的全部复根，仅保留虚部严格大于零（⟦2800⟧）的上半平面极点，并逐一求出留数（二阶极点用求导公式）。","<strong>说明大弧消零得出结果</strong>：用弧长 ⟦1632⟧ 与衰减阶数说明上半圆弧积分趋零，写出 ⟦2801⟧，如系半轴积分再除以 ⟦102⟧。"]],[5,"分式映射下曲线的像","给定具体分式线性映射（如反演 ⟦1565⟧ 或莫比乌斯变换），求直线、圆周或半平面映射后的像曲线/像区域，并留意缺失点。","ch1.2 第 21 页 & 第六章 共形映射第 23–44 页 · 教材 §6.2",[["分式线性映射与反演坐标变换","⟦2807⟧","反变换把圆与直线统一视为扩充复平面上的广义圆。使用反变换代数整理时须特别标出极点及缺失点的像。"],["广义圆映射像类型判据","⟦2808⟧","也可通过取曲线上三点的像点（过 ⟦842⟧ 即直线，共圆即圆周）及边界对应原理测试内点来确定区域像。"]],["<strong>求反变换写实虚坐标</strong>：解出 ⟦9⟧ 关于 ⟦1655⟧ 的反映射，写出 ⟦2809⟧（或直接利用 ⟦1194⟧ 几何距离等式整理）。","<strong>代入曲线并检查极点</strong>：将 ⟦214⟧ 代入原曲线或不等式整理化简为关于 ⟦204⟧ 的圆或直线方程，并核查极点或 ⟦853⟧ 等单独剔除点。","<strong>测试内点判定像域方向</strong>：若原题求区域像，在原区域内部选一简单测试点 ⟦369⟧ 代入得 ⟦2810⟧，最终确定像域在边界的哪一侧。"]],[5,"构造归一化的共形映射","要求把上半平面或圆盘共形映射为单位圆盘（或一般圆盘），同时指定某内点映到圆心且规定该点导数辐角方向。","共形映射 第 47–58 页 三大标准分式线性映射 · 教材 §6.2",[["上半平面映为单位圆盘标准模板","⟦2815⟧","将上半平面 ⟦777⟧ 双射映为单位圆盘 ⟦852⟧，且把 ⟦291⟧ 映到 ⟦128⟧、⟦2816⟧ 映到 ⟦842⟧。"],["单位圆盘自同构与一般圆盘缩放","⟦2817⟧","当目标区域为一般圆盘 ⟦2818⟧ 时，先用模板把源区域映到单位圆 ⟦1788⟧，再作平移伸缩 ⟦2819⟧。"]],["<strong>识别源与目标匹配模板</strong>：确认源域是上半平面还是单位圆盘（若为一般圆盘先归一化平移伸缩），写出把指定内点 ⟦291⟧ 映到圆心的含参 ⟦2820⟧ 标准分式映射。","<strong>求导代入固定内点</strong>：对映射求导 ⟦2821⟧ 并代入 ⟦1512⟧，整理出模和辐角形式 ⟦2822⟧。","<strong>定旋转角并全盘复核</strong>：令 ⟦2823⟧ 等于题目规定的导数辐角（如 ⟦2824⟧ 即角为 ⟦128⟧）解出 ⟦856⟧，并检验区域、内点及导数方向全部符合要求。"]],[6,"分段函数的频谱与傅里叶积分","给定有限区间上的分段波形或周期延拓函数，求频谱函数 ⟦2833⟧、傅里叶积分表达式并指出间断点的收敛值。","1.1–1.2 第 2–39 页 傅里叶级数与傅里叶积分 · 教材 积分变换 §1.1–§1.2",[["傅里叶正变换与反演收敛定理","⟦2830⟧","⟦1195⟧ 在 ⟦2831⟧ 绝对可积且任一有限区间分段光滑。连续点处左端等于 ⟦960⟧，跳跃间断点处等于左右极限半和。"],["实偶函数的余弦频谱与逆变换","⟦2832⟧","当 ⟦960⟧ 为实偶且绝对可积时适用，此时频谱 ⟦2833⟧ 同样为实偶函数（若 ⟦1195⟧ 为实奇函数则 ⟦2834⟧）。"],["周期函数的复指数傅里叶级数","⟦2835⟧","⟦2836⟧ 为周期；分段光滑时级数在跳跃点收敛到左右极限半和，频谱集中于离散谱线 ⟦2837⟧。"]],["<strong>确定非零支撑与对称性</strong>：写明 ⟦960⟧ 非零的时间区间并判断奇偶性，实偶函数可直接化为余弦积分以减少虚部计算。","<strong>分段或分部积分求 ⟦2833⟧</strong>：代入指数定义或三角积分计算，注意处理分母为零的频率（如 ⟦1845⟧ 直接积分即面积 ⟦2838⟧）。","<strong>写出傅里叶积分表达式</strong>：将所得 ⟦2833⟧ 代回逆变换公式并指明在函数连续点、跳点及端点处分别收敛于何值。"]],[6,"逆变换、时移与尺度变换","从矩形频谱还原时域波形，或根据时移、频移与尺度缩放推导延迟脉冲的傅里叶变换/逆变换（包含脉宽–带宽反比规律）。","1.3–1.5 第 2–12 页 傅里叶变换性质与脉冲展缩 · 教材 积分变换 §1.3",[["时移与频移性质","⟦2844⟧","正变换 ⟦2833⟧ 存在时成立。结合欧拉公式即得余弦调制公式 ⟦2845⟧。"],["尺度变换（相似性质）","⟦2846⟧","⟦2847⟧ 时特化为时间反转性质 ⟦2848⟧。注意 ⟦1517⟧ 压缩时域则拉宽频谱并降低零频峰值。"],["矩形脉冲与 sinc 频谱变换对","⟦2849⟧","零频处按极限取 ⟦2850⟧，首个正频谱零点为 ⟦2851⟧；反演还原波形时跳跃端点 ⟦2852⟧ 处均取 ⟦2616⟧。"]],["<strong>识别母体变换对</strong>：找出题中已知的矩形门函数或频谱对，确认正逆变换指数符号与 ⟦2840⟧ 位置。","<strong>有序拆解缩放与平移</strong>：写出从 ⟦960⟧ 到 ⟦2853⟧ 的顺序，依次应用尺度因子 ⟦2854⟧ 与平移相移 ⟦2855⟧（或直接换元代换）。","<strong>特判极限与对称校核</strong>：在分母为零处补取极限值，利用时频展缩方向和区间边界值复核结果。"]],[6,"冲激函数与离散谱线","处理含 ⟦1850⟧、⟦2878⟧ 的取样积分，或由正负对称的频域离散冲激谱线反向还原时域正余弦信号。","1.1–1.2 第 40–50 页 单位冲激与广义频谱 · 教材 积分变换 §1.2",[["单位冲激及其导数的筛选性质","⟦2868⟧","要求光滑乘子 ⟦1894⟧ 在点 ⟦291⟧ 处连续（对 ⟦2869⟧ 则要求 ⟦1894⟧ 在 ⟦291⟧ 处连续可微）；冲激导数筛选必须乘负号 ⟦260⟧。"],["冲激与简谐信号的广义傅里叶变换对","⟦2870⟧","严格匹配本课程角频率与 ⟦1857⟧ 反演约定；同理 ⟦2871⟧。"]],["<strong>定位冲激触发点</strong>：写出 ⟦2872⟧ 括号内为零的时刻（如 ⟦2873⟧ 或 ⟦2874⟧），并确认该点处于积分区间内。","<strong>执行筛选或逆变换代值</strong>：将乘在冲激上的函数在该时刻取值（遇 ⟦2869⟧ 须求导并取负号）；频域冲激逆变换时写出 ⟦1856⟧ 取值并除以 ⟦49⟧。","<strong>用欧拉公式合并谱线</strong>：若出现成对的正负频率指数 ⟦2875⟧，利用欧拉公式合并为 ⟦2876⟧ 或 ⟦2877⟧。"]],[6,"傅里叶卷积与能量积分","直接计算两个分段脉冲的自卷积、利用帕塞瓦尔（Parseval）能量等式求含 ⟦2888⟧ 平方积分时使用。","1.3–1.5 第 21–31 页 傅里叶卷积与帕塞瓦尔定理 · 教材 积分变换 §1.4",[["全轴卷积定义与卷积定理","⟦2882⟧","⟦1341⟧ 在实轴绝对可积时可用。计算有限支撑矩形脉冲卷积时，积分限仅为两函数支撑区间的交集。"],["帕塞瓦尔（Parseval）能量恒等式","⟦2883⟧","⟦1195⟧ 平方可积且 ⟦2833⟧ 采用同约定正变换。若频谱 ⟦2884⟧ 为偶函数，半轴 ⟦1819⟧ 积分等于全轴的一半。"]],["<strong>分流判定时域或频域法</strong>：若题中问脉冲卷积波形，列出 ⟦2885⟧ 与 ⟦2886⟧ 的非零区间交集并按 ⟦682⟧ 分段积分；若频域更容易，则转为频谱相乘后再反演。","<strong>能量积分逆配原信号</strong>：若题目要求求 ⟦2887⟧ 形平方积分，逆向认出对应的原时域信号 ⟦960⟧（通常是简单的门函数或衰减指数）。","<strong>核对 ⟦49⟧ 与半轴折算</strong>：套入帕塞瓦尔等式计算较容易一侧的平方积分，并检查半轴 ⟦1819⟧ 偶对称折半因子。"]],[7,"单边正变换、平移与收敛域","计算常见信号的拉普拉斯正变换，综合运用指数平移（第一位移）、时间延迟（第二位移）与时间积分性质，并给出收敛半平面。","2.1–2.2 第 3–33 页 拉普拉斯正变换与性质 · 教材 积分变换 §2.1–§2.2",[["单边拉普拉斯变换与指数阶收敛域","⟦2892⟧","⟦1195⟧ 在每个有限区间分段连续，且充分大的 ⟦682⟧ 满足 ⟦2893⟧ 时，保证在右半平面 ⟦2894⟧ 绝对收敛且解析。"],["基本初等函数拉氏变换对","⟦2895⟧","对实参数 ⟦481⟧，指数项收敛域为 ⟦2894⟧，常数与正余弦项收敛域为 ⟦1401⟧。"],["第一位移（复频移）与时间积分性质","⟦2896⟧","时间积分性质在 ⟦2897⟧ 成立，其中 ⟦2898⟧ 为 ⟦1195⟧ 的收敛横坐标。"],["第二位移（时域延迟）与单位阶跃","⟦2899⟧","积分下限从 ⟦291⟧ 开始，且收敛横坐标不变；若遇分段函数先用开关因子 ⟦2900⟧ 组合表示。"]],["<strong>拆解操作类型与顺序</strong>：分辨题目中含有的基本初等函数、指数乘子、时间积分 ⟦2901⟧ 与阶跃延迟 ⟦2902⟧ 的嵌套顺序。","<strong>从内向外逐层应用性质</strong>：先查内层基本变换对，再依次应用积分除以 ⟦1086⟧、复频移 ⟦2903⟧ 及延迟因子 ⟦2904⟧。","<strong>确定收敛半平面并复核</strong>：合并各操作的收敛横坐标要求取交集，写出最终解析收敛半平面 ⟦2905⟧。"]],[7,"有理式的拉普拉斯逆变换","给定有理像函数（含复共轭二次因子、重极点或延迟因子 ⟦2923⟧），使用配方凑分子、部分分式裂项或留数反演法求 ⟦2929⟧。","2.3–2.6 第 9–20 页 拉普拉斯逆变换三大求法 · 教材 积分变换 §2.4",[["二次不可约因子的阻尼振荡变换对","⟦2916⟧","分母配方后，先把一次分子改写为 ⟦2917⟧，分别配齐常数系数与 ⟦293⟧ 即得余弦和正弦项。"],["重极点与延迟反演公式","⟦2918⟧","⟦372⟧ 为正整数，⟦2919⟧，⟦1298⟧。重极点幂次减 ⟦101⟧ 对应阶乘 ⟦2920⟧；含延迟指数须把波形延迟并保留阶跃因子。"],["有理函数的留数反演公式","⟦2921⟧","适用于严格真有理像函数（⟦2922⟧），取 ⟦1129⟧ 全部有限极点（收敛线在其最右极点右侧），重极点套高阶极点求导法则。"]],["<strong>先剥离延迟与真分式化</strong>：若有 ⟦2923⟧ 延迟因子先单独提出；若为假分式先多项式除法分离出多项式部分，其余部分因式分解或配方。","<strong>配分母查表或算留数</strong>：单实根用遮盖法裂项，不可约二次式直接配方配齐 ⟦2924⟧ 与 ⟦293⟧，重极点套幂乘指数公式（或统一对 ⟦2925⟧ 求各极点留数之和）。","<strong>复原延迟与正变换核验</strong>：按需补上延迟 ⟦2926⟧ 与阶跃因子 ⟦2927⟧，对结果再心算一次正变换或检查
