  strokePts(cx,[[4,28],[86,28]],'#d5dde0');strokePts(cx,[[44,2],[44,53]],'#d5dde0');
  if(i===0){g(t=>[Math.cos(t),Math.sin(t)],0,2*Math.PI);strokePts(cx,[p(0,0),p(.70,.71)],col,2)}
  else if(i===1){[-.85,-.45,.45,.85].forEach(v=>g(t=>[.68*(t*t-v*v),1.25*v*t],-1.3,1.3))}
  else if(i===2)g(t=>[1.3*Math.cos(t)+.15*Math.sin(2*t),.9*Math.sin(t)+.16*Math.cos(3*t)],0,2*Math.PI);
  else if(i===3)[.4,.78,1.18].forEach(r=>g(t=>[r*Math.cos(t),r*Math.sin(t)],0,2*Math.PI));

 });

   const guide=(guideIds[i]||[]).length,tier=K[i][0];
   const detail=[verified.length?'有原卷例题':'',guide?'有提纲例题':'',ids.length+' 道练习','已掌握 '+done+'/'+ids.length].filter(Boolean).join(' · ');
   return '<article class="coverage-row"><div><div class="coverage-title"><strong>'+T[i][1]+'</strong><span class="tier '+tierClass(tier)+'">'+tier+'</span></div><small>'+detail+'</small></div><div class="actions">'+btn('精讲','topic:'+i+':0','plain')+btn('思路','topic:'+i+':1','plain')+btn('练习','q:'+(verified[0]??ids[0]),'secondary')+'</div></article>';
  }).join('');
  return lines?'<h2 class="group">'+chapter(ch)+' · '+name+'</h2><div class="coverage-list">'+lines+'</div>':'';
 }).join('');
}

let halfWidth=1;
function pulsePanel(){
 return '<section class="viz-panel pulse" aria-label="矩形脉冲与频谱交互图"><h3>交互探究 · 改变半脉宽 T，观察频谱主瓣与零点变化</h3><p class="small">矩形门函数在 |t|&lt;T 取 1。脉冲越窄，零频能量降低，但频谱首个正零点 π/T 越向右扩展（时频反比规律）。</p><canvas id="pulsePlot" role="img" aria-label="矩形脉冲的傅里叶变换，零频幅值为 2T，第一个正零点为 π/T"></canvas><div class="viz-controls"><label for="pulseWidth">半宽 T <input id="pulseWidth" type="range" min="0.5" max="2" step="0.1" value="'+halfWidth+'"></label></div><output id="pulseRead" for="pulseWidth"></output></section>';
}
function paintPulse(){
 const el=document.getElementById('pulsePlot');if(!el)return;
 const output=document.getElementById('pulseRead'),t=halfWidth;
 if(output)output.textContent='T = '+t.toFixed(1)+' · 零频幅值 F(0) = '+(2*t).toFixed(1)+' · 首个正零点 ω₁ = π/T ≈ '+(Math.PI/t).toFixed(2);
 const f=fitCanvas(el);if(!f)return;
 const [ctx,w,h]=f,left=32,right=w-16,top=12,bottom=h-22;
 const X=x=>left+(x+10)*(right-left)/20,Y=y=>bottom-(y+1)*(bottom-top)/5.3;
 ctx.lineWidth=1;ctx.font='12px system-ui';ctx.fillStyle='#455b64';
 for(const y of [0,2,4]){strokePts(ctx,[[left,Y(y)],[right,Y(y)]],'#e2ece9');ctx.fillText(String(y),10,Y(y)+4)}
 strokePts(ctx,[[X(0),top],[X(0),bottom]],'#9bb3ae');ctx.textAlign='center';
 for(const x of [-10,-5,0,5,10])ctx.fillText(String(x),X(x),h-6);
 ctx.beginPath();for(let j=0;j<=420;j++){const x=-10+j/21,y=x===0?2*t:2*Math.sin(t*x)/x;if(j)ctx.lineTo(X(x),Y(y));else ctx.moveTo(X(x),Y(y))}
 ctx.strokeStyle='#176b58';ctx.lineWidth=2.2;ctx.stroke();
 ctx.beginPath();ctx.arc(X(Math.PI/t),Y(0),4,0,Math.PI*2);ctx.fillStyle='#b75b2d';ctx.fill();
}

function rootsPanel(){
 return '<section class="viz-panel" aria-label="单位圆n次方根几何分布图"><h3>交互探究 · 复数 n 次方根的正多边形分布</h3><p class="small">调节原复数主辐角 θ 与开方次数 n，观察 zₖ = e^(i(θ+2kπ)/n) 在单位圆上的对称分布。</p><canvas id="rootsPlot" role="img" aria-label="单位圆上正多边形分布的n次方根"></canvas><div class="viz-controls"><label for="rootN">开方次数 n <input id="rootN" type="range" min="2" max="8" step="1" value="'+rootN+'"></label><label for="rootDeg">主辐角 θ <input id="rootDeg" type="range" min="-175" max="180" step="5" value="'+rootDeg+'"></label></div><output id="rootsRead"></output></section>';
}
function paintRoots(){
 const el=document.getElementById('rootsPlot');if(!el)return;
 const out=document.getElementById('rootsRead'),theta=rootDeg*Math.PI/180;
 const f=fitCanvas(el);if(!f)return;
 const [ctx,w,h]=f,cx=w*.5,cy=h*.5,R=Math.min(w,h)*.36;
 strokePts(ctx,[[cx-R*1.45,cy],[cx+R*1.45,cy]],'#dce5e3');
 strokePts(ctx,[[cx,cy-R*1.3],[cx,cy+R*1.3]],'#dce5e3');
 ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='#9cb5b0';ctx.lineWidth=1.2;ctx.stroke();
 const wx=cx+R*Math.cos(theta),wy=cy-R*Math.sin(theta);
 strokePts(ctx,[[cx,cy],[wx,wy]],'#b86527',1.5);
 ctx.beginPath();ctx.arc(wx,wy,4.5,0,Math.PI*2);ctx.fillStyle='#b86527';ctx.fill();
 ctx.font='12px system-ui';ctx.fillStyle='#99521b';ctx.fillText('w',wx+7,wy-4);
 const pts=[];
 for(let k=0;k<rootN;k++){
  const a=(theta+2*k*Math.PI)/rootN;
  pts.push([cx+R*Math.cos(a),cy-R*Math.sin(a)]);
 }
 ctx.beginPath();pts.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();
 ctx.fillStyle='rgba(23,107,88,.11)';ctx.fill();ctx.strokeStyle='#176b58';ctx.lineWidth=1.8;ctx.stroke();
 pts.forEach(([x,y],k)=>{
  ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#176b58';ctx.fill();
  ctx.fillStyle='#164c3f';ctx.fillText('z'+k,x+6,y+4);
 });
 if(out)out.textContent='n = '+rootN+' 个根均匀分布在单位圆上 · 相邻根辐角间隔 '+(360/rootN).toFixed(1)+'° · 基准点 w 主辐角 θ = '+rootDeg+'°';
}

function annulusPanel(){
 const btns=[[0,'圆内 |z| < 1'],[1,'中间圆环 1 < |z| < 2'],[2,'圆外 |z| > 2']].map(([k,lbl])=>btn(lbl,'annulus-zone:'+k,laurentZone===k?'sel':'')).join('');
 return '<section class="viz-panel" aria-label="洛朗展开收敛圆环域图解"><h3>交互探究 · 同一函数在不同圆环域的收敛公比方向</h3><p class="small">以 f(z) = 1/[(z+1)(z−2)] 在 z₀=0 展开为例：奇点 z=−1 与 z=2 把平面划分为三个同心解析域。</p><div class="viz-seg">'+btns+'</div><canvas id="annulusPlot" role="img" aria-label="以原点为中心过奇点圆周划分的三个同心圆环"></canvas><output id="annulusRead"></output></section>';
}
function paintAnnulus(){
 const el=document.getElementById('annulusPlot');if(!el)return;
 const seg=el.parentElement?.querySelectorAll('.viz-seg button');
 seg?.forEach((b,idx)=>b.classList.toggle('sel',idx===laurentZone));
 const out=document.getElementById('annulusRead');
 const msgs=[
  '当前域 |z|<1：对 z+1 与 z−2 均有 |z|<1 且 |z|<2，两者皆提出常数展开为纯正幂泰勒级数（q₁=−z, q₂=z/2）。',
  '当前域 1<|z|<2：|z|>1 处提出 z 得负幂（q₁=−1/z），|z|<2 处提出 −2 得正幂（q₂=z/2），合并为含正负幂的双边洛朗级数。',
  '当前域 |z|>2：对 z+1 与 z−2 均有 |z|>2>|1|，两者皆提出大变量 z 展开为纯负幂级数（q₁=−1/z, q₂=2/z）。'
 ];
 if(out)out.textContent=msgs[laurentZone];
 const f=fitCanvas(el);if(!f)return;
 const [ctx,w,h]=f,cx=w*.5,cy=h*.5,u=Math.min(w,h)*.17;
 if(laurentZone===0){
  ctx.beginPath();ctx.arc(cx,cy,u,0,Math.PI*2);ctx.fillStyle='rgba(23,107,88,.18)';ctx.fill();
 }else if(laurentZone===1){
  ctx.beginPath();ctx.arc(cx,cy,2*u,0,Math.PI*2);ctx.arc(cx,cy,u,0,Math.PI*2,true);ctx.fillStyle='rgba(23,107,88,.18)';ctx.fill();
 }else{
  ctx.beginPath();ctx.rect(0,0,w,h);ctx.arc(cx,cy,2*u,0,Math.PI*2,true);ctx.fillStyle='rgba(23,107,88,.16)';ctx.fill();
 }
 strokePts(ctx,[[10,cy],[w-10,cy]],'#cfdadb');strokePts(ctx,[[cx,8],[cx,h-8]],'#cfdadb');
 ctx.setLineDash([4,4]);
 ctx.beginPath();ctx.arc(cx,cy,u,0,Math.PI*2);ctx.strokeStyle='#35749b';ctx.lineWidth=1.4;ctx.stroke();
 ctx.beginPath();ctx.arc(cx,cy,2*u,0,Math.PI*2);ctx.strokeStyle='#a65365';ctx.lineWidth=1.4;ctx.stroke();
 ctx.setLineDash([]);
 [[cx-u,cy,'−1'],[cx+2*u,cy,'2']].forEach(([px,py,lbl])=>{
  ctx.beginPath();ctx.arc(px,py,4.5,0,Math.PI*2);ctx.fillStyle='#b83b3b';ctx.fill();
  ctx.font='12px system-ui';ctx.fillStyle='#8c2222';ctx.fillText(lbl,px-4,py-8);
 });
 ctx.font='11.5px system-ui';ctx.fillStyle='#2a5a78';ctx.fillText('|z|=1',cx+u+4,cy-u*.65);
 ctx.fillStyle='#8f3d50';ctx.fillText('|z|=2',cx+2*u+4,cy-u*1.1);
}

function routeToHash(){
 const hash=window.location.hash.slice(1);
 if(hash==='transforms'){try{window.history.replaceState(null,'','#topic:14:0')}catch{}act('topic:14:0',false);return}
 if(hash==='coverage'||hash==='home'||hash==='practice'||hash==='formulas'||hash==='saved'||hash==='sources'){act(hash,false);return}
 const [a,n,m]=hash.split(':');
 if(a==='topic'&&/^\d+$/.test(n)&&T[+n]&&/^[012]$/.test(m)){act(hash,false);return}
 if(a==='q'&&/^\d+$/.test(n)&&Q[+n]){act(hash,false);return}
 act('home',false);
}
let timer;
window.addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>{if(page==='home')draw();else if(page==='study'&&mode===0)paintActiveViz()},90)});
window.addEventListener('popstate',routeToHash);
window.addEventListener('hashchange',()=>{if(window.location.hash==='#transforms'||(window.location.hash==='#coverage'&&page!=='coverage'))routeToHash()});
routeToHash();
if(location.protocol==='https:'&&'serviceWorker' in navigator){
 navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
