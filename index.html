lse">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mi>z</mi><mi>sin</mi><mi>z</mi><mo>/</mo><msup><mi>z</mi><mn>2</mn></msup></mrow></math>，<math><mrow><mi>B</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mo stretchy="false">(</mo><msup><mi>e</mi><mi>z</mi></msup><mo>−</mo><mi>z</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo>/</mo><msup><mi>z</mi><mn>2</mn></msup></mrow></math>，并以展开式分别补上其在原点的值。由上式，<math><mrow><mi>A</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn></mrow></math>，<math><mrow><mi>B</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>/</mo><mn>2</mn></mrow></math>。二者在原点附近解析，且 <math><mrow><mi>B</mi></mrow></math> 在充分小的邻域内不为零。</p></li><li><p>在该去心邻域内，<math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow></mfrac><mspace width="0.167em" /><mfrac><mrow><mi>A</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo></mrow><mrow><mi>B</mi><mo stretchy="false">(</mo><mi>z</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo>,</mo><mspace width="2em" /><msub><mo>lim</mo><mrow><mi>z</mi><mo>→</mo><mn>0</mn></mrow></msub><msup><mi>z</mi><mn>2</mn></msup><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>A</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo></mrow><mrow><mi>B</mi><mo stretchy="false">(</mo><mn>0</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mn>4</mn><mo>.</mo></mrow></math> 因为 <math><mrow><msup><mi>z</mi><mn>2</mn></msup><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo></mrow></math> 在原点可解析延拓且其值非零，按极点阶数判别准则，<math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 是二阶极点。</p></li></ol><strong>结论</strong><p><math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 是二阶极点。</p></details><h3>指数型孤立奇点</h3><p>f(z)=z e<sup>−1/z</sup>/(1+z²) 在原点属于哪一类奇点？</p><ol><li>A 可去奇点</li><li>B 一阶极点</li><li>C 本性奇点</li><li>D 非孤立奇点</li></ol><p class="source">据 ch5.1 第 24 页 · 例 4(2) 改为选择题</p><details><summary>查看完整解答</summary><ol><li><p>由 <math><mrow><mn>1</mn><mo>+</mo><msup><mi>z</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn></mrow></math> 得另外两个可能奇点 <math><mrow><mi>±</mi><mi>i</mi></mrow></math>。在 <math><mrow><mn>0</mn><mo>&#x0003C;</mo><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math> 内，<math><mrow><mi>z</mi><mo>/</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msup><mi>z</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></math> 和 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></msup></mrow></math> 都解析，因此 <math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 是 <math><mrow><mi>f</mi></mrow></math> 的孤立奇点。</p></li><li><p>指数函数在该去心邻域内的洛朗展开为 <math display="block"><mrow><msup><mi>e</mi><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></msup><mo>=</mo><munderover><mo>∑</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mrow><mo>∞</mo></mrow></munderover><mfrac><mrow><mo stretchy="false">(</mo><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mi>n</mi></msup></mrow><mrow><mi>n</mi><mo>!</mo></mrow></mfrac><mspace width="0.167em" /><msup><mi>z</mi><mrow><mo>−</mo><mi>n</mi></mrow></msup><mo>.</mo></mrow></math> 所有 <math><mrow><mi>n</mi><mo>≥</mo><mn>1</mn></mrow></math> 的系数都不为零，所以 <math><mrow><msup><mi>e</mi><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></msup></mrow></math> 在原点有无限个负幂项。</p></li><li><p>若 <math><mrow><mi>f</mi></mrow></math> 在原点可去或为有限阶极点，则乘以 <math><mrow><mn>1</mn><mo>+</mo><msup><mi>z</mi><mn>2</mn></msup></mrow></math> 仍至多有有限阶极点，再除以 <math><mrow><mi>z</mi></mrow></math> 最多增加一阶。由 <math display="block"><mrow><mfrac><mrow><mn>1</mn><mo>+</mo><msup><mi>z</mi><mn>2</mn></msup></mrow><mrow><mi>z</mi></mrow></mfrac><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></msup></mrow></math> 得右端也至多有有限阶极点，这与它的洛朗展开矛盾。</p></li></ol><strong>结论</strong><p><math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 是本性奇点，选 C。</p></details></section><div class="box" id="type-48"><b>有限奇点、零点阶数与数列奇点</b><p>将分子、分母分别在候选奇点 a 处展开为泰勒首项 (z-a)^{m_1}p(z) 与 (z-a)^{m_2}q(z)，奇点类型立即一目了然：分母幂次更高时呈现 (m_2-m_1) 阶极点，分子幂次不低于分母时则是可去奇点。面对含 sin(π z) 等周期分母的函数时，需先列出全部整数零点，再按分子在该点是否取零分情况讨论。</p></div><div class="box" id="type-49"><b>无穷远点的奇点分类</b><p>当函数 f(z) 在某个圆外区域 R&lt;|z|&lt;∞ 内处处解析时，z=∞ 才称为孤立奇点。做倒数代换 z=1/w，无穷远点立刻变成 w=0，从而 f(z) 在 ∞ 处的奇点分类完全等价于 g(w)=f(1/w) 在 w=0 处的分类；但在有限平面上若有趋向无穷远的极点序列（如 z_k=k），则任何外域都包含奇点，z=∞ 为非孤立奇点。</p></div><div class="box" id="type-52"><b>孤立奇点可去与极点判据证明</b><p>黎曼定理与极点刻画是孤立奇点分类的理论基石：若 f 在去心邻域 0&lt;|z-z_0|&lt;R 内有界，利用洛朗负幂项积分公式与 ML 估计令圆半径 r→ 0，所有负幂系数 |a_{-n}|≤ M r^n 被强迫归零，从而证明可去性；若 |f(z)|→∞，则倒数 1/f 局部解析有界且趋于零，转为可去奇点后立刻读出原函数的有限极点阶数。</p></div><section class="box" id="type-10"><small>第五章 · 核心必考</small><h2>留数与围线积分</h2><p>函数在孤立奇点 a 处的留数 Res(f,a) 就是去心邻域内洛朗展开式中 (z-a)^{-1} 项的系数 c_{-1}。因为 (z-a)^n 在 n≠ -1 时绕 a 的闭路积分为零，仅 (z-a)^{-1} 贡献 2π i，故留数定理将整条围线积分彻底转化为内部所有孤立奇点留数之和乘以 2π i。</p><details><summary>留数定理</summary><div>∮<sub>C</sub> f(z) dz = 2πi ∑<sub>圈内</sub> Res(f,a)</div><p>适用条件：C 为正向分段光滑简单闭曲线。除内部有限个孤立奇点外，f 在 C 上和内部解析。</p></details><details><summary>单极点留数</summary><div>Res(g/h,a)=g(a)/h′(a)</div><p>适用条件：g、h 在 a 附近解析，h(a)=0，h′(a)≠0，且 g(a)≠0。</p></details><details><summary>由展开读留数</summary><div>Res(f,a)=c<sub>−1</sub></div><p>适用条件：在 a 的去心邻域，以 z−a 为幂展开，读取 −1 次幂的系数。</p></details><details><summary>解题思路</summary><ol><li>筛选圈内孤立奇点：找出全部奇点并检验与围线的位置关系，排除圈外奇点与可去奇点，识别其余圈内奇点的类型与阶数。</li><li>分点匹配留数算法：一阶极点用分母求导 g(a)/h&#x27;(a) 或乘 (z-a) 取极限；高阶极点看情况用求导公式或展开；本性奇点做代换 u=z-a 展开读 u^{-1} 系数。</li><li>求和并核对路径方向：将所有圈内留数相加后乘 2π i，若给定围线为顺时针方向则取相反数。</li></ol></details><h3>从指数展开读出留数</h3><p>求 f(z)=(1−e<sup>2z</sup>)/z⁴ 在所有有限孤立奇点处的留数。</p><p class="source">本课教材 · 第五章习题 8（2） · 第 184 页</p><details><summary>查看完整解答</summary><ol><li><p>分子 <math><mrow><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>z</mi></mrow></msup></mrow></math> 是整函数，分母仅在 <math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 为零，所以 <math><mrow><mn>0</mn></mrow></math> 是唯一可能的有限孤立奇点。分母为 <math><mrow><msup><mi>z</mi><mn>4</mn></msup></mrow></math>，故留数由分子中的 <math><mrow><msup><mi>z</mi><mn>3</mn></msup></mrow></math> 项决定。</p></li><li><p>将指数展开至三次项，有 <math display="block"><mrow><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>z</mi></mrow></msup><mo>=</mo><mn>1</mn><mo>+</mo><mn>2</mn><mi>z</mi><mo>+</mo><mfrac><mrow><mo stretchy="false">(</mo><mn>2</mn><mi>z</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mrow><mn>2</mn><mo>!</mo></mrow></mfrac><mo>+</mo><mfrac><mrow><mo stretchy="false">(</mo><mn>2</mn><mi>z</mi><msup><mo stretchy="false">)</mo><mn>3</mn></msup></mrow><mrow><mn>3</mn><mo>!</mo></mrow></mfrac><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><msup><mi>z</mi><mn>4</mn></msup><mo stretchy="false">)</mo><mo>,</mo><mspace linebreak="newline" /><mfrac><mrow><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>z</mi></mrow></msup></mrow><mrow><msup><mi>z</mi><mn>4</mn></msup></mrow></mfrac><mo>=</mo><mo>−</mo><mfrac><mn>2</mn><mrow><msup><mi>z</mi><mn>3</mn></msup></mrow></mfrac><mo>−</mo><mfrac><mn>2</mn><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow></mfrac><mo>−</mo><mfrac><mrow><mn>4</mn></mrow><mrow><mn>3</mn><mi>z</mi></mrow></mfrac><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo><mo>.</mo></mrow></mrow></math></p></li><li><p>洛朗展开中的最高负幂是 <math><mrow><msup><mi>z</mi><mrow><mo>−</mo><mn>3</mn></mrow></msup></mrow></math>，故 <math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 为三阶极点。<math><mrow><msup><mi>z</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math> 项的系数是 <math><mrow><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow></math>，这就是该点的留数。</p></li></ol><strong>结论</strong><p>唯一的有限孤立奇点是 <math><mrow><mn>0</mn></mrow></math>，且 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mo>Res</mo><mo stretchy="false">(</mo><mi>f</mi><mo>,</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mo>−</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></mstyle></mrow></math>。</p></details><h3>二阶极点的围线积分</h3><p>沿正向圆周 |z|=2，求 ∮ e<sup>2z</sup>/(z−1)² dz。</p><p class="source">本课教材 · 第五章习题 9（2） · 第 184 页</p><details><summary>查看完整解答</summary><ol><li><p>令 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>z</mi></mrow></msup><mo>/</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></math>。由于 <math><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>z</mi></mrow></msup></mrow></math> 是整函数且 <math><mrow><msup><mi>e</mi><mn>2</mn></msup><mo>≠</mo><mn>0</mn></mrow></math>，<math><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math> 为二阶极点，又因为 <math><mrow><mo stretchy="false">|</mo><mn>1</mn><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>2</mn></mrow></math>，所以该极点位于正向圆周内部，圆周上无奇点。</p></li><li><p>应用二阶极点的留数公式。<math display="block"><mrow><mo>Res</mo><mo stretchy="false">(</mo><mi>f</mi><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><msub><mrow><mo stretchy="true" fence="true" form="prefix" /><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>z</mi></mrow></mfrac><mo minsize="1.2em" maxsize="1.2em">[</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo minsize="1.2em" maxsize="1.2em">]</mo><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></msub><mo>=</mo><msub><mrow><mo stretchy="true" fence="true" form="prefix">.2</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>z</mi></mrow></msup><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mrow><mi>z</mi><mo>=</mo><mn>1</mn></mrow></msub><mo>=</mo><mn>2</mn><msup><mi>e</mi><mn>2</mn></msup><mo>.</mo></mrow></math></p></li><li><p>由留数定理，围线积分为 <math><mrow><mn>2</mn><mi>π</mi><mi>i</mi><mo>Res</mo><mo stretchy="false">(</mo><mi>f</mi><mo>,</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></math>。等价地，把 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>e</mi><mrow><mn>2</mn><mi>z</mi></mrow></msup></mrow></math> 代入柯西导数公式也可直接得到 <math><mrow><mn>2</mn><mi>π</mi><mi>i</mi><mspace width="0.167em" /><msup><mi>g</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mn>1</mn><mo stretchy="false">)</mo></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><msub><mo>∮</mo><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>=</mo><mn>2</mn></mrow></msub><mfrac><mrow><msup><mi>e</mi><mrow><mn>2</mn><mi>z</mi></mrow></msup></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mn>4</mn><mi>π</mi><mi>i</mi><msup><mi>e</mi><mn>2</mn></msup></mstyle></mrow></math>。</p></details><h3>同时处理可去奇点和单极点</h3><p>C 为逆时针圆 |z|=4，求 ∮<sub>C</sub> (eᶻ−1) cot z dz。</p><p class="source">2022 年 6 月 A 卷 · 四(3)</p><details><summary>查看完整解答</summary><ol><li><p>记 <math><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mo stretchy="false">(</mo><msup><mi>e</mi><mi>z</mi></msup><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>cot</mi><mi>z</mi></mrow></math>。<math><mrow><mi>sin</mi><mi>z</mi></mrow></math> 的零点为 <math><mrow><mi>k</mi><mi>π</mi></mrow></math>，其中 <math><mrow><mi>k</mi><mo>∈</mo><mi>ℤ</mi></mrow></math>。因 <math><mrow><mi>π</mi><mo>&#x0003C;</mo><mn>4</mn><mo>&#x0003C;</mo><mn>2</mn><mi>π</mi></mrow></math>，在圆 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>4</mn></mrow></math> 内只有 <math><mrow><mo>−</mo><mi>π</mi><mo>,</mo><mn>0</mn><mo>,</mo><mi>π</mi></mrow></math> 三个候选点，围线上没有奇点。</p></li><li><p>在原点，<math><mrow><msup><mi>e</mi><mi>z</mi></msup><mo>−</mo><mn>1</mn><mo>=</mo><mi>z</mi><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><msup><mi>z</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></math>，<math><mrow><mi>sin</mi><mi>z</mi><mo>=</mo><mi>z</mi><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><msup><mi>z</mi><mn>3</mn></msup><mo stretchy="false">)</mo></mrow></math>，<math><mrow><mi>cos</mi><mi>z</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><msup><mi>z</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></math>。于是 <math display="block"><mrow><mi>g</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><msup><mi>e</mi><mi>z</mi></msup><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>cos</mi><mi>z</mi></mrow><mrow><mi>sin</mi><mi>z</mi></mrow></mfrac><mo>=</mo><mn>1</mn><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 因而 <math><mrow><mn>0</mn></mrow></math> 是可去奇点，留数为 <math><mrow><mn>0</mn></mrow></math>。</p></li><li><p>对 <math><mrow><mi>a</mi><mo>=</mo><mi>π</mi></mrow></math> 或 <math><mrow><mi>a</mi><mo>=</mo><mo>−</mo><mi>π</mi></mrow></math>，<math><mrow><mi>sin</mi><mi>a</mi><mo>=</mo><mn>0</mn></mrow></math> 而 <math><mrow><mo stretchy="false">(</mo><mi>sin</mi><mi>z</mi><msubsup><mo stretchy="false">)</mo><mrow><mi>z</mi><mo>=</mo><mi>a</mi></mrow><mi>′</mi></msubsup><mo>=</mo><mi>cos</mi><mi>a</mi><mo>=</mo><mo>−</mo><mn>1</mn><mo>≠</mo><mn>0</mn></mrow></math>。分子 <math><mrow><mo stretchy="false">(</mo><msup><mi>e</mi><mi>a</mi></msup><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>cos</mi><mi>a</mi></mrow></math> 非零，因此两个点均为单极点，并有 <math display="block"><mrow><msub><mo>Res</mo><mrow><mi>z</mi><mo>=</mo><mi>a</mi></mrow></msub><mi>g</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><msup><mi>e</mi><mi>a</mi></msup><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>cos</mi><mi>a</mi></mrow><mrow><mi>cos</mi><mi>a</mi></mrow></mfrac><mo>=</mo><msup><mi>e</mi><mi>a</mi></msup><mo>−</mo><mn>1</mn><mo>.</mo></mrow></math></p></li><li><p><math><mrow><mi>C</mi></mrow></math> 的方向为逆时针，由留数定理，<math display="block"><mrow><msub><mo>∮</mo><mi>C</mi></msub><mi>g</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mo stretchy="false">(</mo><msup><mi>e</mi><mi>π</mi></msup><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo>+</mo><mo stretchy="false">(</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>π</mi></mrow></msup><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi><mo stretchy="false">(</mo><msup><mi>e</mi><mi>π</mi></msup><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>π</mi></mrow></msup><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo><mo>.</mo></mrow></math></p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><msub><mo>∮</mo><mi>C</mi></msub><mo stretchy="false">(</mo><msup><mi>e</mi><mi>z</mi></msup><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>cot</mi><mi>z</mi><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi><mo stretchy="false">(</mo><msup><mi>e</mi><mi>π</mi></msup><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>π</mi></mrow></msup><mo>−</mo><mn>2</mn><mo stretchy="false">)</mo></mstyle></mrow></math>。</p></details><h3>直接读取负一次项</h3><p>求 z⁻³ cos z 在原点的留数。</p><p class="source">补充教材 Complex Analysis · §8.1 习题 1(f)</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>3</mn></mrow></msup><mi>cos</mi><mi>z</mi></mrow></math>。<math><mrow><mi>cos</mi><mi>z</mi></mrow></math> 在原点的泰勒展开收敛，且 <math><mrow><mi>cos</mi><mn>0</mn><mo>=</mo><mn>1</mn></mrow></math>，所以 <math><mrow><mi>z</mi><mo>=</mo><mn>0</mn></mrow></math> 是 <math><mrow><mi>f</mi></mrow></math> 的三阶极点。在去心邻域内，把 <math><mrow><mi>cos</mi><mi>z</mi></mrow></math> 的泰勒级数乘以 <math><mrow><msup><mi>z</mi><mrow><mo>−</mo><mn>3</mn></mrow></msup></mrow></math> 即得 <math><mrow><mi>f</mi></mrow></math> 的洛朗级数。</p></li><li><p>由于乘上 <math><mrow><msup><mi>z</mi><mrow><mo>−</mo><mn>3</mn></mrow></msup></mrow></math> 后，只有原级数中的 <math><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow></math> 项会成为 <math><mrow><msup><mi>z</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math> 项，展开至二次项已足够。<math display="block"><mrow><mrow><mi>cos</mi><mi>z</mi><mo>=</mo><mn>1</mn><mo>−</mo><mfrac><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><mrow><mn>2</mn></mrow></mfrac><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><msup><mi>z</mi><mn>4</mn></msup><mo stretchy="false">)</mo><mo>,</mo><mspace linebreak="newline" /><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mi>z</mi><mn>3</mn></msup></mrow></mfrac><mo>−</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>2</mn><mi>z</mi></mrow></mfrac><mo>+</mo><mi>O</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>.</mo></mrow></mrow></math></p></li><li><p>孤立奇点处的留数等于洛朗展开中 <math><mrow><msup><mi>z</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math> 的系数，故所求留数为 <math><mrow><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mo>Res</mo><mo stretchy="false">(</mo><msup><mi>z</mi><mrow><mo>−</mo><mn>3</mn></mrow></msup><mi>cos</mi><mi>z</mi><mo>,</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></math>。</p></details></section><div class="box" id="type-50"><b>展开读留数与高阶极点求导</b><p>求解留数没有必要一律死算高阶导数。一阶极点用分子除以分母导数最快捷；含 e^{1/(z-a)} 等本性奇点或三阶以上分式极点时，做平移展开找 -1 次项往往只需两三行；而当围线外奇点数量远少于围线内奇点时，扣掉外部奇点与无穷远点的贡献能大幅简化计算。</p></div><div class="box" id="type-51"><b>无穷远留数与全平面求和</b><p>全平面留数和定理表明，扩充复平面上只有有限个孤立奇点的函数，其所有有限奇点留数加上无穷远点留数的总和恒为零。因此当正向闭路 C 内挤满高阶极点、而 C 外几乎没有有限奇点时，反过来只算 C 外部极点与 z=∞ 的留数并添负号，往往能在几步之内完成求解。</p></div><div class="box" id="type-53"><b>对数导数与零极点阶数</b><p>若函数在 a 处有 m 阶零点（m&gt;0）或 |m| 阶极点（m&lt;0），则可统一写成 f(z)=(z-a)^m h(z)（h(a)≠ 0 解析）。求对数导数 f&#x27;/f 时，乘积求导并相除恰好把指数 m 直接剥离成 m/(z-a)，余项 h&#x27;/h 在 a 解析，因此对数导数只呈现一阶极点且留数恰好等于阶数 m（或 -n）。</p></div><div class="box" id="type-77"><b>给定零点阶数求商的留数</b><p>当函数仅以抽象零点阶数给出时，设 h=z-a 并写出分子和分母从最低非零幂开始的泰勒展开式。由最低幂之差直接确定极点阶数；随后把分母最高公因子提出并对剩余非零幂级数取倒数展开到所需低阶项，便可精确读出 h^{-1} 项的留数通式。</p></div><div class="box" id="type-54"><b>周期三角积分的单位圆法</b><p>设 z=e^{iθ}，当 θ 从 0 变到 2π 时，z 恰好沿单位圆 |z|=1 逆时针绕行一周。借此将 cosθ=(z+z^{-1})/2、sinθ=(z-z^{-1})/(2i) 和 dθ=dz/(iz) 全部替换为 z 的有理函数，即把实三角定积分转化为单位圆周的留数计算。</p></div><section class="box" id="type-11"><small>第五章 · 核心必考</small><h2>用留数求实积分</h2><p>当实有理函数 P(x)/Q(x) 在实轴上没有奇点、且分母次数比分子至少高 2 次时，沿半径 R 的上半圆弧积分模长按 O(1/R) 衰减，在 R→∞ 时自动消失。由此，整条实轴反常积分就等于由实轴与大上半圆弧闭合而成的上半平面围线积分，从而只需计算严格落在上半平面（Ima&gt;0）极点的留数之和。</p><details><summary>上半圆围道</summary><div>∫<sub>−∞</sub><sup>∞</sup> f(x) dx = 2πi ∑<sub>Im a&gt;0</sub> Res(f,a)</div><p>适用条件：实轴无极点，实积分存在，大圆弧积分趋于零。须说明衰减。</p></details><details><summary>弧积分估计</summary><div>|∫<sub>Γ</sub> f(z) dz| ≤ πR max<sub>Γ</sub>|f(z)|</div><p>适用条件：Γ 是半径 R 的半圆弧。若沿弧 f=O(R⁻²)，右端趋于 0。</p></details><details><summary>解题思路</summary><ol><li>核验条件与对称转化：确认实轴无极点且分母比分子至少高二次；若是 [0,+∞) 上的偶函数积分，先改写为 (1)/(2)∫_{-∞}^{+∞}。</li><li>选定上半平面极点：解出分母的全部复根，仅保留虚部严格大于零（Ima_k&gt;0）的上半平面极点，并逐一求出留数（二阶极点用求导公式）。</li><li>说明大弧消零得出结果：用弧长 π R 与衰减阶数说明上半圆弧积分趋零，写出 2π i∑Res，如系半轴积分再除以 2。</li></ol></details><h3>用二阶极点求全轴实积分</h3><p>用留数定理求 I=∫<sub>−∞</sub><sup>∞</sup> dx/(1+x²)²。</p><p class="source">本课教材 · 第五章习题 13（3） · 第 185 页</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn></mrow><mrow><mo stretchy="false">(</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle></mrow></math>。<math><mrow><mi>f</mi></mrow></math> 在实轴上连续，且 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mi>O</mi><mo stretchy="false">(</mo><mo stretchy="false">|</mo><mi>x</mi><msup><mo stretchy="false">|</mo><mrow><mo>−</mo><mn>4</mn></mrow></msup><mo stretchy="false">)</mo></mrow></math>，故全轴积分收敛。取 <math><mrow><mi>R</mi><mo>&#x0003E;</mo><mn>1</mn></mrow></math>，由 <math><mrow><mo stretchy="false">[</mo><mo>−</mo><mi>R</mi><mo>,</mo><mi>R</mi><mo stretchy="false">]</mo></mrow></math> 和从 <math><mrow><mi>R</mi></mrow></math> 到 <math><mrow><mo>−</mo><mi>R</mi></mrow></math> 的上半圆弧 <math><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></math> 组成正向围道，围道内部只有二阶极点 <math><mrow><mi>i</mi></mrow></math>。</p></li><li><p>计算二阶极点留数。<math display="block"><mrow><mrow><mo>Res</mo><mo stretchy="false">(</mo><mi>f</mi><mo>,</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mrow><mo stretchy="true" fence="true" form="prefix" /><mfrac><mrow><mi>d</mi></mrow><mrow><mi>d</mi><mi>z</mi></mrow></mfrac><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mrow><mi>z</mi><mo>=</mo><mi>i</mi></mrow></msub><mspace linebreak="newline" /><mo>=</mo><msub><mrow><mo stretchy="true" fence="true" form="prefix" /><mo>−</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>3</mn></msup></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mrow><mi>z</mi><mo>=</mo><mi>i</mi></mrow></msub><mo>=</mo><mo>−</mo><mfrac><mrow><mn>2</mn></mrow><mrow><mo stretchy="false">(</mo><mn>2</mn><mi>i</mi><msup><mo stretchy="false">)</mo><mn>3</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn></mrow><mrow><mn>4</mn><mi>i</mi></mrow></mfrac><mo>.</mo></mrow></mrow></math> 因此 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∫</mo><mrow><mo>−</mo><mi>R</mi></mrow><mrow><mi>R</mi></mrow></msubsup><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>x</mi><mo>+</mo><msub><mo>∫</mo><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></msub><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi><mo>·</mo><mfrac><mn>1</mn><mrow><mn>4</mn><mi>i</mi></mrow></mfrac><mo>=</mo><mfrac><mi>π</mi><mn>2</mn></mfrac></mstyle></mrow></math>。</p></li><li><p>由 <math><mrow><mo stretchy="false">|</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn><mo stretchy="false">|</mo><mo>≥</mo><msup><mi>R</mi><mn>2</mn></msup><mo>−</mo><mn>1</mn></mrow></math> 及 <math><mrow><mo stretchy="false">|</mo><msub><mi>Γ</mi><mi>R</mi></msub><mo stretchy="false">|</mo><mo>=</mo><mi>π</mi><mi>R</mi></mrow></math>，有 <math display="block"><mrow><mrow><mo stretchy="true" fence="true" form="prefix">|</mo><msub><mo>∫</mo><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></msub><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mo>≤</mo><mfrac><mrow><mi>π</mi><mi>R</mi></mrow><mrow><mo stretchy="false">(</mo><msup><mi>R</mi><mn>2</mn></msup><mo>−</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mi>⟶</mi><mn>0</mn><mspace width="2em" /><mo stretchy="false">(</mo><mi>R</mi><mo>→</mo><mo>∞</mo><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 在围线积分等式中取极限，便得到所求全轴积分。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>I</mi><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mfrac><mrow><mi>d</mi><mi>x</mi></mrow><mrow><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><msup><mi>x</mi><mn>2</mn></msup><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mi>π</mi><mn>2</mn></mfrac></mstyle></mrow></math>。</p></details><h3>四次分母的半轴积分</h3><p>若 a>0，求 I=∫₀<sup>∞</sup> dx/(x⁴+a⁴)。</p><p class="source">2021 年 8 月卷 · 六(2)</p><details><summary>查看完整解答</summary><ol><li><p>记 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mi>z</mi><mn>4</mn></msup><mo>+</mo><msup><mi>a</mi><mn>4</mn></msup></mrow></mfrac></mstyle></mrow></math>。因 <math><mrow><mi>a</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，实轴上无极点，且 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mi>O</mi><mo stretchy="false">(</mo><mo stretchy="false">|</mo><mi>x</mi><msup><mo stretchy="false">|</mo><mrow><mo>−</mo><mn>4</mn></mrow></msup><mo stretchy="false">)</mo></mrow></math>，故原反常积分收敛。由偶性有 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mn>2</mn><mi>I</mi><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>x</mi></mstyle></mrow></math>。</p></li><li><p>取 <math><mrow><mi>R</mi><mo>&#x0003E;</mo><mi>a</mi></mrow></math>，以线段 <math><mrow><mo stretchy="false">[</mo><mo>−</mo><mi>R</mi><mo>,</mo><mi>R</mi><mo stretchy="false">]</mo></mrow></math> 和从 <math><mrow><mi>R</mi></mrow></math> 逆时针走到 <math><mrow><mo>−</mo><mi>R</mi></mrow></math> 的上半圆弧 <math><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></math> 组成正向闭合围道 <math><mrow><msub><mi>C</mi><mi>R</mi></msub></mrow></math>。上半平面内的根为 <math><mrow><msub><mi>z</mi><mn>1</mn></msub><mo>=</mo><mi>a</mi><msup><mi>e</mi><mrow><mi>i</mi><mi>π</mi><mo>/</mo><mn>4</mn></mrow></msup></mrow></math>、<math><mrow><msub><mi>z</mi><mn>2</mn></msub><mo>=</mo><mi>a</mi><msup><mi>e</mi><mrow><mn>3</mn><mi>i</mi><mi>π</mi><mo>/</mo><mn>4</mn></mrow></msup></mrow></math>。分母在两点的导数 <math><mrow><mn>4</mn><msubsup><mi>z</mi><mi>j</mi><mn>3</mn></msubsup></mrow></math> 均非零，故均为一阶极点。<math display="block"><mrow><mo>Res</mo><mo stretchy="false">(</mo><mi>f</mi><mo>,</mo><msub><mi>z</mi><mi>j</mi></msub><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mrow><mn>4</mn><msubsup><mi>z</mi><mi>j</mi><mn>3</mn></msubsup></mrow></mfrac><mo>=</mo><mfrac><mrow><msub><mi>z</mi><mi>j</mi></msub></mrow><mrow><mn>4</mn><msubsup><mi>z</mi><mi>j</mi><mn>4</mn></msubsup></mrow></mfrac><mo>=</mo><mo>−</mo><mfrac><mrow><msub><mi>z</mi><mi>j</mi></msub></mrow><mrow><mn>4</mn><msup><mi>a</mi><mn>4</mn></msup></mrow></mfrac><mspace width="2em" /><mo stretchy="false">(</mo><mi>j</mi><mo>=</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo stretchy="false">)</mo><mo>.</mo></mrow></math></p></li><li><p>由 <math><mrow><msub><mi>z</mi><mn>1</mn></msub><mo>+</mo><msub><mi>z</mi><mn>2</mn></msub><mo>=</mo><msqrt><mn>2</mn></msqrt><mspace width="0.167em" /><mi>i</mi><mi>a</mi></mrow></math>，留数定理给出 <math display="block"><mrow><msubsup><mo>∫</mo><mrow><mo>−</mo><mi>R</mi></mrow><mrow><mi>R</mi></mrow></msubsup><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>x</mi><mo>+</mo><msub><mo>∫</mo><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></msub><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mo>−</mo><mfrac><mrow><msqrt><mn>2</mn></msqrt><mspace width="0.167em" /><mi>i</mi></mrow><mrow><mn>4</mn><msup><mi>a</mi><mn>3</mn></msup></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mrow><msqrt><mn>2</mn></msqrt><mspace width="0.167em" /><msup><mi>a</mi><mn>3</mn></msup></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>在 <math><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></math> 上，<math><mrow><mo stretchy="false">|</mo><msup><mi>z</mi><mn>4</mn></msup><mo>+</mo><msup><mi>a</mi><mn>4</mn></msup><mo stretchy="false">|</mo><mo>≥</mo><msup><mi>R</mi><mn>4</mn></msup><mo>−</mo><msup><mi>a</mi><mn>4</mn></msup></mrow></math>。圆弧长为 <math><mrow><mi>π</mi><mi>R</mi></mrow></math>，所以 <math display="block"><mrow><mrow><mo stretchy="true" fence="true" form="prefix">|</mo><msub><mo>∫</mo><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></msub><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mo>≤</mo><mfrac><mrow><mi>π</mi><mi>R</mi></mrow><mrow><msup><mi>R</mi><mn>4</mn></msup><mo>−</mo><msup><mi>a</mi><mn>4</mn></msup></mrow></mfrac><mi>⟶</mi><mn>0</mn><mspace width="2em" /><mo stretchy="false">(</mo><mi>R</mi><mo>→</mo><mo>∞</mo><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 令 <math><mrow><mi>R</mi><mo>→</mo><mo>∞</mo></mrow></math>，得到全轴积分，再除以 <math><mrow><mn>2</mn></mrow></math> 得原半轴积分。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>I</mi><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt><mspace width="0.167em" /><msup><mi>a</mi><mn>3</mn></msup></mrow></mfrac></mstyle></mrow></math>，其中 <math><mrow><mi>a</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。</p></details><h3>两个二次因子的全轴积分</h3><p>a,b>0 且 a≠b，求 ∫<sub>−∞</sub><sup>∞</sup> x²/[(x²+a²)(x²+b²)] dx。</p><p class="source">ch5.3 第 11 页 · 例 1</p><details><summary>查看完整解答</summary><ol><li><p>记 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><msup><mi>z</mi><mn>2</mn></msup></mrow><mrow><mo stretchy="false">(</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mo stretchy="false">(</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac></mstyle></mrow></math>。由 <math><mrow><mi>a</mi><mo>,</mo><mi>b</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，知实轴上无极点，且 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mo>=</mo><mi>O</mi><mo stretchy="false">(</mo><mo stretchy="false">|</mo><mi>x</mi><msup><mo stretchy="false">|</mo><mrow><mo>−</mo><mn>2</mn></mrow></msup><mo stretchy="false">)</mo></mrow></math>，故全轴积分收敛。取 <math><mrow><mi>R</mi><mo>&#x0003E;</mo><mo>max</mo><mo stretchy="false">{</mo><mi>a</mi><mo>,</mo><mi>b</mi><mo stretchy="false">}</mo></mrow></math>，以 <math><mrow><mo stretchy="false">[</mo><mo>−</mo><mi>R</mi><mo>,</mo><mi>R</mi><mo stretchy="false">]</mo></mrow></math> 和上半圆弧 <math><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></math> 组成正向围道。由于 <math><mrow><mi>a</mi><mo>≠</mo><mi>b</mi></mrow></math>，围道内的 <math><mrow><mi>i</mi><mi>a</mi></mrow></math> 与 <math><mrow><mi>i</mi><mi>b</mi></mrow></math> 是两个不同的一阶极点。</p></li><li><p>用一阶极点留数公式，分别消去因子 <math><mrow><mi>z</mi><mo>−</mo><mi>i</mi><mi>a</mi></mrow></math> 与 <math><mrow><mi>z</mi><mo>−</mo><mi>i</mi><mi>b</mi></mrow></math>。<math display="block"><mrow><mrow><mo>Res</mo><mo stretchy="false">(</mo><mi>f</mi><mo>,</mo><mi>i</mi><mi>a</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><mi>i</mi><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mrow><mo stretchy="false">(</mo><mn>2</mn><mi>i</mi><mi>a</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mi>i</mi><mi>a</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn><mi>i</mi><mo stretchy="false">(</mo><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><msup><mi>b</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac><mo>,</mo><mspace linebreak="newline" /><mo>Res</mo><mo stretchy="false">(</mo><mi>f</mi><mo>,</mo><mi>i</mi><mi>b</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mo stretchy="false">(</mo><mi>i</mi><mi>b</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow><mrow><mo stretchy="false">(</mo><mn>2</mn><mi>i</mi><mi>b</mi><mo stretchy="false">)</mo><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mi>i</mi><mi>b</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>b</mi></mrow><mrow><mn>2</mn><mi>i</mi><mo stretchy="false">(</mo><msup><mi>b</mi><mn>2</mn></msup><mo>−</mo><msup><mi>a</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac><mo>.</mo></mrow></mrow></math> 两者相加得 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>a</mi><mo>−</mo><mi>b</mi></mrow><mrow><mn>2</mn><mi>i</mi><mo stretchy="false">(</mo><msup><mi>a</mi><mn>2</mn></msup><mo>−</mo><msup><mi>b</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mrow><mn>2</mn><mi>i</mi><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo></mrow></mfrac></mstyle></mrow></math>。</p></li><li><p>当 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo stretchy="false">|</mo><mo>=</mo><mi>R</mi></mrow></math> 时，<math><mrow><mo stretchy="false">|</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup><mo stretchy="false">|</mo><mo>≥</mo><msup><mi>R</mi><mn>2</mn></msup><mo>−</mo><msup><mi>a</mi><mn>2</mn></msup></mrow></math>、<math><mrow><mo stretchy="false">|</mo><msup><mi>z</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo stretchy="false">|</mo><mo>≥</mo><msup><mi>R</mi><mn>2</mn></msup><mo>−</mo><msup><mi>b</mi><mn>2</mn></msup></mrow></math>，故 <math display="block"><mrow><mrow><mo stretchy="true" fence="true" form="prefix">|</mo><msub><mo>∫</mo><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></msub><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mo>≤</mo><mfrac><mrow><mi>π</mi><msup><mi>R</mi><mn>3</mn></msup></mrow><mrow><mo stretchy="false">(</mo><msup><mi>R</mi><mn>2</mn></msup><mo>−</mo><msup><mi>a</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mo stretchy="false">(</mo><msup><mi>R</mi><mn>2</mn></msup><mo>−</mo><msup><mi>b</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac><mi>⟶</mi><mn>0</mn><mo>.</mo></mrow></math></p></li><li><p>留数定理给出 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∫</mo><mrow><mo>−</mo><mi>R</mi></mrow><mrow><mi>R</mi></mrow></msubsup><mi>f</mi><mo stretchy="false">(</mo><mi>x</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>x</mi><mo>+</mo><msub><mo>∫</mo><mrow><msub><mi>Γ</mi><mi>R</mi></msub></mrow></msub><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>z</mi><mo>=</mo><mn>2</mn><mi>π</mi><mi>i</mi><mo>·</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mrow><mn>2</mn><mi>i</mi><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo></mrow></mfrac></mstyle></mstyle></mrow></math>。令 <math><mrow><mi>R</mi><mo>→</mo><mo>∞</mo></mrow></math> 即得所求积分。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mfrac><mrow><msup><mi>x</mi><mn>2</mn></msup></mrow><mrow><mo stretchy="false">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>a</mi><mn>2</mn></msup><mo stretchy="false">)</mo><mo stretchy="false">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>b</mi><mn>2</mn></msup><mo stretchy="false">)</mo></mrow></mfrac><mspace width="0.167em" /><mi>d</mi><mi>x</mi><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mi>a</mi><mo>+</mo><mi>b</mi></mrow></mfrac></mstyle></mrow></math>。</p></details></section><div class="box" id="type-55"><b>有理函数全轴与半轴反常积分</b><p>对实轴无零点且满足 deg Q - deg P ≥ 2 的有理函数，其沿上半平面大圆弧 |z|=R 的积分在 R→∞ 时以 O(1/R) 速度衰减为零。这使得原实积分直接由上半平面内的全部极点留数和确定；即使遇到二阶以上重极点（如 (x^2+1)^2），也只需结合高阶极点求导法则即可求得精确值。</p></div><div class="box" id="type-56"><b>振荡反常积分与约当引理</b><p>当有理分母比分子只高 1 次（如 (xsin(ax))/(x^2+b^2)）时，普通 ML 估计已不足以说明弧积分趋零，而直接把 cos(ax) 换成 cos(az) 更会因为沿虚轴指数爆炸而失效。约当引理指出：在 a&gt;0 时把三角因子嵌入 e^{iaz} 并在上半平面封闭，指数衰减因子 e^{-ay} 将强力压制大圆弧积分趋零，取留数结果实部或虚部即得正解。</p></div><div class="box" id="type-80"><b>实轴极点与柯西主值</b><p>当一阶极点恰好落在实轴上时，普通反常积分发散，必须讨论对称删去极点邻域的柯西主值（PV）。常用技巧是在实轴极点 b 处从上半平面（或下半平面）挖去一个半径为 ε 的小半圆绕开奇点：随着 ε→ 0，顺时针上方小半圆恰好贡献“负的半留数” -π iRes(f,b)。</p></div><h2>第六章 · 共形映射</h2><div class="box" id="type-57"><b>局部保角、伸缩率与旋转角</b><p>当解析函数在一点满足 f&#x27;(z_0)≠ 0 时，由复导数极限可知任意过 z_0 的光滑曲线经过映射后，切线长度一致放大 |f&#x27;(z_0)| 倍（伸缩率不变性），切线方向一致逆时针旋转 arg f&#x27;(z_0) 弧度（保角性）。反之在导数为零的点 f&#x27;(z_0)=0 处，夹角将被成倍放大（如 w=z^2 在原点将夹角加倍），映射不再保角。</p></div><section class="box" id="type-12"><small>第六章 · 高频重点</small><h2>分式映射下曲线的像</h2><p>分式线性映射 w=(az+b)/(cz+d)（ad-bc≠ 0）在扩充复平面上一一对应且处处保角，并具备著名的“保广义圆性”：将圆周或直线映射为圆周或直线。判断像究竟是直线还是圆周的黄金判据是看原曲线是否经过极点 z=-d/c：经过极点（有某点被映成 ∞）则像必是直线，不经过极点则像必是有界圆周。</p><details><summary>反求坐标</summary><div>1/w = (u−iv)/(u²+v²)</div><p>适用条件：w=u+iv≠0；用反变换时要排除其无定义的点。</p></details><details><summary>保圆性</summary><div>w = (az+b)/(cz+d)</div><p>适用条件：ad−bc≠0。扩充复平面上的圆与直线统称广义圆，分式线性映射将广义圆映成广义圆。</p></details><details><summary>解题思路</summary><ol><li>求反变换写实虚坐标：解出 z 关于 w=u+iv 的反映射，写出 x(u,v), y(u,v)（或直接利用 |z-a|=R 几何距离等式整理）。</li><li>代入曲线并检查极点：将 x,y 代入原曲线或不等式整理化简为关于 u,v 的圆或直线方程，并核查极点或 w=0 等单独剔除点。</li><li>测试内点判定像域方向：若原题求区域像，在原区域内部选一简单测试点 z_0 代入得 w_0，最终确定像域在边界的哪一侧。</li></ol></details><h3>圆在反演下的像</h3><p>求圆 (x−1)²+y²=1（去掉原点）在 w=1/z 下的像。</p><p class="source">本课教材 · 第一章习题 26（4） · 第 34 页</p><details><summary>查看完整解答</summary><ol><li><p>原圆方程可写为 <math><mrow><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>y</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>x</mi></mrow></math>，也就是 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>=</mo><mn>2</mn><mo>Re</mo><mi>z</mi></mrow></math>。在 <math><mrow><mi>z</mi><mo>≠</mo><mn>0</mn></mrow></math> 时，<math><mrow><mi>w</mi><mo>=</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></math> 有限且非零，可用反变换 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn><mo>/</mo><mi>w</mi></mrow></math> 求像。</p></li><li><p>令 <math><mrow><mi>w</mi><mo>=</mo><mi>u</mi><mo>+</mo><mi>i</mi><mi>v</mi></mrow></math>，则 <math display="block"><mrow><mi>z</mi><mo>=</mo><mfrac><mrow><mi>u</mi><mo>−</mo><mi>i</mi><mi>v</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>,</mo><mspace width="2em" /><mi>x</mi><mo>=</mo><mfrac><mrow><mi>u</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>,</mo><mspace width="2em" /><mo stretchy="false">|</mo><mi>z</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>.</mo></mrow></math> 代入原圆方程得 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>2</mn><mi>u</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac></mstyle></mrow></math>。分母非零，故 <math><mrow><mi>u</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></math>。</p></li><li><p>反过来，直线 <math><mrow><mi>u</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></math> 上任意点 <math><mrow><mi>w</mi></mrow></math> 均非零。由 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn><mo>/</mo><mi>w</mi></mrow></math> 可得非零有限点 <math><mrow><mi>z</mi></mrow></math>，并且 <math><mrow><mo stretchy="false">|</mo><mi>z</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>=</mo><mn>2</mn><mo>Re</mo><mi>z</mi></mrow></math>，所以每个这样的 <math><mrow><mi>w</mi></mrow></math> 都有原像。</p></li></ol><strong>结论</strong><p>像为整条直线 <math><mrow><mo>Re</mo><mi>w</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></math>。</p></details><h3>反演后水平带映到哪里</h3><p>在 w=1/z 下，求水平带 0&lt;Im z&lt;1/2 的像域。</p><p class="source">本课教材 · 第六章习题 8（3） · 第 246 页</p><details><summary>查看完整解答</summary><ol><li><p>带状区域内 <math><mrow><mi>z</mi></mrow></math> 的虚部为正，故 <math><mrow><mi>z</mi><mo>≠</mo><mn>0</mn></mrow></math>。记 <math><mrow><mi>w</mi><mo>=</mo><mi>u</mi><mo>+</mo><mi>i</mi><mi>v</mi></mrow></math>，由 <math><mrow><mi>w</mi><mo>=</mo><mn>1</mn><mo>/</mo><mi>z</mi></mrow></math> 可知 <math><mrow><mi>w</mi><mo>≠</mo><mn>0</mn></mrow></math>，反解得 <math display="block"><mrow><mi>z</mi><mo>=</mo><mfrac><mn>1</mn><mi>w</mi></mfrac><mo>=</mo><mfrac><mrow><mi>u</mi><mo>−</mo><mi>i</mi><mi>v</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>,</mo><mspace width="2em" /><mo>Im</mo><mi>z</mi><mo>=</mo><mo>−</mo><mfrac><mrow><mi>v</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>因 <math><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，条件 <math><mrow><mn>0</mn><mo>&#x0003C;</mo><mo>Im</mo><mi>z</mi></mrow></math> 等价于 <math><mrow><mi>v</mi><mo>&#x0003C;</mo><mn>0</mn></mrow></math>。条件 <math><mrow><mo>Im</mo><mi>z</mi><mo>&#x0003C;</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></math> 等价于 <math><mrow><mo>−</mo><mn>2</mn><mi>v</mi><mo>&#x0003C;</mo><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></math>，即 <math display="block"><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><mo stretchy="false">(</mo><mi>v</mi><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>&#x0003E;</mo><mn>1</mn><mo>.</mo></mrow></math> 因此像点位于实轴下方及圆心为 <math><mrow><mo>−</mo><mi>i</mi></mrow></math>、半径为 <math><mrow><mn>1</mn></mrow></math> 的圆的外部。</p></li><li><p>反过来，若 <math><mrow><mi>v</mi><mo>&#x0003C;</mo><mn>0</mn></mrow></math> 且 <math><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><mo stretchy="false">(</mo><mi>v</mi><mo>+</mo><mn>1</mn><msup><mo stretchy="false">)</mo><mn>2</mn></msup><mo>&#x0003E;</mo><mn>1</mn></mrow></math>，则 <math><mrow><mi>w</mi><mo>≠</mo><mn>0</mn></mrow></math>，并可逐步逆推得 <math><mrow><mn>0</mn><mo>&#x0003C;</mo><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>v</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac></mstyle><mo>&#x0003C;</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle></mrow></math>。所以反解 <math><mrow><mi>z</mi><mo>=</mo><mn>1</mn><mo>/</mo><mi>w</mi></mrow></math> 位于原带状区域内，两个严格不等式共同给出完整像域。</p></li></ol><strong>结论</strong><p>像域为 <math><mrow><mo stretchy="false">{</mo><mi>w</mi><mi>:</mi><mo>Im</mo><mi>w</mi><mo>&#x0003C;</mo><mn>0</mn><mo>,</mo><mtext> </mtext><mo stretchy="false">|</mo><mi>w</mi><mo>+</mo><mi>i</mi><mo stretchy="false">|</mo><mo>&#x0003E;</mo><mn>1</mn><mo stretchy="false">}</mo></mrow></math>。</p></details><h3>像圆上少了哪个点</h3><p>在有限复平面内，求直线 x=1 在 w=i/z 下的像。</p><p class="source">2022 年 6 月 A 卷 · 一(3)</p><details><summary>查看完整解答</summary><ol><li><p>直线 <math><mrow><mi>x</mi><mo>=</mo><mn>1</mn></mrow></math> 上的点 <math><mrow><mi>z</mi></mrow></math> 均非零，所以有限像点 <math><mrow><mi>w</mi><mo>=</mo><mi>i</mi><mo>/</mo><mi>z</mi></mrow></math> 也非零。设 <math><mrow><mi>w</mi><mo>=</mo><mi>u</mi><mo>+</mo><mi>i</mi><mi>v</mi></mrow></math>，则 <math display="block"><mrow><mi>z</mi><mo>=</mo><mfrac><mrow><mi>i</mi></mrow><mrow><mi>w</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>v</mi><mo>+</mo><mi>i</mi><mi>u</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>,</mo><mspace width="2em" /><mo>Re</mo><mi>z</mi><mo>=</mo><mfrac><mrow><mi>v</mi></mrow><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>代入 <math><mrow><mo>Re</mo><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math>，得 <math><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mi>v</mi></mrow></math>。配方得 <math display="block"><mrow><msup><mi>u</mi><mn>2</mn></msup><mo>+</mo><msup><mrow><mo stretchy="true" fence="true" form="prefix">(</mo><mi>v</mi><mo>−</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">)</mo></mrow><mn>2</mn></msup><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>.</mo></mrow></math></p></li><li><p><math><mrow><mi>w</mi><mo>=</mo><mn>0</mn></mrow></math> 虽满足所得圆方程，但 <math><mrow><mi>i</mi><mo>/</mo><mi>z</mi></mrow></math> 对任何有限的非零 <math><mrow><mi>z</mi></mrow></math> 均不等于 <math><mrow><mn>0</mn></mrow></math>。对于圆周上任意 <math><mrow><mi>w</mi><mo>≠</mo><mn>0</mn></mrow></math>，由 <math><mrow><mi>z</mi><mo>=</mo><mi>i</mi><mo>/</mo><mi>w</mi></mrow></math> 反解可得 <math><mrow><mo>Re</mo><mi>z</mi><mo>=</mo><mn>1</mn></mrow></math>，故这些点全部取到。</p></li></ol><strong>结论</strong><p>像为 <math><mrow><mrow><mo stretchy="true" fence="true" form="prefix">{</mo><mi>w</mi><mi>:</mi><mrow><mo stretchy="true" fence="true" form="prefix">|</mo><mi>w</mi><mo>−</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>i</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mstyle><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mn>1</mn><mn>2</mn></mfrac></mstyle><mo>,</mo><mtext> </mtext><mi>w</mi><mo>≠</mo><mn>0</mn><mo stretchy="true" fence="true" form="postfix">}</mo></mrow></mrow></math>。</p></details><h3>判定半平面的像并证明满射</h3><p>在 w=i(1−z)/(1+z) 下求右半平面 Re z>0 的像，并说明像域中的每一点均能取到。</p><p class="source">补充教材 Complex Analysis · §9.2 习题 3</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mo>Re</mo><mi>z</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，则 <math><mrow><mi>z</mi><mo>≠</mo><mo>−</mo><mn>1</mn></mrow></math>，所以 <math><mrow><mi>w</mi><mo>=</mo><mi>i</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>z</mi><mo stretchy="false">)</mo><mo>/</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>z</mi><mo stretchy="false">)</mo></mrow></math> 有定义。计算 <math display="block"><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>+</mo><mi>z</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>−</mo><mo stretchy="false">|</mo><mn>1</mn><mo>−</mo><mi>z</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>=</mo><mn>2</mn><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mrow class="ov"><mi>z</mi></mrow><mo stretchy="false">)</mo><mo>=</mo><mn>4</mn><mo>Re</mo><mi>z</mi><mo>&gt;</mo><mn>0</mn><mo>,</mo></mrow></math> 可知 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mo stretchy="false">|</mo><mi>w</mi><mo stretchy="false">|</mo><mo>=</mo><mfrac><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>−</mo><mi>z</mi><mo stretchy="false">|</mo></mrow><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>+</mo><mi>z</mi><mo stretchy="false">|</mo></mrow></mfrac><mo>&#x0003C;</mo><mn>1</mn></mstyle></mrow></math>。</p></li><li><p>反过来，任取 <math><mrow><mo stretchy="false">|</mo><mi>w</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>，则 <math><mrow><mi>w</mi><mo>≠</mo><mo>−</mo><mi>i</mi></mrow></math>，方程 <math><mrow><mi>w</mi><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mi>i</mi><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>z</mi><mo stretchy="false">)</mo></mrow></math> 有唯一解 <math><mrow><mi>z</mi><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>i</mi><mo>−</mo><mi>w</mi></mrow><mrow><mi>i</mi><mo>+</mo><mi>w</mi></mrow></mfrac></mstyle></mrow></math>。</p></li><li><p>将反解的分子、分母同乘 <math><mrow><mrow class="ov"><mi>i</mi><mo>+</mo><mi>w</mi></mrow></mrow></math>，得到 <math display="block"><mrow><mo>Re</mo><mi>z</mi><mo>=</mo><mfrac><mrow><mo>Re</mo><mo stretchy="false">[</mo><mo stretchy="false">(</mo><mi>i</mi><mo>−</mo><mi>w</mi><mo stretchy="false">)</mo><mrow class="ov"><mo stretchy="false">(</mo><mi>i</mi><mo>+</mo><mi>w</mi><mo stretchy="false">)</mo></mrow><mo stretchy="false">]</mo></mrow><mrow><mo stretchy="false">|</mo><mi>i</mi><mo>+</mo><mi>w</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>1</mn><mo>−</mo><mo stretchy="false">|</mo><mi>w</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup></mrow><mrow><mo stretchy="false">|</mo><mi>i</mi><mo>+</mo><mi>w</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup></mrow></mfrac><mo>&gt;</mo><mn>0</mn><mo>.</mo></mrow></math> 因此所得原像确实在右半平面内，且它的像就是所取的 <math><mrow><mi>w</mi></mrow></math>。</p></li></ol><strong>结论</strong><p>右半平面的像恰为单位圆盘 <math><mrow><mo stretchy="false">{</mo><mi>w</mi><mi>:</mi><mo stretchy="false">|</mo><mi>w</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn><mo stretchy="false">}</mo></mrow></math>，圆盘内每一点都有唯一原像。</p></details></section><div class="box" id="type-58"><b>三点对应、保圆性与对称点</b><p>由于分式线性映射仅含三个本质复自由度，任意互异的三点 (z_1,z_2,z_3) 到互异三点 (w_1,w_2,w_3) 存在唯一的分式线性映射，由交比不变式直接给出。在交比公式中若出现无穷远点 ∞，只需按极限约定将所有含 ∞ 点的差因式直接替换为 1，即可大幅化简代数运算。</p></div><section class="box" id="type-13"><small>第六章 · 核心必考</small><h2>构造归一化的共形映射</h2><p>构造上半平面或单位圆盘到圆盘的共形映射不需要每次从头列交比：根据对称点保持原理，只要把指定的原内点 a 送到像圆心 0，那么 a 关于原边界的对称点必然被送到 0 关于单位圆的对称点 ∞。由此直接锁定两个标准单参数模板，唯一待定的实旋转角 θ 再通过求导代入 a 点并匹配给定的导数辐角 arg w&#x27;(a) 即可迅速确定。</p><details><summary>半平面映为圆盘</summary><div>ζ = (z−a)/(z−ā)</div><p>适用条件：Im a>0 时，上半平面双射到单位圆盘，a 映到原点。</p></details><details><summary>旋转、伸缩、平移</summary><div>w = w₀ + R e<sup>iθ</sup> ζ</div><p>适用条件：R>0，圆心和平移量由目标区域确定。用导数或边界点条件确定旋转角。</p></details><details><summary>解题思路</summary><ol><li>识别源与目标匹配模板：确认源域是上半平面还是单位圆盘（若为一般圆盘先归一化平移伸缩），写出把指定内点 a 映到圆心的含参 e^{iθ} 标准分式映射。</li><li>求导代入固定内点：对映射求导 w&#x27;(z) 并代入 z=a，整理出模和辐角形式 r e^{i(θ+φ_0)}。</li><li>定旋转角并全盘复核：令 θ+φ_0 等于题目规定的导数辐角（如 w&#x27;(a)&gt;0 即角为 0）解出 θ，并检验区域、内点及导数方向全部符合要求。</li></ol></details><h3>由中心与导数方向确定分式映射</h3><p>求将上半平面映到单位圆盘的分式线性双射 f，使 f(i)=0 且 arg f′(i)=0。</p><p class="source">本课教材 · 第六章习题 15（2） · 第 246 页</p><details><summary>查看完整解答</summary><ol><li><p>利用 <math><mrow><mi>i</mi></mrow></math> 关于实轴的对称点 <math><mrow><mo>−</mo><mi>i</mi></mrow></math>，取 <math><mrow><mi>ζ</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mo stretchy="false">(</mo><mi>z</mi><mo>−</mo><mi>i</mi><mo stretchy="false">)</mo><mo>/</mo><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mi>i</mi><mo stretchy="false">)</mo></mrow></math>。当 <math><mrow><mo>Im</mo><mi>z</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math> 时，<math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>−</mo><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mi>i</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>=</mo><mn>4</mn><mo>Im</mo><mi>z</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，所以 <math><mrow><mo stretchy="false">|</mo><mi>ζ</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>，且 <math><mrow><mi>ζ</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math>。</p></li><li><p>反解 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>z</mi><mo>=</mo><mi>i</mi><mfrac><mrow><mn>1</mn><mo>+</mo><mi>ζ</mi></mrow><mrow><mn>1</mn><mo>−</mo><mi>ζ</mi></mrow></mfrac></mstyle></mrow></math>。对任意 <math><mrow><mo stretchy="false">|</mo><mi>ζ</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>，有 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mo>Im</mo><mi>z</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>−</mo><mo stretchy="false">|</mo><mi>ζ</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup></mrow><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>−</mo><mi>ζ</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup></mrow></mfrac><mo>&#x0003E;</mo><mn>0</mn></mstyle></mrow></math>。因此 <math><mrow><mi>ζ</mi></mrow></math> 将上半平面双射到单位圆盘。任意满足 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math> 的这种双射均有 <math><mrow><mi>f</mi><mo>=</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup><mi>ζ</mi></mrow></math>，因为 <math><mrow><mi>f</mi><mo>∘</mo><msup><mi>ζ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math> 是固定原点的单位圆盘自同构，必为旋转。</p></li><li><p>求导得 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msup><mi>ζ</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mn>2</mn><mi>i</mi></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle></mrow></math>，故 <math display="block"><mrow><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup></mrow><mrow><mn>2</mn><mi>i</mi></mrow></mfrac><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><msup><mi>e</mi><mrow><mi>i</mi><mo stretchy="false">(</mo><mi>θ</mi><mo>−</mo><mi>π</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></msup><mo>.</mo></mrow></math> 要使 <math><mrow><mo>arg</mo><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math>，必须有 <math><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup><mo>=</mo><mi>i</mi></mrow></math>。所得映射满足 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math> 和 <math><mrow><msup><mi>f</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>/</mo><mn>2</mn><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>f</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mi>i</mi><mfrac><mrow><mi>z</mi><mo>−</mo><mi>i</mi></mrow><mrow><mi>z</mi><mo>+</mo><mi>i</mi></mrow></mfrac></mstyle></mrow></math>。</p></details><h3>导数方向如何确定旋转角</h3><p>将上半平面共形地映到 |w−w₀|<R，R>0，且 w(i)=w₀、w′(i)>0。求该映射。</p><p class="source">共形映射 第 51 页 · 例 5.5</p><details><summary>查看完整解答</summary><ol><li><p>设 <math><mrow><mi>ζ</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mi>z</mi><mo>−</mo><mi>i</mi></mrow><mrow><mi>z</mi><mo>+</mo><mi>i</mi></mrow></mfrac></mstyle></mrow></math>。在上半平面内，<math><mrow><mo stretchy="false">|</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>−</mo><mo stretchy="false">|</mo><mi>z</mi><mo>−</mo><mi>i</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup><mo>=</mo><mn>4</mn><mo>Im</mo><mi>z</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，从而 <math><mrow><mo stretchy="false">|</mo><mi>ζ</mi><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn></mrow></math>。反解为 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>z</mi><mo>=</mo><mi>i</mi><mfrac><mrow><mn>1</mn><mo>+</mo><mi>ζ</mi></mrow><mrow><mn>1</mn><mo>−</mo><mi>ζ</mi></mrow></mfrac></mstyle></mrow></math>，并且 <math display="block"><mrow><mo>Im</mo><mi>z</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>−</mo><mo stretchy="false">|</mo><mi>ζ</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup></mrow><mrow><mo stretchy="false">|</mo><mn>1</mn><mo>−</mo><mi>ζ</mi><msup><mo stretchy="false">|</mo><mn>2</mn></msup></mrow></mfrac><mo>&#x0003E;</mo><mn>0</mn><mspace width="2em" /><mo stretchy="false">(</mo><mo stretchy="false">|</mo><mi>ζ</mi><mo stretchy="false">|</mo><mo>&#x0003C;</mo><mn>1</mn><mo stretchy="false">)</mo><mo>.</mo></mrow></math> 于是 <math><mrow><mi>ζ</mi></mrow></math> 是上半平面到单位圆盘的共形双射，且 <math><mrow><mi>ζ</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math>。</p></li><li><p>把目标圆盘归一化为单位圆盘。将 <math><mrow><mo stretchy="false">(</mo><mi>w</mi><mo>−</mo><msub><mi>w</mi><mn>0</mn></msub><mo stretchy="false">)</mo><mo>/</mo><mi>R</mi></mrow></math> 与 <math><mrow><msup><mi>ζ</mi><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow></math> 复合，得到固定原点的单位圆盘自同构。对它和它的逆分别应用施瓦茨引理，可知该自同构必为旋转。因此 <math><mrow><mi>w</mi><mo>=</mo><msub><mi>w</mi><mn>0</mn></msub><mo>+</mo><mi>R</mi><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup><mi>ζ</mi></mrow></math>。</p></li><li><p>利用 <math><mrow><mstyle displaystyle="true" scriptlevel="0"><msup><mi>ζ</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>z</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mn>2</mn><mi>i</mi></mrow><mrow><mo stretchy="false">(</mo><mi>z</mi><mo>+</mo><mi>i</mi><msup><mo stretchy="false">)</mo><mn>2</mn></msup></mrow></mfrac></mstyle></mrow></math>，可得 <math display="block"><mrow><msup><mi>w</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>R</mi><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup></mrow><mrow><mn>2</mn><mi>i</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>R</mi></mrow><mrow><mn>2</mn></mrow></mfrac><msup><mi>e</mi><mrow><mi>i</mi><mo stretchy="false">(</mo><mi>θ</mi><mo>−</mo><mi>π</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></msup><mo>.</mo></mrow></math> 由于 <math><mrow><mi>R</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，所给的正实导数条件等价于 <math><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>θ</mi></mrow></msup><mo>=</mo><mi>i</mi></mrow></math>。代回后，<math><mrow><mi>w</mi><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><msub><mi>w</mi><mn>0</mn></msub></mrow></math> 且 <math><mrow><msup><mi>w</mi><mi>′</mi></msup><mo stretchy="false">(</mo><mi>i</mi><mo stretchy="false">)</mo><mo>=</mo><mi>R</mi><mo>/</mo><mn>2</mn><mo>&#x0003E;</mo><mn>0</mn></mrow></math>。</p></li></ol><strong>结论</strong><p><math><mrow><mstyle displaystyle="true" scriptlevel="0"><mi>w</mi><mo>=</mo><msub><mi>w</mi><mn>0</mn></msub><mo>+</mo><mi>i</mi><mi>R</mi><mfrac><mrow><mi>z</mi><mo>−</mo><mi>i</mi></mrow><mrow><mi>z</mi><mo>+</mo><mi>i</mi></mrow></mfrac></mstyle></mrow></math>。</p></details></section><div class="box" id="type-59"><b>圆盘自同构与内点归一化</b><p>一切单位圆盘到自身的共形双射（自同构）都具有统一形式 w=e^{iθ}(z-a)/(1-̄a z)（|a|&lt;1），其中内点 a 被映至原点，关于单位圆的对称点 1/̄a 被映至无穷远。若源区域是左/右/上/下半平面，可先旋转平移至标准上半平面 Imζ&gt;0，再直接套用上半平面模板完成内点与导数归一化。</p></div><div class="box" id="type-60"><b>偏心圆环映到同心圆环</b><p>偏心圆环的两个边界圆周虽然不同心，但永远存在一对独特的公共几何反演对称点 p, q。借助分式线性映射的保对称点性质，只要把 p 映到 0、把 q 映到 ∞，那么关于 p,q 互为对称点的新圆周就必须同时以 0 和 ∞ 为反演对称点——而在平面上以原点和无穷远为对称点的圆周只能是以原点为圆心的同心圆！</p></div><div class="box" id="type-61"><b>幂、指数与对数的复合区域映射</b><p>单一的分式线性映射无法改变两条边界曲线的夹角，遇到角形域、带形域或半圆月牙域时，必须与幂函数 z^α、指数函数 e^z、对数函数等初等映射“搭积木”复合。核心战略是以“上半平面 Imζ&gt;0”为通用中转站：角域用幂函数张平、带域用指数函数展开、月牙两交点用分式映射送到 0 和 ∞ 变为角域后再用幂函数张平，最后再用 (ζ-i)/(ζ+i) 收束为单位圆盘。</p></div><div class="box" id="type-78"><b>分支选择与 Joukowski 映射</b><p>儒可夫斯基函数 w=(1)/(2)(z+z^{-1}) 是航空动力学翼型绕流理论的基础变换。因为 w(z)=w(1/z) 且仅在 z=± 1 导数为零，它把单位圆周 |z|=1 对折映成实轴闭线段 [-1,1]，并同时把单位圆外 |z|&gt;1 与单位圆内 0&lt;|z|&lt;1 各自一对一双射地映到除去线段 [-1,1] 的整个复平面。</p></div><h2>第七章 · 傅里叶变换</h2><div class="box" id="type-62"><b>傅里叶级数、端点收敛与积分求值</b><p>周期函数可展为离散频率谐波之和（傅里叶级数），非周期绝对可积函数则展为连续傅里叶积分。无论是级数还是积分，只要在满足狄利克雷条件的分段光滑函数跳跃点（或连续端点）处代入具体数值 t_0，等式两端由极限平均值 (1)/(2)[f(t_0^-)+f(t_0^+)] 接轨，往往能直接推算出看似棘手的无穷级数和或振荡反常积分。</p></div><section class="box" id="type-14"><small>第七章 · 核心必考</small><h2>分段函数的频谱与傅里叶积分</h2><p>傅里叶正变换将满足绝对可积条件的时域非周期信号分解为连续分布的角频率成分 F(ω)（频谱密度）；而傅里叶反演积分定理保证，在满足狄利克雷条件的情况下，反演积分在连续点还原原信号值，在第一类跳跃间断点处精确收敛到左右极限的算术平均值 [f(t^-)+f(t^+)]/2。</p><details><summary>傅里叶正变换</summary><div>F(ω) = ∫<sub>−∞</sub><sup>∞</sup> f(t)e<sup>−iωt</sup> dt</div><p>适用条件：ω 为角频率。f 在实轴绝对可积是正变换存在的充分条件。</p></details><details><summary>傅里叶反演与间断点</summary><div>[f(t⁻)+f(t⁺)]/2 = (1/2π) lim<sub>R→∞</sub> ∫<sub>−R</sub><sup>R</sup> F(ω)e<sup>iωt</sup> dω</div><p>适用条件：例如 f 绝对可积且在所考察点附近分段光滑。连续处恢复 f(t)，有跳跃时恢复左右极限的半和。</p></details><details><summary>实偶函数的频谱</summary><div>F(ω) = 2∫<sub>0</sub><sup>∞</sup> f(t)cos(ωt) dt</div><p>适用条件：f 为实偶且绝对可积。F 也是实偶函数，反演时可用 (1/π)∫₀<sup>∞</sup> F(ω)cos(ωt)dω。</p></details><details><summary>周期展开与连续频谱</summary><div>cₙ=(1/P)∫ₐ<sup>a+P</sup>f(t)e<sup>−inΩt</sup>dt，Ω=2π/P；f(t)∼∑ cₙe<sup>inΩt</sup></div><p>适用条件：P 为正周期，积分取任一完整周期。分段光滑时，级数在跳点收敛到左右极限的半和；周期信号的谱线位于 nΩ。</p></details><details><summary>解题思路</summary><ol><li>确定非零支撑与对称性：写明 f(t) 非零的时间区间并判断奇偶性，实偶函数可直接化为余弦积分以减少虚部计算。</li><li>分段或分部积分求 F(ω)：代入指数定义或三角积分计算，注意处理分母为零的频率（如 ω=0 直接积分即面积 ∫ f(t) dt）。</li><li>写出傅里叶积分表达式：将所得 F(ω) 代回逆变换公式并指明在函数连续点、跳点及端点处分别收敛于何值。</li></ol></details><h3>截断余弦的频谱与积分表示</h3><p>在 |t|&lt;π/2 时令 f(t)=cos t，其余处为 0。求傅里叶变换，并写出 f 的傅里叶积分表示。</p><p>2022 年 6 月 A 卷 · 五 · 真题集 PDF 第 61 页</p><details><summary>查看完整解答</summary><ol><li><p>按本章约定，<math><mrow><mi mathvariant="script">F</mi><mo stretchy="false">[</mo><mi>f</mi><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi></mrow></math>。本题 <math><mrow><mi>f</mi></mrow></math> 有界且有紧支撑，故该积分绝对收敛。由于 <math><mrow><mi>f</mi></mrow></math> 为偶函数，<math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mi>sin</mi><mo stretchy="false">(</mo><mi>ω</mi><mi>t</mi><mo stretchy="false">)</mo></mrow></math> 为奇函数，其全轴积分为零。因此 <math display="block"><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mi>π</mi><mo>/</mo><mn>2</mn></mrow><mrow><mi>π</mi><mo>/</mo><mn>2</mn></mrow></msubsup><mi>cos</mi><mi>t</mi><mspace width="0.167em" /><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mn>2</mn><msubsup><mo>∫</mo><mn>0</mn><mrow><mi>π</mi><mo>/</mo><mn>2</mn></mrow></msubsup><mi>cos</mi><mi>t</mi><mi>cos</mi><mo stretchy="false">(</mo><mi>ω</mi><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>.</mo></mrow></math></p></li><li><p>若 <math><mrow><mi>ω</mi><mo>≠</mo><mi>±</mi><mn>1</mn></mrow></math>，由 <math><mrow><mn>2</mn><mi>cos</mi><mi>t</mi><mi>cos</mi><mo stretchy="false">(</mo><mi>ω</mi><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>cos</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>ω</mi><mo stretchy="false">)</mo><mi>t</mi><mo stretchy="false">)</mo><mo>+</mo><mi>cos</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>ω</mi><mo stretchy="false">)</mo><mi>t</mi><mo stretchy="false">)</mo></mrow></math>，得 <math display="block"><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>ω</mi><mo stretchy="false">)</mo><mi>π</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><mrow><mn>1</mn><mo>−</mo><mi>ω</mi></mrow></mfrac><mo>+</mo><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>ω</mi><mo stretchy="false">)</mo><mi>π</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><mrow><mn>1</mn><mo>+</mo><mi>ω</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mi>cos</mi><mo stretchy="false">(</mo><mi>π</mi><mi>ω</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><mrow><mn>1</mn><mo>−</mo><msup><mi>ω</mi><mn>2</mn></msup></mrow></mfrac><mo>.</mo></mrow></math> 这里两项的正弦因子均等于 <math><mrow><mi>cos</mi><mo stretchy="false">(</mo><mi>π</mi><mi>ω</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow></math>。</p></li><li><p>若 <math><mrow><mi>ω</mi><mo>=</mo><mi>±</mi><mn>1</mn></mrow></math>，应回到原积分计算。由 <math><mrow><mn>2</mn><msup><mi>cos</mi><mn>2</mn></msup><mi>t</mi><mo>=</mo><mn>1</mn><mo>+</mo><mi>cos</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow></math>，得 <math display="block"><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>±</mi><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><mn>2</mn><msubsup><mo>∫</mo><mn>0</mn><mrow><mi>π</mi><mo>/</mo><mn>2</mn></mrow></msubsup><msup><mi>cos</mi><mn>2</mn></msup><mi>t</mi><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mi>t</mi><mo>+</mo><mfrac><mrow><mi>sin</mi><mo stretchy="false">(</mo><mn>2</mn><mi>t</mi><mo stretchy="false">)</mo></mrow><mn>2</mn></mfrac><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mn>0</mn><mrow><mi>π</mi><mo>/</mo><mn>2</mn></mrow></msubsup><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mn>2</mn></mfrac><mo>.</mo></mrow></math></p></li><li><p><math><mrow><mi>F</mi></mrow></math> 为实偶函数，在 <math><mrow><mi>ω</mi><mo>=</mo><mi>±</mi><mn>1</mn></mrow></math> 处按上式连续延拓，且无穷远为 <math><mrow><mi>O</mi><mo stretchy="false">(</mo><mo stretchy="false">|</mo><mi>ω</mi><msup><mo stretchy="false">|</mo><mrow><mo>−</mo><mn>2</mn></mrow></msup><mo stretchy="false">)</mo></mrow></math>，因而属于 <math><mrow><msup><mi>L</mi><mn>1</mn></msup></mrow></math>。由傅里叶反演公式，连续点 <math><mrow><mi>t</mi></mrow></math> 满足 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mi>π</mi></mfrac><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><mi>F</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mi>cos</mi><mo stretchy="false">(</mo><mi>ω</mi><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>ω</mi></mrow></math>。这里 <math><mrow><mi>f</mi></mrow></math> 在端点 <math><mrow><mi>t</mi><mo>=</mo><mi>±</mi><mi>π</mi><mo>/</mo><mn>2</mn></mrow></math> 的左右极限也都为零，积分表示对所有实数 <math><mrow><mi>t</mi></mrow></math> 成立。</p></li></ol><strong>结论</strong><p><math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mn>2</mn><mi>cos</mi><mo stretchy="false">(</mo><mi>π</mi><mi>ω</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><mrow><mn>1</mn><mo>−</mo><msup><mi>ω</mi><mn>2</mn></msup></mrow></mfrac></mrow></math>（<math><mrow><mi>ω</mi><mo>≠</mo><mi>±</mi><mn>1</mn></mrow></math>），<math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>±</mi><mn>1</mn><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mn>2</mn></mfrac></mrow></math>。<math display="block"><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>2</mn><mi>π</mi></mfrac><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><mfrac><mrow><mi>cos</mi><mo stretchy="false">(</mo><mi>π</mi><mi>ω</mi><mo>/</mo><mn>2</mn><mo stretchy="false">)</mo></mrow><mrow><mn>1</mn><mo>−</mo><msup><mi>ω</mi><mn>2</mn></msup></mrow></mfrac><mi>cos</mi><mo stretchy="false">(</mo><mi>ω</mi><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>ω</mi><mo>,</mo><mspace width="2em" /><mi>t</mi><mo>∈</mo><mi mathvariant="double-struck">R</mi><mo>,</mo></mrow></math>其中被积式在 <math><mrow><mi>ω</mi><mo>=</mo><mn>1</mn></mrow></math> 的商取连续延拓值 <math><mrow><mi>π</mi><mo>/</mo><mn>4</mn></mrow></math>。</p></details><h3>单边衰减指数的频谱</h3><p>a&gt;0。设 f(t) 在 t≥0 时为 e<sup>−at</sup>，在 t&lt;0 时为 0，求 F(ω)。</p><p><a href="https://eng.libretexts.org/Bookshelves/Electrical_Engineering/Signal_Processing_and_Modeling/Signals_and_Systems_%28Baraniuk_et_al.%29/08%3A_Continuous_Time_Fourier_Transform_%28CTFT%29/8.02%3A_Continuous_Time_Fourier_Transform_%28CTFT%29">补充教材 Baraniuk 等 · §8.2 练习 1</a></p><details><summary>查看完整解答</summary><ol><li><p><math><mrow><mi>t</mi><mo>&#x0003C;</mo><mn>0</mn></mrow></math> 时 <math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mn>0</mn></mrow></math>，故整个积分只在 <math><mrow><mi>t</mi><mo>≥</mo><mn>0</mn></mrow></math> 上有贡献。因 <math><mrow><mi>a</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，对任意实数 <math><mrow><mi>ω</mi></mrow></math>，<math><mrow><mrow><mo stretchy="true" fence="true" form="prefix">|</mo><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>i</mi><mi>ω</mi><mo stretchy="false">)</mo><mi>t</mi></mrow></msup><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi><mi>t</mi></mrow></msup></mrow></math> 在 <math><mrow><mo stretchy="false">[</mo><mn>0</mn><mo>,</mo><mo>∞</mo><mo stretchy="false">)</mo></mrow></math> 上可积。</p></li><li><p>令 <math><mrow><mi>R</mi><mo>&#x0003E;</mo><mn>0</mn></mrow></math>，先算有穷区间积分。<math display="block"><mrow><msubsup><mo>∫</mo><mn>0</mn><mi>R</mi></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>i</mi><mi>ω</mi><mo stretchy="false">)</mo><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><msubsup><mrow><mo stretchy="true" fence="true" form="prefix">[</mo><mo>−</mo><mfrac><mrow><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>i</mi><mi>ω</mi><mo stretchy="false">)</mo><mi>t</mi></mrow></msup></mrow><mrow><mi>a</mi><mo>+</mo><mi>i</mi><mi>ω</mi></mrow></mfrac><mo stretchy="true" fence="true" form="postfix">]</mo></mrow><mn>0</mn><mi>R</mi></msubsup><mo>=</mo><mfrac><mrow><mn>1</mn><mo>−</mo><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>i</mi><mi>ω</mi><mo stretchy="false">)</mo><mi>R</mi></mrow></msup></mrow><mrow><mi>a</mi><mo>+</mo><mi>i</mi><mi>ω</mi></mrow></mfrac><mo>.</mo></mrow></math></p></li><li><p>由于 <math><mrow><mrow><mo stretchy="true" fence="true" form="prefix">|</mo><msup><mi>e</mi><mrow><mo>−</mo><mo stretchy="false">(</mo><mi>a</mi><mo>+</mo><mi>i</mi><mi>ω</mi><mo stretchy="false">)</mo><mi>R</mi></mrow></msup><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi><mi>R</mi></mrow></msup><mo>→</mo><mn>0</mn></mrow></math>，令 <math><mrow><mi>R</mi><mo>→</mo><mo>∞</mo></mrow></math> 即得所求频谱。零频处 <math><mrow><mi>F</mi><mo stretchy="false">(</mo><mn>0</mn><mo stretchy="false">)</mo><mo>=</mo><mn>1</mn><mo>/</mo><mi>a</mi></mrow></math>，与时域曲线的积分 <math><mrow><msubsup><mo>∫</mo><mn>0</mn><mo>∞</mo></msubsup><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi></mrow></math> 一致。</p></li></ol><strong>结论</strong><p><math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><mstyle displaystyle="true" scriptlevel="0"><mfrac><mrow><mn>1</mn></mrow><mrow><mi>a</mi><mo>+</mo><mi>i</mi><mi>ω</mi></mrow></mfrac></mstyle></mrow></math>，<math><mrow><mi>ω</mi><mo>∈</mo><mi mathvariant="double-struck">R</mi></mrow></math>。</p></details></section><div class="box" id="type-63"><b>奇偶性、分段波形与典型频谱</b><p>门函数、单双边指数函数和三角脉冲是最常考的基本变换对。借助欧拉公式与函数奇偶性，实偶脉冲只需计算正半轴的余弦积分，而实奇脉冲则只产生纯虚的 -2i 倍正弦积分；利用零频值 F(0)=∫_{-∞}^{∞}f(t) dt 等于时域曲线下面积，可以在考场迅速验证求出的频谱公式是否正确。</p></div><section class="box" id="type-16"><small>第七章 · 核心必考</small><h2>冲激函数与离散谱线</h2><p>直流常数、正余弦信号与阶跃函数在实轴上并不绝对可积，引入单位冲激函数 δ(t) 后，它们在频域中恰巧表现为集中在单个频率上的离散谱线。计算含冲激函数的积分时核心依据是“筛选性质”：冲激把乘在它上面的光滑函数在冲激触发时刻的值精准抽取出来；逆变换中出现一对关于 ω=0 对称的冲激谱线时，直接用欧拉公式还原为余弦或正弦波。</p><details><summary>冲激的筛选性质</summary><div>∫<sub>−∞</sub><sup>∞</sup> g(t)δ(t−a) dt = g(a)</div><p>适用条件：以广义函数理解，g 在 a 附近光滑。先代入冲激所在时刻，再计算其余因子。</p></details><details><summary>冲激与谐波变换对</summary><div>δ(t−a) ↔ e<sup>−iωa</sup>　 ·　 e<sup>ibt</sup> ↔ 2πδ(ω−b)</div><p>适用条件：广义傅里叶变换，采用角频率和 1/(2π) 反演约定。</p></details><details><summary>解题思路</summary><ol><li>定位冲激触发点：写出 δ 括号内为零的时刻（如 t=a 或 ω=±ω_0），并确认该点处于积分区间内。</li><li>执行筛选或逆变换代值：将乘在冲激上的函数在该时刻取值（遇 δ&#x27; 须求导并取负号）；频域冲激逆变换时写出 e^{iω t} 取值并除以 2π。</li><li>用欧拉公式合并谱线：若出现成对的正负频率指数 e^{± iω_0 t}，利用欧拉公式合并为 cos(ω_0 t) 或 sin(ω_0 t)。</li></ol></details><h3>冲激取样后还剩哪个相位</h3><p>求 δ(t−1)sin(3t) 的傅里叶变换。</p><p>2022 年 6 月 A 卷 · 一（4） · 真题集 PDF 第 60 页</p><details><summary>查看完整解答</summary><ol><li><p>在广义函数意义下，<math><mrow><mi>δ</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>a</mi><mo stretchy="false">)</mo></mrow></math> 的抽样性质是 <math><mrow><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mi>δ</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mi>a</mi><mo stretchy="false">)</mo><mi>φ</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mo>=</mo><mi>φ</mi><mo stretchy="false">(</mo><mi>a</mi><mo stretchy="false">)</mo></mrow></math>。本题取样点为 <math><mrow><mi>a</mi><mo>=</mo><mn>1</mn></mrow></math>，乘子 <math><mrow><mi>φ</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup></mrow></math> 在该点光滑。</p></li><li><p>直接代入傅里叶变换的核并取样。<math display="block"><mrow><mrow><mi mathvariant="script">F</mi><mo stretchy="false">[</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mi>δ</mi><mo stretchy="false">(</mo><mi>t</mi><mo>−</mo><mn>1</mn><mo stretchy="false">)</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>t</mi><mspace linebreak="newline" /><mo>=</mo><msub><mrow><mo stretchy="true" fence="true" form="prefix" /><mi>sin</mi><mo stretchy="false">(</mo><mn>3</mn><mi>t</mi><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mo stretchy="true" fence="true" form="postfix">|</mo></mrow><mrow><mi>t</mi><mo>=</mo><mn>1</mn></mrow></msub><mspace linebreak="newline" /><mo>=</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>3</mn><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi></mrow></msup><mo>.</mo></mrow></mrow></math></p></li></ol><strong>结论</strong><p><math><mrow><mi>F</mi><mo stretchy="false">(</mo><mi>ω</mi><mo stretchy="false">)</mo><mo>=</mo><mi>sin</mi><mo stretchy="false">(</mo><mn>3</mn><mo stretchy="false">)</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>ω</mi></mrow></msup></mrow></math>。</p></details><h3>从一对冲激谱线还原余弦</h3><p>给定 F(ω)=π[δ(ω−b)+δ(ω+b)]，b&gt;0。求 f(t)。</p><p><a href="https://math.libretexts.org/Bookshelves/Differential_Equations/Introduction_to_Partial_Differential_Equations_%28Herman%29/09%3A_Transform_Techniques_in_Physics/9.05%3A_Properties_of_the_Fourier_Transform">补充教材 Herman · §9.5 例 5</a></p><details><summary>查看完整解答</summary><ol><li><p><math><mrow><mi>F</mi></mrow></math> 由两个冲激组成，采用广义傅里叶逆变换。逆变换核为 <math><mrow><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup></mrow></math>，归一化因子为 <math><mrow><mn>1</mn><mo>/</mo><mo stretchy="false">(</mo><mn>2</mn><mi>π</mi><mo stretchy="false">)</mo></mrow></math>。</p></li><li><p>代入给定的 <math><mrow><mi>F</mi></mrow></math>，然后分别对 <math><mrow><mi>ω</mi><mo>=</mo><mi>b</mi></mrow></math> 和 <math><mrow><mi>ω</mi><mo>=</mo><mo>−</mo><mi>b</mi></mrow></math> 取样。<math display="block"><mrow><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mrow><mi>π</mi></mrow><mrow><mn>2</mn><mi>π</mi></mrow></mfrac><msubsup><mo>∫</mo><mrow><mo>−</mo><mo>∞</mo></mrow><mrow><mo>∞</mo></mrow></msubsup><mo stretchy="false">[</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>ω</mi><mo>−</mo><mi>b</mi><mo stretchy="false">)</mo><mo>+</mo><mi>δ</mi><mo stretchy="false">(</mo><mi>ω</mi><mo>+</mo><mi>b</mi><mo stretchy="false">)</mo><mo stretchy="false">]</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>ω</mi><mi>t</mi></mrow></msup><mspace width="0.167em" /><mi>d</mi><mi>ω</mi><mspace linebreak="newline" /><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="false">(</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>b</mi><mi>t</mi></mrow></msup><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>b</mi><mi>t</mi></mrow></msup><mo stretchy="false">)</mo><mo>.</mo></mrow></mrow></math></p></li><li><p>由欧拉公式 <math><mrow><mi>cos</mi><mi>x</mi><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac><mo stretchy="false">(</mo><msup><mi>e</mi><mrow><mi>i</mi><mi>x</mi></mrow></msup><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><mi>x</mi></mrow></msup><mo stretchy="false">)</mo></mrow></math>，两条对称谱线还原为频率参数为 <math><mrow><mi>b</mi></mrow></math> 的余弦信号。</p></li></ol><strong>结论</strong><p><math><mrow><mi>f</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo><mo>=</mo><mi>cos</mi><mo stretchy="false">(</mo><mi>b</mi><mi>t</mi><mo stretchy="false">)</mo></mrow></math>，<math><mrow><mi>t</mi><mo>∈</mo><mi mathvariant="double-struck">R</mi></mrow></math>。</p></details></section><div class="box" id="type-64"><b>广义变换、冲激缩放及阶跃</b><p>单位冲激在时间变量做线性代换 at-b 时，其“总面积为 1”的分布特性在换元雅可比作用下会产生伸缩因子 (1)/(|a|)。另一高频重点是单位阶跃函数 H(t)=(1)/(2)+(1)/(2)sgn(t) 的频谱：它的直流平均值 1/2 贡献了零频冲激 πδ(ω)，而奇对称跃变部分则贡献主值项 (1)/(iω)。</p></div><section class="box" id="type-15"><small>第七章 · 高频重点</small><h2>逆变换、时移与尺度变换</h2><p>傅里叶变换的三大几何性质深刻刻画了时域与频域的对应：时域延迟 t↦ t-a 不改变振幅谱大小，仅附加线性相位因子 e^{-iω a}；而时间轴的压缩 f(at)（|a|&gt;1）则把频谱向外拉宽成 (1)/(|a|)F(ω/a)，呈现出“脉冲越窄、频带越宽”的时频不确定性互易规律。</p><details><summary>时移与频移</summary><div>f(t−a) ↔ e<sup>−iωa</sup>F(ω)　 ·　 e<sup>ibt</sup>f(t) ↔ F(ω−b)</div><p>适用条件：a、b 为实数，f 的正变换存在。时域延迟对应频域相位因子。</p></details><details><summary>尺度变换</summary><div>f(at) ↔ F(ω/a)/|a|</div><p>适用条件：a 为非零实数。a&lt;0 时，反向换元产生绝对值因子。</p></details><details><summary>矩形脉冲变换对</summary><div>1<sub>{|t|&lt;T}</sub> ↔ 2sin(ωT)/ω</div><p>适用条件：T&gt;0，零频取极限 2T。由反演恢复矩形时，两个跳跃端点取 1/2。</p></details><details><summary>解题思路</summary><ol><li>识别母体变换对：找出题中已知的矩形门函数或频谱对，确认正逆变换指数符号与 (1)/(2π) 位置。</li><li>有序拆解缩放与平移：写出从 f(t) 到 f(at-c)=f[a(t-c/a)] 的顺序，依次应用尺度因子 1/|a| 与平移相移 e^{-iω c/a}（或直接换元代换）。</li><li>特判极限与对称校核：在分母为零处补取极限值，利用时频展缩方向和区间边界值复核结果。</li></ol></details><h3>从矩形频谱还原波形</h3><p>频谱 H(ω) 在 |ω|≤M 时为 1，其余为 0，M&gt;0。求原函数 h(t)，给出 h(0)。</p><p><a href="https://eng.libretexts.org/Bookshelves/Electrical_Engineering/Signal_Processing_and_Modeling/Signals_and_Systems_%28Baraniuk_et_al.%29/08%3A_Continuous_Time_Fourier_Transform_%28CTFT%29/8.02%3A_Continuous_Tim
